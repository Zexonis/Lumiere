isent pour diagnostiquer une anomalie de la cornée.","v":false,"expl":"Le corrigé le dit : « Les couleurs seules ne suffisent pas à diagnostiquer une anomalie ». Le bleu non plus : il « nous donne aucune information sur les anomalies ».","source":"CM5-corr; 5.3-d6","mod":5},{"id":"m5-057","fam":"m5-sortie","kc":"T5.19","k":"qcm","q":"Après un laser pour corriger la myopie, qu’arrive-t-il à la cornée ?","choix":[{"t":"Elle est aplatie au centre : sa puissance baisse","ok":true},{"t":"Elle est plus bombée au centre : sa puissance monte","pourquoi":"Ça, c’est le laser pour l’hypermétropie : « une cornée plus bombée »."},{"t":"Elle est aplatie au centre : sa puissance monte","pourquoi":"Aplatir agrandit le rayon, et un grand rayon donne moins de dioptries."},{"t":"Elle est plus cambrée au centre : sa puissance baisse","pourquoi":"Le laser pour la myopie aplatit; et plus cambré voudrait dire plus de puissance."}],"expl":"« La cornée est aplatie au centre »; la figure le résume : « Flattened cornea = reduced focusing power ».","source":"5.1-d39, d40","mod":5},{"id":"m5-058","fam":"m5-sortie","kc":"T5.19","k":"num","q":"Après un LASIK pour la myopie, le rayon central passe de 7,8 mm à 8,2 mm. De combien la puissance change-t-elle ? (Mets un signe − si elle baisse.)","rep":{"v":-2.11,"u":"D","tol":0.03,"dec":2},"dem":[["① Avant","0,3375 ÷ 0,0078 = 43,27 D"],["② Après","0,3375 ÷ 0,0082 = 41,16 D"],["③ Changement","41,16 − 43,27 = −2,11 D"],["④ Vérifier le sens","aplatir = rayon plus grand = moins de puissance"]],"pieges":[{"v":2.11,"m":"Le montant est juste, pas le sens : aplatir fait baisser la puissance, donc −2,11 D."},{"v":-0.0021,"m":"Tu as gardé les rayons en mm. Convertis-les en mètres avant la formule."}],"expl":"Aplatir le centre agrandit r, donc la puissance baisse : 43,27 D devient 41,16 D, soit −2,11 D.","source":"5.1-d32, d39","mod":5},{"id":"m5-059","fam":"m5-sortie","kc":"T5.19","k":"qcm","q":"Ortho-K : la puissance centrale passe de 43,16 D (examen A) à 42,23 D (examen B). Que donne la carte « Exam B minus Exam A » ?","choix":[{"t":"−0,93 D : la puissance centrale a baissé","ok":true},{"t":"+0,93 D : la puissance centrale a monté","pourquoi":"B moins A = 42,23 − 43,16 : le résultat est négatif."},{"t":"−0,93 D : la cornée est devenue plus cambrée","pourquoi":"Moins de puissance veut dire plus plat, pas plus cambré."}],"expl":"L’ortho-K sert à « Applatir (sic) la cornée avec une lentille cornéenne » : 42,23 − 43,16 = −0,93 D, moins de puissance au centre.","source":"5.1-d41; 5.3-d10","mod":5},{"id":"m5-060","fam":"m5-sortie","kc":"T5.20","k":"num","q":"Sortie après un LASIK : « 42.08D (8.02) @ 65° » et « 41.15D (8.20) @ 155° ». Calcule l’astigmatisme cornéen.","rep":{"v":0.93,"u":"D","tol":0.01,"dec":2},"dem":[["① Les deux K","42,08 D (à 65) et 41,15 D (à 155)"],["② Soustraire","42,08 − 41,15 = 0,93 D"],["③ Comparer","la carte affiche « dk 0.93D » : c’est le même résultat"]],"pieges":[{"v":-0.93,"m":"Montant négatif : fais le K cambré moins le K plat."},{"v":0.18,"m":"Tu as soustrait les rayons (8,20 − 8,02). L’astigmatisme se calcule avec les dioptries."}],"expl":"K cambré − K plat = 42,08 − 41,15 = 0,93 D, ce que l’appareil écrit « dk 0.93D ».","source":"5.3-d11","mod":5},{"id":"m5-061","fam":"m5-sortie","kc":"T5.20","k":"num","q":"Vérifie la sortie « 42.08D (8.02) @ 65° » : calcule la puissance pour r = 8,02 mm.","rep":{"v":42.08,"u":"D","tol":0.015,"dec":2},"dem":[["① mm → m","8,02 mm = 0,00802 m"],["② Formule","D = 0,3375 ÷ 0,00802 = 42,08 D"],["③ Comparer","l’appareil affiche bien 42,08 D : il applique la même formule"]],"pieges":[{"v":0.042,"m":"r est resté en mm : 8,02 mm = 0,00802 m."}],"expl":"Le nombre entre parenthèses est le rayon en mm. La formule le change en dioptries : 0,3375 ÷ 0,00802 = 42,08 D.","source":"5.3-d11; 5.1-d32","mod":5},{"id":"m5-062","fam":"m5-sortie","kc":"T5.20","k":"qcm","q":"Sur la sortie « 41.15D (8.20) @ 155° », que représente le nombre entre parenthèses ?","choix":[{"t":"Le rayon de courbure, en mm","ok":true},{"t":"Une deuxième puissance, en dioptries","pourquoi":"8,20 D serait hors de 35 à 50 D : c’est un rayon en mm."},{"t":"L’axe du cylindre, en degrés","pourquoi":"Les degrés sont après le @ (155°). Et pour la cornée, on parle de méridien."},{"t":"L’astigmatisme cornéen, en dioptries","pourquoi":"L’astigmatisme est écrit à part : « dk 0.93D »."}],"expl":"Chaque SIM K donne la puissance (41,15 D), le rayon entre parenthèses (8,20 mm) et le méridien (@ 155°).","source":"5.3-d11","mod":5},{"id":"m5-063","fam":"m5-sortie","kc":"T5.20","k":"qcm","q":"Sortie Medmont : Flat K 44,24 D @ 120 ; Steep K 45,47 D @ 30. Que veut dire @ 30 ?","choix":[{"t":"Le méridien où la cornée est la plus cambrée","ok":true},{"t":"L’axe du cylindre, où il n’y a pas de puissance","pourquoi":"Axe est un mot de lentille. Ici, 30 est le méridien du Steep K."},{"t":"Le méridien où la cornée est la plus plate","pourquoi":"Le plus plat, c’est le Flat K, à 120. Steep K veut dire cambré."},{"t":"Le rayon du Steep K, en mm","pourquoi":"Le @ donne un méridien, pas un rayon."}],"expl":"Steep K = K cambré : 45,47 D au méridien 30. Le Flat K est à 120 : 30 + 90 = 120, les deux méridiens sont bien à 90°.","source":"5.3-d9","mod":5},{"id":"m5-064","fam":"m5-sortie","kc":"T5.21","k":"qcm","q":"Prétests : l’auto-kératomètre donne 44,50 D au méridien 180 et 42,25 D au méridien 90. Les deux sont entre 35 et 50 D. Quelle fiche est juste ?","choix":[{"t":"2,25 D ; 90 plat, 180 cambré ; 44.50x42.25@090","ok":true},{"t":"2,25 D ; 180 plat, 90 cambré ; 44.50x42.25@090","pourquoi":"Le plus grand K (44,50, à 180) est le plus cambré, pas le plus plat."},{"t":"2,25 D ; 90 plat, 180 cambré ; 44.50x42.25@180","pourquoi":"Le @ donne le méridien de la deuxième valeur : 42,25 est à 90."},{"t":"−2,25 D ; 90 plat, 180 cambré ; 44.50x42.25@090","pourquoi":"Montant négatif : on fait K cambré − K plat."}],"expl":"44,50 − 42,25 = 2,25 D. Le plus petit K (à 90) est le plat. Optosys : l’horizontal d’abord (44,50), x, 42,25, puis @ le méridien de la deuxième valeur (090).","source":"5.1-d36; 5.2-R1, R2; AK5","mod":5},{"id":"m5-065","fam":"m5-sortie","kc":"T5.21","k":"qcm","q":"Topographe : carte « KC oval os, inferior », zone rouge inférieure et nasale. La sortie donne Flat K 44,24 D @ 120 et Steep K 45,47 D @ 30. Que fais-tu ?","choix":[{"t":"Tu notes les deux K et leurs méridiens, et tu rapportes la carte","ok":true},{"t":"Tu ne notes pas les K, puisque la cornée est irrégulière et asymétrique","pourquoi":"Les deux K s’écrivent quand même : 45,47 D à 30 et 44,24 D à 120."},{"t":"Tu inscris kératocône au dossier, comme diagnostic","pourquoi":"Tu ne diagnostiques pas : tu décris le motif et tu rapportes la carte."},{"t":"Tu notes au dossier que la zone rouge est malade, et rien d’autre","pourquoi":"Rouge veut dire cambré, pas malade. Décris le motif : irrégulier / asymétrique."}],"expl":"« Cornée irrégulière et asymmétrique (sic) », mais ses deux K s’écrivent quand même. La couleur ne diagnostique pas : tu décris et tu rapportes.","source":"5.3-d6, d9; CM5-corr","mod":5},{"id":"m6-001","fam":"m6-kc","kc":"T6.1","k":"qcm","q":"Comment le cours définit-il le kératocône ?","choix":[{"t":"Une maladie dégénérative non inflammatoire de la cornée","ok":true},{"t":"Une maladie inflammatoire de la cornée causée par une infection","pourquoi":"Le cours dit « non inflammatoire » : c’est une dégénérescence, pas une inflammation."},{"t":"Une maladie dégénérative du cristallin, qui devient plus bombé","pourquoi":"Mauvaise structure : c’est la cornée qui s’amincit et se déforme, pas le cristallin."},{"t":"Une déformation de la rétine, visible seulement à l’OCT","pourquoi":"Le kératocône touche la cornée; on le dépiste surtout par la topographie cornéenne."}],"expl":"« Maladie dégénérative non inflammatoire de la cornée » ; « Caractérisée par un amincissement et une déformation conique ».","source":"6.1-d4","mod":6},{"id":"m6-002","fam":"m6-kc","kc":"T6.1","k":"qcm","q":"Quel effet sur la vision le kératocône cause-t-il, selon le cours ?","choix":[{"t":"Une myopie et un astigmatisme irrégulier, qui progressent","ok":true},{"t":"Une hypermétropie et un astigmatisme régulier, qui progressent","pourquoi":"Deux erreurs : le cône rend l’œil plus myope, et son astigmatisme est irrégulier."},{"t":"Une myopie et un astigmatisme régulier, stables dans le temps","pourquoi":"L’astigmatisme est irrégulier (non symétrique), et le cours dit « progressifs »."},{"t":"Une presbytie précoce, sans aucun astigmatisme","pourquoi":"La presbytie n’est pas en cause; le cône crée justement un astigmatisme, irrégulier."}],"expl":"« Cause une myopie et un astigmatisme irrégulier progressifs » : trois mots à retenir, myopie, irrégulier, progressifs.","source":"6.1-d4","mod":6},{"id":"m6-003","fam":"m6-kc","kc":"T6.2","k":"qcm","q":"À quel moment de la vie le kératocône apparaît-il habituellement ?","choix":[{"t":"De l’adolescence au début de l’âge adulte","ok":true},{"t":"Vers 40 ans, en même temps que la presbytie","pourquoi":"Trop tard : le cours dit « adolescence à jeune adulte »."},{"t":"Après 60 ans, en même temps que la cataracte","pourquoi":"Trop tard : c’est une maladie qui apparaît chez les jeunes."},{"t":"Dès la naissance, chez les enfants à risque","pourquoi":"Le cours ne parle pas de naissance : il dit « adolescence à jeune adulte »."}],"expl":"« Apparition : adolescence à jeune adulte ». C’est pourquoi un patient jeune (18-30 ans) figure parmi les signes.","source":"6.1-d7, d14","mod":6},{"id":"m6-004","fam":"m6-kc","kc":"T6.2","k":"vf","q":"Selon le cours, le frottement des yeux dû aux allergies est un facteur du kératocône, lié à sa progression.","v":true,"expl":"Vrai : « Facteurs : génétiques, frottement oculaire due (sic) aux allergies ». Les notes de la prof insistent sur le lien entre frottement et progression.","source":"6.1-d7","mod":6},{"id":"m6-005","fam":"m6-kc","kc":"T6.3","k":"qcm","q":"Quelle couche de la cornée s’amincit dans le kératocône ?","choix":[{"t":"Le stroma, la couche épaisse qui assure la rigidité","ok":true},{"t":"L’épithélium, la couche de surface de la cornée","pourquoi":"Le cours parle d’un « Amincissement progressif du stroma », pas de l’épithélium."},{"t":"L’endothélium, la couche la plus profonde de la cornée","pourquoi":"Mauvaise couche : c’est le stroma, la couche épaisse qui assure la rigidité."},{"t":"La membrane de Bowman, juste sous l’épithélium","pourquoi":"Bowman figure sur le schéma, mais c’est le stroma qui s’amincit et perd sa rigidité."}],"expl":"« Le stroma représente 90% de l’épaisseur et assure la rigidité. » Quand son collagène devient moins rigide, la cornée s’amincit et se bombe.","source":"6.1-d3, d5, d6","mod":6},{"id":"m6-006","fam":"m6-kc","kc":"T6.3","k":"ordre","q":"Remets la chaîne du kératocône dans l’ordre, de la cause à l’effet sur la vue.","etapes":["Le collagène du stroma devient moins rigide","Le stroma s’amincit peu à peu","La surface avant de la cornée perd sa régularité et prend une forme de cône","La vue devient plus myope, avec un astigmatisme irrégulier"],"expl":"« le collagène est moins rigide et la cornée est plus mince et bombée » ; l’amincissement entraîne une « perte de régularité » et une forme conique, d’où myopie et astigmatisme irrégulier.","source":"6.1-d4, d5, d6","mod":6},{"id":"m6-007","fam":"m6-kc","kc":"T6.4","k":"qcm","q":"Sur une carte de topographie, qu’est-ce qui distingue l’astigmatisme du kératocône d’un astigmatisme régulier ?","choix":[{"t":"Il n’est pas symétrique : plus de cambrure en bas qu’en haut","ok":true},{"t":"Il a deux K différents, un méridien cambré et un méridien plat","pourquoi":"Tout astigmatisme a deux K différents. Irrégulier veut dire non symétrique, avec plus de cambrure en bas."},{"t":"Il est plus cambré à 90°, comme l’astigmatisme le plus commun","pourquoi":"« plus cambré à 90 degré—le plus commun » décrit un astigmatisme régulier, pas le kératocône."},{"t":"Il est cambré dans un méridien oblique, à 30°","pourquoi":"Un astigmatisme « plus cambré à 30 degrés » reste régulier : symétrique, deux méridiens à 90°."}],"expl":"Kératocône : « astigmatisme n’est pas symmétrique (sic). Plus de cambrure inférieure par rapport à supérieur ». Vertical, horizontal ou oblique, l’astigmatisme régulier reste symétrique.","source":"6.1-d8 à d11","mod":6},{"id":"m6-008","fam":"m6-kc","kc":"T6.4","k":"vf","q":"Une carte de topographie montre une cornée symétrique, avec 44,75 D à 96° et 41,62 D à 6°. Comme les deux K sont différents, c’est un astigmatisme irrégulier.","v":false,"expl":"Faux : c’est la figure de l’« Astigmatisme régulier (plus cambré à 90 degré—le plus commun) ». Deux K différents, à 90° l’un de l’autre, symétriques : régulier.","source":"6.1-d9","mod":6},{"id":"m6-009","fam":"m6-dep","kc":"T6.5","k":"qcm","q":"« L’individu est jeune (18-30 ans) » : dans quelle catégorie le cours place-t-il cet élément ?","choix":[{"t":"Un signe, relevé aux prétests","ok":true},{"t":"Un symptôme, rapporté par le patient","pourquoi":"Le patient ne se plaint pas de son âge : le cours range l’âge parmi les signes."},{"t":"Un examen que l’optométriste ajoute","pourquoi":"Les examens ajoutés sont la topographie, la pachymétrie, le réflexe lumineux… L’âge est un signe."},{"t":"Une cause du kératocône, selon le cours","pourquoi":"Les facteurs cités sont génétiques et le frottement; l’âge est rangé parmi les signes."}],"expl":"Le cours liste « L’individu est jeune (18-30 ans) » avec les signes. Signe : « Ce que nous observons ou ce que nous mesurons de facon (sic) objective ».","source":"6.1-d12, d14","mod":6},{"id":"m6-010","fam":"m6-dep","kc":"T6.5","k":"qcm","q":"Pendant l’histoire de cas, le patient te dit : « mes lunettes ne m’aident pas ». Comment classes-tu cette information ?","choix":[{"t":"Un symptôme : c’est ce que le patient ressent et te dit","ok":true},{"t":"Un signe : c’est une mesure objective de sa vision","pourquoi":"Personne n’a rien mesuré : c’est le patient qui le dit. Donc un symptôme."},{"t":"Un signe, parce que la phrase porte sur ses lunettes","pourquoi":"Le sujet ne compte pas; ce qui compte, c’est qui le constate. Ici, le patient."},{"t":"Ni l’un ni l’autre : une plainte sur les lunettes ne compte pas","pourquoi":"Elle compte : c’est un des cinq symptômes du kératocône dans le cours."}],"expl":"« Symptômes: Ce que le patient nous indique qu’il resent (sic) subjectivement ». Demande-toi qui le constate : le patient → symptôme; toi, en mesurant → signe.","source":"6.1-d12, d13","mod":6},{"id":"m6-011","fam":"m6-dep","kc":"T6.5","k":"vf","q":"Des mires déformées pendant la mesure à l’autoréfractomètre/kératomètre sont un signe, pas un symptôme.","v":true,"expl":"Vrai : c’est toi qui les observes pendant la mesure. Le cours les range avec les signes : « Mires distortionnées (sic) lors de la mesure à l’autoréfractomètre/kératomètre ».","source":"6.1-d12, d14","mod":6},{"id":"m6-012","fam":"m6-dep","kc":"T6.6","k":"qcm","q":"Lequel de ces résultats de prétests fait partie des signes du kératocône, selon le cours ?","choix":[{"t":"Un cylindre oblique à l’autoréfractomètre","ok":true},{"t":"Une kératométrie plate à l’autokératomètre","pourquoi":"C’est l’inverse : le cours dit « Kératométrie cambrée à l’autokératomètre »."},{"t":"Une pression intraoculaire plus élevée","pourquoi":"C’est l’inverse : le cours dit « Pression intraoculaire plus basse »."},{"t":"Un patient de plus de 50 ans","pourquoi":"Le signe est un patient jeune, de 18 à 30 ans."}],"expl":"Les six signes : jeune (18-30 ans), acuité réduite, « Cylindre oblique à l’autoréfractomètre », K cambrée, mires déformées, pression plus basse.","source":"6.1-d14","mod":6},{"id":"m6-013","fam":"m6-dep","kc":"T6.6","k":"vf","q":"Dans le kératocône, la pression intraoculaire mesurée en prétests est souvent plus élevée que la normale.","v":false,"expl":"Faux : le cours dit « Pression intraoculaire plus basse (moins que 9 et parfois asymmétrique (sic)) ». Retiens : plus basse, parfois différente d’un œil à l’autre.","source":"6.1-d14","mod":6},{"id":"m6-014","fam":"m6-dep","kc":"T6.7","k":"qcm","q":"Tu soupçonnes un kératocône. Quels prétests le cours te demande-t-il d’ajouter ?","choix":[{"t":"La topographie cornéenne et la pachymétrie","ok":true},{"t":"La tonométrie et une deuxième kératométrie","pourquoi":"La pachymétrie mesure l’épaisseur de la cornée; ce n’est ni la pression ni la courbure."},{"t":"Le réflexe lumineux et une réfraction complète","pourquoi":"Ce sont des examens de l’optométriste, pas des prétests ajoutés par l’assistant."},{"t":"Un OCT de la macula et une photo de la rétine","pourquoi":"Le cours demande la topographie (« le plus concluant ») et la pachymétrie, l’épaisseur de la cornée."}],"expl":"« Topographie cornéenne (le plus concluant) » et « Pachymétrie (épaisseur de la cornée) ». Les notes ajoutent que la topographie permet le diagnostic précoce.","source":"6.1-d15, d16","mod":6},{"id":"m6-015","fam":"m6-dep","kc":"T6.7","k":"qcm","q":"Que mesure la pachymétrie, demandée quand on soupçonne un kératocône ?","choix":[{"t":"L’épaisseur de la cornée","ok":true},{"t":"La pression à l’intérieur de l’œil","pourquoi":"Ça, c’est la pression intraoculaire (tonométrie). La pachymétrie mesure l’épaisseur."},{"t":"La courbure de la cornée, en dioptries","pourquoi":"La courbure, c’est la kératométrie ou la topographie. La pachymétrie mesure l’épaisseur."},{"t":"L’épaisseur des fibres du nerf optique","pourquoi":"L’OCT mesure aussi ces fibres, mais la pachymétrie porte sur la cornée."}],"expl":"« Pachymétrie (épaisseur de la cornée) » : elle montre l’amincissement du stroma. L’OCT a d’ailleurs une « Fonction pachymétrie pour mesurer l’épaisseur de la cornée ».","source":"6.1-d15; 6.4-d12","mod":6},{"id":"m6-016","fam":"m6-dep","kc":"T6.8","k":"qcm","q":"Un patient de 22 ans dit que ses lunettes ne l’aident pas; il a des allergies et se frotte les yeux. À l’autoréfracto-kératomètre : cylindre oblique, K cambrée, mires déformées. Que fais-tu ?","choix":[{"t":"Tu ajoutes topographie et pachymétrie et tu informes l’optométriste","ok":true},{"t":"Tu lui annonces un kératocône et tu lui parles du cross-linking","pourquoi":"Tu dépistes et tu orientes; le diagnostic et le traitement reviennent à l’optométriste."},{"t":"Tu ajoutes une tonométrie et tu refais la kératométrie, puis tu continues","pourquoi":"Mauvais examens : le cours demande la topographie et la pachymétrie (épaisseur)."},{"t":"Tu notes un astigmatisme ordinaire : des lunettes plus fortes suffiront","pourquoi":"Jeune, frottement, cylindre oblique, K cambrée, mires déformées : ce faisceau fait soupçonner un kératocône."}],"expl":"Symptômes (lunettes inutiles, frottement) et signes (âge, cylindre oblique, K cambrée, mires) pointent vers un kératocône. On ajoute topographie et pachymétrie; on oriente, on ne diagnostique pas.","source":"6.1-d13 à d15, d24","mod":6},{"id":"m6-017","fam":"m6-dep","kc":"T6.8","k":"qcm","q":"Patient de 24 ans. Aux prétests : acuité réduite, cylindre oblique, K cambrée, mires déformées. Dans l’histoire de cas, il a seulement dit que sa vue baisse. Quelle question est la plus utile à ajouter ?","choix":[{"t":"Avez-vous des allergies, et vous frottez-vous souvent les yeux ?","ok":true},{"t":"Votre pression dans l’œil a-t-elle déjà été trouvée élevée ?","pourquoi":"Dans le kératocône, la pression est plutôt plus basse; ce n’est pas la piste à creuser."},{"t":"Avez-vous de la difficulté à lire de près depuis vos 40 ans ?","pourquoi":"À 24 ans, la presbytie n’est pas en cause. Le cours cite les allergies et le frottement."},{"t":"Préférez-vous des verres photochromiques pour l’extérieur ?","pourquoi":"Utile pour la lunette, pas pour le dépistage. Le frottement, lui, est lié à la progression."}],"expl":"Un symptôme du cours : « Parfois il y a plainte d’allergie. Ses yeux lui grattent et il frotte ses yeux ». Oublier de le demander affaiblit le dépistage.","source":"6.1-d7, d13, d14","mod":6},{"id":"m6-018","fam":"m6-dep","kc":"T6.8","k":"qcm","q":"Une adolescente de 16 ans a des allergies et se frotte les yeux. Ses prétests sont normaux : bonne acuité, K normales, pas de cylindre oblique, mires nettes. Que fais-tu ?","choix":[{"t":"Tu notes allergies et frottement; l’optométriste jugera","ok":true},{"t":"Tu lui dis qu’elle a probablement un kératocône débutant","pourquoi":"Un seul indice ne suffit pas pour soupçonner, et l’assistant ne pose jamais de diagnostic."},{"t":"Tu n’écris rien : sans signe, la plainte ne compte pas","pourquoi":"Ce que la patiente rapporte se note; c’est à l’optométriste de juger."},{"t":"Tu lui conseilles des lentilles rigides dès maintenant","pourquoi":"Aucun signe, aucun diagnostic : proposer une correction n’est pas le rôle de l’assistant."}],"expl":"Un indice isolé ne fait pas un kératocône : les signes sont absents. Mais le frottement est un facteur cité par le cours; tu le notes, l’optométriste décide.","source":"6.1-d7, d13, d14, d24","mod":6},{"id":"m6-019","fam":"m6-trt","kc":"T6.9","k":"qcm","q":"Un patient atteint de kératocône voit de moins en moins bien avec ses lunettes. Quelle correction le cours présente-t-il comme principale ?","choix":[{"t":"Des lentilles rigides, qui créent une nouvelle surface","ok":true},{"t":"Des lunettes avec un cylindre beaucoup plus fort","pourquoi":"Un cylindre corrige deux méridiens symétriques; il ne corrige pas un cône irrégulier."},{"t":"Des lentilles souples, qui épousent et lissent le cône","pourquoi":"Les souples sont « utiles au début mais efficacité limitée avec un astigmatisme irrégulier »."},{"t":"Une greffe de cornée, dès que la vue commence à baisser","pourquoi":"La greffe est réservée aux « cas sévères », pas à la première baisse de vision."}],"expl":"« Lentilles cornéennes rigides corrigent un astigmatisme irrégulier. » Les notes : elles sont « le traitement optique principal dès que la vision baisse ».","source":"6.1-d18, d19","mod":6},{"id":"m6-020","fam":"m6-trt","kc":"T6.9","k":"vf","q":"Au début d’un kératocône, des lunettes ou des lentilles souples peuvent encore être utiles.","v":true,"expl":"Vrai : « utiles au début mais efficacité limitée avec un astigmatisme irrégulier ». Quand la vue baisse, on passe aux lentilles rigides.","source":"6.1-d18","mod":6},{"id":"m6-021","fam":"m6-trt","kc":"T6.10","k":"qcm","q":"Que fait le cross-linking dans le traitement du kératocône ?","choix":[{"t":"Il renforce le collagène et stabilise la cornée","ok":true},{"t":"Il corrige la myopie et l’astigmatisme du patient","pourquoi":"Il stabilise la cornée; il ne remplace pas la correction optique."},{"t":"Il remplace la partie malade par une cornée de donneur","pourquoi":"Ça, c’est la greffe, réservée aux « cas sévères »."},{"t":"Il pose une nouvelle surface rigide sur la cornée","pourquoi":"Ça, c’est la lentille rigide. Le cross-linking durcit le stroma lui-même."}],"expl":"« Cross-linking : renforce le collagène, stabilise la cornée ». Riboflavine puis UV créent des « liens additionnels entre les couches de collagène ».","source":"6.1-d20, d21","mod":6},{"id":"m6-022","fam":"m6-trt","kc":"T6.10","k":"ordre","q":"Remets les étapes du cross-linking dans l’ordre.","etapes":["On applique une solution de riboflavine (vitamine B2)","On utilise la lumière UV","Des liens additionnels se créent entre les couches de collagène du stroma","La cornée durcit et se stabilise"],"expl":"« On applique une solution de riboflavine (vit B2). Ensuite on utilize (sic) la lumière UV. » Les nouveaux liens durcissent la cornée.","source":"6.1-d20, d21","mod":6},{"id":"m6-023","fam":"m6-trt","kc":"T6.11","k":"qcm","q":"Lequel de ces gestes fait partie du rôle de l’assistant devant un kératocône ?","choix":[{"t":"Proposer le dépistage aux membres de la famille","ok":true},{"t":"Choisir entre le cross-linking et la greffe","pourquoi":"Choisir un traitement n’est pas le rôle de l’assistant : il dépiste, aide et éduque."},{"t":"Confirmer le diagnostic à l’aide de la topographie","pourquoi":"L’assistant fait la topographie, mais il dépiste et oriente; il ne confirme pas."},{"t":"Ajuster seul l’ordonnance de lunettes du patient","pourquoi":"L’ordonnance relève de l’optométriste. L’assistant aide à l’adaptation en lentilles rigides."}],"expl":"« Dépistage et orientation du patient. Dépistage membres de la famille » ; aide à l’adaptation en lentilles rigides; éducation du patient.","source":"6.1-d24","mod":6},{"id":"m6-024","fam":"m6-trt","kc":"T6.11","k":"qcm","q":"Un patient vient d’avoir un cross-linking. Quels conseils l’assistant lui donne-t-il, selon le cours ?","choix":[{"t":"Éviter le frottement, entretenir ses lentilles, venir aux suivis","ok":true},{"t":"Se frotter doucement les yeux pour aider la cornée à bien guérir","pourquoi":"C’est l’inverse : le frottement est lié à la progression; on l’évite."},{"t":"Arrêter ses suivis, puisque sa cornée est maintenant stabilisée","pourquoi":"Le cours insiste sur l’« adherence aux suivis et conseils post-chirurgie »."},{"t":"Remplacer ses lentilles rigides par des lentilles souples, plus douces","pourquoi":"Les souples ont une efficacité limitée sur un astigmatisme irrégulier; les rigides restent la correction."}],"expl":"« Éducation du patient : éviter le frottement oculaire, entretien des lentilles, adherence aux suivis et conseils post-chirurgie ». Les notes : insister sur le suivi post-traitement.","source":"6.1-d20, d24","mod":6},{"id":"m6-025","fam":"m6-ver","kc":"T6.12","k":"qcm","q":"Dans un verre dégressif, où sont les forces ?","choix":[{"t":"L’intermédiaire et la lecture, sans zone de loin","ok":true},{"t":"Le loin au centre, l’intermédiaire et le près en bas","pourquoi":"Ça, c’est le progressif. Le dégressif n’a pas de zone de loin."},{"t":"Une seule force, la même partout dans le verre","pourquoi":"Ça, c’est le simple vision. Le dégressif a 2 forces."},{"t":"Le loin en haut et une petite fenêtre de lecture","pourquoi":"Ça, c’est le double foyer (bifocal), avec sa ligne."}],"expl":"« Dégressifs est une sorte de lunette intermédiaire/lecture avec 2 forces. » Les patients disent souvent que ce sont « des lunettes d’ordinateurs ».","source":"6.2-d8, d10","mod":6},{"id":"m6-026","fam":"m6-ver","kc":"T6.12","k":"qcm","q":"Tu regardes une lunette qui a plus d’une force. Comment distingues-tu un double foyer d’un progressif ?","choix":[{"t":"Le double foyer a une ligne visible; le progressif n’en montre pas","ok":true},{"t":"Le progressif a une ligne visible; le double foyer n’en montre pas","pourquoi":"C’est inversé : le double foyer a une ligne, les divisions du progressif sont « moins évidentes »."},{"t":"On ne peut pas : à l’œil nu, les deux verres se ressemblent en tout","pourquoi":"Ils diffèrent : ligne et « petite fenêtre » pour le bifocal, divisions peu visibles pour le progressif."},{"t":"Le double foyer n’a qu’une force; le progressif en a deux","pourquoi":"Le double foyer a 2 forces; le progressif en a plusieurs."}],"expl":"« Lunettes doubles foyers avec ligne » ; le progressif a « plusieurs forces dans la même lentille mais les divisions sont moins évidentes ».","source":"6.2-d4, d5, d7","mod":6},{"id":"m6-027","fam":"m6-ver","kc":"T6.12","k":"vf","q":"Un verre anti-fatigue est un simple vision : il n’a qu’une seule force.","v":false,"expl":"Faux : ce sont des « mini-progressifs ». La différence entre loin et près est petite, « (0.50D à 1.00D) », mais elle existe : un renfort en bas du verre.","source":"6.2-d6","mod":6},{"id":"m6-028","fam":"m6-ver","kc":"T6.13","k":"qcm","q":"Une patiente de 25 ans a des difficultés d’accommodation. Le lentimètre montre une petite addition, +0,75. Quel type de verre le tableau des âges lui associe-t-il ?","choix":[{"t":"Un anti-fatigue","ok":true},{"t":"Des progressifs","pourquoi":"Le cours les place à « 38 ans+ pour presbytie ». À 25 ans, c’est l’anti-fatigue."},{"t":"Un dégressif","pourquoi":"Réservé aux presbytes avancés de 52 ans et plus, sous conditions."},{"t":"Un double foyer (bifocal)","pourquoi":"Le tableau des âges ne le cite pas; pour 20-38 ans et l’accommodation, il dit anti-fatigue."}],"expl":"« Anti-fatigue: 20-38 ans pour difficultés d’accommodation », avec une addition « (0.50D à 1.00D) ». +0,75 entre dans cette plage.","source":"6.2-d6, d10","mod":6},{"id":"m6-029","fam":"m6-ver","kc":"T6.13","k":"vf","q":"Selon le cours, tout patient de 52 ans et plus porte des dégressifs.","v":false,"expl":"Faux : les dégressifs visent les presbytes avancés de 52 ans et plus « qui ont des difficultés ergonomiques avec les progressifs », ou quand le simple vision ne suffit plus.","source":"6.2-d10","mod":6},{"id":"m6-030","fam":"m6-ver","kc":"T6.16","k":"qcm","q":"Le lentimètre lit « OD +1.00-1.00x180 add +0.75 ». Le patient dit que ce sont ses « lunettes de lecture ». Quel verre est-ce ?","choix":[{"t":"Un dégressif (intermédiaire et près)","ok":true},{"t":"Un progressif (vision de loin et de près)","pourquoi":"Progressif ou anti-fatigue, c’est quand le patient dit « lunettes pour vision de loin »."},{"t":"Un simple vision pour la lecture","pourquoi":"Il y a une addition : la force change vers le bas, donc c’est un multifoyer."},{"t":"Impossible à dire sans l’âge du patient","pourquoi":"Ici, l’usage suffit : pour la lecture, le cours conclut au dégressif."}],"expl":"Cours : « Dans ce cas il s’agit d’un verre dégressif (intermédiaire et vision de près) ». Le +1,00 du haut est alors l’intermédiaire, pas le loin (déduit).","source":"6.2-d15","mod":6},{"id":"m6-031","fam":"m6-ver","kc":"T6.16","k":"qcm","q":"Mêmes valeurs, « OD +1.00-1.00x180 add +0.75 ». Cette fois, le patient dit que ce sont ses « lunettes pour vision de loin ». Que conclut le cours ?","choix":[{"t":"Un anti-fatigue ou des progressifs","ok":true},{"t":"Un dégressif, puisque l’addition est la même","pourquoi":"Mêmes nombres, autre usage : le dégressif sert à la lecture, pas au loin."},{"t":"Un simple vision, puisqu’il le porte de loin","pourquoi":"La force change vers le bas : c’est un multifoyer, même porté de loin."},{"t":"Le même verre qu’en lecture : les nombres décident","pourquoi":"Faux : l’usage tranche. Mêmes nombres, deux verres possibles."}],"expl":"« Dans ce cas il s’agit d’un verre anti-fatigue ou progressifs (vision de loin et vision de près) ». Les mêmes nombres, deux verres : l’usage tranche.","source":"6.2-d15, d16","mod":6},{"id":"m6-032","fam":"m6-ver","kc":"T6.16","k":"qcm","q":"Patient de 27 ans. Le lentimètre lit +0,50 en haut du verre et +1,25 en bas. Il porte ses lunettes de loin et à l’ordinateur. Quel verre est le plus probable ?","choix":[{"t":"Un anti-fatigue","ok":true},{"t":"Des progressifs","pourquoi":"Progressifs : 38 ans et plus, pour la presbytie. À 27 ans, avec +0,75 d’addition, l’anti-fatigue colle."},{"t":"Un dégressif","pourquoi":"Le dégressif n’a pas de zone de loin, et il vise les presbytes avancés de 52 ans et plus."},{"t":"Un simple vision","pourquoi":"La force change vers le bas : c’est un multifoyer."}],"expl":"Addition = +1,25 − (+0,50) = +0,75, dans la plage « (0.50D à 1.00D) ». Usage de loin, 27 ans : anti-fatigue (« 20-38 ans »). Lecture déduite du cours.","source":"6.2-d6, d9, d10","mod":6},{"id":"m6-033","fam":"m6-ver","kc":"T6.16","k":"qcm","q":"Patiente de 58 ans, presbyte. Aucune ligne visible sur ses verres. Au lentimètre, la force augmente de +2,00 vers le bas. Elle porte ses lunettes en tout temps, de loin comme de près. Quel verre ?","choix":[{"t":"Des progressifs","ok":true},{"t":"Un anti-fatigue","pourquoi":"L’anti-fatigue a une petite addition (0,50 à 1,00 D) et vise 20-38 ans; ici +2,00 à 58 ans."},{"t":"Un dégressif","pourquoi":"Le dégressif n’a pas de zone de loin; elle porte ses lunettes de loin."},{"t":"Un double foyer (bifocal)","pourquoi":"Le double foyer a une ligne visible; ses verres n’en ont pas."}],"expl":"Loin au centre, près en bas, sans ligne : progressifs, « 38 ans+ pour presbytie ». L’âge seul ne suffit pas; l’usage et la mesure confirment.","source":"6.2-d4, d7, d10","mod":6},{"id":"m6-034","fam":"m6-ver","kc":"T6.16","k":"qcm","q":"Une patiente dit : “Ce sont mes lunettes pour lire.” Tu déplaces le verre au lentimètre : la force ne change pas vers le bas. Quel verre ?","choix":[{"t":"Un simple vision, pour la vision de près","ok":true},{"t":"Un dégressif, puisqu’elle les utilise pour lire","pourquoi":"Un dégressif a 2 forces; ici la force ne change pas, donc une seule force."},{"t":"Un double foyer avec une fenêtre de lecture","pourquoi":"Le double foyer a 2 forces et une ligne; ici une seule force."},{"t":"Un anti-fatigue à faible addition","pourquoi":"L’anti-fatigue a une addition de 0,50 à 1,00 D : la force changerait vers le bas."}],"expl":"Simple vision : « Une force dans la lentille », pour le loin, le près ou en tout temps. Le cours montre d’ailleurs un simple vision de « lunettes de lecture ».","source":"6.2-d3, d9, d14","mod":6},{"id":"m6-035","fam":"m6-rx","kc":"T6.14","k":"qcm","q":"Dans la ligne « OD +1.00-1.00x180 add +0.75 », que représente -1.00 ?","choix":[{"t":"Le cylindre","ok":true},{"t":"La sphère","pourquoi":"La sphère vient en premier, avec son signe : +1.00."},{"t":"L’addition","pourquoi":"L’addition suit le mot add : +0.75."},{"t":"L’axe du cylindre","pourquoi":"L’axe suit le x : 180."}],"expl":"Ordre de lecture : œil (OD), sphère (+1.00), cylindre (−1.00), x et axe (180), addition (+0.75).","source":"6.2-d15","mod":6},{"id":"m6-036","fam":"m6-rx","kc":"T6.14","k":"qcm","q":"Tu dois écrire, pour l’œil gauche : sphère +0,50, cylindre −1,25, axe 95, addition +2,00. Quelle ligne est juste ?","choix":[{"t":"OS +0,50 −1,25 x095 add +2,00","ok":true},{"t":"OD +0,50 −1,25 x095 add +2,00","pourquoi":"L’œil gauche s’écrit OS; OD, c’est l’œil droit."},{"t":"OS +0,50 +1,25 x095 add +2,00","pourquoi":"Signe inversé sur le cylindre : « Écrire + ou (sic) lieu de – »."},{"t":"OS +0,50 −1,25 x095","pourquoi":"L’addition manque : la lunette serait lue comme un simple foyer."}],"expl":"Œil (OS = gauche), sphère signée, cylindre négatif, x et axe, puis l’addition. Une erreur de signe ou d’œil change toute la correction.","source":"6.2-d15 à d17, d20","mod":6},{"id":"m6-037","fam":"m6-rx","kc":"T6.14","k":"vf","q":"Dans « OD -1.00 sph », l’œil droit n’a pas de cylindre : seulement une sphère de −1,00 D.","v":true,"expl":"Vrai : sph indique une sphère seule. Au lentimètre, un C 0,00 s’écrit de cette façon.","source":"6.2-d18","mod":6},{"id":"m6-038","fam":"m6-rx","kc":"T6.14","k":"qcm","q":"Après les valeurs de la lunette, le cours ajoute des notes au dossier. Lesquelles ?","choix":[{"t":"L’âge des lunettes, clairs ou photochromiques, rayures, monture","ok":true},{"t":"Le diagnostic probable du patient et le traitement à lui conseiller","pourquoi":"L’assistant note ce qu’il observe; il ne diagnostique pas."},{"t":"La nouvelle ordonnance que l’assistant juge la meilleure pour lui","pourquoi":"La nouvelle ordonnance revient à l’optométriste."},{"t":"Seulement l’écart pupillaire affiché sur l’écran du lentimètre","pourquoi":"Le cours note bien plus : âge, verres clairs ou photochromiques, rayures, monture."}],"expl":"Exemple du cours : « Notes: âge 2 ans, claires, sans rayures, monture bon état ». Rayures et monture abîmée peuvent nuire à l’acuité.","source":"6.2-d11, d14, d17","mod":6},{"id":"m6-039","fam":"m6-rx","kc":"T6.15","k":"num","q":"Ligne mesurée : « OD +1.00-1.00x180 add +0.75 ». Quelle est la sphère de la puissance de près (le bas du verre), en dioptries ?","rep":{"v":1.75,"u":"D","tol":0.01,"dec":2},"dem":[["① Sphère du haut","+1,00"],["② + addition","+1,00 + 0,75 = +1,75"],["③ Cylindre et axe","inchangés : −1,00 x180"]],"pieges":[{"v":0.75,"m":"C’est l’addition seule. Puissance de près = sphère du haut + addition."},{"v":1,"m":"C’est la sphère du haut, sans l’addition."},{"v":0.25,"m":"Tu as soustrait l’addition : il faut l’ajouter."}],"expl":"De près : +1,75 −1,00 x180. L’addition s’ajoute à la sphère seulement (règle déduite des exemples du cours).","source":"6.2-d15","mod":6},{"id":"m6-040","fam":"m6-rx","kc":"T6.15","k":"num","q":"Progressifs : OS +2,00 −1,00 x090 add +1,75. Quelle est la sphère de près, en dioptries ?","rep":{"v":3.75,"u":"D","tol":0.01,"dec":2},"dem":[["① Sphère du haut","+2,00"],["② + addition","+2,00 + 1,75 = +3,75"],["③ Cylindre et axe","inchangés : −1,00 x090"]],"pieges":[{"v":1.75,"m":"C’est l’addition seule."},{"v":2,"m":"C’est la sphère du haut, sans l’addition. As-tu mis l’addition sur le cylindre ?"},{"v":0.25,"m":"Tu as soustrait : +2,00 − 1,75. L’addition s’ajoute."}],"expl":"De près : +3,75 −1,00 x090. L’addition est « la puissance positive supplémentaire destinée à faciliter la vision de près » : elle s’ajoute à la sphère (déduit).","source":"6.2-d17","mod":6},{"id":"m6-041","fam":"m6-rx","kc":"T6.15","k":"num","q":"OD +1,25 −0,50 x170 add +2,00. Quelle est la sphère de près, en dioptries ?","rep":{"v":3.25,"u":"D","tol":0.01,"dec":2},"dem":[["① Sphère du haut","+1,25"],["② + addition","+1,25 + 2,00 = +3,25"],["③ Cylindre et axe","inchangés : −0,50 x170"]],"pieges":[{"v":2,"m":"C’est l’addition seule."},{"v":1.25,"m":"C’est la sphère du haut, sans l’addition."},{"v":-0.75,"m":"Tu as soustrait l’addition (+1,25 − 2,00). Elle s’ajoute."}],"expl":"De près : +3,25 −0,50 x170. Seule la sphère change; le cylindre et l’axe restent (règle déduite).","source":"6.2-d15 à d17","mod":6},{"id":"m6-042","fam":"m6-rx","kc":"T6.15","k":"num","q":"OD −1,50 −0,50 x180 add +2,00. Quelle est la sphère de près, en dioptries ?","rep":{"v":0.5,"u":"D","tol":0.01,"dec":2},"dem":[["① Sphère du haut","−1,50"],["② + addition","−1,50 + 2,00 = +0,50"],["③ Cylindre et axe","inchangés : −0,50 x180"]],"pieges":[{"v":-3.5,"m":"Tu as soustrait l’addition (−1,50 − 2,00). Une addition est positive : elle s’ajoute."},{"v":2,"m":"C’est l’addition seule."},{"v":-0.5,"m":"Signe inversé : −1,50 + 2,00 donne +0,50, pas −0,50."}],"expl":"Avec une sphère négative, l’addition remonte vers zéro, puis au-delà : −1,50 + 2,00 = +0,50. Attention au signe, une des erreurs fréquentes.","source":"6.2-d15 à d17, d20","mod":6},{"id":"m6-043","fam":"m6-rx","kc":"T6.15","k":"num","q":"Le lentimètre lit +0,50 en haut du verre et +1,25 en bas (même cylindre, même axe). Quelle est l’addition, en dioptries ?","rep":{"v":0.75,"u":"D","tol":0.01,"dec":2},"dem":[["Règle à rebours","addition = bas − haut"],["Calcul","+1,25 − 0,50 = +0,75"]],"pieges":[{"v":1.75,"m":"Tu as additionné le haut et le bas. L’addition = bas − haut."},{"v":-0.75,"m":"Signe inversé : bas − haut = +1,25 − 0,50 = +0,75."},{"v":1.25,"m":"C’est la puissance du bas, pas l’écart entre le haut et le bas."}],"expl":"Addition +0,75 : dans la plage anti-fatigue « (0.50D à 1.00D) ». Règle déduite des exemples du cours.","source":"6.2-d6, d9","mod":6},{"id":"m6-044","fam":"m6-rx","kc":"T6.15","k":"num","q":"En haut du verre, le lentimètre lit −2,00; en bas, +0,25 (même cylindre, même axe). Quelle est l’addition, en dioptries ?","rep":{"v":2.25,"u":"D","tol":0.01,"dec":2},"dem":[["Règle à rebours","addition = bas − haut"],["Calcul","+0,25 − (−2,00) = +2,25"]],"pieges":[{"v":-1.75,"m":"Tu as additionné : −2,00 + 0,25. L’addition = bas − haut = +0,25 − (−2,00)."},{"v":1.75,"m":"Tu as oublié le signe moins du haut : soustraire −2,00 revient à ajouter 2,00."},{"v":-2.25,"m":"Signe inversé : le bas est plus positif que le haut, l’addition est donc positive."}],"expl":"Addition +2,25. Vérifie : −2,00 + 2,25 = +0,25, la puissance du bas. Règle déduite des exemples du cours.","source":"6.2-d15 à d17","mod":6},{"id":"m6-045","fam":"m6-mes","kc":"T6.18","k":"qcm","q":"Pourquoi l’optométriste a-t-il besoin que tu mesures les lunettes que le patient porte ?","choix":[{"t":"Pour savoir avec quelle correction il fonctionne en ce moment","ok":true},{"t":"Pour recopier l’ancienne ordonnance telle quelle dans le dossier","pourquoi":"Le cours le dit : « ce n'est pas simplement recopier une prescription »."},{"t":"Pour que l’assistant prépare lui-même la nouvelle ordonnance","pourquoi":"La nouvelle ordonnance revient à l’optométriste; tu lui fournis la mesure."},{"t":"Pour remplacer l’autoréfractomètre quand il est en panne","pourquoi":"Ce sont deux mesures différentes : l’une porte sur l’œil, l’autre sur la lunette."}],"expl":"« C'est permettre à l'optométriste de comprendre avec quelle correction le patient fonctionne actuellement. » Trois usages : vision et confort actuels, nouvelle ordonnance, santé oculaire.","source":"6.3-d3 à d6","mod":6},{"id":"m6-046","fam":"m6-mes","kc":"T6.18","k":"vf","q":"Le patient montre sur son téléphone la photo de son ancienne ordonnance. Tu peux la recopier au dossier au lieu de mesurer ses lunettes.","v":false,"expl":"Faux : « Mesurer les lunettes du patient, ce n'est pas simplement recopier une prescription. » L’optométriste veut la correction avec laquelle il fonctionne : celle de la lunette qu’il porte.","source":"6.3-d3, d4","mod":6},{"id":"m6-047","fam":"m6-mes","kc":"T6.19","k":"ordre","q":"Un patient arrive avec ses lunettes. Remets la démarche de l’assistant dans l’ordre.","etapes":["Demander s’il a ses lunettes et quand il les porte","Observer les verres et la monture : clairs ou photochromiques, rayures, monture","Mesurer au lentimètre en déplaçant le verre vers le bas","Transcrire au dossier : OD, OS, signes, addition, notes","Signaler à l’optométriste ce qu’on ne peut pas mesurer, comme un prisme"],"expl":"Demander → observer → mesurer → transcrire → signaler (ordre déduit de 6.2-d13 et 6.3-d7). Sauter la première étape mène aux deux premières erreurs fréquentes.","source":"6.2-d13, d18; 6.3-d7","mod":6},{"id":"m6-048","fam":"m6-mes","kc":"T6.19","k":"qcm","q":"Le cours propose de commencer par « quand portez vous les lunettes? ». Qu’est-ce que cette question t’apprend ?","choix":[{"t":"L’usage : tout le temps, seulement de loin ou de près","ok":true},{"t":"La puissance exacte de ses verres, sans avoir à les mesurer","pourquoi":"La puissance se mesure au lentimètre; la question donne l’usage."},{"t":"Si le patient a un kératocône débutant ou non","pourquoi":"La question porte sur l’usage des lunettes, pas sur un dépistage."},{"t":"L’âge exact de sa monture et de ses verres","pourquoi":"L’âge des lunettes est une autre question : « Âge des lunettes? »."}],"expl":"« Ceci nous donne une indication si c’est à tout moment, seulement vision de loin, seulement vision de près. » Ne pas la poser est une erreur fréquente.","source":"6.2-d2, d20; 6.3-d7","mod":6},{"id":"m6-049","fam":"m6-mes","kc":"T6.19","k":"qcm","q":"Le patient affirme : “Mes lunettes n’ont qu’une seule force.” Au lentimètre, la force augmente quand tu déplaces le verre vers le bas. Que retiens-tu ?","choix":[{"t":"C’est un multifoyer : la mesure l’emporte sur ses dires","ok":true},{"t":"C’est un simple vision : le patient connaît ses lunettes","pourquoi":"Le cours prévient : « il ne faut pas nécessairement se fier au patient…on va effectuer les mesures »."},{"t":"L’instrument se trompe : tu refais la mesure au centre seulement","pourquoi":"Mesurer au centre seulement cache l’addition : c’est l’erreur du multifoyer pris pour un simple foyer."},{"t":"Tu inscris simple vision et tu notes son commentaire","pourquoi":"Inscrire un multifoyer comme un simple foyer est une des cinq erreurs fréquentes."}],"expl":"« Si la force change vers la partie inférieure, il s’agit d’un multifoyers ». Tu mesures l’addition et tu l’inscris.","source":"6.2-d2, d9, d20","mod":6},{"id":"m6-050","fam":"m6-mes","kc":"T6.17","k":"qcm","q":"Au lentimètre, tu n’arrives pas à centrer la mire. Que fais-tu ?","choix":[{"t":"Tu notes un prisme possible, à vérifier avec l’opticien ou l’optométriste","ok":true},{"t":"Tu conclus à une erreur de l’instrument et tu passes à la suite du test","pourquoi":"Une mire qui ne se centre pas est un indice de prisme, pas une panne à ignorer."},{"t":"Tu inscris “aucun prisme” au dossier, puisque tu n’as rien pu lire à l’écran","pourquoi":"Tu ne peux pas écrire ce que tu n’as pas mesuré; tu signales le doute."},{"t":"Tu calcules toi-même la valeur du prisme et sa base, puis tu l’inscris","pourquoi":"Le cours dit que c’est « un peu complexe » : on demande l’appui de l’opticien ou de l’optométriste."}],"expl":"« Si on n'est pas capable de center (sic) la mire il y a possiblement un prisme. » C’est à vérifier avec l’opticien ou l’optométriste.","source":"6.2-d18","mod":6},{"id":"m6-051","fam":"m6-mes","kc":"T6.17","k":"qcm","q":"Une patiente porte des lunettes avec prismes pour corriger sa vision double. Que fait l’assistant ?","choix":[{"t":"Il note la force et demande l’appui d’un opticien ou optométriste","ok":true},{"t":"Il ne mesure pas ces lunettes : les prismes sont hors de son rôle","pourquoi":"Le cours dit « On note la force » : il mesure, puis demande de l’aide pour le prisme."},{"t":"Il retire le prisme de la ligne d’ordonnance pour simplifier le dossier","pourquoi":"Retirer une valeur fausse la correction que l’optométriste croit lire."},{"t":"Il note seulement le prisme, sans la sphère ni le cylindre","pourquoi":"Il note la force (sphère, cylindre, axe) et fait vérifier le prisme."}],"expl":"« On note la force mais on demande à un opticien ou l’optométriste de nous appuyer » : le prisme est « un peu complexe ». On le prescrit pour déplacer l’image.","source":"6.2-d18, d19","mod":6},{"id":"m6-052","fam":"m6-mes","kc":"T6.22","k":"qcm","q":"Qui utilise surtout le lentimètre manuel (focomètre), selon le cours ?","choix":[{"t":"Les opticiens, pour la qualité des verres et le taillage","ok":true},{"t":"Les assistants, pour mesurer les lunettes des patients en prétests","pourquoi":"En prétests, l’assistant utilise le lentimètre automatique."},{"t":"Les optométristes, pour mesurer l’épaisseur de la cornée","pourquoi":"L’épaisseur de la cornée, c’est la pachymétrie; le focomètre mesure un verre."}],"expl":"Le focomètre manuel est « Surtout utilisé par les opticiens pour évaluer la qualité de la lentille et dans le taillage des verres ».","source":"6.3-d11","mod":6},{"id":"m6-053","fam":"m6-mes","kc":"T6.22","k":"vf","q":"Comme pour le kératomètre, il existe un lentimètre automatique et un lentimètre manuel; en prétests, l’assistant utilise l’automatique.","v":true,"expl":"Vrai : « Tout comme le kératomètre, il existe aussi un lentimètre ou focomètre manuel. » Le manuel sert surtout aux opticiens.","source":"6.3-d9 à d11","mod":6},{"id":"m6-054","fam":"m6-ecr","kc":"T6.20","k":"qcm","q":"L’écran du lentimètre affiche, à gauche, L : S −3,25 C 0,00 ; à droite, R : S −4,00 C −0,75 A 70. Quelle transcription est juste ?","choix":[{"t":"OD −4,00 −0,75 x070 ; OS −3,25 sph","ok":true},{"t":"OD −3,25 sph ; OS −4,00 −0,75 x070","pourquoi":"Tu as lu la colonne de gauche comme l’œil droit. L = gauche = OS : erreur OD/OS."},{"t":"OD +4,00 −0,75 x070 ; OS +3,25 sph","pourquoi":"Signe inversé sur la sphère : « Écrire + ou (sic) lieu de – »."},{"t":"OD −4,00 −0,75 x160 ; OS −3,25 sph","pourquoi":"Tu as ajouté 90 à l’axe comme pour un méridien. L’axe se recopie : 70 → x070."}],"expl":"R = OD, L = OS (déduit), même si L est affiché à gauche. C 0,00 → sph. L’axe se recopie tel quel : x070.","source":"6.3-d10; 6.2-d20","mod":6},{"id":"m6-055","fam":"m6-ecr","kc":"T6.20","k":"qcm","q":"Écran du lentimètre : R : S +1,50 C −0,50 A 180 ; L : S +1,75 C −0,75 A 10. La force ne change pas quand tu déplaces le verre. Quelle ligne inscris-tu ?","choix":[{"t":"OD +1,50 −0,50 x180 ; OS +1,75 −0,75 x010","ok":true},{"t":"OD +1,75 −0,75 x010 ; OS +1,50 −0,50 x180","pourquoi":"Yeux inversés : R va à OD, L va à OS."},{"t":"OD +1,50 +0,50 x180 ; OS +1,75 +0,75 x010","pourquoi":"Signe du cylindre inversé : l’écran affiche un cylindre négatif."},{"t":"OD +1,50 −0,50 x180 add +0,75 ; OS +1,75 −0,75 x010 add +0,75","pourquoi":"Aucune addition : la force ne change pas vers le bas, c’est un simple vision."}],"expl":"R → OD, L → OS; chaque valeur garde son signe; l’axe 10 s’écrit x010. Force identique en bas : simple vision, pas d’addition.","source":"6.3-d10; 6.2-d9","mod":6},{"id":"m6-056","fam":"m6-ecr","kc":"T6.20","k":"qcm","q":"Lunette multifoyer. En haut du verre : R : S −0,75 C −0,50 A 90 ; L : S −1,00 C 0,00. En bas, la sphère monte de +1,50 aux deux yeux. Quelle ligne est juste ?","choix":[{"t":"OD −0,75 −0,50 x090 add +1,50 ; OS −1,00 sph add +1,50","ok":true},{"t":"OD −0,75 −0,50 x090 ; OS −1,00 sph","pourquoi":"L’addition manque : un multifoyer inscrit comme un simple foyer, erreur fréquente."},{"t":"OD −1,00 sph add +1,50 ; OS −0,75 −0,50 x090 add +1,50","pourquoi":"OD et OS mélangés : R est l’œil droit, L l’œil gauche."},{"t":"OD −0,75 −0,50 x090 add +1,50 ; OS +1,00 sph add +1,50","pourquoi":"Signe inversé sur la sphère de l’OS : « Écrire + ou (sic) lieu de – »."}],"expl":"Puissance du haut, puis l’addition (bas − haut = +1,50). OS −1,00 sph : C 0,00 veut dire pas de cylindre.","source":"6.3-d10; 6.2-d9, d17, d20","mod":6},{"id":"m6-058","fam":"m6-ecr","kc":"T6.20","k":"num","q":"Sur l’écran du lentimètre, LPD = 28,5 et RPD = 29,5. Quelle valeur de PD (écart pupillaire total) l’écran affiche-t-il ?","rep":{"v":58,"u":"","tol":0.05,"dec":1},"dem":[["PD = LPD + RPD","28,5 + 29,5 = 58,0"]],"pieges":[{"v":1,"m":"Tu as fait la différence. Le PD est la somme des deux demi-écarts."},{"v":29,"m":"C’est la moyenne des deux. Le PD est leur somme."}],"expl":"L’écran du cours affiche LPD 28,5, RPD 29,5 et PD 58,0 : le PD est la somme LPD + RPD.","source":"6.3-d10","mod":6},{"id":"m6-059","fam":"m6-ecr","kc":"T6.21","k":"qcm","q":"Le patient porte OD +2,00 −0,50 x090. Au dossier, l’assistant a écrit OD −2,00 −0,50 x090. Quelle erreur fréquente est-ce ?","choix":[{"t":"Écrire + au lieu de – (erreur de signe)","ok":true},{"t":"Mélanger l’œil droit et l’œil gauche","pourquoi":"C’est bien l’OD des deux côtés; seul le signe de la sphère a changé."},{"t":"Ne pas identifier un multifoyer","pourquoi":"Aucune addition n’est en jeu ici; c’est le signe de la sphère qui a changé."},{"t":"Ne pas demander quand il porte ses lunettes","pourquoi":"Ça ne change pas une valeur écrite; ici, +2,00 est devenu −2,00."}],"expl":"« Écrire + ou (sic) lieu de – ou vis versa (sic) » : le +2,00 devient −2,00, et l’optométriste part d’une base fausse.","source":"6.2-d20","mod":6},{"id":"m6-060","fam":"m6-ecr","kc":"T6.21","k":"qcm","q":"1re mesure de l’assistant : OD +1,00 −0,50 x020 ; OS +1,25 −0,75 x030. À la revérification : OD +0,75 add +1,00 ; OS +0,75 add +1,00. Quelle erreur la 1re mesure contenait-elle ?","choix":[{"t":"Un multifoyer inscrit en simple foyer","ok":true},{"t":"Une erreur de signe sur les sphères","pourquoi":"Les sphères sont positives dans les deux mesures; le problème est l’addition manquée."},{"t":"L’œil droit et l’œil gauche mélangés","pourquoi":"Les deux yeux ont des valeurs voisines; l’indice est l’addition, absente de la 1re mesure."},{"t":"Un axe mal recopié dans chaque œil","pourquoi":"Ce n’est pas qu’un axe : ce cylindre n’existe pas dans la vraie lunette."}],"expl":"Le cylindre inattendu était l’indice : « il y a des valeurs d’astigmatisme qui cloches (sic) ». Il fallait déplacer le verre vers le bas et noter l’addition.","source":"SC6-c04; 6.2-d9, d20","mod":6},{"id":"m6-061","fam":"m6-ecr","kc":"T6.21","k":"qcm","q":"Le patient arrive sans lunettes sur le nez. L’assistant passe directement aux prétests. Après l’examen, on apprend que ses lunettes étaient dans son sac. Quelle erreur fréquente ?","choix":[{"t":"Ne pas demander s’il a des lunettes avec lui","ok":true},{"t":"Ne pas demander quand il utilise ses lunettes","pourquoi":"Avant de parler d’usage, il fallait savoir s’il les avait apportées."},{"t":"Mélanger l’œil droit et l’œil gauche","pourquoi":"Rien n’a été mesuré, donc rien n’a pu être mélangé."},{"t":"Écrire + au lieu de –","pourquoi":"Aucune valeur n’a été écrite : la lunette n’a jamais été mesurée."}],"expl":"Première erreur de la liste : « Ne pas demander si la patient (sic) a des lunettes avec eux ». Sans la lunette, l’optométriste ignore la correction actuelle.","source":"6.2-d13, d20","mod":6},{"id":"m6-062","fam":"m6-ecr","kc":"T6.21","k":"vf","q":"Une patiente a une paire seulement pour conduire la nuit. L’assistant mesure bien cette paire, mais sans demander quand elle la porte : c’est quand même une des erreurs fréquentes.","v":true,"expl":"Vrai : « Ne pas demander quand le patient utilise les lunettes ». L’usage dit si la paire sert tout le temps, de loin ou de près; certains patients ont plusieurs paires.","source":"6.2-d2, d20; 6.3-d7","mod":6},{"id":"m6-063","fam":"m6-role","kc":"T6.23","k":"qcm","q":"Chaque situation clinique du module (SC6) pose les mêmes questions. Laquelle en fait partie ?","choix":[{"t":"Que doit vérifier, documenter ou signaler l’assistant ?","ok":true},{"t":"Quel diagnostic l’assistant doit-il poser ?","pourquoi":"L’assistant ne diagnostique pas; il vérifie, documente et signale."},{"t":"Quelle nouvelle ordonnance l’assistant propose-t-il ?","pourquoi":"La nouvelle ordonnance revient à l’optométriste."},{"t":"Quel traitement l’assistant doit-il conseiller ?","pourquoi":"Le traitement n’est pas son rôle; il transmet l’information."}],"expl":"Les trois questions : « Pourquoi la mesure des lunettes est-elle importante dans cette situation? » ; « Qu’apporte cette information à l’optométriste? » ; « Que doit vérifier, documenter ou signaler l’assistant? ».","source":"SC6","mod":6},{"id":"m6-064","fam":"m6-role","kc":"T6.23","k":"qcm","q":"SC6-c08 : le patient porte des progressifs. Mesure de loin : OD +1,00 sph ; OS +1,25 sph. Addition mesurée : +2,00 aux deux yeux. Saisie : Simple vision; OD +1,00; OS +1,25. Que doit faire l’assistant ?","choix":[{"t":"Corriger la saisie (add +2,00) et avertir l’optométriste","ok":true},{"t":"Rien : la puissance de loin est juste, c’est elle qui compte","pourquoi":"La vision de près manque au dossier : l’optométriste ignore avec quoi le patient lit."},{"t":"Corriger la saisie sans en parler à personne","pourquoi":"Le dossier a pu être lu : « L’optométriste consulte ensuite le dossier avant l’examen ». On le prévient."},{"t":"Prescrire lui-même l’addition oubliée au patient","pourquoi":"L’assistant ne prescrit rien : il corrige sa transcription et signale."}],"expl":"C’est l’erreur « Ne pas identifier un multifoyer et inscrire les valeurs comme un simple foyer ». De près, il voit par +3,00 (OD) et +3,25 (OS) (déduit).","source":"SC6-c08; 6.2-d20","mod":6},{"id":"m6-065","fam":"m6-role","kc":"T6.23","k":"num","q":"Toujours SC6-c08 : OD +1,00 sph, addition +2,00. Quelle sphère de près manque au dossier pour l’œil droit, en dioptries ?","rep":{"v":3,"u":"D","tol":0.01,"dec":2},"dem":[["① Sphère de loin","+1,00"],["② + addition","+1,00 + 2,00 = +3,00"]],"pieges":[{"v":2,"m":"C’est l’addition seule."},{"v":1,"m":"C’est la puissance de loin, déjà au dossier."},{"v":-1,"m":"Tu as soustrait l’addition : elle s’ajoute."}],"expl":"+3,00 à l’OD (et +3,25 à l’OS) : c’est ce que le patient utilise pour lire, et le dossier l’ignorait. Règle déduite des exemples du cours.","source":"SC6-c08","mod":6},{"id":"m6-066","fam":"m6-role","kc":"T6.29","k":"qcm","q":"Au lentimètre, une valeur prismatique inattendue apparaît; la mire est décentrée, et une 2e mesure après repositionnement donne une autre valeur. Ton collègue croit que c’est une erreur de l’instrument. Qu’en penses-tu ?","choix":[{"t":"Il faut le noter et le signaler à l’opticien ou l’optométriste","ok":true},{"t":"Il a raison : on efface la valeur et on continue l’examen normalement","pourquoi":"Une mire qui ne se centre pas peut cacher un prisme; on signale, on n’efface pas."},{"t":"On garde la première valeur affichée, c’est la plus fiable","pourquoi":"Rien ne dit laquelle est juste; l’assistant ne tranche pas seul, il signale."},{"t":"On annonce au patient qu’il a sûrement une vision double","pourquoi":"Annoncer un problème, c’est diagnostiquer : ce n’est pas le rôle de l’assistant."}],"expl":"SC6-c06 : l’assistant « croit que c’est une erreur de l’instrument ». Or « Si on n'est pas capable de center (sic) la mire il y a possiblement un prisme. »","source":"SC6-c06; 6.2-d18","mod":6},{"id":"m6-067","fam":"m6-role","kc":"T6.29","k":"qcm","q":"Verres fortement rayés. Trois lectures successives de l’OD : −2,25 ; −1,75 ; −2,50 D. Que fais-tu ?","choix":[{"t":"Tu notes rayures et lectures instables, et tu le signales","ok":true},{"t":"Tu inscris la moyenne des trois, sans rien préciser","pourquoi":"Une moyenne cache le problème : la lecture n’est pas fiable, il faut le dire."},{"t":"Tu gardes la valeur qui te semble la plus logique","pourquoi":"Choisir une valeur, c’est interpréter; tu transcris ce que tu vois et tu signales."},{"t":"Tu ne notes rien : les rayures ne regardent que l’opticien","pourquoi":"Le cours dit de noter « d’autres éléments qui pourraient nuire à l’acuité visuelle »."}],"expl":"Rayures et valeurs instables font partie de ce qu’on ne peut pas mesurer de façon fiable : on les note et on les signale (SC6-c07).","source":"SC6-c07; 6.2-d11","mod":6},{"id":"m6-068","fam":"m6-role","kc":"T6.29","k":"qcm","q":"Après la topographie de Mathis, 23 ans, la carte montre plus de cambrure (de rouge) en bas qu’en haut. Il te demande : “C’est grave ?” Que réponds-tu ?","choix":[{"t":"L’optométriste va examiner vos résultats et vous les expliquer.","ok":true},{"t":"Oui, c’est un kératocône; il vous faudra sûrement une greffe.","pourquoi":"Diagnostic et pronostic : ni l’un ni l’autre n’est le rôle de l’assistant."},{"t":"Non, le rouge veut dire que votre cornée est normale.","pourquoi":"Rassurer à tort est aussi interpréter : la couleur situe, elle ne diagnostique pas."},{"t":"Je n’ai rien remarqué de particulier sur la carte.","pourquoi":"Tu as vu une cambrure en bas : tu la notes et tu la signales à l’optométriste."}],"expl":"« Le rouge indique cambré mais nous informe pas s’il s’agit anomalie (sic) ». Rôle de l’assistant : « Dépistage et orientation du patient. » L’optométriste interprète.","source":"5.3-d6; 6.1-d8, d24","mod":6},{"id":"m6-069","fam":"m6-role","kc":"T6.29","k":"vf","q":"Le rapport d’OCT montre un secteur rouge. L’assistant peut dire au patient qu’il a probablement un glaucome.","v":false,"expl":"Faux : le rouge peut vouloir dire hors norme ou difficile à mesurer, et « N’indique pas nécessairement un problème de pathologie. » L’optométriste interprète.","source":"6.4-d14","mod":6},{"id":"m6-070","fam":"m6-oct","kc":"T6.24","k":"qcm","q":"Qu’est-ce que l’OCT, selon le cours ?","choix":[{"t":"Une échographie faite avec de la lumière infrarouge","ok":true},{"t":"Une échographie par ultrasons, avec une sonde posée sur l’œil","pourquoi":"C’est la comparaison du cours, mais l’OCT utilise la lumière, pas le son."},{"t":"Une photo en couleurs de la surface de la rétine","pourquoi":"La photo, c’est la caméra; l’OCT montre les couches internes en coupe."},{"t":"Une carte de la courbure de la surface avant de la cornée","pourquoi":"Ça, c’est la topographie. L’OCT visualise les couches internes de la rétine."}],"expl":"« Utilise la lumière infrarouge pour visualiser les couches internes de la rétine » ; « Comparable à une échographie, mais avec de la lumière ».","source":"6.4-d2, d8, d14","mod":6},{"id":"m6-071","fam":"m6-oct","kc":"T6.24","k":"vf","q":"OCT veut dire Optical Coherence Tomography, en français tomographie par cohérence optique, et sa résolution est d’environ 5 microns.","v":true,"expl":"Vrai : « Optical Coherence Tomography », « tomographie par cohérence optique », « Résolution : environ 5 microns ». À retenir : une « échographie de la rétine avec la lumière ».","source":"6.4-d2","mod":6},{"id":"m6-072","fam":"m6-oct","kc":"T6.25","k":"ordre","q":"Remets les quatre étapes de l’OCT dans l’ordre.","etapes":["Un faisceau lumineux est projeté dans l’œil","La lumière se réfléchit sur les couches rétiniennes","Le système mesure le temps de réflexion et reconstruit une image 3D","L’image est affichée en coupe transversale haute résolution"],"expl":"Projeter → réfléchir → mesurer le temps de réflexion et reconstruire en 3D → afficher en coupe. C’est la séquence de la diapo 6.4-d3.","source":"6.4-d3","mod":6},{"id":"m6-073","fam":"m6-oct","kc":"T6.25","k":"qcm","q":"À l’étape 3 de l’OCT, que mesure le système pour reconstruire l’image 3D ?","choix":[{"t":"Le temps de réflexion de la lumière","ok":true},{"t":"L’écho d’un son envoyé dans l’œil","pourquoi":"Comparable à une échographie, mais l’OCT travaille avec de la lumière."},{"t":"La pression exercée sur la cornée","pourquoi":"L’OCT ne touche pas l’œil : c’est une imagerie « non invasive »."},{"t":"La couleur de la surface de la rétine","pourquoi":"La surface, c’est la photo de la caméra; l’OCT voit sous la surface."}],"expl":"« 3. Le système mesure le temps de réflexion et reconstruit une image 3D ». À l’étape 2, la lumière s’est réfléchie sur les couches rétiniennes.","source":"6.4-d2, d3","mod":6},{"id":"m6-074","fam":"m6-oct","kc":"T6.26","k":"qcm","q":"Sur le rapport d’OCT du nerf optique, que veulent dire les lettres N, S, T et I ?","choix":[{"t":"Nasal, supérieur, temporal et inférieur","ok":true},{"t":"Normal, suspect, très mince et inconnu","pourquoi":"Ce sont des secteurs du nerf, pas des verdicts."},{"t":"Nerf, sclère, tissu et iris","pourquoi":"Ce sont des directions autour du nerf optique, pas des structures."},{"t":"Nasal, sclère, temporal et iris","pourquoi":"S et I sont des directions : supérieur et inférieur."}],"expl":"Le cours : N = nasal, S = supérieur, T = temporal, I = inférieur. L’OCT mesure les fibres nerveuses de chaque secteur.","source":"6.4-d8","mod":6},{"id":"m6-075","fam":"m6-oct","kc":"T6.26","k":"qcm","q":"En plus des fibres du nerf optique, qu’est-ce que l’OCT mesure, selon le cours ?","choix":[{"t":"Les cellules ganglionnaires, l’IPL et l’épaisseur de la cornée","ok":true},{"t":"La pression de l’œil et la courbure de la cornée avant","pourquoi":"Ce ne sont pas des mesures de l’OCT; il mesure des couches et des épaisseurs."},{"t":"La puissance des lunettes que porte le patient en ce moment","pourquoi":"Ça, c’est le lentimètre."},{"t":"Les couches de la macula, que tu dois mémoriser une par une","pourquoi":"L’OCT les montre, mais la prof dit « pas nécessaire de mémoriser ces couches »."}],"expl":"Cellules ganglionnaires et IPL : « plus d’information sur les risques de glaucome ». La « Fonction pachymétrie » mesure l’épaisseur de la cornée.","source":"6.4-d4, d5, d12","mod":6},{"id":"m6-076","fam":"m6-oct","kc":"T6.27","k":"qcm","q":"Le rapport des fibres nerveuses montre un secteur rouge. Que peut-il vouloir dire ?","choix":[{"t":"Des fibres plus minces que la moyenne, ou une mesure difficile","ok":true},{"t":"Un glaucome certain, qu’il faut annoncer tout de suite au patient","pourquoi":"Le rouge « N’indique pas nécessairement un problème de pathologie. »"},{"t":"Des fibres plus épaisses que la moyenne, sans aucune inquiétude","pourquoi":"C’est l’inverse : le rouge signale des fibres plus minces."},{"t":"Une zone tout à fait dans la norme habituelle","pourquoi":"Le rouge sort de la norme habituelle; il faut plus d’information."}],"expl":"Rouge : « fibres nerveuses sont plus minces que la moyenne » ; causes possibles : « Erreur de mesure, forme de nerf optique inhabituelle ou autre ».","source":"6.4-d9, d14","mod":6},{"id":"m6-077","fam":"m6-oct","kc":"T6.27","k":"vf","q":"Si tous les secteurs du rapport d’OCT sont verts, on peut conclure que le nerf optique est en santé.","v":false,"expl":"Faux : « Mais on ne peut pas présumer que vert est toujours normal. » L’OCT s’utilise « dans un plein context (sic) clinique ».","source":"6.4-d11","mod":6},{"id":"m6-078","fam":"m6-oct","kc":"T6.27","k":"qcm","q":"Le rapport montre, dans un secteur, des fibres nerveuses plus épaisses que la moyenne. Que retiens-tu ?","choix":[{"t":"Parfois sans pathologie, parfois un problème : l’optométriste juge","ok":true},{"t":"Plus épais veut toujours dire que le nerf est en bonne santé","pourquoi":"Le cours dit « parfois ceci peut indiquer un problème selon la situation »."},{"t":"Plus épais veut toujours dire que le nerf est atteint d’une maladie","pourquoi":"Le cours dit aussi : « un peu plus épais que la moyenne (sans pathologie) »."},{"t":"C’est une erreur de l’appareil, à effacer tout de suite du dossier","pourquoi":"On n’efface pas un résultat : on le rapporte à l’optométriste."}],"expl":"« Parfois c’est un nerf qui est un peu plus épais que la moyenne (sans pathologie) » : tu rapportes, l’optométriste interprète selon la situation.","source":"6.4-d10","mod":6},{"id":"m6-079","fam":"m6-oct","kc":"T6.28","k":"qcm","q":"Avant l’OCT, la patiente demande s’il faut des gouttes. Que lui dis-tu, selon le script du cours ?","choix":[{"t":"Aucune goutte n’est requise; le test se fait dans l’obscurité","ok":true},{"t":"Il faut des gouttes, et le test se fait en pleine lumière","pourquoi":"Deux erreurs : pas de gouttes, et le test se fait dans l’obscurité."},{"t":"Il faut des gouttes, mais le test se fait dans l’obscurité","pourquoi":"Le script dit « Aucune goutte est requise (sic) »."},{"t":"Aucune goutte; on allume une lumière vive pour mieux voir","pourquoi":"Le script dit « Test est fait dans l’obscurité. »"}],"expl":"Script : « Aucune goutte est requise (sic) » / « No drops are needed for this test » ; « Test est fait dans l’obscurité. » Puis « On guide le patient et on vérifie que l’image est fiable ».","source":"6.4-d13","mod":6},{"id":"m6-080","fam":"m6-oct","kc":"T6.28","k":"vf","q":"Pour expliquer l’OCT en anglais, le script du cours dit : « OCT is a light scan that lets us see the inner layers of your eye. »","v":true,"expl":"Vrai. En français : « L’OCT nous permet de voir les couches internes de votre œil, comme une échographie mais avec de la lumière. »","source":"6.4-d13","mod":6},{"id":"m7-001","fam":"m7-pupille","kc":"T7.1","k":"qcm","q":"Comment la caméra rétinienne obtient-elle l’image du fond de l’œil ?","choix":[{"t":"Elle prend une photo à travers la pupille, avec un flash.","ok":true},{"t":"Elle fait une coupe de la rétine en lumière infrarouge.","pourquoi":"Ça, c’est l’OCT : il voit les couches internes en infrarouge. La caméra, elle, prend une photo."},{"t":"Elle photographie la rétine à travers la sclère, sur le côté.","pourquoi":"La lumière entre par la pupille : « La caméra prend une photo à travers la pupille »."},{"t":"Elle mesure d’abord l’épaisseur de la cornée, puis la photo.","pourquoi":"L’épaisseur de la cornée se mesure à l’OCT (pachymétrie). La caméra photographie le fond à travers la pupille."}],"expl":"« La caméra prend une photo à travers la pupille » : la lumière du flash doit entrer par la pupille et atteindre le fond de l’œil.","source":"7.1-d2, d17","mod":7},{"id":"m7-002","fam":"m7-pupille","kc":"T7.1","k":"qcm","q":"Pièce éclairée, pupille d’environ 3 mm. La première photo de l’œil droit sort presque noire. Quelle est la cause la plus probable ?","choix":[{"t":"La pupille est trop petite : le flash atteint mal le fond de l’œil.","ok":true},{"t":"Le fond de l’œil est malade : une rétine foncée donne une photo noire.","pourquoi":"Une photo noire vient de la technique, pas du fond : « Si la pupille est trop petite, la photo sera sombre ou noire »."},{"t":"La choroïde est très pigmentée : c’est ce qui noircit la photo.","pourquoi":"Une choroïde plus pigmentée rend seulement la macula plus foncée, avec une « Apparence normale »."}],"expl":"« Si la pupille est trop petite, la photo sera sombre ou noire. » Avec 3 mm et la lumière allumée, le flash entre mal.","source":"7.1-d16–d18","mod":7},{"id":"m7-003","fam":"m7-pupille","kc":"T7.1","k":"vf","q":"Une pupille trop petite peut donner une photo du fond d’œil sombre ou noire.","v":true,"expl":"Il faut que la lumière du flash atteigne le fond de l’œil : « Si la pupille est trop petite, la photo sera sombre ou noire ».","source":"7.1-d17","mod":7},{"id":"m7-004","fam":"m7-pupille","kc":"T7.4","k":"qcm","q":"Laquelle de ces situations fait partie des « Limitations » de la photo du fond d’œil ?","choix":[{"t":"Des opacités dans l’œil.","ok":true},{"t":"Une choroïde plus pigmentée.","pourquoi":"C’est une variante normale : la macula paraît plus foncée, « Apparence normale ». Ce n’est pas une limite de la photo."},{"t":"Un reflet brillant chez un enfant.","pourquoi":"C’est normal chez les jeunes : « typique d’une couche de fibres nerveuses en excellente santé »."},{"t":"Une photo prise sans dilatation.","pourquoi":"La photo se prend « avec ou sans dilatation pupillaire » : ne pas dilater n’est pas une limite en soi."}],"expl":"Trois limitations : le patient a de la difficulté à fixer, les pupilles sont trop petites pour la lumière, ou il y a des « Opacités dans l’oeil ».","source":"7.1-d15","mod":7},{"id":"m7-005","fam":"m7-pupille","kc":"T7.4","k":"qcm","q":"La pupille est large et le patient fixe bien. Pourtant, toutes les photos sont floues. Quelle limitation explique le mieux ce résultat ?","choix":[{"t":"Des opacités dans l’œil, comme une cataracte.","ok":true},{"t":"Des pupilles trop petites pour la lumière.","pourquoi":"La pupille est large ici. Une pupille trop petite donne une photo « sombre ou noire »."},{"t":"Une difficulté du patient à bien fixer la cible.","pourquoi":"Le patient fixe bien ici. Flou partout, avec une bonne pupille et une bonne fixation : on pense aux milieux de l’œil."}],"expl":"Photos floues malgré une bonne pupille : on pense aux milieux de l’œil (« cataracte, opacité »). C’est la limitation « Opacités dans l’oeil ».","source":"7.1-d15; 7.3-d12","mod":7},{"id":"m7-006","fam":"m7-pupille","kc":"T7.4","k":"vf","q":"La photo du fond d’œil se prend toujours après avoir dilaté les pupilles.","v":false,"expl":"Elle se prend « avec ou sans dilatation pupillaire ». On dilate si la pupille est trop petite : « Before Dilation 3-4 mm », « After Dilation 8 mm ».","source":"7.1-d4, d17, d18","mod":7},{"id":"m7-007","fam":"m7-role","kc":"T7.2","k":"ordre","q":"Remets dans l’ordre ce que fait l’assistant pour une photo du fond d’œil.","etapes":["Vérifier que la photo correspond au bon patient (son nom)","Bien positionner le patient et vérifier la fixation","Prendre la photo, puis vérifier netteté, centrage et exposition"],"expl":"Le bon patient d’abord (« verifier (sic) le nom de la personne devant nous »), puis la position et la fixation, puis « Vérifier netteté, centrage et exposition ».","source":"7.1-d3","mod":7},{"id":"m7-008","fam":"m7-role","kc":"T7.2","k":"qcm","q":"À la caméra rétinienne, que garantit l’assistant ?","choix":[{"t":"La qualité technique de la photo.","ok":true},{"t":"Le diagnostic tiré de la photo.","pourquoi":"L’assistant ne diagnostique pas : « Le technicien garantit la qualité technique ». L’interprétation revient à l’optométriste."},{"t":"L’absence d’anomalie sur la photo.","pourquoi":"Il ne peut pas garantir l’absence d’anomalie. Il garantit une image nette, centrée et bien exposée."},{"t":"Le traitement choisi selon la photo.","pourquoi":"Ce n’est pas son rôle : il garantit la qualité technique de l’image, pas les décisions cliniques."}],"expl":"« Le technicien garantit la qualité technique » : bon patient, fixation, netteté, centrage, exposition. L’interprétation revient à l’optométriste.","source":"7.1-d3","mod":7},{"id":"m7-009","fam":"m7-role","kc":"T7.2","k":"qcm","q":"Tu viens de prendre la photo. Quels trois points vérifies-tu sur l’image ?","choix":[{"t":"Netteté, centrage, exposition.","ok":true},{"t":"Couleur, pigmentation et macula.","pourquoi":"La pigmentation varie normalement d’un œil à l’autre. Le cours dit « Vérifier netteté, centrage et exposition »."},{"t":"Épaisseur, pression et fixation.","pourquoi":"Épaisseur et pression viennent de l’OCT et du tonomètre. Et la fixation se vérifie avant la photo."},{"t":"Nom, âge et date de naissance.","pourquoi":"Le nom se vérifie avant la photo (le bon patient). Sur l’image : netteté, centrage, exposition."}],"expl":"« Vérifier netteté, centrage et exposition » : une image floue, décentrée ou mal exposée ne garantit pas la qualité technique.","source":"7.1-d3","mod":7},{"id":"m7-010","fam":"m7-role","kc":"T7.3","k":"qcm","q":"Pourquoi photographie-t-on un naevus de la choroïde d’une visite à l’autre ?","choix":[{"t":"Pour le suivre dans le temps : on ne veut pas le voir évoluer.","ok":true},{"t":"Pour mesurer son épaisseur, couche par couche, à chaque visite.","pourquoi":"Mesurer des couches, c’est le travail de l’OCT. La photo sert à comparer d’une visite à l’autre."},{"t":"Pour remplacer l’examen du fond d’œil fait par l’optométriste.","pourquoi":"La photo ne remplace pas l’examen : elle aide « parfois » à voir des détails manqués."},{"t":"Pour que l’assistant pose le diagnostic sans l’optométriste.","pourquoi":"L’assistant ne diagnostique pas. La photo documente et permet de comparer au fil du temps."}],"expl":"« Une raison pour les photos est de suivre des naevus dans la choroïde. On ne veut pas voir d’évolution »","source":"7.1-d13","mod":7},{"id":"m7-011","fam":"m7-role","kc":"T7.3","k":"qcm","q":"Lequel de ces points est un avantage de la photo du fond d’œil, selon le cours ?","choix":[{"t":"Elle capte vite l’image et permet de comparer dans le temps.","ok":true},{"t":"Elle remplace l’examen du fond d’œil fait par l’optométriste.","pourquoi":"Non : elle permet « parfois » de mieux voir des détails manqués à l’examen. Elle ne le remplace pas."},{"t":"Elle mesure l’épaisseur de chaque couche de la rétine.","pourquoi":"C’est l’OCT qui mesure les couches. La photo documente, compare, dépiste et suit."},{"t":"Elle marche même si le patient a de la difficulté à fixer.","pourquoi":"Faux : la difficulté à fixer est une des limitations de la photo."}],"expl":"Avantages : « Rapidité de la capture de l’information », comparer « d’un temps à un autre », et parfois mieux voir les « défauts des petits vaisseaux ».","source":"7.1-d4, d12","mod":7},{"id":"m7-012","fam":"m7-role","kc":"T7.3","k":"vf","q":"Avec la photo du fond d’œil, l’examen du fond d’œil par l’optométriste devient inutile.","v":false,"expl":"La photo aide : on peut « parfois mieux voir des détails subtils manqués lors de l’examen du fond d’œil ». Parfois, donc elle ne remplace pas l’examen.","source":"7.1-d4","mod":7},{"id":"m7-013","fam":"m7-fond","kc":"T7.5","k":"qcm","q":"Sur la photo étiquetée du fond de l’œil vue en cours, quelles structures sont nommées ?","choix":[{"t":"Fovéa, macula, nerf optique, artère, veine.","ok":true},{"t":"Cornée, cristallin, iris, pupille, sclère.","pourquoi":"Ce sont des structures de l’avant de l’œil. La photo montre le fond (la rétine)."},{"t":"Fovéa, macula, cristallin, artère, veine.","pourquoi":"Le cristallin n’est pas nommé sur la photo du fond. C’est le nerf optique qui complète la liste."},{"t":"Choroïde, Bruch, photorécepteurs, fibres nerveuses.","pourquoi":"Ce sont des couches vues en coupe à l’OCT, pas les structures nommées sur la photo du fond."}],"expl":"La photo « Fond de l’oeil (rétine) » nomme « Fovea », « Macula », « Nerf optique », « Artère », « Veine ».","source":"7.1-d5","mod":7},{"id":"m7-014","fam":"m7-fond","kc":"T7.5","k":"vf","q":"Sur le fond d’œil, la macula se trouve au centre de la fovéa.","v":false,"expl":"C’est l’inverse : la fovéa est au centre de la macula, et la foveola est le « centre de la fovea ».","source":"7.1-d5; 7.2-d2","mod":7},{"id":"m7-015","fam":"m7-fond","kc":"T7.5","k":"qcm","q":"Les fibres nerveuses de la rétine convergent pour former quelle structure ?","choix":[{"t":"Le nerf optique, à la papille.","ok":true},{"t":"La macula, au centre de la rétine.","pourquoi":"Les fibres ne forment pas la macula : N = « couche de fibres nerveuses (formeront le nerf optique) »."},{"t":"La choroïde, derrière la rétine.","pourquoi":"La choroïde est la couche du fond (C) sur la coupe. Les fibres nerveuses forment le nerf optique."}],"expl":"N = « couche de fibres nerveuses (formeront le nerf optique) ». À la papille, ce sont « Les fibres nerveuses qui forment le nerf optique ».","source":"7.1-d7; 7.2-d2, d6","mod":7},{"id":"m7-016","fam":"m7-fond","kc":"T7.6","k":"qcm","q":"Sur une photo, la choroïde est très pigmentée et la macula paraît plus foncée que d’habitude. Comment le cours décrit-il ce fond ?","choix":[{"t":"Une apparence normale.","ok":true},{"t":"Une anomalie à signaler.","pourquoi":"Le cours dit « la macula parait plus foncée. Apparence normale » : c’est une variante de la pigmentation."},{"t":"Un artefact à reprendre.","pourquoi":"L’image n’est pas ratée : la couleur vient de la choroïde du patient, pas de la technique."},{"t":"Une photo trop sombre.","pourquoi":"Seule la macula paraît plus foncée, à cause d’une choroïde plus pigmentée : « Apparence normale »."}],"expl":"« Œil avec choroïde plus pigmentée alors la macula parait plus foncée. Apparence normale » : une variante, pas une maladie.","source":"7.1-d8","mod":7},{"id":"m7-017","fam":"m7-fond","kc":"T7.6","k":"qcm","q":"La photo montre un fond rayé : on voit les vaisseaux de la choroïde en bandes. De quoi s’agit-il ?","choix":[{"t":"D’une pigmentation mixte (tigroïde), d’apparence normale.","ok":true},{"t":"D’une maladie de la choroïde à signaler à l’optométriste.","pourquoi":"Le cours décrit ce fond « pigmentation mixte (tigroide). Apparence normale » : une variante, pas une maladie."},{"t":"D’un reflet du flash de la caméra, donc d’un artefact à reprendre.","pourquoi":"Les bandes sont les vaisseaux de la choroïde du patient. Elles ne viennent pas de la technique."}],"expl":"« pigmentation mixte (tigroide). Apparence normale » : les vaisseaux de la choroïde se voient en bandes, et c’est normal.","source":"7.1-d10","mod":7},{"id":"m7-018","fam":"m7-fond","kc":"T7.6","k":"qcm","q":"Chez un enfant, la rétine a un reflet plus brillant que chez l’adulte. Qu’est-ce que ça veut dire ?","choix":[{"t":"C’est typique d’une couche de fibres nerveuses en excellente santé.","ok":true},{"t":"C’est un défaut de la photo : il faut la reprendre tout de suite.","pourquoi":"Ce reflet vient de la rétine du jeune, pas de la technique. C’est un signe de bonne santé."},{"t":"C’est une anomalie de la rétine qu’il faut signaler à l’optométriste.","pourquoi":"Non : c’est « typique d’une couche de fibres nerveuses en excellente santé »."}],"expl":"« Les enfants et adolescents ont un reflet de la rétine plus brillante que les adultes » : c’est « typique d’une couche de fibres nerveuses en excellente santé ».","source":"7.1-d11","mod":7},{"id":"m7-019","fam":"m7-fond","kc":"T7.6","k":"vf","q":"Selon le cours, le fond d’œil le plus pâle (« moins de pigmentation dans la choroïde ») illustrait un signe de mauvaise santé.","v":false,"expl":"En classe, ce fond pâle illustrait les personnes plus jeunes, pas une mauvaise santé. Aucune des variantes de pigmentation ne se signale comme une anomalie.","source":"7.1-d9 (en classe, 2 nov.)","mod":7},{"id":"m7-020","fam":"m7-oct","kc":"T7.7","k":"qcm","q":"Au test 1 de l’OCT, quelle structure regarde-t-on, et que doit-on voir ?","choix":[{"t":"La rétine centrale : une dépression, qui est la fovéa.","ok":true},{"t":"La papille : les fibres qui forment le nerf optique.","pourquoi":"C’est le test 2 : « Disc (papille, nerf optique) ». Le test 1 est la rétine centrale."},{"t":"La cornée : une bande claire avec 4 des 5 couches visibles.","pourquoi":"C’est le scan du segment antérieur, pas le test 1. Le test 1 montre le creux de la fovéa."},{"t":"Le cristallin : on doit le voir au centre de l’écran.","pourquoi":"Capter le cristallin est une erreur de l’OCT, pas un test. Le test 1 regarde la rétine centrale."}],"expl":"« Test 1: Rétine centrale sur OCT. On voit une dépression qui est la fovea. » Et : « Prendre OD et OS ».","source":"7.2-d1","mod":7},{"id":"m7-021","fam":"m7-oct","kc":"T7.7","k":"vf","q":"Pour les tests de base de l’OCT (rétine centrale et papille), un seul œil suffit.","v":false,"expl":"Les deux diapos le disent : « Prendre OD et OS ». On fait les deux yeux, au test 1 comme au test 2.","source":"7.2-d1, d5","mod":7},{"id":"m7-022","fam":"m7-oct","kc":"T7.7","k":"qcm","q":"Quel est le test
