<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests ophtalmiques, UA2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* L'exerciseur de notions : le moteur de « Quelle formule ? » (Optique UA2), pour des cours de notions. Des questions
   mêlées (QCM, vrai ou faux, calcul, mise en ordre, ordonnance), une carte des familles à côté, le critère du blueprint
   §4.2 (trois de suite, sans aide, en au moins cinq essais). Gabarit commun : Guides/_commun/drill-notions/gabarit.html,
   assemblé par construire.py avec la banque d'un cours. Couleurs : celles de « Quelle formule ? ». */
:root{
  --bg:#ECF0F2; --panel:#FFFFFF; --panel-2:#F3F6F8; --ink:#13202A; --ink-2:#465763; --ink-3:#5F717D; --line:#D3DBE0;
  --accent:#0F6E8C; --accent-soft:rgba(15,110,140,.11); --on-accent:#FFFFFF;
  --ok:#1B7A4B; --ok-soft:rgba(27,122,75,.12); --warn:#9A5F0C; --warn-soft:rgba(158,99,13,.14); --bad:#B3352A; --bad-soft:rgba(179,53,42,.11);
  --f-display:"STIX Two Text", Cambria, Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1217; --panel:#131B22; --panel-2:#19232B; --ink:#E1E7EB; --ink-2:#A7B3BC; --ink-3:#8494A0; --line:#26323B;
    --accent:#5FC8E8; --accent-soft:rgba(95,200,232,.15); --on-accent:#0C1217;
    --ok:#55C68E; --ok-soft:rgba(85,198,142,.14); --warn:#E5B256; --warn-soft:rgba(229,178,86,.14); --bad:#F2705F; --bad-soft:rgba(242,112,95,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1217; --panel:#131B22; --panel-2:#19232B; --ink:#E1E7EB; --ink-2:#A7B3BC; --ink-3:#8494A0; --line:#26323B;
  --accent:#5FC8E8; --accent-soft:rgba(95,200,232,.15); --on-accent:#0C1217;
  --ok:#55C68E; --ok-soft:rgba(85,198,142,.14); --warn:#E5B256; --warn-soft:rgba(229,178,86,.14); --bad:#F2705F; --bad-soft:rgba(242,112,95,.14);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 var(--f-body)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.page{max-width:1080px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.tete{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{margin:0;font:600 30px/1.1 var(--f-display);letter-spacing:-.01em}
.tete p{margin:0;color:var(--ink-2);font-size:15.5px}
.bande{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.puce{min-height:38px;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:15px}
.puce[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.puce .n{margin-left:5px;font:600 12px var(--f-mono);opacity:.8}
.compte{margin-left:auto;font:600 13px var(--f-mono);color:var(--ink-2)}
.corps{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.scene,.cote section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.scene{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:380px}
.sujet{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font:600 12.5px var(--f-mono);color:var(--ink-3)}
.sujet .chip{padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.sujet .sorte{padding:2px 9px;border-radius:999px;background:var(--panel-2)}
.enonce{margin:0;font-size:19px;line-height:1.5;max-width:64ch}
.tuiles{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.tuiles.deux{grid-template-columns:repeat(2,minmax(0,1fr))}
.tuile{display:flex;align-items:center;gap:10px;min-height:56px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);text-align:left;font-size:17px;line-height:1.35}
.tuile:hover:not(:disabled){border-color:var(--accent)}
.tuile kbd{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line);font:600 12px var(--f-mono);color:var(--ink-3)}
.tuile .f{min-width:0;overflow-wrap:anywhere}
.tuile.non{border-color:var(--bad);background:var(--bad-soft)}
.tuile.oui{border-color:var(--ok);background:var(--ok-soft)}
.tuile:disabled{cursor:default}
.qm{position:relative;flex:none;width:28px;height:28px;padding:0;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--ink-2);font:700 14px/1 var(--f-body)}
.qm::after{content:"";position:absolute;inset:-8px}
.qm:hover{border-color:var(--accent);color:var(--accent)}
.suite{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.suite li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:10px;background:var(--ok-soft);font-size:16.5px}
.suite li::before{content:counter(s);flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:var(--panel);font:600 12px var(--f-mono);color:var(--ink-2)}
.suite.vide-s li{background:var(--panel-2);color:var(--ink-3)}
.suite-t{margin:0;font-size:14px;font-weight:700;color:var(--ink-2)}
.expl-fond{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(8,12,16,.5)}
.expl{width:min(440px,100%);height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--panel);border-left:1px solid var(--line)}
.expl h2{margin:0;font:600 24px/1.2 var(--f-display);overflow-wrap:anywhere}
.expl h3{margin:0 0 3px;font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.expl p{margin:0}
.expl .haut{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.expl .ex{padding:10px 12px;border-radius:10px;background:var(--panel-2)}
.expl .piege{padding:10px 12px;border-radius:10px;background:var(--warn-soft)}
.expl small{color:var(--ink-3);font-size:13.5px}
.expl textarea{width:100%;min-height:42vh;padding:10px 12px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font:400 14px/1.5 var(--f-mono)}
.copie-note{flex-basis:100%;color:var(--ink-2);font-size:14.5px}
.saisie{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.saisie input{width:150px;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font:600 18px var(--f-mono)}
.saisie .u{color:var(--ink-2)}
.rx{display:flex;flex-wrap:wrap;gap:10px}
.rx label{display:flex;flex-direction:column;gap:3px;font:600 12px var(--f-mono);color:var(--ink-3)}
.rx input{width:110px;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font:600 18px var(--f-mono)}
.bouton.signe{min-width:46px;padding:8px 10px;font-size:18px}
.bouton{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:700}
.bouton:hover{border-color:var(--accent)}
.bouton.plein{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lien{border:0;background:none;padding:8px 2px;min-height:36px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:15px}
.lien.petit{align-self:flex-start;font-size:14px;color:var(--ink-3)}
.brouillon-boite{display:flex;flex-direction:column;gap:6px}
.brouillon-t{font-size:14px;font-weight:700;color:var(--ink-2)}
.brouillon-t .facultatif{font-weight:400;color:var(--ink-3)}
.brouillon{width:100%;min-height:104px;padding:10px 12px;border:1px dashed var(--ink-3);border-radius:10px;background:var(--panel-2);color:var(--ink);font:400 16px/1.55 var(--f-mono);resize:vertical}
.msg{margin:0;padding:10px 13px;border-radius:10px;font-size:16px}
.msg.bad{background:var(--bad-soft)}
.msg.warn{background:var(--warn-soft)}
.msg.ok{background:var(--ok-soft)}
.msg.info{background:var(--panel-2)}
.dem{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.dem li{display:grid;grid-template-columns:168px minmax(0,1fr);gap:10px;font-size:16px}
.dem .l{color:var(--ink-3);font-size:14px}
.dem .c{font-family:var(--f-mono);font-size:15px;overflow-wrap:anywhere}
.source{margin:0;color:var(--ink-3);font-size:13px}
.bas{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:auto}
.cote{display:flex;flex-direction:column;gap:12px}
.cote section{padding:14px}
.cote h2{margin:0 0 8px;font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.mod-t{margin:10px 0 2px;font:600 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fam{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:0 9px;margin:0 -7px;padding:6px 7px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.3}
.fam.tout,.mod-t + .fam{border-top:0}
.fam .nom small{margin-left:7px;color:var(--ink-3);font-size:12.5px}
.fam .nom small.bon{color:var(--ok);font-weight:700}
.fam .fin{display:flex;align-items:center;gap:7px}
.ser{display:inline-flex;gap:4px;align-items:center;flex:none}
.ser i{width:10px;height:10px;border-radius:50%;background:transparent;border:1px solid var(--ink-3);flex:none}
.ser i.on{background:var(--accent);border-color:var(--accent)}
.ser i.neuf{width:12px;height:12px;background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.ser i.perdu{background:transparent;border:1px dashed var(--bad)}
.fam.eteinte .nom{color:var(--ink-3)}
.fam.eteinte .fin{opacity:.55}
.fam.vient{border-radius:9px;border-top-color:transparent}
.fam.vient + .fam{border-top-color:transparent}
.fam.vient.ok{background:var(--ok-soft);box-shadow:inset 3px 0 0 var(--ok)}
.fam.vient.perdu{background:var(--bad-soft);box-shadow:inset 3px 0 0 var(--bad)}
.fam.vient.neutre{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--ink-3)}
.fam .tag{font:600 12.5px var(--f-mono);font-style:normal;white-space:nowrap}
.fam.vient.ok .tag{color:var(--ok)}
.fam.vient.perdu .tag{color:var(--bad)}
.legende{margin:9px 0 0;font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.inter{position:relative;flex:none;width:36px;height:21px;padding:0;border:1px solid var(--ink-3);border-radius:999px;background:var(--panel-2);cursor:pointer}
.inter::before{content:'';position:absolute;inset:-9px -6px}
.inter span{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--ink-3);transition:transform .15s ease}
.inter[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.inter[aria-checked="true"] span{transform:translateX(15px);background:var(--on-accent)}
.fam.tout{padding-bottom:8px}
.fam.tout .nom{font-weight:700}
.fam.tout .nom small{font-weight:400}
.aide-carte{margin:-2px 0 8px;font-size:12.5px;color:var(--ink-3);line-height:1.35}
.annonce-carte{margin:6px 0 0;font-size:12.5px;color:var(--warn)}
.annonce-carte:empty{display:none}
.maitrise{padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.m-ligne{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.m-t{margin:0;font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.m-pct{font:600 26px/1 var(--f-display)}
.m-delta{padding:1px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font:600 13px var(--f-mono)}
.m-delta.moins{background:var(--bad-soft);color:var(--bad)}
.jauge{flex:1 1 130px;min-width:110px;max-width:240px;height:8px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.jauge i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.m-rep,.m-vit{font-size:13.5px;color:var(--ink-2)}
.m-vit{margin-left:auto}
.calcul{margin-top:6px}
.seul-mobile{display:none}
.calcul summary{font-weight:400;font-size:13px;color:var(--ink-3)}
.calcul p{margin:6px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink-2);max-width:86ch}
.bilan{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:3px 13px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2)}
.bilan.ok{border-color:var(--ok);background:var(--ok-soft)}
.bilan.perdu{border-color:var(--bad);background:var(--bad-soft)}
.bilan p{margin:0;font-size:15.5px;line-height:1.45}
.bilan .sous{grid-column:2;font-size:13.5px;color:var(--ink-2)}
.bilan .ser{gap:5px}
.bilan .ser i{width:15px;height:15px}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.bilan .ser i.neuf{animation:pop .5s ease-out}
@media (prefers-reduced-motion:reduce){.inter span{transition:none} .bilan .ser i.neuf{animation:none}}
@media (min-width:881px){ .cote{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto;scrollbar-width:thin;padding-right:2px} }
.erreurs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.35}
.erreurs li{display:flex;flex-direction:column;gap:2px}
.erreurs .r{color:var(--ok)}
.vide{margin:0;color:var(--ink-3);font-size:14.5px}
details summary{cursor:pointer;font-weight:700;font-size:15px}
.mots{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.35}
.mots li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:center}
.note{margin:0;font-size:13.5px;color:var(--ink-2);max-width:80ch}
/* la progression guidée : module par module, ce qui est réussi sort de la pile */
.guide{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.guide.on{border-color:var(--accent);background:var(--accent-soft)}
.guide label{display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;font-size:14.5px;line-height:1.35}
.guide label b{font-size:15.5px}
.guide label span{color:var(--ink-2)}
.guide .chemin{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:2px;font:600 12.5px var(--f-mono);color:var(--ink-3)}
.guide .chemin i{font-style:normal;padding:1px 8px;border-radius:999px;background:var(--panel)}
.guide .chemin i.fait{color:var(--ok)}
.guide .chemin i.ici{background:var(--accent);color:var(--on-accent)}
/* une table du cours, dans la question ou dans la fiche */
.tableau{display:flex;flex-direction:column;gap:6px}
.tableau-t{margin:0;font-size:14px;font-weight:700;color:var(--ink-2)}
.tableau-c{margin:0;font:600 12.5px var(--f-mono);color:var(--ink-3)}
.paires{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.paires div{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:4px 9px;border-radius:7px;background:var(--panel-2);font:600 14.5px var(--f-mono)}
.paires dt{color:var(--ink-2);font-weight:400}
.paires dd{margin:0}
.paires .fort{box-shadow:inset 0 0 0 1px var(--ink-3)}
.paires .ta-ligne{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.tab-wrap{overflow-x:auto}
.tab-libre{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.4}
.tab-libre th,.tab-libre td{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tab-libre thead th{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tab-libre tbody th{font-weight:700}
.tableau small{color:var(--ink-3);font-size:13px;line-height:1.4}
@media (max-width:880px){ .corps{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){
  h1{font-size:26px}
  .scene{padding:15px}
  .enonce{font-size:18px}
  .tuiles.deux{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dem li{grid-template-columns:minmax(0,1fr);gap:0}
  .compte{display:none}
  .page{gap:12px;padding-top:12px}
  .tete p{display:none}
  .bande{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
  .bande::-webkit-scrollbar{display:none}
  .puce{flex:none}
  .maitrise{padding:8px 12px}
  .m-rep,.m-vit{display:none}
  .seul-mobile{display:block!important}
  .jauge{flex-basis:100%;max-width:none;order:9}
  .bilan{grid-template-columns:minmax(0,1fr)}
  .bilan .sous{grid-column:1}
  .saisie label{flex-basis:100%}
  .saisie input{width:140px}
  .rx input{width:96px}
  .expl-fond{align-items:flex-end;justify-content:stretch}
  .expl{width:100%;height:auto;max-height:84vh;border-left:0;border-radius:16px 16px 0 0}
}
</style>

  <header class="tete">
    <h1 id="titre"></h1>
    <p id="sous-titre"></p>
  </header>
  <div class="guide" id="guide"></div>
  <div class="bande" role="group" aria-label="Ce que tu pratiques" id="portees"></div>
  <section class="maitrise" id="progression" aria-labelledby="t-prog"></section>
  <div class="corps">

<script>
(() => {
'use strict';
/* === données du cours (assemblées par construire.py) === */
const COURS = {"titre":"Tests ophtalmiques, UA2","sousTitre":"Modules 5 à 8 : kératométrie et topographie, lunettes et lentimètre, OCT, caméra rétinienne, gouttes diagnostiques. Des questions mêlées ; le « ? » ouvre la fiche de chaque notion.","nom":"Tests ophtalmiques (SAN 0010)","cle":"drill-to-ua2-v1","examen":{"date":"2026-11-16","txt":"lundi 16 novembre, 10 h"},"note":"Questions tirées des modules 5 à 8 de la prof (diapos et leurs exercices). Un point = une réponse juste du premier coup, sans aide. Réussie = trois points de suite, en au moins cinq essais. La fiche « ? » ou une copie pour une IA ne donnent pas de point et n’en enlèvent pas. « Mes erreurs » reprend les questions ratées jusqu’à ce que tu les réussisses.","maitrise":"Ta maîtrise de l’UA2","tout":"Tout l’UA2"};
const BANQUE = {"familles":[{"id":"m5-cornee","t":"La cornée : pourquoi, combien","mod":5,"carte":{"quoi":"On mesure la cornée pour adapter les lentilles de contact, détecter l’astigmatisme cornéen pour aider la réfraction, et suivre sa santé. Elle fait environ 43 D (de 35 à 50 D), environ 2/3 du pouvoir de l’œil.","quand":"La question demande pourquoi on mesure la cornée, sa puissance moyenne, ou si un résultat est plausible.","piege":"Croire que la kératométrie donne l’ordonnance de lunettes : le cours dit « pour aider dans la réfraction ».","exemple":"« Pouvoir moyen environ 43 dioptries (varie entre 35D et 50D) » : un calcul qui donne 0,04 D ou 178 D est faux.","source":"5.1-d1, d3, d29"}},{"id":"m5-miroir","t":"Miroir convexe et reflet","mod":5,"carte":{"quoi":"« La cornée agit comme un miroir convexe ». Le kératomètre envoie des mires, regarde leur reflet et calcule le rayon à partir de la taille de ce reflet.","quand":"La question parle de mires, de reflet, de miroir, ou demande comment on mesure la cornée sans la toucher.","piege":"Inverser le sens : un reflet plus petit vient d’un rayon plus petit, pas plus grand.","exemple":"« Plus l’image est petite, plus le rayon est petit » : petit reflet, petit rayon, cornée plus puissante.","source":"5.1-d20, d22, d23, d28, d31"}},{"id":"m5-formule","t":"Du rayon à la puissance","mod":5,"carte":{"quoi":"La formule « D = (1,3375 - 1) / r » change un rayon en dioptries, avec r en mètres. À rebours : r = 0,3375 ÷ D, puis en mm. 1,3375 est « un indice fictif » de calibration.","quand":"On te donne un rayon en mm et on veut des dioptries, ou une puissance et on veut le rayon.","piege":"Laisser r en mm (8,0 mm donne 0,04 D), oublier le − 1, ou mettre 1,376, l’indice réel de la cornée.","exemple":"r = 8,0 mm = 0,0080 m, donc D = 0,3375 ÷ 0,0080 = 42,2 D.","source":"5.1-d32, d35"}},{"id":"m5-cambre","t":"Cambrée = puissante","mod":5,"carte":{"quoi":"Plus le rayon est petit, plus la cornée est cambrée et puissante. Une cornée sphérique a un seul rayon; une sphérocylindrique en a deux : « un petit (plus cambré) et un grand (plus plat) ».","quand":"On compare deux rayons ou deux K, ou on demande la forme d’une cornée.","piege":"Croire qu’un plus grand rayon fait une courbe plus forte. C’est l’inverse : grand rayon, plus plat, moins de dioptries.","exemple":"7,6 mm donne 44,4 D et 8,0 mm donne 42,2 D : le plus petit rayon est le plus puissant.","source":"5.1-d5–d7, d32, d35"}},{"id":"m5-axe","t":"Axe ou méridien","mod":5,"carte":{"quoi":"L’axe d’une lentille, c’est « la position ou (sic) il n’y a pas de puissance ». Pour la cornée, on donne la puissance à un méridien. Le x d’une ligne de K sépare deux K; le x d’une ligne d’Rx donne l’axe.","quand":"La question montre une ligne avec x et @, ou demande ce que veut dire un nombre en degrés.","piege":"Prendre le méridien après le @ pour un axe, ou lire une ligne de K comme une ligne d’Rx.","exemple":"« 42.00x44.00 @090 » : deux K, et 44,00 D est au méridien 90. Dans « OD +1.00-1.00x180 », 180 est l’axe.","source":"5.1-d10, d11; TO3.1-d13; 6.2-d14"}},{"id":"m5-astig","t":"Astigmatisme et méridiens","mod":5,"carte":{"quoi":"L’astigmatisme cornéen est la différence des deux K (K cambré − K plat), sur deux méridiens à 90° l’un de l’autre. Le méridien le plus cambré dit si c’est avec la règle (vertical), contre la règle (horizontal) ou oblique.","quand":"On te donne deux K avec leurs méridiens, ou un seul méridien et on demande l’autre.","piege":"Donner un montant négatif, ou croire que K1 veut dire horizontal : « K1/K2 désignent le plus plat/le plus cambré ».","exemple":"« 42.00@180 et 44.00@090 » donne « 2 dioptries d’astigmatisme » et « Méridien 180 est le plus plat ».","source":"5.1-d35, d36; 5.2-Q1–R5; AK5; CM5-corr"}},{"id":"m5-optosys","t":"L’écriture Optosys","mod":5,"carte":{"quoi":"Dans Optosys, on écrit la valeur du méridien horizontal d’abord, puis x et l’autre valeur, puis @ et le méridien de la deuxième valeur. Une cornée oblique peut s’écrire de deux façons.","quand":"On te demande d’écrire deux K comme dans le logiciel Optosys, ou de décoder une ligne Optosys.","piege":"Mettre après le @ le méridien de la première valeur, ou écrire K1 en premier même quand il est vertical.","exemple":"42,00 D à 180 et 44,00 D à 90 s’écrivent « 42.00x44.00 @090 ».","source":"5.1-d36; 5.2-Q1–R5; AK5-B"}},{"id":"m5-instruments","t":"Les instruments","mod":5,"carte":{"quoi":"Le kératomètre, manuel ou automatique, lit « 2-3mm au centre ». Le topographe Medmont, « extension du kératomètre », lit toute la surface (11 à 14 mm) avec des disques de Placido.","quand":"La question nomme un appareil, une zone de la cornée, ou un appareil qui ne prend pas la mesure.","piege":"Inverser les limites : c’est l’automatique qui ne mesure pas une cornée très déformée; le manuel est plus lent et repère mal les petits astigmatismes.","exemple":"À Lumiris : « un auto-réfractomètre combiné avec auto-kératomètre », et le topographe Medmont.","source":"5.1-d33, d34, d37, d38; 5.3-d2–d4"}},{"id":"m5-carte","t":"Lire une carte topographique","mod":5,"carte":{"quoi":"Sur la carte, le rouge est cambré et le bleu est plat. On lit le motif : anneaux concentriques (pas d’astigmatisme apparent), régulier et symétrique (avec ou contre la règle), ou zone de cambrure localisée (irrégulier).","quand":"On te montre ou on te décrit une carte en couleurs.","piege":"Lire le rouge comme une maladie : « Les couleurs seules ne suffisent pas à diagnostiquer une anomalie ».","exemple":"Carte mystère 04 : orange à gauche et à droite, bleu en haut et en bas, donc régulier, contre la règle.","source":"5.3-d5–d9; CM5"}},{"id":"m5-sortie","t":"Chirurgie, sorties, cas entier","mod":5,"carte":{"quoi":"Aplatir le centre (LASIK pour la myopie, ortho-K) baisse la puissance; le bomber la monte. Une sortie d’appareil se vérifie avec les mêmes règles : la formule pour le rayon, la différence des K, les méridiens à 90°.","quand":"La question parle de chirurgie, d’ortho-K, d’une sortie d’appareil (SIM K, Flat K, Steep K, dk) ou d’un patient du début à la fin.","piege":"Croire que le LASIK pour la myopie rend la cornée plus cambrée, ou lire le rayon entre parenthèses comme une puissance.","exemple":"« 42.08D (8.02) @ 65° » et « 41.15D (8.20) @ 155° » : 42,08 − 41,15 = 0,93, c’est le « dk 0.93D ».","source":"5.1-d39–d41; 5.3-d9–d12"}},{"id":"m6-kc","t":"Kératocône : la maladie","mod":6,"carte":{"quoi":"Le kératocône est une maladie de la cornée, non inflammatoire : le stroma s’amincit, la cornée se bombe en cône, et la vue devient plus myope avec un astigmatisme irrégulier qui progresse.","quand":"La question parle de définition, de stroma, d’âge d’apparition, de frottement des yeux, ou d’une carte de topographie à classer en régulier ou irrégulier.","piege":"Le croire inflammatoire, ou appeler irrégulier tout astigmatisme à deux K différents. Irrégulier veut dire non symétrique, avec plus de cambrure en bas.","exemple":"« Kératocone (sic): astigmatisme n’est pas symmétrique (sic). Plus de cambrure inférieure par rapport à supérieur »","source":"6.1-d3 à d11"}},{"id":"m6-dep","t":"Dépister un kératocône","mod":6,"carte":{"quoi":"Dépister en prétests : tu tries ce que le patient raconte (symptômes) et ce que tu mesures (signes). Si le tableau évoque un kératocône, tu ajoutes topographie et pachymétrie, et tu orientes vers l’optométriste.","quand":"Un patient jeune, une plainte comme « mes lunettes ne m’aident pas », du frottement, un cylindre oblique, une K cambrée ou des mires déformées.","piege":"Classer l’âge comme symptôme (c’est un signe), croire la pression plus haute (elle est plus basse), soupçonner sur un seul indice, ou poser le diagnostic toi-même.","exemple":"Patient de 22 ans, lunettes qui n’aident pas, frottement, cylindre oblique, K cambrée : topographie et pachymétrie, puis tu informes l’optométriste.","source":"6.1-d12 à d16, d24"}},{"id":"m6-trt","t":"Corriger, traiter, suivre","mod":6,"carte":{"quoi":"Corriger : lunettes ou lentilles souples au début, puis lentilles rigides qui créent une nouvelle surface. Traiter : cross-linking pour stabiliser, greffe pour les cas sévères. L’assistant dépiste, aide et éduque.","quand":"La vue baisse malgré les lunettes, on parle de riboflavine et d’UV, de greffe, ou du suivi après un traitement.","piege":"Croire qu’un cylindre plus fort corrige un astigmatisme irrégulier, ou que le cross-linking améliore la vue : il stabilise la cornée.","exemple":"« Lentilles cornéennes rigides corrigent un astigmatisme irrégulier. »","source":"6.1-d18 à d24"}},{"id":"m6-ver","t":"Types de verres : lequel ?","mod":6,"carte":{"quoi":"Chaque verre place ses forces autrement : simple vision (une force), doubles foyers (ligne visible), anti-fatigue (petite addition), progressifs (loin au centre, près en bas), dégressifs (intermédiaire et près). Usage, mesure et âge disent lequel.","quand":"On te donne une lunette mesurée, ce que le patient en dit et son âge, et on te demande le type de verre.","piege":"Les mêmes nombres peuvent faire deux verres : sans l’usage, tu ne tranches pas. Et les 52 ans et plus ne portent pas tous des dégressifs.","exemple":"« OD +1.00-1.00x180 add +0.75 » : « lunettes de lecture » → dégressif; « lunettes pour vision de loin » → anti-fatigue ou progressifs.","source":"6.2-d3 à d10, d15, d16","tableau":{"t":"Le tableau des âges de la prof","cols":["Verre","Pour qui","Ses forces"],"lignes":[["Simple vision","« n’importe quel âge »","« Une force dans la lentille »"],["Anti-fatigue","« 20-38 ans pour difficultés d’accommodation »","une petite addition « (0.50D à 1.00D) »"],["Progressifs","« 38 ans+ pour presbytie »","loin au centre, intermédiaire, près en bas"],["Dégressifs","« presbytes avancés 52ans (sic) et plus qui ont des difficultés ergonomiques avec les progressifs ou quand les lunettes simples vision ne répondent plus aux besoins »","intermédiaire et près, pas de loin"]],"note":"Les doubles foyers (une ligne visible) n’y sont pas.","source":"6.2-d3, d6–d8, d10"}}},{"id":"m6-rx","t":"Ligne d’Rx et puissance de près","mod":6,"carte":{"quoi":"Une ligne d’ordonnance se lit : œil, sphère avec son signe, cylindre (négatif), x et l’axe, puis l’addition. De près, la sphère = sphère du haut + addition; cylindre et axe ne bougent pas (règle déduite des exemples).","quand":"On te donne une ligne à décoder ou à écrire, ou on te demande la puissance de près ou l’addition d’une lunette.","piege":"Mettre l’addition sur le cylindre, donner l’addition seule comme puissance de près, oublier l’addition, ou inverser un signe.","exemple":"« OD +1.00-1.00x180 add +0.75 » → de près : +1,75 −1,00 x180.","source":"6.2-d14 à d18"}},{"id":"m6-mes","t":"Mesurer les lunettes","mod":6,"carte":{"quoi":"Mesurer la lunette actuelle dit à l’optométriste avec quelle correction le patient vit. Démarche : demander, observer, mesurer en déplaçant le verre, transcrire, signaler ce qu’on ne peut pas mesurer (un prisme, par exemple).","quand":"Le patient a ou n’a pas ses lunettes, il en a plusieurs, il dit “une seule force”, la mire ne se centre pas, ou on te demande pourquoi mesurer.","piege":"Croire que l’ancienne ordonnance suffit, se fier au patient plutôt qu’à la mesure, ou ignorer une mire décentrée.","exemple":"« Mesurer les lunettes du patient, ce n'est pas simplement recopier une prescription. »","source":"6.2-d2, d9, d13, d18; 6.3-d3 à d11"}},{"id":"m6-ecr","t":"Du lentimètre au dossier","mod":6,"carte":{"quoi":"L’écran du lentimètre automatique affiche, pour R et L, S (sphère), C (cylindre), A (axe) et Δ (prisme). Tu transcris R → OD, L → OS, C 0,00 → sph, puis tu te relis contre les cinq erreurs fréquentes.","quand":"On te montre un écran ou une mesure à inscrire au dossier, ou une saisie où chercher l’erreur.","piege":"L est affiché à gauche de l’écran : le lire comme l’œil droit mélange OD et OS. Un petit cylindre inattendu peut cacher un multifoyer mal identifié.","exemple":"R : S −4,00 C −0,75 A 70; L : S −3,25 C 0,00 → OD −4,00 −0,75 x070; OS −3,25 sph.","source":"6.3-d10; 6.2-d20"}},{"id":"m6-role","t":"Signaler, pas diagnostiquer","mod":6,"carte":{"quoi":"Devant tout résultat (carte, mesure de lunettes, rapport d’OCT, plainte), l’assistant mesure, transcrit et signale; l’optométriste interprète. Les situations cliniques demandent : pourquoi la mesure compte, ce qu’elle apporte, quoi vérifier, documenter ou signaler.","quand":"On te demande ce que fait l’assistant ou ce que tu dis au patient, ou on décrit une valeur étrange ou instable.","piege":"Annoncer un diagnostic, rassurer à tort, ou effacer une valeur bizarre en accusant l’instrument.","exemple":"SC6-c06 : un prisme inattendu, une mire décentrée; l’assistant « croit que c’est une erreur de l’instrument ». Il faut le noter et le signaler.","source":"6.1-d24; 6.2-d18; 6.3-d3, d8; 6.4-d14; SC6"}},{"id":"m6-oct","t":"L’OCT : principe et rapport","mod":6,"carte":{"quoi":"L’OCT envoie une lumière infrarouge dans l’œil et en fait une coupe, « Comparable à une échographie, mais avec de la lumière ». Il mesure les fibres du nerf optique, les cellules ganglionnaires et l’épaisseur de la cornée. Ses couleurs comparent à une moyenne.","quand":"On te demande ce qu’est l’OCT, ses étapes, ce qu’il mesure, ce que veut dire une couleur du rapport, ou ce que tu dis au patient.","piege":"Croire qu’il utilise du son ou qu’il faut des gouttes; lire rouge = maladie et vert = santé.","exemple":"Secteur rouge : fibres « plus minces que la moyenne », ou mesure difficile; « N’indique pas nécessairement un problème de pathologie. »","source":"6.4-d2 à d14"}},{"id":"m7-pupille","t":"La photo à travers la pupille","mod":7,"carte":{"quoi":"La caméra rétinienne photographie le fond de l’œil à travers la pupille : le flash doit atteindre la rétine. Fixation difficile, pupille trop petite ou opacités font rater la photo.","quand":"Une photo sombre ou noire, une petite pupille, une question sur la dilatation ou sur les « Limitations ».","piege":"Lire une photo noire comme un fond malade, ou croire qu’on dilate toujours : la photo se prend « avec ou sans dilatation pupillaire ».","exemple":"Pupille de 3-4 mm : photo noire. Après les gouttes, 8 mm, et on a une image utilisable.","source":"7.1-d2, d4, d15–d18"}},{"id":"m7-role","t":"Le rôle de l’assistant","mod":7,"carte":{"quoi":"L’assistant vérifie le bon patient, le positionne et vérifie la fixation, puis la netteté, le centrage et l’exposition. La photo sert à documenter, comparer, dépister et suivre.","quand":"On te demande ce que fait l’assistant à la caméra, ou pourquoi on photographie le fond de l’œil.","piege":"Croire que l’assistant interprète la photo : « Le technicien garantit la qualité technique ».","exemple":"Un naevus de la choroïde se photographie d’une visite à l’autre : « On ne veut pas voir d’évolution ».","source":"7.1-d3, d4, d12–d14"}},{"id":"m7-fond","t":"Le fond d’œil normal","mod":7,"carte":{"quoi":"La photo montre cinq structures : fovéa, macula, nerf optique, artère, veine. La pigmentation de la choroïde varie d’un œil à l’autre, et c’est normal.","quand":"Une photo qui semble anormale : macula foncée, fond pâle, fond rayé, reflet brillant chez un jeune.","piege":"Prendre une variante de pigmentation pour une anomalie à signaler.","exemple":"« pigmentation mixte (tigroide). Apparence normale » : les vaisseaux de la choroïde se voient en bandes.","source":"7.1-d5, d8–d11"}},{"id":"m7-oct","t":"Les tests de l’OCT","mod":7,"carte":{"quoi":"Test 1 : la rétine centrale, où le creux est la fovéa. Test 2 : la papille. Les deux à OD et OS. Sept lettres sur la coupe de la fovéa; 4 des 5 couches sur la cornée.","quand":"Une coupe OCT à nommer, une lettre à identifier, ou la question : quel test est-ce ?","piege":"Inverser B (Bruch) et C (choroïde), placer les photorécepteurs devant, ou ne faire qu’un œil.","exemple":"De l’avant vers l’arrière : N, G, P, E, B, C. F, la foveola, est au fond du creux.","source":"7.2-d1–d9"}},{"id":"m7-pression","t":"Épaisseur et pression","mod":7,"carte":{"quoi":"Les tonomètres sont calibrés pour 545 µm. Cornée plus mince : la lecture est trop basse; plus épaisse : trop haute. PIO corrigée = PIO mesurée + correction de la table.","quand":"Une lecture en mmHg avec une épaisseur en µm, ou une valeur corrigée dont il faut retrouver la lecture ou l’épaisseur.","piege":"Corriger à l’envers : sous 545 µm, la correction est positive (on ajoute); au-dessus, elle est négative (on retranche).","exemple":"Lecture de 20 mmHg : à 415 µm → 30 mmHg; à 545 µm → 20 mmHg; à 615 µm → 15 mmHg.","source":"7.2-d11–d14","tableau":{"t":"La table de la prof : « Table de valeurs corrigées du tonomètre »","cols":["Épaisseur (µm)","Correction (mmHg)"],"forme":"paires","lignes":[["410","+10"],["415","+10"],["420","+9"],["425","+9"],["430","+8"],["435","+8"],["440","+7"],["445","+7"],["455","+6"],["465","+6"],["475","+5"],["485","+4"],["495","+4"],["505","+3"],["515","+2"],["525","+1"],["535","+1"],["545","0"],["555","−1"],["565","−1"],["575","−2"],["585","−3"],["595","−4"],["605","−4"],["615","−5"],["625","−6"],["635","−6"],["645","−7"]],"fort":"545","note":"Mince (sous 545) : on ajoute ; épaisse (au-dessus) : on retranche. Le signe + est ajouté ici pour la lecture : la table de la diapo l’omet. Pas de ligne 450 : 5 en 5 µm jusqu’à 445, puis 10 en 10.","source":"7.2-d12"}}},{"id":"m7-artefact","t":"Artefact ou anomalie","mod":7,"carte":{"quoi":"Un artefact est une « Image anormale créée par la technique, sans signification diagnostique, mais pouvant gêner l’interprétation ».","quand":"Une image étrange : empreinte, reflets, tache qui semble grandir d’une photo à l’autre.","piege":"Le prendre pour une maladie, ou l’ignorer : il peut cacher ou imiter une lésion.","exemple":"Des artefacts de caméra donnent la fausse impression qu’une lésion de la choroïde grossit.","source":"7.3-d2–d7"}},{"id":"m7-erreurs","t":"Erreurs fréquentes","mod":7,"carte":{"quoi":"Chaque erreur a sa conduite : lumières éteintes, attendre, dilater, reprendre, s’arrêter à 2 photos, consulter. À l’OCT : refaire, vérifier la structure, pas plus de 3-4 minutes.","quand":"Une photo ou un scan raté, et la question : que fais-tu ?","piege":"S’acharner : « On se limite à 2 photos »; à l’OCT, « Ne pas dépasser 3-4 minutes ».","exemple":"« Clignement pendant la capture » → « Reprendre la photo ».","source":"7.3-d12, d13; 7.2-d15"}},{"id":"m8-systemes","t":"Deux systèmes, trois muscles","mod":8,"carte":{"quoi":"Trois muscles font le travail : le sphincter (un cercle) et le dilatateur (des rayons) règlent la pupille, le corps ciliaire règle l’accommodation. Le parasympathique fait rétrécir la pupille, le sympathique la dilate.","quand":"La question demande quel muscle ou quel système agit sur la pupille ou sur l’accommodation.","piege":"Inverser les deux systèmes, ou croire que le corps ciliaire change la taille de la pupille.","exemple":"« Le corps ciliaire contrôle l’accommodation »; le parasympathique est « digestion et relaxation », le sympathique « mettre en action ».","source":"8.1-d7, d8, d11, d12"}},{"id":"m8-mecanisme","t":"Bloquer ou stimuler","mod":8,"carte":{"quoi":"Deux façons de dilater. Bloquer le parasympathique (tropicamide, cyclopentolate, atropine) relâche le sphincter ET le corps ciliaire; stimuler le sympathique (phényléphrine) contracte le dilatateur seul, sans toucher l’accommodation.","quand":"On te demande comment une goutte dilate, si elle touche l’accommodation, ou pourquoi on associe deux gouttes.","piege":"Croire que bloquer un système rend la pupille petite, ou que tout mydriatique est aussi cycloplégique.","exemple":"Seule, la phényléphrine « ne réussit pas à bien dilater » : on l’ajoute au tropicamide « pour atteindre une dilatation supérieure ».","source":"8.1-d18, d20, d22, d23, d25"}},{"id":"m8-effets","t":"Les effets secondaires","mod":8,"carte":{"quoi":"Chaque effet suit le muscle ou le système touché. Bloqueurs du parasympathique : éblouissement, flou de près, et très rarement l’humeur aqueuse bloquée. Phényléphrine : photophobie, tension qui monte, arythmies.","quand":"Un patient décrit un symptôme après les gouttes, ou on te demande quoi lui annoncer.","piege":"Attribuer le flou de près à la phényléphrine : elle n’agit pas sur le muscle ciliaire.","exemple":"Flou de près et tension qui monte après deux gouttes : le flou vient du tropicamide, la tension de la phényléphrine.","source":"8.1-d10, d18, d22, d27"}},{"id":"m8-pourquoi","t":"Pourquoi dilater, et chez qui","mod":8,"carte":{"quoi":"On dilate pour voir la périphérie de la rétine et le pôle postérieur, et parce que plusieurs prétests passent par la pupille. Avec l’âge, la pupille rapetisse : le dilatateur s’atrophie plus que le sphincter.","quand":"On te demande pourquoi on dilate, chez qui, ou pourquoi une personne âgée a de petites pupilles.","piege":"Croire que les pupilles grandissent avec l’âge, ou dire que c’est le parasympathique qui faiblit.","exemple":"« Personnes 50 ans+ », « Petites pupilles », « Opacités du cristallin ».","source":"8.1-d13–d17"}},{"id":"m8-fiches","t":"La fiche de chaque goutte","mod":8,"carte":{"quoi":"Chaque agent a un nom de commerce, un délai et une durée : tropicamide (Mydriacyl), cyclopentolate (Cyclogyl), atropine, phényléphrine (Mydfrin), proparacaïne (Alcaine).","quand":"On te donne un nom de commerce, une concentration, un délai ou une durée, et tu dois trouver la goutte.","piege":"Inverser les délais du tropicamide (environ 20 min) et du cyclopentolate (30-45 min), ou prendre l’atropine pour la goutte habituelle.","exemple":"Tropicamide : effet « dans environ 20 minutes », durée « 5-6 heures », « jusqu’à 24 heures » chez les personnes sensibles.","source":"8.1-d19–d28, d30"}},{"id":"m8-choix","t":"Quelle goutte pour quel cas?","mod":8,"carte":{"quoi":"Le but décide : fond d’œil chez l’adulte → tropicamide (± phényléphrine); réfraction d’un jeune enfant → cyclopentolate; toucher la cornée → anesthésique; voir le film ou une égratignure → fluorescéine.","quand":"Une vignette donne un patient et un examen : trouve la goutte, puis ce que tu annonces.","piege":"Choisir l’atropine pour un examen de routine, ou la phényléphrine pour relâcher l’accommodation.","exemple":"Léo, 6 ans, réfraction : cyclopentolate, effet après « 30-45 minutes », durée qui « peut être 24 heures ou plus chez certains enfants ».","source":"8.1-d3, d20, d22, d23, d28, d36–d40"}},{"id":"m8-anesth","t":"Les anesthésiques","mod":8,"carte":{"quoi":"Un nom en -aine ou -caine = un anesthésique : il coupe les influx nerveux, pour qu’on puisse toucher la cornée. Effet en moins d’une minute, pour 15-20 minutes.","quand":"Il faut toucher la cornée (pression, abrasion, corps étranger), ou un patient demande le flacon.","piege":"Remettre le flacon au patient qui a mal : « une sur-utilisation crée une toxicité au niveau de l’épithélium ».","exemple":"Corps étranger : une goutte d’Alcaine, sortie du réfrigérateur. Après, préviens que l’œil peut sembler sec : il cligne moins.","source":"8.1-d28–d31, d33"}},{"id":"m8-fluo","t":"La fluorescéine","mod":8,"carte":{"quoi":"Un colorant, pas un anesthésique : il colore la phase aqueuse des larmes. Sous lumière bleue, on voit le bris du film, la sécheresse et les égratignures, l’ajustement d’une lentille rigide et les mires de l’aplanation.","quand":"La question parle de lumière bleue, de film lacrymal, de lentille rigide ou de tonométrie Goldmann ou Perkins.","piege":"Croire qu’elle colore la couche de lipide, ou confondre l’aplanation (contact, anesthésique) et le NCT (« un jet d’air »).","exemple":"Goldmann ou Perkins : « On utilise un mélange d’anesthésie et fluorescéine ».","source":"8.1-d36–d40; 3.2-d8, d9"}},{"id":"m8-protocole","t":"Protocole et sécurité","mod":8,"carte":{"quoi":"Avant les gouttes, dans l’ordre : acuité, tonométrie, l’optométriste revoit l’histoire de cas, puis regarde l’angle et la cornée; enfin les gouttes. En instillant : mains au savon, asepsie, conservation, doute → optométriste, collyre et heure au dossier.","quand":"On te demande l’ordre des étapes, ou l’erreur dans une instillation décrite.","piege":"Mettre les gouttes avant les prétests, croire que l’assistant regarde l’angle, ou noter le collyre sans l’heure.","exemple":"« Noter les collyres administrés dans le dossier du patient et l’heure ».","source":"8.1-d32, d33"}},{"id":"m8-consent","t":"Le consentement explicite","mod":8,"carte":{"quoi":"Avant chaque goutte, tu expliques la raison, les avantages et ce qui arrive sans les gouttes, les effets secondaires et les alternatives; tu réponds aux questions, puis tu demandes un oui.","quand":"Un jeu de rôle : que dire au patient, ou aux parents, avant d’instiller?","piege":"Instiller après avoir seulement informé, sans demander le oui, ou annoncer la durée longue après coup.","exemple":"« C’est donc correct que je vous mets ces gouttes? »","source":"8.1-d20, d23, d34, d35"}}],"items":[{"id":"m5-001","fam":"m5-cornee","kc":"T5.1","k":"qcm","q":"Selon le cours, laquelle de ces propositions n’est PAS une raison de mesurer la cornée ?","choix":[{"t":"Mesurer l’épaisseur de la cornée","ok":true},{"t":"Adapter correctement les lentilles de contact","pourquoi":"C’est une des trois raisons du cours : « Adapter correctement les lentilles de contact »."},{"t":"Détecter et quantifier l’astigmatisme cornéen","pourquoi":"C’est une des trois raisons : « Détecter et quantifier l’astigmatisme cornéen pour aider dans la réfraction »."},{"t":"Suivre la stabilité et la santé de la cornée","pourquoi":"C’est une des trois raisons : « Suivre la stabilité et santé cornéenne »."}],"expl":"La kératométrie mesure la courbure de la cornée, pas son épaisseur. Les trois raisons du cours : les lentilles de contact, l’astigmatisme cornéen, la stabilité et la santé de la cornée.","source":"5.1-d29, d37","mod":5},{"id":"m5-002","fam":"m5-cornee","kc":"T5.1","k":"vf","q":"Un patient porte des lentilles de contact. Mesurer sa cornée sert, entre autres, à bien adapter ses lentilles.","v":true,"expl":"C’est la première raison du cours : « Adapter correctement les lentilles de contact ». Les deux autres : l’astigmatisme cornéen et le suivi de la santé de la cornée.","source":"5.1-d29","mod":5},{"id":"m5-003","fam":"m5-cornee","kc":"T5.2","k":"qcm","q":"Selon le cours de kératométrie, quelle est la puissance moyenne de la cornée ?","choix":[{"t":"Environ 43 D, de 35 à 50 D selon la cornée","ok":true},{"t":"Environ 40 D, de 35 à 50 D selon la cornée","pourquoi":"40 D est le chiffre rond de l’Optique. Ce cours dit « environ 43 dioptries »."},{"t":"Environ 60 D, de 50 à 70 D selon la cornée","pourquoi":"Environ 60 D, c’est l’œil entier en Optique. La cornée n’en fait qu’environ 2/3."},{"t":"Environ 43 D, de 40 à 45 D selon la cornée","pourquoi":"Fourchette trop étroite : le cours dit « varie entre 35D et 50D »."}],"expl":"« Pouvoir moyen environ 43 dioptries (varie entre 35D et 50D) ». Cette fourchette te sert à vérifier chaque calcul : hors de 35 à 50 D, cherche l’erreur.","source":"5.1-d3","mod":5},{"id":"m5-004","fam":"m5-cornee","kc":"T5.2","k":"qcm","q":"Pour une cornée de rayon 7,2 mm, quatre élèves donnent ces puissances. Laquelle est plausible ?","choix":[{"t":"46,88 D","ok":true},{"t":"0,047 D","pourquoi":"Hors de 35 à 50 D : r est resté en mm (0,3375 ÷ 7,2). Il faut 0,0072 m."},{"t":"185,76 D","pourquoi":"Hors de 35 à 50 D : le − 1 a été oublié (1,3375 ÷ 0,0072)."},{"t":"4,69 D","pourquoi":"Hors de 35 à 50 D : la virgule a mal bougé. 7,2 mm = 0,0072 m, pas 0,072."}],"expl":"D = 0,3375 ÷ 0,0072 = 46,88 D, entre 35 et 50 D. Les trois autres résultats sortent de cette fourchette : c’est le signe d’une erreur de calcul.","source":"5.1-d3, d32","mod":5},{"id":"m5-005","fam":"m5-cornee","kc":"T5.2","k":"vf","q":"Le mot kératométrie veut dire : mesure de la cornée.","v":true,"expl":"Le cours décompose le mot : « Kérato=cornée  métrie=mesure ».","source":"5.1-d1","mod":5},{"id":"m5-006","fam":"m5-cornee","kc":"T5.14","k":"qcm","q":"Selon le cours, à quoi sert la kératométrie pour la réfraction ?","choix":[{"t":"À l’aider, en détectant et quantifiant l’astigmatisme cornéen","ok":true},{"t":"À la remplacer, car les deux K donnent l’ordonnance de lunettes","pourquoi":"Le cours dit « pour aider dans la réfraction ». Une ligne de K n’est pas une ligne d’Rx."},{"t":"À mesurer le pouvoir de l’œil entier, en une seule mesure","pourquoi":"La cornée ne fait qu’« environ 2/3 » du pouvoir de l’œil, et le kératomètre lit « 2-3mm au centre »."}],"expl":"« Détecter et quantifier l’astigmatisme cornéen pour aider dans la réfraction » : la kératométrie apporte une information à la réfraction, elle ne la donne pas.","source":"5.1-d3, d29; 5.3-d4","mod":5},{"id":"m5-007","fam":"m5-cornee","kc":"T5.14","k":"vf","q":"Selon le cours, la cornée est responsable d’environ 2/3 du pouvoir total de l’œil, pas de tout.","v":true,"expl":"« Responsable d’environ 2/3 du pouvoir total de l’œil ». Mesurer la cornée ne mesure donc pas tout le pouvoir de l’œil.","source":"5.1-d3","mod":5},{"id":"m5-008","fam":"m5-miroir","kc":"T5.3","k":"qcm","q":"Selon le cours, la cornée agit comme quel type de miroir ?","choix":[{"t":"Un miroir convexe : l’image est plus petite","ok":true},{"t":"Un miroir concave : l’image paraît plus grande","pourquoi":"Le concave agrandit, comme le miroir de maquillage. La cornée bombée fait l’inverse."},{"t":"Un miroir plat : l’image a la même taille","pourquoi":"Le plat donne « image et objet sont de même taille ». La cornée est bombée, pas plate."}],"expl":"« La cornée agit comme un miroir convexe » : « image plus petite et effet d’être plus loin que la réalité », comme le dos d’une cuillère ou un rétroviseur.","source":"5.1-d20, d22, d23, d28","mod":5},{"id":"m5-009","fam":"m5-miroir","kc":"T5.3","k":"vf","q":"Le kératomètre mesure la lumière qui traverse la cornée (la transmission).","v":false,"expl":"Il mesure la lumière qui rebondit sur la cornée : la réflexion. Il regarde le reflet des mires, comme dans un miroir convexe.","source":"5.1-d16–d19, d28","mod":5},{"id":"m5-010","fam":"m5-miroir","kc":"T5.4","k":"qcm","q":"Le reflet des mires est plus petit sur la cornée A que sur la cornée B. Que peux-tu dire de la cornée A ?","choix":[{"t":"Rayon plus petit, donc plus puissante","ok":true},{"t":"Rayon plus grand, donc moins puissante","pourquoi":"Sens inversé : un reflet plus petit vient d’un rayon plus petit, pas plus grand."},{"t":"Rayon plus grand, donc plus puissante","pourquoi":"Le reflet et le rayon varient ensemble : petit reflet, petit rayon."},{"t":"Rayon plus petit, donc moins puissante","pourquoi":"Le rayon est juste, mais un petit rayon donne plus de dioptries, pas moins."}],"expl":"« Plus l’image est petite, plus le rayon est petit ». Puis la formule : plus le rayon est petit, plus la puissance est grande. Petit reflet, petit r, grand D.","source":"5.1-d28, d31, d32","mod":5},{"id":"m5-011","fam":"m5-miroir","kc":"T5.4","k":"vf","q":"Le kératomètre ne lit pas la puissance directement : il mesure la taille du reflet, en calcule le rayon, puis la puissance.","v":true,"expl":"Il « Calcule le rayon de courbure (r) à partir de la taille de l’image », puis la formule « D = (1,3375 - 1) / r » donne les dioptries.","source":"5.1-d31, d32","mod":5},{"id":"m5-012","fam":"m5-miroir","kc":"T5.4","k":"ordre","q":"Remets dans l’ordre la mesure du kératomètre.","etapes":["L’appareil envoie des mires lumineuses vers la cornée.","La cornée, comme un miroir convexe, réfléchit les mires.","L’appareil observe l’image réfléchie par un système optique.","Il calcule le rayon r à partir de la taille de l’image.","La formule D = (1,3375 − 1) / r change ce rayon en dioptries."],"expl":"La chaîne du cours : « Envoie des mires lumineuses vers la cornée », le reflet, « Observe l’image réfléchie à travers un système optique », le rayon, puis la puissance.","source":"5.1-d28, d31, d32","mod":5},{"id":"m5-013","fam":"m5-formule","kc":"T5.5","k":"num","q":"Une cornée a un rayon de 7,5 mm. Quelle est sa puissance ?","rep":{"v":45.0,"u":"D","tol":0.06,"dec":2},"dem":[["① mm → m","7,5 mm = 0,0075 m"],["② Formule","D = (1,3375 − 1) ÷ 0,0075 = 0,3375 ÷ 0,0075"],["③ Résultat","D = 45,00 D"],["④ Vérifier","45,00 D est entre 35 et 50 D : plausible"]],"pieges":[{"v":0.045,"m":"Tu as laissé r en mm. Convertis d’abord : 7,5 mm = 0,0075 m."},{"v":50.13,"m":"Tu as pris 1,376, l’indice réel de la cornée. Le kératomètre utilise 1,3375."},{"v":178.33,"m":"Tu as oublié le − 1 : on divise 0,3375, pas 1,3375."}],"expl":"« D = (1,3375 - 1) / r », avec r en mètres : 0,3375 ÷ 0,0075 = 45,00 D.","source":"5.1-d32, d35","mod":5},{"id":"m5-014","fam":"m5-formule","kc":"T5.5","k":"qcm","q":"Le kératomètre donne r = 7,8 mm. Quelle puissance dois-tu trouver ?","choix":[{"t":"43,3 D","ok":true},{"t":"0,04 D","pourquoi":"r est resté en mm. Avec 0,0078 m, tu tombes entre 35 et 50 D."},{"t":"48,2 D","pourquoi":"Calcul fait avec 1,376, l’indice réel. La formule du kératomètre prend 1,3375."},{"t":"171,5 D","pourquoi":"Le − 1 est oublié : c’est 0,3375 ÷ r, pas 1,3375 ÷ r."}],"expl":"C’est l’exemple du cours : « r = 7,8 mm → D = 43,3 D ». En détail : 0,3375 ÷ 0,0078 = 43,27 D.","source":"5.1-d32","mod":5},{"id":"m5-015","fam":"m5-formule","kc":"T5.5","k":"num","q":"r = 8,0 mm. Calcule la puissance de la cornée, à 0,01 D près.","rep":{"v":42.19,"u":"D","tol":0.06,"dec":2},"dem":[["① mm → m","8,0 mm = 0,0080 m"],["② Formule","D = 0,3375 ÷ 0,0080"],["③ Résultat","D = 42,19 D (le cours arrondit à 42,2 D)"],["④ Vérifier","entre 35 et 50 D : plausible"]],"pieges":[{"v":0.042,"m":"Piège d’unité : r est resté en mm. 8,0 mm = 0,0080 m."},{"v":47.0,"m":"Tu as mis 1,376 au lieu de 1,3375 : 0,376 ÷ 0,0080 = 47."},{"v":167.19,"m":"Tu as oublié le − 1 dans (1,3375 − 1)."}],"expl":"Exemple du cours : « D = (1,3375 - 1)/0,0080 = 42,2 D ».","source":"5.1-d35","mod":5},{"id":"m5-016","fam":"m5-formule","kc":"T5.5","k":"num","q":"Une cornée mesure 41,00 D. Quel est son rayon, en mm ?","rep":{"v":8.23,"u":"mm","tol":0.015,"dec":2},"dem":[["① Formule à rebours","r = 0,3375 ÷ D = 0,3375 ÷ 41,00"],["② Résultat en mètres","r = 0,00823 m"],["③ m → mm","0,00823 × 1000 = 8,23 mm"],["④ Vérifier","moins de dioptries que 7,8 mm (43,3 D), donc un rayon plus grand : cohérent"]],"pieges":[{"v":0.00823,"m":"C’est la réponse en mètres. Multiplie par 1000 pour avoir des mm."},{"v":121.48,"m":"Tu as fait D ÷ 0,3375. À rebours, c’est 0,3375 ÷ D."},{"v":9.17,"m":"Tu as pris 1,376 (0,376 ÷ 41). Le kératomètre utilise 1,3375."}],"expl":"À rebours : r = 0,3375 ÷ 41,00 = 0,00823 m = 8,23 mm. Plus plat que 7,8 mm, donc moins de dioptries : c’est cohérent.","source":"5.1-d32","mod":5},{"id":"m5-017","fam":"m5-formule","kc":"T5.5","k":"qcm","q":"Une cornée mesure 44,4 D. Quel est son rayon ?","choix":[{"t":"7,60 mm","ok":true},{"t":"0,0076 mm","pourquoi":"0,0076, ce sont des mètres. Multiplie par 1000 : 7,60 mm."},{"t":"131,6 mm","pourquoi":"Division à l’envers (44,4 ÷ 0,3375). Le rayon, c’est 0,3375 ÷ D."},{"t":"8,47 mm","pourquoi":"Calcul fait avec 1,376. La formule du kératomètre prend 1,3375."}],"expl":"r = 0,3375 ÷ 44,4 = 0,0076 m = 7,60 mm. Le cours donne le même couple dans l’autre sens : « Si r = 7,6 mm », 44,4 D.","source":"5.1-d35","mod":5},{"id":"m5-018","fam":"m5-formule","kc":"T5.7","k":"qcm","q":"Pourquoi la formule du kératomètre utilise-t-elle 1,3375 ?","choix":[{"t":"C’est un indice fictif qui sert à calibrer les kératomètres","ok":true},{"t":"C’est l’indice réel de la cornée, mesuré directement sur l’œil","pourquoi":"L’indice réel de la cornée est 1,376 (Optique). 1,3375 est un indice fictif."},{"t":"C’est l’indice des larmes qui recouvrent la cornée","pourquoi":"1,3375 n’est pas l’indice des larmes : c’est un indice fictif de calibration."},{"t":"C’est l’indice de l’humeur aqueuse, derrière la cornée","pourquoi":"C’est une moyenne de deux passages : air à cornée, et cornée à humeur aqueuse."}],"expl":"1,3375 est « utilisé dans la calibration des kératomètres » : « un indice fictif », une moyenne, utilisé par Helmholtz « qui a inventé le kératomètre ».","source":"5.1-d32","mod":5},{"id":"m5-019","fam":"m5-formule","kc":"T5.7","k":"vf","q":"Pour calculer la puissance au kératomètre, on remplace 1,3375 par 1,376, l’indice réel de la cornée.","v":false,"expl":"La formule est « D = (1,3375 - 1) / r ». 1,376 est l’indice réel de la cornée (Optique); le kératomètre est calibré avec l’indice fictif 1,3375.","source":"5.1-d32","mod":5},{"id":"m5-020","fam":"m5-cambre","kc":"T5.6","k":"qcm","q":"Deux cornées : l’une a un rayon de 7,4 mm, l’autre de 8,2 mm. Laquelle est la plus cambrée, et laquelle la plus puissante ?","choix":[{"t":"7,4 mm : plus cambrée et plus puissante","ok":true},{"t":"8,2 mm : plus cambrée et plus puissante","pourquoi":"Un grand rayon fait une courbe plus plate, pas plus forte."},{"t":"7,4 mm plus cambrée, 8,2 mm plus puissante","pourquoi":"Cambrée et puissante vont ensemble : le petit rayon est les deux."},{"t":"8,2 mm plus cambrée, 7,4 mm plus puissante","pourquoi":"Tu as séparé courbure et puissance. Le petit rayon est le plus cambré."}],"expl":"« Plus le rayon de la cornée est petit, plus la puissance de la cornée est importante ». 7,4 mm donne 45,61 D; 8,2 mm donne 41,16 D.","source":"5.1-d7, d32","mod":5},{"id":"m5-021","fam":"m5-cambre","kc":"T5.6","k":"vf","q":"Plus le rayon de la cornée est grand, plus elle est cambrée.","v":false,"expl":"C’est l’inverse : le petit rayon est « plus cambré », le grand « plus plat ». Et le petit rayon donne le plus de dioptries.","source":"5.1-d7, d32","mod":5},{"id":"m5-022","fam":"m5-cambre","kc":"T5.6","k":"qcm","q":"Une cornée mesure 42,00 D sur un méridien et 45,00 D sur l’autre. Quel méridien est le plus cambré ?","choix":[{"t":"Celui de 45,00 D : il a le plus petit rayon","ok":true},{"t":"Celui de 42,00 D : il a le plus petit rayon","pourquoi":"Moins de dioptries veut dire un rayon plus grand, donc plus plat."},{"t":"On ne peut pas le dire sans mesurer les rayons","pourquoi":"Les dioptries suffisent : le plus grand K vient du plus petit rayon."}],"expl":"Cambré = petit rayon = grand D. Le plus grand K est le méridien le plus cambré; le plus petit K, le plus plat.","source":"5.1-d32, d35; AK5-B","mod":5},{"id":"m5-023","fam":"m5-cambre","kc":"T5.8","k":"qcm","q":"Une cornée n’a qu’un seul rayon de courbure. Quelle est sa forme ?","choix":[{"t":"Sphérique : une seule mesure de rayon","ok":true},{"t":"Sphérocylindrique : deux rayons différents","pourquoi":"Sphérocylindrique veut dire deux rayons, un petit et un grand. Ici, il n’y en a qu’un."},{"t":"Sphérocylindrique : un rayon et deux puissances","pourquoi":"Un seul rayon donne une seule puissance. Deux puissances demandent deux rayons."}],"expl":"« 2 formes: sphérique et sphérocylindrique ». « Sphère: une mesure de rayon seulement »; « Ovale: sphero-cylindrique (avec astigmatisme ) ».","source":"5.1-d5–d7","mod":5},{"id":"m5-024","fam":"m5-cambre","kc":"T5.8","k":"qcm","q":"Fiche de pratique, patient D : K1 = 44,00 D et K2 = 44,00 D. Que dis-tu de sa cornée ?","choix":[{"t":"Sphérique : astigmatisme cornéen nul","ok":true},{"t":"Sphérocylindrique : 44,00 D d’astigmatisme","pourquoi":"L’astigmatisme est la différence des deux K : 44,00 − 44,00 = 0."},{"t":"Sphérocylindrique : deux K, donc deux rayons","pourquoi":"Deux K égaux viennent d’un même rayon : il n’y a qu’une courbure."}],"expl":"K2 − K1 = 44,00 − 44,00 = 0 D : une seule courbure, donc une cornée sphérique, sans astigmatisme cornéen.","source":"AK5-A; 5.1-d6","mod":5},{"id":"m5-025","fam":"m5-axe","kc":"T5.9","k":"qcm","q":"Sur une lentille torique, qu’est-ce que l’axe du cylindre ?","choix":[{"t":"La position où il n’y a pas de puissance","ok":true},{"t":"La position où se trouve toute la puissance","pourquoi":"C’est l’inverse : sur la figure, l’axe « PLANO » est à 90° et la puissance « +4.00 » à 180."},{"t":"Le méridien le plus cambré de la cornée","pourquoi":"Axe est un mot de lentille. Pour la cornée, on donne la puissance à un méridien."}],"expl":"« L’axe du cylinder (sic) est la position ou (sic) il n’y a pas de puissance ». Pour la cornée, on décrit « sa puissance à un méridien donné ».","source":"5.1-d10, d11","mod":5},{"id":"m5-026","fam":"m5-axe","kc":"T5.9","k":"qcm","q":"Dans la ligne Optosys « 42.00x44.00 @090 », que fait le x ?","choix":[{"t":"Il sépare les deux valeurs K de la cornée","ok":true},{"t":"Il donne l’axe du cylindre, sans puissance","pourquoi":"C’est le x d’une ligne d’Rx. Ici, de chaque côté du x, il y a un K."},{"t":"Il sépare une puissance et son méridien","pourquoi":"C’est le rôle du @ : il donne le méridien de la deuxième valeur."}],"expl":"42,00 et 44,00 sont deux K. Le @090 dit que la deuxième valeur, 44,00 D, est au méridien 90; 42,00 D est donc à 180.","source":"5.1-d36; 5.2-R1","mod":5},{"id":"m5-027","fam":"m5-axe","kc":"T5.9","k":"qcm","q":"Dans l’ordonnance « OD +1.00-1.00x180 », que veut dire x180 ?","choix":[{"t":"L’axe du cylindre est à 180","ok":true},{"t":"Une deuxième valeur K est au méridien 180","pourquoi":"C’est une ligne d’Rx, pas une ligne de K : ici, le x introduit l’axe."},{"t":"La puissance du cylindre est au méridien 180","pourquoi":"L’axe est là où il n’y a pas de puissance; la puissance du cylindre est à 90° de lui."}],"expl":"Même symbole, deux rôles : dans une ligne d’Rx, x donne l’axe du cylindre; dans une ligne de K Optosys, x sépare deux K.","source":"6.2-d14; TO3.1-d13; 5.1-d11","mod":5},{"id":"m5-028","fam":"m5-axe","kc":"T5.9","k":"vf","q":"Dans « 42.00x44.00 @090 », 090 est l’axe du cylindre de la cornée.","v":false,"expl":"090 est un méridien : celui de la deuxième valeur (44,00 D). Pour la cornée, on décrit « sa puissance à un méridien donné », pas un axe.","source":"5.1-d11, d36","mod":5},{"id":"m5-029","fam":"m5-astig","kc":"T5.10","k":"num","q":"La kératométrie donne 43,25 D au méridien 180 et 45,00 D au méridien 90. Quel est l’astigmatisme cornéen ?","rep":{"v":1.75,"u":"D","tol":0.01,"dec":2},"dem":[["① Le plus grand K","45,00 D (méridien 90) : le plus cambré"],["② Soustraire","45,00 − 43,25 = 1,75 D"],["③ Nommer","180 est le plus plat, 90 le plus cambré"]],"pieges":[{"v":-1.75,"m":"Montant négatif : tu as fait K plat − K cambré. On fait K cambré − K plat."}],"expl":"« Différence de puissance = astigmatisme cornéen » : 45,00 − 43,25 = 1,75 D. Le plus petit K (à 180) est le méridien plat.","source":"5.1-d36; 5.2-Q1, R1","mod":5},{"id":"m5-030","fam":"m5-astig","kc":"T5.10","k":"num","q":"Le K plat d’une cornée est 41,75 D et son astigmatisme cornéen est de 2,25 D. Quel est le K cambré ?","rep":{"v":44.0,"u":"D","tol":0.01,"dec":2},"dem":[["① La règle","astigmatisme = K cambré − K plat"],["② À rebours","K cambré = K plat + astigmatisme"],["③ Calcul","41,75 + 2,25 = 44,00 D"]],"pieges":[{"v":39.5,"m":"Tu as soustrait. Le K cambré est le plus grand : on ajoute l’astigmatisme au K plat."}],"expl":"Le K cambré est toujours le plus grand : 41,75 + 2,25 = 44,00 D. Vérifie : 44,00 − 41,75 = 2,25 D.","source":"5.1-d36; AK5-A","mod":5},{"id":"m5-031","fam":"m5-astig","kc":"T5.10","k":"qcm","q":"Fiche de pratique, K1 / K2 : A 42,00 / 42,50 · B 43,00 / 46,00 · C 40,50 / 41,00 · E 41,50 / 43,50. Quel patient a le plus fort astigmatisme cornéen ?","choix":[{"t":"Patient B","ok":true},{"t":"Patient C","pourquoi":"C a le K le plus plat (40,50), mais seulement 0,50 D d’astigmatisme."},{"t":"Patient E","pourquoi":"E a 2,00 D (43,50 − 41,50) : moins que B, qui a 3,00 D."},{"t":"Patient A","pourquoi":"A n’a que 0,50 D (42,50 − 42,00)."}],"expl":"K2 − K1 : A 0,50 · B 3,00 · C 0,50 · E 2,00. B a le plus fort astigmatisme; il a aussi le méridien le plus cambré (46,00 D).","source":"AK5-A","mod":5},{"id":"m5-032","fam":"m5-astig","kc":"T5.10","k":"qcm","q":"La fiche donne : K1 43,00 D (90°) ; K2 45,00 D (180°). Quel est l’astigmatisme, et quel méridien est le plus plat ?","choix":[{"t":"2,00 D ; le méridien 90 est le plus plat","ok":true},{"t":"2,00 D ; le méridien 180 est le plus plat","pourquoi":"K1 n’est pas l’horizontal : « K1/K2 désignent le plus plat/le plus cambré ». Ici, K1 est à 90."},{"t":"−2,00 D ; le méridien 90 est le plus plat","pourquoi":"Montant négatif : fais K cambré − K plat, soit 45,00 − 43,00."},{"t":"2,00 D ; aucun méridien n’est plus plat","pourquoi":"Deux K différents, deux courbures : le plus petit K est le plus plat."}],"expl":"« Les valeurs ne sont pas toujours dans le même ordre. » K1 est le plus plat, ici à 90. Astigmatisme : 45,00 − 43,00 = 2,00 D.","source":"AK5-B; 5.1-d36","mod":5},{"id":"m5-033","fam":"m5-astig","kc":"T5.11","k":"num","q":"Optosys affiche « 39.00 x 42.00@80 ». 42,00 D est au méridien 80. À quel méridien est 39,00 D ?","rep":{"v":170,"u":"°","tol":0.5,"dec":0},"dem":[["① La règle","les deux méridiens principaux sont à 90° l’un de l’autre"],["② Calcul","80 + 90 = 170"],["③ Réponse","39,00 D est au méridien 170"]],"pieges":[{"v":80,"m":"80 est le méridien de la deuxième valeur (42,00). La première est à 90° de lui."}],"expl":"« l’autre méridien est à 90 degrés de celui-ci » : « 80+90=170 ». Donc « 39.00 @170 et 42.00@080 ».","source":"5.2-Q5, R5","mod":5},{"id":"m5-034","fam":"m5-astig","kc":"T5.11","k":"num","q":"Un méridien principal de la cornée est à 90. À quel méridien est l’autre ?","rep":{"v":180,"u":"°","tol":0.5,"dec":0},"dem":[["① La règle","l’autre méridien est à 90° du premier"],["② Calcul","90 + 90 = 180"]],"pieges":[{"v":0,"m":"Le cours écrit 180, pas 0 : « 90+90=180 »."}],"expl":"Comme dans l’exercice du cours : « 90+90=180 ». On écrit 180.","source":"5.2-R4","mod":5},{"id":"m5-035","fam":"m5-astig","kc":"T5.11","k":"num","q":"Sortie Medmont : le K plat est au méridien 120. À quel méridien est le K cambré ?","rep":{"v":30,"u":"°","tol":0.5,"dec":0},"dem":[["① La règle","les deux méridiens principaux sont à 90°"],["② Essai","120 + 90 = 210 : trop grand, un méridien va de 0 à 180"],["③ Donc","120 − 90 = 30"]],"pieges":[{"v":210,"m":"210 dépasse 180. Quand + 90 dépasse 180, fais − 90 : 120 − 90 = 30."}],"expl":"La sortie du cours le montre : K plat à 120, K cambré à 30. Vérifie : 30 + 90 = 120.","source":"5.3-d9","mod":5},{"id":"m5-036","fam":"m5-astig","kc":"T5.11","k":"num","q":"Sortie après un LASIK : un SIM K est au méridien 155. À quel méridien est l’autre ?","rep":{"v":65,"u":"°","tol":0.5,"dec":0},"dem":[["① La règle","les deux méridiens principaux sont à 90°"],["② Essai","155 + 90 = 245 : trop grand"],["③ Donc","155 − 90 = 65"]],"pieges":[{"v":245,"m":"245 dépasse 180 : fais plutôt 155 − 90 = 65."}],"expl":"La carte du cours donne « 42.08D (8.02) @ 65° » et « 41.15D (8.20) @ 155° » : 65 + 90 = 155.","source":"5.3-d11","mod":5},{"id":"m5-037","fam":"m5-astig","kc":"T5.12","k":"qcm","q":"Que veut dire un astigmatisme « contre la règle » ?","choix":[{"t":"Courbure plus forte selon le méridien horizontal","ok":true},{"t":"Courbure plus forte selon le méridien vertical","pourquoi":"Ça, c’est avec la règle. Contre la règle : l’horizontal est le plus cambré."},{"t":"Méridiens principaux obliques, entre 30-60° ou 120-150°","pourquoi":"Ça, c’est un cylindre oblique : ni vertical, ni horizontal."},{"t":"Une zone de cambrure localisée sur la carte","pourquoi":"Ça, c’est un motif irrégulier / asymétrique, pas un astigmatisme régulier."}],"expl":"« contre la règle : courbure plus forte selon le méridien horizontal »; « avec la règle : courbure plus forte selon le méridien vertical ».","source":"CM5-corr; 5.1-d36","mod":5},{"id":"m5-038","fam":"m5-astig","kc":"T5.12","k":"qcm","q":"Carte régulière et symétrique : rouge en haut et en bas (méridien 90), bleu à gauche et à droite (méridien 180). Comment la décris-tu ?","choix":[{"t":"Avec la règle : le méridien vertical est le plus cambré","ok":true},{"t":"Contre la règle : le méridien horizontal est le plus cambré","pourquoi":"Le rouge (cambré) est en haut et en bas : c’est le vertical. Tu as lu la règle sur le bleu."},{"t":"Oblique : les méridiens sont entre 30 et 60°","pourquoi":"Les couleurs suivent 90 et 180, pas 30-60 ou 120-150."},{"t":"Irrégulier : il y a une zone de cambrure localisée","pourquoi":"Le motif est régulier et symétrique, pas une zone isolée."}],"expl":"Rouge = cambré. Vertical cambré : « avec la règle : courbure plus forte selon le méridien vertical » (figure « With-the-rule »).","source":"5.3-d5, d7, d8; CM5-corr","mod":5},{"id":"m5-039","fam":"m5-astig","kc":"T5.12","k":"qcm","q":"Kératométrie : 41,00 D au méridien 45 et 42,00 D au méridien 135. Comment s’appelle ce cylindre ?","choix":[{"t":"Oblique","ok":true},{"t":"Avec la règle","pourquoi":"Avec la règle demande un méridien vertical cambré; 135 n’est pas vertical."},{"t":"Contre la règle","pourquoi":"Contre la règle demande un méridien horizontal cambré; ni 45 ni 135 ne l’est."}],"expl":"« Cylindre oblique: 30-60 degrés ou 120-150 degrés ». 45 et 135 tombent dans ces zones.","source":"5.1-d36; 5.2-Q3","mod":5},{"id":"m5-040","fam":"m5-optosys","kc":"T5.13","k":"qcm","q":"Kératométrie : 42,00 D au méridien 180 et 44,00 D au méridien 90. Comment l’écris-tu dans Optosys ?","choix":[{"t":"42.00x44.00 @090","ok":true},{"t":"42.00x44.00 @180","pourquoi":"Le @ donne le méridien de la deuxième valeur (44,00, à 90), pas de la première."},{"t":"44.00x42.00 @180","pourquoi":"Tu as commencé par le vertical. Optosys commence par le méridien horizontal."},{"t":"44.00x42.00 @090","pourquoi":"Vertical d’abord, et le @ suit la première valeur : deux erreurs."}],"expl":"« on inscrit le méridien horizontal en premier, suivi du méridien vertical »; le @ donne le méridien de la deuxième valeur : « 42.00x44.00 @090 ».","source":"5.1-d36; 5.2-R1","mod":5},{"id":"m5-041","fam":"m5-optosys","kc":"T5.13","k":"qcm","q":"La fiche donne : K1 40,00 D (90°) ; K2 43,00 D (180°). Écris-le comme dans Optosys.","choix":[{"t":"43.00x40.00@090","ok":true},{"t":"40.00x43.00@180","pourquoi":"Tu as écrit K1 d’abord. Optosys commence par le méridien horizontal (180), ici 43,00."},{"t":"43.00x40.00@180","pourquoi":"Le @ donne le méridien de la deuxième valeur (40,00, à 90)."},{"t":"40.00x43.00@090","pourquoi":"K1 en premier, et le @ suit la première valeur : deux erreurs."}],"expl":"K1/K2 disent plat ou cambré, pas l’ordre d’écriture. Horizontal d’abord : 43,00 D, puis 40,00 D à 90. Le cours écrit « 43x40@090 ».","source":"AK5-B; 5.2-R2","mod":5},{"id":"m5-042","fam":"m5-optosys","kc":"T5.13","k":"num","q":"Optosys affiche « 41.00 x 40.00@090 ». La question du cours : « 41.00 dioptries est à quel méridien? »","rep":{"v":180,"u":"°","tol":0.5,"dec":0},"dem":[["① Le @","la deuxième valeur (40,00 D) est au méridien après le @ : 90"],["② L’autre méridien","90 + 90 = 180"],["③ Décodage","41,00 D à 180 et 40,00 D à 90"]],"pieges":[{"v":90,"m":"90 est le méridien de la deuxième valeur (40,00 D). 41,00 D est à 90° de lui."}],"expl":"Le cours conclut : « 41.00 @180 et 40.00@090 ». Le @ appartient toujours à la deuxième valeur.","source":"5.2-Q4, R4","mod":5},{"id":"m5-043","fam":"m5-optosys","kc":"T5.13","k":"qcm","q":"Kératométrie : 41,00 D au méridien 45 et 42,00 D au méridien 135. Quelle ligne Optosys est juste ?","choix":[{"t":"41x42@135","ok":true},{"t":"41x42@045","pourquoi":"Le @ donne le méridien de la deuxième valeur : 42 est à 135, pas à 45."},{"t":"42x41@135","pourquoi":"41 n’est pas à 135 : il est à 45. Le @ suit la deuxième valeur."},{"t":"41x42@090","pourquoi":"Rien n’est mesuré à 90 : le @ reprend le méridien de la deuxième valeur."}],"expl":"Pour un oblique, le cours accepte deux écritures : « 41x42@135  ou 42x41@045 ». Dans les deux, le @ suit la deuxième valeur.","source":"5.2-Q3, R3","mod":5},{"id":"m5-044","fam":"m5-optosys","kc":"T5.13","k":"qcm","q":"Patient I : K2 46,00 D au méridien 45 ; K1 42,50 D au méridien 135. Quelle ligne est FAUSSE ?","choix":[{"t":"46x42.50@045","ok":true},{"t":"46x42.50@135","pourquoi":"Elle est juste : 42,50 D est bien à 135, et 46,00 D à 90° de lui, à 45."},{"t":"42.50x46@045","pourquoi":"Elle est juste : 46 est bien à 45. Un oblique s’écrit dans les deux sens."}],"expl":"Dans 46x42.50@045, le @ donne le méridien de la première valeur. Le cours insiste : « l’important est d’associer le bon K avec le méridien correspondant ».","source":"AK5-B","mod":5},{"id":"m5-045","fam":"m5-optosys","kc":"T5.13","k":"ordre","q":"Optosys affiche « 39.00 x 42.00@80 ». Remets dans l’ordre les étapes pour décoder cette ligne.","etapes":["Lire le @ : la deuxième valeur, 42,00 D, est au méridien 80.","Placer la première valeur à 90° : 80 + 90 = 170, donc 39,00 D à 170.","Nommer les méridiens : 170 est le plus plat, 80 le plus cambré."],"expl":"D’abord le @, puis + 90 pour l’autre méridien : « 39.00 @170 et 42.00@080 ». Ensuite, le plus petit K est le méridien plat.","source":"5.2-Q5, R5","mod":5},{"id":"m5-046","fam":"m5-instruments","kc":"T5.15","k":"qcm","q":"Quelle zone de la cornée le kératomètre lit-il ?","choix":[{"t":"Environ 2-3 mm au centre","ok":true},{"t":"Toute la surface, environ 11-14 mm","pourquoi":"C’est le topographe qui lit « la surface totale de la cornée (11mm-14mm) »."},{"t":"Environ 2-3 mm en périphérie","pourquoi":"La zone est au centre : « 2-3mm au centre »."}],"expl":"Le topographe évalue « la surface totale de la cornée (11mm-14mm) et non seulement une zone de 2-3mm au centre(kératomètre) ».","source":"5.3-d4","mod":5},{"id":"m5-047","fam":"m5-instruments","kc":"T5.15","k":"qcm","q":"La cornée d’un patient est extrêmement déformée. Quel appareil risque de ne pas prendre la mesure ?","choix":[{"t":"L’auto-kératomètre","ok":true},{"t":"Le kératomètre manuel","pourquoi":"Limites inversées : le manuel est plus lent et repère mal les petits astigmatismes."},{"t":"Le topographe","pourquoi":"Le topographe évalue toute la surface et sa régularité : il montre la cornée irrégulière."}],"expl":"« Kératomètre automatique ne va pas prendre les mesures d’une cornée extrêmement distortionnée (sic) ». Tu le notes; le topographe montre la surface entière.","source":"5.1-d38; 5.3-d4","mod":5},{"id":"m5-048","fam":"m5-instruments","kc":"T5.15","k":"qcm","q":"Comment le topographe Medmont projette-t-il la lumière sur la cornée ?","choix":[{"t":"En cercles appelés disques de Placido","ok":true},{"t":"En une image dédoublée, vue au télescope","pourquoi":"C’est le kératomètre manuel : un télescope où l’image est « dédoublée »."},{"t":"En mires sur 2-3 mm au centre seulement","pourquoi":"Ça, c’est le kératomètre. Le topographe couvre 11 à 14 mm avec des cercles."}],"expl":"« Lumière est projetée sur la cornée en cercles appelés Disques de Placido ». Le Medmont est une « extension du kératomètre ».","source":"5.3-d2, d3; 5.1-d34","mod":5},{"id":"m5-049","fam":"m5-carte","kc":"T5.16","k":"qcm","q":"Sur une carte de topographie, que montre une zone bleue ?","choix":[{"t":"Une zone plus plate, avec moins de puissance","ok":true},{"t":"Une zone plus cambrée, avec plus de puissance","pourquoi":"Couleurs inversées : le rouge est cambré, le bleu est plat."},{"t":"Une zone saine, sans aucune anomalie","pourquoi":"Le bleu ne dit rien des anomalies : il « nous donne aucune information sur les anomalies »."}],"expl":"« Zones rouges sont cambrées et les zones bleus (sic) sont plats ». L’échelle est en dioptries : plat veut dire moins de dioptries.","source":"5.3-d5, d6, d9","mod":5},{"id":"m5-050","fam":"m5-carte","kc":"T5.16","k":"vf","q":"Sur une carte de topographie, la partie la plus cambrée est typiquement au centre de la cornée.","v":true,"expl":"Le cours le dit : « Typiquement la partie la plus cambrée est au centre de la cornée ».","source":"5.3-d5","mod":5},{"id":"m5-051","fam":"m5-carte","kc":"T5.17","k":"qcm","q":"Carte : des anneaux de couleur concentriques et réguliers; aucun méridien ne ressort. Y a-t-il de l’astigmatisme cornéen apparent ?","choix":[{"t":"Non : motif concentrique et régulier","ok":true},{"t":"Oui : régulier, avec la règle, vertical cambré","pourquoi":"Avec la règle demande un méridien vertical plus cambré; ici, aucun ne ressort."},{"t":"Oui : régulier, contre la règle","pourquoi":"Contre la règle demande un méridien horizontal plus cambré; ici, aucun ne ressort."},{"t":"Oui : irrégulier / asymétrique, zone localisée","pourquoi":"Il n’y a pas de zone de cambrure localisée : les anneaux sont réguliers."}],"expl":"Corrigé : « Non, pas d’astigmatisme cornéen apparent significatif — motif concentrique et régulier ». Aucun méridien n’est plus cambré ou plus plat.","source":"CM5-corr","mod":5},{"id":"m5-052","fam":"m5-carte","kc":"T5.17","k":"qcm","q":"Carte mystère : orange à gauche et à droite (180°), bleu en haut et en bas (90°), motif symétrique. Ta réponse ?","choix":[{"t":"Régulier, contre la règle : horizontal le plus cambré","ok":true},{"t":"Régulier, avec la règle : vertical le plus cambré","pourquoi":"Le bleu (plat) est en haut et en bas. Le cambré est l’horizontal : contre la règle."},{"t":"Irrégulier / asymétrique : une zone de cambrure localisée","pourquoi":"Le motif est symétrique, sur deux méridiens opposés : il est régulier."},{"t":"Pas d’astigmatisme cornéen apparent significatif","pourquoi":"Deux méridiens de couleurs différentes : il y a de l’astigmatisme apparent."}],"expl":"Corrigé de la carte 04 : « régulier, contre la règle : courbure plus forte selon le méridien horizontal ». Justifie par les couleurs : l’orange (cambré) est à 180.","source":"CM5-c04, corr","mod":5},{"id":"m5-053","fam":"m5-carte","kc":"T5.17","k":"qcm","q":"Carte : une zone rouge localisée dans le bas de la cornée, sans motif symétrique. Comment la décris-tu ?","choix":[{"t":"Irrégulier / asymétrique, zone de cambrure localisée","ok":true},{"t":"Régulier, avec la règle, puisque le bas est vertical","pourquoi":"Une seule zone localisée n’est pas un motif régulier et symétrique sur un méridien."},{"t":"Pas d’astigmatisme apparent, puisqu’il n’y a qu’une zone rouge","pourquoi":"Une zone de cambrure localisée, c’est un astigmatisme apparent, irrégulier."}],"expl":"Corrigé : « Oui, motif irrégulier / asymétrique, zone de cambrure localisée ». Pour la direction, le corrigé dit : « accepter « indéterminable » si justifié ».","source":"CM5-corr; 5.3-d9","mod":5},{"id":"m5-054","fam":"m5-carte","kc":"T5.18","k":"qcm","q":"Une patiente voit du rouge sur sa carte de topographie et te demande si c’est grave. Que sais-tu de ce rouge ?","choix":[{"t":"Il montre une zone plus cambrée, sans dire s’il y a une anomalie","ok":true},{"t":"Il montre une zone malade : la cornée a sûrement une anomalie","pourquoi":"Rouge veut dire cambré, pas malade : « Les couleurs seules ne suffisent pas à diagnostiquer une anomalie »."},{"t":"Il montre une zone normale : il n’y a pas d’anomalie","pourquoi":"Le rouge ne dit pas non plus que c’est normal : il indique cambré, rien de plus."},{"t":"Il montre une zone plus plate, avec moins de puissance dioptrique","pourquoi":"Couleurs inversées : rouge = cambré, bleu = plat."}],"expl":"« Le rouge indique cambré mais nous informe pas s’il s’agit anomalie (sic) ». Tu décris la carte et tu la rapportes; tu ne poses pas de diagnostic.","source":"5.3-d6; CM5-corr","mod":5},{"id":"m5-055","fam":"m5-carte","kc":"T5.18","k":"qcm","q":"La carte d’un patient montre une zone de cambrure localisée, en bas. Que fais-tu ?","choix":[{"t":"Tu décris la carte et tu la rapportes, sans diagnostic","ok":true},{"t":"Tu dis au patient qu’il a une maladie de la cornée","pourquoi":"Les couleurs ne suffisent pas à diagnostiquer : tu décris et tu rapportes."},{"t":"Tu inscris kératocône au dossier, comme diagnostic","pourquoi":"Tu ne diagnostiques pas : tu décris le motif et tu rapportes la carte."},{"t":"Tu ne notes rien, puisque la couleur ne diagnostique pas","pourquoi":"La couleur ne diagnostique pas, mais tu dois quand même décrire la carte : c’est ton rôle."}],"expl":"« Les couleurs seules ne suffisent pas à diagnostiquer une anomalie ». Ton rôle : décrire le motif (irrégulier / asymétrique) et le rapporter.","source":"5.3-d6, d9; CM5-corr","mod":5},{"id":"m5-056","fam":"m5-carte","kc":"T5.18","k":"vf","q":"Les couleurs seules suff
