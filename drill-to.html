2 de base de l’OCT ?","choix":[{"t":"Le disc : papille, nerf optique.","ok":true},{"t":"La macula, avec la fovéa au centre.","pourquoi":"C’est le test 1, la rétine centrale. Le test 2 est le « Disc (papille, nerf optique) »."},{"t":"La cornée, avec son épaisseur.","pourquoi":"La cornée se scanne au segment antérieur, mais ce n’est pas le test 2."},{"t":"Le vitré, devant la rétine.","pourquoi":"Suivre le vitré est un artefact (« au lieu des fibres nerveuses »), pas un test."}],"expl":"« Test 2: Disc (papille, nerf optique) ». « On devrait voir cette structure dans l’écran », puis « Prendre OD et OS ».","source":"7.2-d5","mod":7},{"id":"m7-023","fam":"m7-oct","kc":"T7.8","k":"qcm","q":"Sur la coupe OCT de la fovéa, que désigne la lettre E ?","choix":[{"t":"L’épithélium pigmentaire.","ok":true},{"t":"L’endothélium de la cornée.","pourquoi":"L’endothélium est une couche de la cornée, pas de la rétine. E = « épithélium pigmentaire »."},{"t":"L’épithélium de la cornée.","pourquoi":"On est sur la coupe de la rétine : E est l’« épithélium pigmentaire », pas une couche de la cornée."},{"t":"Les cellules ganglionnaires.","pourquoi":"C’est G : « Cellules ganglionnaires (juste avant la formation de fibres nerveuses) »."}],"expl":"Les sept lettres : F foveola, N fibres nerveuses, G cellules ganglionnaires, P photorécepteurs, E « épithélium pigmentaire », B membrane de Bruch, C choroïde.","source":"7.2-d2","mod":7},{"id":"m7-024","fam":"m7-oct","kc":"T7.8","k":"qcm","q":"Sur la coupe de la fovéa, que désigne la lettre N ?","choix":[{"t":"La couche de fibres nerveuses, qui formeront le nerf optique.","ok":true},{"t":"Le nerf optique lui-même, au centre du creux de la fovéa.","pourquoi":"Le centre du creux, c’est F, la foveola. N est la couche de fibres qui « formeront le nerf optique »."},{"t":"Les cellules ganglionnaires, juste avant les fibres nerveuses.","pourquoi":"C’est G, « juste avant la formation de fibres nerveuses ». N, ce sont les fibres elles-mêmes."},{"t":"Les photorécepteurs, qui captent la lumière en premier.","pourquoi":"C’est P, et les photorécepteurs sont vers l’arrière : la lumière traverse d’abord les fibres nerveuses."}],"expl":"« N=couche de fibres nerveuses (formeront le nerf optique) » : c’est la première des sept couches quand on part de l’avant.","source":"7.2-d2","mod":7},{"id":"m7-025","fam":"m7-oct","kc":"T7.8","k":"qcm","q":"Sur la coupe de la fovéa, que désigne la lettre C, tout au fond ?","choix":[{"t":"La choroïde.","ok":true},{"t":"La membrane de Bruch.","pourquoi":"C’est B. La membrane de Bruch est entre l’épithélium pigmentaire (E) et la choroïde (C)."},{"t":"Les cellules ganglionnaires.","pourquoi":"C’est G, près de l’avant de la rétine. C est la choroïde, au fond."},{"t":"La cornée.","pourquoi":"La cornée est à l’avant de l’œil. Elle n’apparaît pas sur la coupe de la fovéa."}],"expl":"De l’avant vers l’arrière : N, G, P, E, puis B (membrane de Bruch) et C (choroïde), tout au fond.","source":"7.2-d2–d4","mod":7},{"id":"m7-026","fam":"m7-oct","kc":"T7.8","k":"ordre","q":"Remets ces éléments de la coupe de la fovéa dans l’ordre, de l’avant vers l’arrière.","etapes":["N · couche de fibres nerveuses","G · cellules ganglionnaires","P · photorécepteurs","E · épithélium pigmentaire","B · membrane de Bruch","C · choroïde"],"expl":"La lumière traverse d’abord les fibres nerveuses (N) et les cellules ganglionnaires (G). Les photorécepteurs (P) sont derrière, puis E, B et la choroïde (C).","source":"7.2-d2–d4 (ordre lu sur les figures)","mod":7},{"id":"m7-027","fam":"m7-oct","kc":"T7.9","k":"qcm","q":"À l’OCT du segment antérieur, combien de couches de la cornée voit-on ?","choix":[{"t":"4 des 5 couches.","ok":true},{"t":"Les 5 couches.","pourquoi":"Le cours dit « 4 des 5 couches visibles » : une des cinq ne se voit pas."},{"t":"Seulement 2 couches.","pourquoi":"La figure en nomme quatre : épithélium, Bowman, stroma, endothélium."},{"t":"Une seule bande.","pourquoi":"On voit bien une bande claire, mais avec ses couches : 4 des 5."}],"expl":"« On voit une bande illumine (sic) avec 4 des 5 couches visibles. » La figure nomme épithélium, Bowman, stroma et endothélium.","source":"7.2-d7","mod":7},{"id":"m7-028","fam":"m7-oct","kc":"T7.9","k":"qcm","q":"Sur la coupe OCT d’une cornée, qu’est-ce qui montre une anomalie de l’endothélium ?","choix":[{"t":"Il est moins lisse et manque des cellules.","ok":true},{"t":"Il est plus épais et plus brillant qu’avant.","pourquoi":"Ce n’est pas ce que montre le cours : l’endothélium anormal est « moins lisse, manque des cellules »."},{"t":"Il est plein de petits espaces noirs.","pourquoi":"Ça, c’est le stroma anormal : « moins dense (plus d’espaces noires (sic)) »."},{"t":"Il devient visible, alors qu’il est caché.","pourquoi":"L’endothélium fait partie des 4 couches visibles. C’est son aspect qui change."}],"expl":"Anomalies vues à l’OCT : endothélium « moins lisse, manque des cellules »; stroma « moins dense (plus d’espaces noires (sic)) ».","source":"7.2-d8","mod":7},{"id":"m7-029","fam":"m7-oct","kc":"T7.9","k":"vf","q":"À l’OCT de la cornée, un stroma anormal paraît moins dense, avec plus d’espaces noirs.","v":true,"expl":"« Stroma (2) moins dense (plus d’espaces noires (sic)) ». Pour l’endothélium, c’est autre chose : « moins lisse, manque des cellules ».","source":"7.2-d8","mod":7},{"id":"m7-030","fam":"m7-pression","kc":"T7.10","k":"qcm","q":"Pour quelle épaisseur de cornée la plupart des tonomètres sont-ils calibrés ?","choix":[{"t":"545 µm","ok":true},{"t":"615 µm","pourquoi":"615 µm est une cornée épaisse de l’exercice (correction −5). Le calibrage est à 545 µm, où la correction vaut 0."},{"t":"410 µm","pourquoi":"410 µm est le début de la table (+10), une cornée très mince. Le calibrage est à 545 µm."},{"t":"645 µm","pourquoi":"645 µm est la fin de la table (−7). La correction vaut 0 à 545 µm, l’épaisseur du calibrage."}],"expl":"« La plupart des tonomètres sont calibrés pour une épaisseur de cornée de 545microns » : c’est pour ça que la table donne 0 à 545 µm.","source":"7.2-d11, d12","mod":7},{"id":"m7-031","fam":"m7-pression","kc":"T7.10","k":"qcm","q":"La cornée du patient est plus mince que 545 µm. Que fait la mesure du tonomètre ?","choix":[{"t":"Elle est sous-estimée : la vraie pression est plus haute.","ok":true},{"t":"Elle est surestimée : la vraie pression est plus basse.","pourquoi":"C’est l’inverse, le piège classique. Plus épaisse → « sur-estimée »; plus mince → « sous-estimée »."},{"t":"Elle est juste : l’épaisseur ne change rien à la lecture.","pourquoi":"Le tonomètre est calibré pour 545 µm : une autre épaisseur fausse la mesure."},{"t":"Elle est impossible : on ne mesure pas une cornée aussi mince.","pourquoi":"On mesure quand même, puis on corrige la lecture avec la table."}],"expl":"« Si la cornée est plus mince, la mesure sera sous-estimée » : on ajoute la correction de la table, positive sous 545 µm.","source":"7.2-d11","mod":7},{"id":"m7-032","fam":"m7-pression","kc":"T7.10","k":"vf","q":"Si la cornée est plus épaisse que 545 µm, la mesure du tonomètre sera sous-estimée.","v":false,"expl":"C’est l’inverse : « Si la cornée est plus épaisse, la mesure sera sur-estimée ». La correction de la table est négative : on retranche.","source":"7.2-d11","mod":7},{"id":"m7-033","fam":"m7-pression","kc":"T7.10","k":"qcm","q":"Cornée de 625 µm, le tonomètre lit 21 mmHg. Sans calculer, la pression corrigée sera…","choix":[{"t":"plus basse que 21 mmHg.","ok":true},{"t":"plus haute que 21 mmHg.","pourquoi":"Sens inversé : au-dessus de 545 µm, la mesure est « sur-estimée ». On retranche."},{"t":"égale à 21 mmHg, sans correction.","pourquoi":"On garde la lecture seulement à 545 µm. À 625 µm, la table donne une correction (−6)."}],"expl":"625 µm, c’est plus que 545 µm : cornée épaisse, mesure « sur-estimée ». La table donne −6 : 21 − 6 = 15 mmHg.","source":"7.2-d11, d12","mod":7},{"id":"m7-034","fam":"m7-pression","kc":"T7.11","k":"num","q":"Le tonomètre lit 20 mmHg. La cornée mesure 415 µm. Quelle est la pression corrigée ?","rep":{"v":30,"u":"mmHg","tol":0.5,"dec":0},"dem":[["Épaisseur","415 µm < 545 µm : cornée plus mince, mesure sous-estimée"],["Table","415 µm → +10"],["Calcul","20 + 10 = 30 mmHg"]],"pieges":[{"v":10,"m":"Tu as retranché 10. Sous 545 µm, la correction est positive : on l’ajoute."},{"v":20,"m":"Tu as gardé la lecture. À 415 µm, la table donne +10."},{"v":29,"m":"Tu as pris la ligne voisine (420 µm, +9). À 415 µm, c’est +10."}],"expl":"C’est l’exercice du cours : « 1. 30mmHg ». Cornée mince, lecture trop basse : on ajoute 10.","source":"7.2-d12–d14","tableau":true,"ligne":"415","mod":7},{"id":"m7-035","fam":"m7-pression","kc":"T7.11","k":"num","q":"Le tonomètre lit 20 mmHg. La cornée mesure 615 µm. Quelle est la pression corrigée ?","rep":{"v":15,"u":"mmHg","tol":0.5,"dec":0},"dem":[["Épaisseur","615 µm > 545 µm : cornée plus épaisse, mesure surestimée"],["Table","615 µm → −5"],["Calcul","20 + (−5) = 20 − 5 = 15 mmHg"]],"pieges":[{"v":25,"m":"Sens inversé : au-dessus de 545 µm, la correction est négative. Ajouter −5, c’est retrancher 5."},{"v":20,"m":"Tu as gardé la lecture. À 615 µm, la table donne −5."},{"v":16,"m":"Tu as pris la ligne voisine (605 µm, −4). À 615 µm, c’est −5."},{"v":14,"m":"Tu as pris la ligne voisine (625 µm, −6). À 615 µm, c’est −5."}],"expl":"C’est l’exercice du cours : « 3. 15mmHg ». Cornée épaisse, lecture trop haute : on retranche 5.","source":"7.2-d12–d14","tableau":true,"ligne":"615","mod":7},{"id":"m7-036","fam":"m7-pression","kc":"T7.11","k":"num","q":"Le tonomètre lit 18 mmHg et la pachymétrie donne 485 µm. Quelle est la pression corrigée ?","rep":{"v":22,"u":"mmHg","tol":0.5,"dec":0},"dem":[["Épaisseur","485 µm < 545 µm : cornée mince, mesure sous-estimée"],["Table","485 µm → +4"],["Calcul","18 + 4 = 22 mmHg"]],"pieges":[{"v":14,"m":"Tu as retranché 4. Cornée mince : la correction est positive, on l’ajoute."},{"v":18,"m":"Tu as oublié la correction : à 485 µm, la table donne +4."},{"v":23,"m":"Tu as pris la ligne voisine (475 µm, +5). À 485 µm, c’est +4."}],"expl":"485 µm : +4 dans la table. 18 + 4 = 22 mmHg : la vraie pression est plus haute que la lecture.","source":"7.2-d12","tableau":true,"ligne":"485","mod":7},{"id":"m7-037","fam":"m7-pression","kc":"T7.11","k":"num","q":"Cornée de 595 µm; le tonomètre lit 24 mmHg. Quelle est la pression corrigée ?","rep":{"v":20,"u":"mmHg","tol":0.5,"dec":0},"dem":[["Épaisseur","595 µm > 545 µm : cornée épaisse, mesure surestimée"],["Table","595 µm → −4"],["Calcul","24 − 4 = 20 mmHg"]],"pieges":[{"v":28,"m":"Sens inversé : au-dessus de 545 µm, la correction est négative, on retranche."},{"v":24,"m":"Tu as oublié la correction : à 595 µm, la table donne −4."},{"v":21,"m":"Tu as pris la ligne voisine (585 µm, −3). À 595 µm, c’est −4."}],"expl":"595 µm : −4. Cornée épaisse, la lecture était trop haute : 24 − 4 = 20 mmHg.","source":"7.2-d12","tableau":true,"ligne":"595","mod":7},{"id":"m7-038","fam":"m7-pression","kc":"T7.11","k":"num","q":"La pachymétrie donne 455 µm et le tonomètre lit 12 mmHg. Quelle est la pression corrigée ?","rep":{"v":18,"u":"mmHg","tol":0.5,"dec":0},"dem":[["Épaisseur","455 µm < 545 µm : cornée mince, mesure sous-estimée"],["Table","455 µm → +6"],["Calcul","12 + 6 = 18 mmHg"]],"pieges":[{"v":6,"m":"Tu as retranché 6. Sous 545 µm, la correction est positive : on l’ajoute."},{"v":12,"m":"Tu as oublié la correction : à 455 µm, la table donne +6."},{"v":19,"m":"Tu as pris la ligne voisine (445 µm, +7). À 455 µm, c’est +6."}],"expl":"455 µm : +6. 12 + 6 = 18 mmHg. Une cornée mince fait lire une pression plus basse que la vraie.","source":"7.2-d12","tableau":true,"ligne":"455","mod":7},{"id":"m7-039","fam":"m7-pression","kc":"T7.11","k":"num","q":"Le tonomètre lit 22 mmHg. La cornée mesure 645 µm. Quelle est la pression corrigée ?","rep":{"v":15,"u":"mmHg","tol":0.5,"dec":0},"dem":[["Épaisseur","645 µm > 545 µm : cornée épaisse, mesure surestimée"],["Table","645 µm → −7"],["Calcul","22 − 7 = 15 mmHg"]],"pieges":[{"v":29,"m":"Sens inversé : au-dessus de 545 µm, la correction est négative, on retranche."},{"v":22,"m":"Tu as oublié la correction : à 645 µm, la table donne −7."},{"v":16,"m":"Tu as pris la ligne voisine (635 µm, −6). À 645 µm, c’est −7."}],"expl":"645 µm, la dernière ligne de la table : −7. 22 − 7 = 15 mmHg.","source":"7.2-d12","tableau":true,"ligne":"645","mod":7},{"id":"m7-040","fam":"m7-pression","kc":"T7.11","k":"vf","q":"À 545 µm, la table donne une correction de 0 : la pression corrigée est égale à la lecture du tonomètre.","v":true,"expl":"545 µm, c’est l’épaisseur du calibrage. Dans l’exercice, 20 mmHg à 545 µm reste « 2. 20mmHg ».","source":"7.2-d11–d14","mod":7},{"id":"m7-041","fam":"m7-pression","kc":"T7.12","k":"num","q":"La pression corrigée est de 25 mmHg pour une cornée de 445 µm. Qu’avait lu le tonomètre ?","rep":{"v":18,"u":"mmHg","tol":0.5,"dec":0},"dem":[["Table","445 µm → +7"],["À rebours","mesurée = corrigée − correction"],["Calcul","25 − 7 = 18 mmHg"]],"pieges":[{"v":32,"m":"Tu as ajouté 7 encore une fois. À rebours, on enlève la correction : 25 − 7."},{"v":25,"m":"Tu as gardé la valeur corrigée. Cornée mince : la lecture était plus basse."},{"v":19,"m":"Tu as pris la ligne voisine (455 µm, +6). À 445 µm, c’est +7."}],"expl":"Cornée mince : le tonomètre lisait trop bas. On enlève la correction : 25 − 7 = 18 mmHg.","source":"7.2-d12 (à rebours)","tableau":true,"ligne":"445","mod":7},{"id":"m7-042","fam":"m7-pression","kc":"T7.12","k":"num","q":"Le tonomètre lit 20 mmHg et la pression corrigée est de 23 mmHg. Selon la table, quelle est l’épaisseur de la cornée ?","rep":{"v":505,"u":"µm","tol":0.5,"dec":0},"dem":[["Correction","23 − 20 = +3"],["Table","+3 → une seule ligne : 505 µm"],["Contrôle","505 µm < 545 µm : cornée mince, correction positive"]],"pieges":[{"v":585,"m":"Tu as pris la ligne −3. La correction est +3 : la cornée est plus mince que 545 µm."},{"v":3,"m":"3, c’est la correction en mmHg. On cherche l’épaisseur : la ligne qui donne +3."},{"v":515,"m":"Tu as pris la ligne voisine (515 µm, +2). La seule ligne à +3 est 505 µm."}],"expl":"Correction = corrigée − mesurée = +3. Dans la table, seule la ligne 505 µm donne +3.","source":"7.2-d12 (à rebours)","tableau":true,"ligne":"505","mod":7},{"id":"m7-043","fam":"m7-pression","kc":"T7.12","k":"num","q":"Cornée de 575 µm : la pression corrigée est de 18 mmHg. Qu’avait lu le tonomètre ?","rep":{"v":20,"u":"mmHg","tol":0.5,"dec":0},"dem":[["Table","575 µm → −2"],["À rebours","mesurée = corrigée − correction = 18 − (−2)"],["Calcul","18 + 2 = 20 mmHg"]],"pieges":[{"v":16,"m":"Tu as appliqué la correction une deuxième fois. À rebours, on l’enlève : 18 − (−2) = 20."},{"v":18,"m":"Tu as gardé la valeur corrigée. Cornée épaisse : la lecture était plus haute."},{"v":19,"m":"Tu as pris la ligne voisine (565 µm, −1). À 575 µm, c’est −2."}],"expl":"Cornée épaisse : le tonomètre lisait trop haut. 18 − (−2) = 18 + 2 = 20 mmHg.","source":"7.2-d12 (à rebours)","tableau":true,"ligne":"575","mod":7},{"id":"m7-044","fam":"m7-pression","kc":"T7.12","k":"num","q":"Le tonomètre lit 26 mmHg; la pression corrigée est de 21 mmHg. Selon la table, quelle est l’épaisseur de la cornée ?","rep":{"v":615,"u":"µm","tol":0.5,"dec":0},"dem":[["Correction","21 − 26 = −5"],["Table","−5 → une seule ligne : 615 µm"],["Contrôle","615 µm > 545 µm : cornée épaisse, correction négative"]],"pieges":[{"v":475,"m":"Tu as pris la ligne +5. La correction est −5 : la cornée est plus épaisse que 545 µm."},{"v":605,"m":"Tu as pris la ligne voisine (605 µm, −4). La seule ligne à −5 est 615 µm."},{"v":5,"m":"5, c’est la correction en mmHg. On cherche l’épaisseur : la ligne qui donne −5."}],"expl":"Correction = 21 − 26 = −5. Dans la table, seule la ligne 615 µm donne −5.","source":"7.2-d12 (à rebours)","tableau":true,"ligne":"615","mod":7},{"id":"m7-045","fam":"m7-artefact","kc":"T7.13","k":"qcm","q":"Selon le cours, qu’est-ce qu’un artefact ?","choix":[{"t":"Une image anormale créée par la technique, sans valeur diagnostique, pouvant gêner la lecture.","ok":true},{"t":"Une lésion réelle de l’œil, que l’appareil a découverte et qu’on doit signaler comme une maladie.","pourquoi":"Ça, c’est une anomalie réelle. L’artefact est « créée par la technique, sans signification diagnostique »."},{"t":"Une image normale de l’œil, que le patient trouve inquiétante quand il la voit à l’écran.","pourquoi":"Un artefact est une image anormale, et il vient de la technique, pas du ressenti du patient."},{"t":"Une image ratée par la technique, qu’on peut toujours ignorer sans aucun risque pour la lecture.","pourquoi":"Non : l’artefact peut « gêner l’interprétation », et même ressembler à une lésion."}],"expl":"« Image anormale créée par la technique, sans signification diagnostique, mais pouvant gêner l’interprétation. »","source":"7.3-d2","mod":7},{"id":"m7-046","fam":"m7-artefact","kc":"T7.13","k":"vf","q":"Un artefact peut parfois ressembler à quelque chose qui a une signification clinique.","v":true,"expl":"« Parfois un artefact peut ressembler à quelque chose avec signification clinique » : par exemple, une fausse croissance de lésion sur les photos.","source":"7.3-d3, d7","mod":7},{"id":"m7-047","fam":"m7-artefact","kc":"T7.13","k":"qcm","q":"Sur les photos de suivi d’un naevus de la choroïde, la tache semble plus grande que l’an dernier. Que retiens-tu du cours ?","choix":[{"t":"Ça peut être un artefact de la caméra : je refais une bonne image et l’optométriste juge.","ok":true},{"t":"Le naevus a grossi : je l’annonce au patient et je l’écris au dossier comme un fait.","pourquoi":"Tu poses un diagnostic. La caméra peut donner une fausse impression de croissance; l’optométriste interprète."},{"t":"C’est sûrement un artefact de la caméra : je n’en parle à personne et je passe à la suite.","pourquoi":"Un artefact peut « gêner l’interprétation », et une vraie évolution reste possible : on ne l’ignore pas."}],"expl":"« Camera artifacts producing the false impression of growth of choroidal melanocytic lesions » : la caméra peut imiter une croissance. On obtient une bonne image et l’optométriste juge.","source":"7.1-d13; 7.3-d7","mod":7},{"id":"m7-048","fam":"m7-artefact","kc":"T7.13","k":"qcm","q":"Sur une photo du fond d’œil, tu vois une empreinte de doigt (« Fingerprint ») et des reflets (« Flares »). De quoi s’agit-il ?","choix":[{"t":"D’artefacts de la caméra : l’image est à reprendre.","ok":true},{"t":"D’anomalies réelles de la rétine à montrer au patient.","pourquoi":"Ils viennent de la technique, pas de l’œil. Et ce n’est pas à l’assistant de les interpréter."},{"t":"D’une pigmentation mixte (tigroïde), qui est normale.","pourquoi":"La pigmentation mixte montre les vaisseaux de la choroïde en bandes. Empreinte et reflets viennent de la caméra."}],"expl":"Le cours montre « Fingerprint », « Flares » et « Central Artifact » comme artefacts de la caméra rétinienne : créés par la technique, ils se reprennent.","source":"7.3-d6","mod":7},{"id":"m7-049","fam":"m7-artefact","kc":"T7.13","k":"vf","q":"Une image anormale est toujours le signe d’une maladie de l’œil.","v":false,"expl":"Elle peut être un artefact, « créée par la technique, sans signification diagnostique ». Le cours l’oppose à « Ici on a une anomalie réelle ».","source":"7.3-d2, d5","mod":7},{"id":"m7-050","fam":"m7-erreurs","kc":"T7.14","k":"qcm","q":"Le patient a cligné pendant la capture. Que fais-tu ?","choix":[{"t":"Je reprends simplement la photo.","ok":true},{"t":"J’envoie la photo telle quelle.","pourquoi":"Le clignement a raté la photo, c’est la technique. Le cours dit « Reprendre la photo »."},{"t":"Je dilate le patient d’abord.","pourquoi":"La dilatation sert quand la pupille est trop petite. Pour un clignement : « Reprendre la photo »."},{"t":"J’arrête et je vois l’optométriste.","pourquoi":"On consulte quand les images restent floues malgré tout. Un clignement se règle en reprenant la photo."}],"expl":"« Clignement pendant la capture » → « Reprendre la photo » : la cause est passée, on reprend simplement.","source":"7.3-d12","mod":7},{"id":"m7-051","fam":"m7-erreurs","kc":"T7.14","k":"ordre","q":"« Image trop sombre oeil droit ». Remets la conduite dans l’ordre.","etapes":["S’assurer que les lumières sont éteintes","Si la pupille reste trop petite, dilater les yeux","Reprendre la photo, sans dépasser 2 photos"],"expl":"D’abord les lumières. Puis, si la pupille est trop petite, « on va dilater les yeux pour prendre une meilleure photo ». Et « On se limite à 2 photos ».","source":"7.3-d12; 7.1-d17","mod":7},{"id":"m7-052","fam":"m7-erreurs","kc":"T7.14","k":"qcm","q":"« Bonne image à droite mais image sombre à gauche ». D’après le cours, que s’est-il passé, et que fais-tu ?","choix":[{"t":"Photo prise trop vite, pupille contractée : je baisse les lumières et j’attends quelques minutes.","ok":true},{"t":"Le fond est plus foncé de ce côté : je le note comme une anomalie à signaler à l’optométriste.","pourquoi":"C’est la technique : la photo a été prise « trop rapidement », pupille « en état de constriction »."},{"t":"La pupille est trop petite : je prends d’autres photos tout de suite jusqu’à en avoir une bonne.","pourquoi":"Pas d’acharnement : « On se limite à 2 photos ». On baisse les lumières et on attend d’abord."},{"t":"Les milieux de l’œil sont opaques : j’arrête l’examen et je consulte tout de suite l’optométriste.","pourquoi":"Ça, c’est pour des « Images toujours floues ». Ici, une photo est bonne : la pupille était contractée."}],"expl":"Photo prise « trop rapidement », pupille « en état de constriction » : diminuer les lumières, « attendre quelques minutes », cache-œil pour la fixation. « On se limite à 2 photos ».","source":"7.3-d12","mod":7},{"id":"m7-053","fam":"m7-erreurs","kc":"T7.14","k":"qcm","q":"Après deux essais, les images restent floues : pas moyen de bien capter. Que fais-tu ?","choix":[{"t":"J’arrête : opacité possible. Je m’en tiens à 2 par œil et je consulte l’optométriste.","ok":true},{"t":"Je refais la mise au point et je continue les photos jusqu’à ce que l’image soit enfin nette.","pourquoi":"« Ne continuer (sic) pas à prendre des photos » : le flou peut venir d’une opacité, pas du réglage."},{"t":"Je dilate les pupilles et je prends encore cinq photos pour être sûr d’en avoir une bonne.","pourquoi":"La limite est de « 2 par oeil ». Le flou partout fait penser aux milieux (« cataracte, opacité »), pas à la pupille."},{"t":"J’écris au dossier que le patient a une cataracte, puis je passe au patient suivant.","pourquoi":"Tu poses un diagnostic. Le cours dit « on consulte avec l’optométriste »."}],"expl":"« Images toujours floues » : « cataracte, opacité » possibles. « On se limite à 2 par oeil et on consulte avec l’optométriste ».","source":"7.3-d12","mod":7},{"id":"m7-054","fam":"m7-erreurs","kc":"T7.15","k":"qcm","q":"Tu lances le test 2 (la papille), mais l’écran montre la dépression de la fovéa, comme au test 1. Que s’est-il passé ?","choix":[{"t":"Le patient ne fixait pas la cible : l’OCT a capté la macula.","ok":true},{"t":"La papille du patient est anormale : il faut la signaler.","pourquoi":"Ce creux est la fovéa : c’est une erreur de fixation, pas une anomalie de la papille."},{"t":"L’appareil a capté le cristallin au lieu de la cornée du patient.","pourquoi":"Ça arrive au scan de la cornée. Ici, on voit la macula au lieu de la papille."},{"t":"Le QI est dans le rouge : l’image du scan est trop dégradée.","pourquoi":"Le problème n’est pas la qualité : l’écran montre la mauvaise structure. C’est la fixation."}],"expl":"« Le patient ne fixe pas la cible et l’instrument capte la macula et non le disc ». On rappelle la cible et on refait le scan.","source":"7.3-d13; 7.2-d1, d5","mod":7},{"id":"m7-055","fam":"m7-erreurs","kc":"T7.15","k":"qcm","q":"Au scan de la cornée, l’image montre le cristallin. Que fais-tu ?","choix":[{"t":"Je refais le scan en m’assurant de bien capter la cornée.","ok":true},{"t":"Je garde l’image : cristallin ou cornée, la mesure reste bonne.","pourquoi":"Ce sont deux structures différentes : l’appareil a capté la mauvaise. On refait le scan."},{"t":"Je signale à l’optométriste une anomalie de la cornée.","pourquoi":"C’est une erreur de l’appareil, pas une anomalie : « L’instrument capte le cristallin ou (sic) lieu de la cornée »."},{"t":"J’arrête le test et je reporte l’examen à une autre visite.","pourquoi":"On arrête si le patient est trop fatigué. Ici, on refait simplement le scan."}],"expl":"« L’instrument capte le cristallin ou (sic) lieu de la cornée » : « refaire le scan, s’assurer que la structure est la cornée ».","source":"7.3-d13","mod":7},{"id":"m7-056","fam":"m7-erreurs","kc":"T7.15","k":"qcm","q":"À l’OCT, l’écran indique « QI dans le rouge ». Que fais-tu ?","choix":[{"t":"L’image est dégradée : je refais le scan.","ok":true},{"t":"Une couche est trop mince : je la signale.","pourquoi":"Le « QI dans le rouge » parle de la qualité de l’image, pas d’une mesure : « Image dégradée (QI dans le rouge). Refaire »."},{"t":"Le rouge veut dire un bon signal : je garde.","pourquoi":"C’est l’inverse : « QI dans le rouge » va avec « Image dégradée ». On refait."},{"t":"J’arrête tout et je reporte à une autre visite.","pourquoi":"On reporte si le patient est trop fatigué. Une image dégradée, on la refait."}],"expl":"« Image dégradée (QI dans le rouge). Refaire » : une mauvaise image ne se lit pas, on la reprend.","source":"7.3-d13","mod":7},{"id":"m7-057","fam":"m7-erreurs","kc":"T7.15","k":"vf","q":"Si le patient est trop fatigué à l’OCT, on arrête le test : on ne dépasse pas 3-4 minutes, et on voit l’optométriste.","v":true,"expl":"« Si le patient est trop fatigue (sic) on arrête le test. Ne pas dépasser 3-4 minutes. Voir l’optométriste. » On peut refaire à une autre visite.","source":"7.3-d13","mod":7},{"id":"m7-058","fam":"m7-erreurs","kc":"T7.16","k":"vf","q":"Chaque scan de l’OCT vise sa structure : la rétine centrale (test 1), la papille (test 2) ou la cornée.","v":true,"expl":"Test 1 : « Rétine centrale »; test 2 : « Disc (papille, nerf optique) »; et la « Cornée (segment antérieur) ». Un scan regarde une structure à la fois.","source":"7.2-d1, d5, d7, d15","mod":7},{"id":"m7-059","fam":"m7-erreurs","kc":"T7.16","k":"qcm","q":"L’optométriste a demandé un scan de la papille. C’est fait, mais après 4 minutes le patient est très fatigué. Un collègue propose d’ajouter tous les autres scans, pour être complet. Que réponds-tu ?","choix":[{"t":"Non : pas plus de 3-4 minutes, et un patient trop fatigué, on arrête le test.","ok":true},{"t":"Oui : plus on fait de scans, mieux c’est pour le patient, même s’il est fatigué.","pourquoi":"Plus n’est pas mieux : le temps du patient est limité, « Ne pas dépasser 3-4 minutes »."},{"t":"Oui, mais sur un seul œil pour aller plus vite, et on fera l’autre une autre fois.","pourquoi":"Les tests se font « OD et OS ». Et un patient trop fatigué, on arrête le test."},{"t":"Oui, si l’assistant pense que le patient risque une maladie de l’œil.","pourquoi":"L’assistant ne diagnostique pas. C’est l’optométriste qui demande un scan en particulier."}],"expl":"« Si le patient est trop fatigue (sic) on arrête le test. Ne pas dépasser 3-4 minutes. » Chaque scan est demandé pour une structure précise.","source":"7.2-d15; 7.3-d13","mod":7},{"id":"m7-060","fam":"m7-erreurs","kc":"T7.16","k":"qcm","q":"L’optométriste demande un scan en particulier : celui de la cornée. Avant de garder l’image, que dois-tu voir à l’écran ?","choix":[{"t":"La cornée : une bande claire avec 4 des 5 couches.","ok":true},{"t":"Le cristallin, avec toutes ses couches bien visibles.","pourquoi":"Capter le cristallin est une erreur : il faut « s’assurer que la structure est la cornée »."},{"t":"La fovéa, avec sa dépression au centre de l’image.","pourquoi":"La fovéa, c’est le test 1 (rétine centrale), pas le scan demandé."},{"t":"La papille, avec le départ du nerf optique.","pourquoi":"C’est le test 2. Le scan demandé vise la cornée."}],"expl":"Un scan demandé vise une structure. Pour la cornée : « s’assurer que la structure est la cornée », une bande claire avec « 4 des 5 couches visibles ».","source":"7.2-d7, d15; 7.3-d13","mod":7},{"id":"m8-001","fam":"m8-systemes","kc":"T8.1","k":"qcm","q":"Sur un dessin de l’iris, un muscle forme un cercle autour de la pupille. Lequel?","choix":[{"t":"Le sphincter","ok":true},{"t":"Le dilatateur","pourquoi":"Le dilatateur « forme des lignes radiaires », pas un cercle."},{"t":"Le corps ciliaire","pourquoi":"Les deux muscles de l’iris sont le sphincter et le dilatateur; le corps ciliaire contrôle l’accommodation."}],"expl":"Le sphincter « forme un cercle autour de la pupille »; le dilatateur « forme des lignes radiaires ». Truc : le cercle serre la pupille, les rayons l’ouvrent.","source":"8.1-d8","mod":8},{"id":"m8-002","fam":"m8-systemes","kc":"T8.1","k":"qcm","q":"Qu’est-ce qui contrôle l’accommodation?","choix":[{"t":"Le corps ciliaire","ok":true},{"t":"Le sphincter","pourquoi":"Le sphincter règle la taille de la pupille, pas l’accommodation."},{"t":"Le dilatateur de l’iris","pourquoi":"Le dilatateur règle lui aussi la taille de la pupille, pas l’accommodation."}],"expl":"« Le corps ciliaire contrôle l’accommodation »; « Le sphincter et le dilatateur de l’iris contrôlent la taille de la pupille ».","source":"8.1-d7","mod":8},{"id":"m8-003","fam":"m8-systemes","kc":"T8.1","k":"vf","q":"Le dilatateur de l’iris forme des lignes radiaires; le sphincter forme un cercle autour de la pupille.","v":true,"expl":"Oui : deux muscles dans l’iris, deux formes. Le sphincter « forme un cercle autour de la pupille », le dilatateur « forme des lignes radiaires ».","source":"8.1-d8","mod":8},{"id":"m8-004","fam":"m8-systemes","kc":"T8.2","k":"qcm","q":"Quel système fait rétrécir la pupille?","choix":[{"t":"Le parasympathique, « digestion et relaxation »","ok":true},{"t":"Le sympathique, système « mettre en action »","pourquoi":"Le sympathique fait l’effet contraire : « dilatation de la pupille »."},{"t":"Le sympathique, quand on est au repos ou somnolent","pourquoi":"Le repos et la somnolence, c’est le parasympathique; le sympathique dilate la pupille quand on est alerte."}],"expl":"« Notre système parasympathique encourage nos pupilles de rétrécir (somnolence, repos). » Le sympathique a l’effet contraire : il dilate la pupille quand on est alerte, éveillé.","source":"8.1-d11, d12","mod":8},{"id":"m8-005","fam":"m8-systemes","kc":"T8.2","k":"qcm","q":"Sur la figure des deux systèmes, lequel de ces effets appartient au sympathique?","choix":[{"t":"« accélère le coeur »","ok":true},{"t":"« ralentit le coeur »","pourquoi":"Ralentir le cœur, c’est le parasympathique, le système du repos."},{"t":"« stimule la digestion »","pourquoi":"Le parasympathique est « digestion et relaxation »; le sympathique « bloque la digestion »."},{"t":"« rétrécit la pupille »","pourquoi":"Le sympathique « dilate la pupille »; la rétrécir, c’est le parasympathique."}],"expl":"Le sympathique, « mettre en action » : il « accélère le coeur », « dilate la pupille », « bloque la digestion ». Le parasympathique fait l’inverse.","source":"8.1-d12","mod":8},{"id":"m8-006","fam":"m8-systemes","kc":"T8.2","k":"vf","q":"Le parasympathique est le système de l’alerte : il dilate la pupille quand on est éveillé.","v":false,"expl":"Inversé. Le parasympathique rétrécit la pupille (« somnolence, repos »); c’est le sympathique qui la dilate quand on est alerte et éveillé.","source":"8.1-d12","mod":8},{"id":"m8-007","fam":"m8-mecanisme","kc":"T8.3","k":"qcm","q":"Comment le tropicamide dilate-t-il la pupille?","choix":[{"t":"Il bloque le parasympathique : le sphincter se relâche","ok":true},{"t":"Il stimule le sympathique : le dilatateur se contracte","pourquoi":"Ça, c’est la phényléphrine. Le tropicamide bloque le parasympathique."},{"t":"Il bloque le sympathique : le dilatateur se relâche","pourquoi":"Mauvais système : le tropicamide fait un « blocage du système parasympathique »."},{"t":"Il coupe les influx nerveux de la cornée","pourquoi":"Couper les influx nerveux, c’est l’anesthésique (-aine, -caine), pas un mydriatique."}],"expl":"Le tropicamide fait un « blocage du système parasympathique » : le sphincter et le corps ciliaire se relâchent. Pupille grande, accommodation relâchée.","source":"8.1-d18, d20","mod":8},{"id":"m8-008","fam":"m8-mecanisme","kc":"T8.3","k":"qcm","q":"Tu mets une goutte qui bloque le parasympathique. Qu’arrive-t-il à la pupille et à l’accommodation?","choix":[{"t":"Pupille grande, accommodation relâchée","ok":true},{"t":"Pupille petite, accommodation relâchée","pourquoi":"Bloquer le parasympathique relâche le sphincter : la pupille grandit, elle ne rapetisse pas."},{"t":"Pupille grande, accommodation intacte","pourquoi":"Ça, c’est la phényléphrine. Ici, le corps ciliaire se relâche aussi."},{"t":"Pupille petite, accommodation intacte","pourquoi":"Les deux sont faux : le sphincter et le corps ciliaire se relâchent."}],"expl":"Un seul blocage, deux muscles : « relaxation du muscle sphincteur (sic) de la pupille et relaxation du muscle du corps ciliaire ». Donc mydriase et cycloplégie.","source":"8.1-d18","mod":8},{"id":"m8-009","fam":"m8-mecanisme","kc":"T8.3","k":"vf","q":"Bloquer le système parasympathique rend la pupille petite.","v":false,"expl":"Piège classique. Le parasympathique fait rétrécir la pupille; le bloquer relâche le sphincter, donc la pupille devient grande (mydriase).","source":"8.1-d12, d18","mod":8},{"id":"m8-010","fam":"m8-mecanisme","kc":"T8.3","k":"qcm","q":"Quelles sont les trois gouttes « Mydriatiques avec un effet cycloplégique »?","choix":[{"t":"Tropicamide, cyclopentolate, atropine","ok":true},{"t":"Tropicamide, phényléphrine, atropine","pourquoi":"La phényléphrine dilate sans toucher l’accommodation : elle n’est pas cycloplégique."},{"t":"Cyclopentolate, phényléphrine, proparacaïne","pourquoi":"La phényléphrine n’est pas cycloplégique, et la proparacaïne est un anesthésique."},{"t":"Phényléphrine, tropicamide, cyclopentolate","pourquoi":"La phényléphrine stimule le sympathique; elle n’agit pas sur le muscle ciliaire."}],"expl":"Les trois bloquent le parasympathique : ils dilatent ET relâchent l’accommodation. La phényléphrine, elle, dilate seulement.","source":"8.1-d18, d25","mod":8},{"id":"m8-011","fam":"m8-mecanisme","kc":"T8.3","k":"qcm","q":"Un collègue dit que le cyclopentolate dilate parce qu’il stimule le dilatateur. Qu’en penses-tu?","choix":[{"t":"Faux : il bloque le parasympathique, le sphincter se relâche","ok":true},{"t":"Vrai : il agit comme la phényléphrine","pourquoi":"Stimuler le dilatateur, c’est la phényléphrine. Le cyclopentolate bloque le parasympathique."},{"t":"Faux : il ne dilate pas, il agit seulement sur le corps ciliaire","pourquoi":"Il agit « surtout » sur le corps ciliaire, mais il dilate aussi : c’est un mydriatique cycloplégique."}],"expl":"Le cyclopentolate est un des trois « Mydriatiques avec un effet cycloplégique » : il bloque le parasympathique. On le choisit « Quand on veut surtout un effet de relaxation du corps ciliaire ».","source":"8.1-d18, d23","mod":8},{"id":"m8-012","fam":"m8-mecanisme","kc":"T8.4","k":"qcm","q":"Comment la phényléphrine dilate-t-elle la pupille?","choix":[{"t":"Elle stimule le sympathique : le dilatateur se contracte","ok":true},{"t":"Elle bloque le parasympathique, comme le fait le tropicamide","pourquoi":"Non : son mécanisme est une « stimulation du système sympathique (adrénergique) »."},{"t":"Elle relâche le corps ciliaire, qui ouvre la pupille","pourquoi":"Elle n’agit pas sur le muscle ciliaire, et le corps ciliaire règle l’accommodation, pas la pupille."}],"expl":"Mécanisme : « stimulation du système sympathique (adrénergique) ». Les sympathomimétiques agissent directement : ils contractent le dilatateur de l’iris.","source":"8.1-d22, d25","mod":8},{"id":"m8-013","fam":"m8-mecanisme","kc":"T8.4","k":"vf","q":"La phényléphrine relâche l’accommodation, comme le tropicamide.","v":false,"expl":"« Ils n’ont pas d’effet sur l’accommodation parce qu’ils n’agissent pas sur le muscle ciliaire » : la phényléphrine dilate seulement.","source":"8.1-d25","mod":8},{"id":"m8-014","fam":"m8-mecanisme","kc":"T8.4","k":"vf","q":"La phényléphrine dilate la pupille sans être cycloplégique.","v":true,"expl":"Oui : mydriatique ne veut pas dire cycloplégique. Tropicamide, cyclopentolate et atropine font les deux; la phényléphrine dilate seulement, car « ils n’agissent pas sur le muscle ciliaire ».","source":"8.1-d18, d25","mod":8},{"id":"m8-015","fam":"m8-mecanisme","kc":"T8.4","k":"qcm","q":"Laquelle de ces gouttes dilate la pupille sans toucher l’accommodation?","choix":[{"t":"La phényléphrine (Mydfrin)","ok":true},{"t":"Le tropicamide (Mydriacyl)","pourquoi":"Le tropicamide relâche aussi le corps ciliaire : il est cycloplégique."},{"t":"Le cyclopentolate (Cyclogyl)","pourquoi":"Le cyclopentolate agit « surtout » sur le corps ciliaire : il est cycloplégique."},{"t":"L’atropine 1 %","pourquoi":"L’atropine bloque le parasympathique : elle relâche aussi l’accommodation."}],"expl":"La phényléphrine contracte le dilatateur, et « ils n’agissent pas sur le muscle ciliaire » : l’accommodation reste intacte.","source":"8.1-d18, d25","mod":8},{"id":"m8-016","fam":"m8-mecanisme","kc":"T8.4","k":"qcm","q":"Qu’est-ce qui distingue vraiment la phényléphrine du tropicamide?","choix":[{"t":"Elle dilate sans relâcher l’accommodation","ok":true},{"t":"Seule, elle dilate mieux que lui","pourquoi":"Seule, elle « ne réussit pas à bien dilater » : le parasympathique l’emporte."},{"t":"Elle relâche le corps ciliaire, mais pas le sphincter","pourquoi":"Elle n’agit pas sur le muscle ciliaire; elle contracte le dilatateur."},{"t":"Elle bloque le sympathique au lieu du parasympathique","pourquoi":"Elle stimule le sympathique; elle ne le bloque pas."}],"expl":"Les deux dilatent. Le tropicamide bloque le parasympathique (sphincter et corps ciliaire); la phényléphrine stimule le sympathique (dilatateur seul). D’où le flou de près avec l’un, pas avec l’autre.","source":"8.1-d18, d22, d25","mod":8},{"id":"m8-017","fam":"m8-mecanisme","kc":"T8.5","k":"qcm","q":"Pourquoi la phényléphrine seule dilate-t-elle mal la pupille?","choix":[{"t":"Parce que, pour la pupille, le parasympathique l’emporte","ok":true},{"t":"Parce qu’elle agit seulement sur le corps ciliaire","pourquoi":"Elle n’agit pas sur le muscle ciliaire; elle contracte le dilatateur."},{"t":"Parce que le sympathique l’emporte toujours sur le parasympathique","pourquoi":"C’est l’inverse : pour la pupille, c’est le parasympathique qui l’emporte."},{"t":"Parce qu’elle bloque le dilatateur au lieu de le stimuler","pourquoi":"Elle stimule le dilatateur (sympathique); elle ne le bloque pas."}],"expl":"« Pour le control (sic) de la taille de la pupille, le système parasympathique remporte » : le sphincter garde le dessus. On l’ajoute donc au tropicamide.","source":"8.1-d25","mod":8},{"id":"m8-018","fam":"m8-mecanisme","kc":"T8.5","k":"qcm","q":"Pourquoi l’optométriste ajoute-t-il de la phényléphrine au tropicamide?","choix":[{"t":"Pour une dilatation plus prononcée ou plus longue","ok":true},{"t":"Pour enlever le flou de près causé par le tropicamide","pourquoi":"La phényléphrine n’agit pas sur le muscle ciliaire : elle ne corrige pas le flou de près."},{"t":"Pour que l’effet commence en moins d’une minute","pourquoi":"Moins d’une minute, c’est le délai de l’anesthésique, pas des mydriatiques."},{"t":"Pour anesthésier la cornée avant la tonométrie","pourquoi":"Anesthésier, c’est le rôle des gouttes en -aine ou -caine."}],"expl":"« Ajouté au tropicamide pour un examen du fond d’œil » quand on veut une dilatation « plus prononcée ou de plus longue durée ». Ensemble, ils visent « une dilatation supérieure ».","source":"8.1-d22, d25","mod":8},{"id":"m8-019","fam":"m8-mecanisme","kc":"T8.5","k":"qcm","q":"Imagine qu’on mette seulement de la phényléphrine, sans tropicamide. Que prévois-tu?","choix":[{"t":"La pupille se dilate mal : le parasympathique l’emporte","ok":true},{"t":"La pupille devient encore plus grande qu’avec le tropicamide","pourquoi":"Seule, elle « ne réussit pas à bien dilater » la pupille."},{"t":"La pupille rapetisse, car le sympathique est stimulé","pourquoi":"Stimuler le sympathique dilate la pupille; il ne la rétrécit pas."},{"t":"La pupille ne bouge pas, mais l’accommodation se relâche","pourquoi":"C’est l’inverse : elle dilate un peu et ne touche pas l’accommodation."}],"expl":"La phényléphrine contracte le dilatateur, mais pour la pupille « le système parasympathique remporte » : la dilatation reste incomplète. D’où l’association avec le tropicamide.","source":"8.1-d25","mod":8},{"id":"m8-020","fam":"m8-effets","kc":"T8.6","k":"qcm","q":"Après des gouttes, un patient dit qu’il voit flou de près. Laquelle de ces gouttes l’explique?","choix":[{"t":"Le tropicamide","ok":true},{"t":"La phényléphrine","pourquoi":"Elle n’agit pas sur le muscle ciliaire : elle ne touche pas l’accommodation."},{"t":"La proparacaïne (Alcaine)","pourquoi":"Un anesthésique coupe les influx nerveux : il change la sensation (œil sec), pas la vision de près."}],"expl":"Le tropicamide relâche le corps ciliaire, qui contrôle l’accommodation : « vision de près floue ». La phényléphrine, elle, n’agit pas sur le muscle ciliaire.","source":"8.1-d18, d25, d28","mod":8},{"id":"m8-021","fam":"m8-effets","kc":"T8.6","k":"qcm","q":"Après les gouttes de dilatation, la pression sanguine d’un patient monte. Quelle goutte est en cause?","choix":[{"t":"La phényléphrine","ok":true},{"t":"Le tropicamide","pourquoi":"Ses effets sont l’éblouissement, le flou de près et, très rarement, l’humeur aqueuse bloquée."},{"t":"Le cyclopentolate","pourquoi":"Il bloque le parasympathique : flou de près et éblouissement, pas la tension."},{"t":"La proparacaïne","pourquoi":"C’est un anesthésique : on ne s’en sert pas pour dilater."}],"expl":"La phényléphrine « augmente les effets sur le système sympathique » : « hypertension possible », et elle « peut provoquer des arythmies cardiaques ».","source":"8.1-d22, d27","mod":8},{"id":"m8-022","fam":"m8-effets","kc":"T8.6","k":"qcm","q":"Quels effets secondaires le cours donne-t-il pour le tropicamide, le cyclopentolate et l’atropine?","choix":[{"t":"Éblouissement, flou de près, très rarement l’humeur aqueuse bloquée","ok":true},{"t":"Photophobie, tension qui monte, arythmies cardiaques","pourquoi":"Ça, c’est la phényléphrine, qui stimule le sympathique."},{"t":"Œil sec et moins d’envie de cligner, pendant les 15-20 minutes suivantes","pourquoi":"Ça, c’est l’anesthésique, qui coupe les influx nerveux."},{"t":"Pupille petite et accommodation bloquée en contraction","pourquoi":"Ces gouttes relâchent le sphincter et le corps ciliaire : la pupille devient grande."}],"expl":"« éblouissement avec la lumière, vision de près floue, risque de bloquer l’évaculation (sic) de l’humeur aqueuse chez les patients susceptibles ».","source":"8.1-d10, d18","mod":8},{"id":"m8-023","fam":"m8-effets","kc":"T8.6","k":"vf","q":"Très rarement, une dilatation de la pupille peut bloquer le passage de l’humeur aqueuse chez des personnes susceptibles.","v":true,"expl":"Oui, mais c’est rare : « Très rarement une dilatation pupillaire bloque le passage de l’humeur aqueuse dans des individus susceptibles anatomiquement ».","source":"8.1-d10, d18","mod":8},{"id":"m8-024","fam":"m8-effets","kc":"T8.6","k":"qcm","q":"Mme L. a reçu du tropicamide et de la phényléphrine. Elle voit flou de près, et sa tension a monté. D’où vient chaque effet?","choix":[{"t":"Flou de près : tropicamide; tension : phényléphrine","ok":true},{"t":"Flou de près : phényléphrine; tension : tropicamide","pourquoi":"Inversé : la phényléphrine n’agit pas sur le muscle ciliaire, mais c’est elle qui touche la tension."},{"t":"Les deux viennent de la phényléphrine","pourquoi":"La phényléphrine n’agit pas sur le muscle ciliaire : le flou de près vient du tropicamide."},{"t":"Les deux viennent du tropicamide","pourquoi":"La tension qui monte est un effet de la phényléphrine, qui stimule le sympathique."}],"expl":"Chaque effet suit son muscle ou son système : corps ciliaire relâché → flou de près (tropicamide); sympathique stimulé → « hypertension possible » (phényléphrine).","source":"8.1-d18, d22, d27","mod":8},{"id":"m8-025","fam":"m8-effets","kc":"T8.6","k":"vf","q":"La phényléphrine peut, elle aussi, causer de la photophobie.","v":true,"expl":"Oui : ses effets secondaires sont « photophobie, hypertension possible ». La sensibilité à la lumière ne distingue donc pas les deux familles; le flou de près, oui.","source":"8.1-d18, d22","mod":8},{"id":"m8-026","fam":"m8-pourquoi","kc":"T8.7","k":"qcm","q":"M. R., 72 ans, a de petites pupilles sans prendre de médicament. Quelle explication donne le cours?","choix":[{"t":"Le dilatateur s’atrophie avec l’âge plus que le sphincter","ok":true},{"t":"Le sphincter s’atrophie avec l’âge plus que le dilatateur","pourquoi":"Inversé : c’est le dilatateur, le muscle qui ouvre, qui s’atrophie le plus."},{"t":"Le parasympathique devient moins efficace avec l’âge","pourquoi":"C’est le sympathique qui faiblit; « le système parasympathique change moins »."},{"t":"Le corps ciliaire tire l’iris vers la pupille avec l’âge","pourquoi":"Le corps ciliaire contrôle l’accommodation, pas la taille de la pupille."}],"expl":"« Le muscle dilatateur s’atrophie avec l’âge plus que le sphincter » et « Le système sympathique devient moins efficace » : le côté qui ouvre faiblit, la pupille rapetisse.","source":"8.1-d17","mod":8},{"id":"m8-027","fam":"m8-pourquoi","kc":"T8.7","k":"vf","q":"Avec l’âge, les pupilles ont tendance à devenir plus grandes.","v":false,"expl":"C’est l’inverse : petites pupilles avec l’âge, car le dilatateur s’atrophie plus que le sphincter. Le cours associe les grandes pupilles à la jeunesse.","source":"8.1-d4, d17","mod":8},{"id":"m8-028","fam":"m8-pourquoi","kc":"T8.7","k":"qcm","q":"En plus de l’âge, quelle autre cause de petites pupilles le cours nomme-t-il?","choix":[{"t":"Certains médicaments : opioïdes, sédatifs, antipsychotiques","ok":true},{"t":"Une goutte de tropicamide reçue plus tôt dans la journée","pourquoi":"Le tropicamide dilate la pupille; il ne la rend pas petite."},{"t":"Un système sympathique plus actif que d’habitude","pourquoi":"Le sympathique dilate la pupille : plus actif, il la ferait grandir."}],"expl":"Le cours donne l’âge, et aussi : « Effet secondaire de certains médiments (sic) tel opiodes (sic), sédatifs, antipsychotiques ».","source":"8.1-d17","mod":8},{"id":"m8-029","fam":"m8-pourquoi","kc":"T8.10","k":"qcm","q":"Laquelle de ces raisons de dilater vient du cours?","choix":[{"t":"Plusieurs prétests passent par la pupille","ok":true},{"t":"Insensibiliser la cornée avant la tonométrie","pourquoi":"Ça, c’est le rôle de l’anesthésique, pas d’un mydriatique."},{"t":"Colorer le film lacrymal sous lumière bleue","pourquoi":"Ça, c’est la fluorescéine, un colorant."},{"t":"Faciliter la mesure de l’acuité visuelle","pourquoi":"L’acuité se mesure avant les gouttes : c’est la première étape du protocole."}],"expl":"« Les informations lors de plusieurs prétests entrent par le biais de la pupille ». Autres raisons : voir la périphérie de la rétine et mieux voir le pôle postérieur.","source":"8.1-d13–d16, d32","mod":8},{"id":"m8-030","fam":"m8-pourquoi","kc":"T8.10","k":"qcm","q":"Chez qui le cours dit-il qu’on souhaite une meilleure vue du pôle postérieur?","choix":[{"t":"Les 50 ans+, les petites pupilles, les opacités du cristallin","ok":true},{"t":"Les enfants, les grandes pupilles, les cornées égratignées","pourquoi":"Ce ne sont pas les groupes du cours : il nomme les 50 ans+, les petites pupilles, les opacités."},{"t":"Les porteurs de lentilles rigides et les yeux secs","pourquoi":"Ceux-là, on les examine avec la fluorescéine; ce ne sont pas les groupes nommés."}],"expl":"« Personnes 50 ans+ », « Petites pupilles », « Opacités du cristallin » : ces patients ont plus de maladies oculaires et circulatoires, et on veut bien voir le fond d’œil.","source":"8.1-d16","mod":8},{"id":"m8-031","fam":"m8-pourquoi","kc":"T8.10","k":"vf","q":"On dilate parfois pour voir l’extrême périphérie de la rétine, jusqu’à la zone entre l’équateur et la fin du corps ciliaire.","v":true,"expl":"Oui : « Pour voie (sic) l’extreme périphérique de la rétine dans certains cas », jusqu’à « la zone entre l’équateur et la fin du corps ciliaire ».","source":"8.1-d13, d14","mod":8},{"id":"m8-032","fam":"m8-fiches","kc":"T8.8","k":"qcm","q":"Mydriacyl est le nom de commerce de quelle goutte?","choix":[{"t":"Le tropicamide","ok":true},{"t":"Le cyclopentolate","pourquoi":"Le cyclopentolate, c’est le Cyclogyl."},{"t":"La phényléphrine","pourquoi":"La phényléphrine, c’est le Mydfrin."},{"t":"La proparacaïne","pourquoi":"La proparacaïne, c’est l’Alcaine."}],"expl":"Mydriacyl = tropicamide, Cyclogyl = cyclopentolate, Mydfrin = phényléphrine, Alcaine = proparacaïne. Attention : Mydriacyl et Mydfrin dilatent tous deux, mais seul le Mydriacyl est cycloplégique.","source":"8.1-d20–d26, d28","mod":8},{"id":"m8-033","fam":"m8-fiches","kc":"T8.8","k":"qcm","q":"Quel est le nom de commerce du cyclopentolate?","choix":[{"t":"Cyclogyl","ok":true},{"t":"Mydriacyl","pourquoi":"Mydriacyl, c’est le tropicamide."},{"t":"Mydfrin","pourquoi":"Mydfrin, c’est la phényléphrine."},{"t":"Alcaine","pourquoi":"Alcaine, c’est la proparacaïne, un anesthésique."}],"expl":"Cyclopentolate (Cyclogyl) : « l’agent le plus souvent utilisé chez les enfants », à 1 %.","source":"8.1-d23, d24","mod":8},{"id":"m8-034","fam":"m8-fiches","kc":"T8.8","k":"num","q":"Tu viens de mettre du tropicamide. Dans combien de minutes, environ, verras-tu l’effet?","rep":{"v":20,"u":"min","tol":0,"dec":0},"dem":[["Goutte","Tropicamide (Mydriacyl), « Une goutte par œil »"],["Délai","« dans environ 20 minutes »"],["Durée","« 5-6 heures », « jusqu’à 24 heures » si sensible"]],"pieges":[{"v":30,"m":"30-45 minutes, c’est le délai du cyclopentolate."},{"v":45,"m":"30-45 minutes, c’est le délai du cyclopentolate."},{"v":1,"m":"Moins d’une minute, c’est l’anesthésique."},{"v":15,"m":"15-20 minutes, c’est la durée de l’anesthésique."}],"expl":"Le tropicamide est la goutte la plus utilisée en optométrie parce que son effet commence vite : « dans environ 20 minutes ».","source":"8.1-d20","mod":8},{"id":"m8-035","fam":"m8-fiches","kc":"T8.8","k":"qcm","q":"Laquelle de ces gouttes a l’effet le plus long?","choix":[{"t":"L’atropine 1 %","ok":true},{"t":"Le cyclopentolate","pourquoi":"24 heures ou plus chez certains enfants : c’est long, mais l’atropine dure plus."},{"t":"Le tropicamide","pourquoi":"5-6 heures, jusqu’à 24 heures si sensible : moins que l’atropine."},{"t":"La phényléphrine","pourquoi":"Son effet dure 2-6 heures."}],"expl":"L’atropine 1 % dure « jusqu’à 2 semaines », et elle est « rarement utilisé pour fins diagnostiques ». Cyclopentolate : 24 heures ou plus chez certains enfants; tropicamide : 5-6 heures.","source":"8.1-d19, d20, d23, d27","mod":8},{"id":"m8-036","fam":"m8-fiches","kc":"T8.8","k":"vf","q":"L’atropine 1 % est la goutte habituelle pour dilater lors d’un examen de routine.","v":false,"expl":"Non : l’atropine 1 % est « rarement utilisé pour fins diagnostiques », et elle dure « jusqu’à 2 semaines ». La goutte habituelle est le tropicamide.","source":"8.1-d19, d20","mod":8},{"id":"m8-037","fam":"m8-fiches","kc":"T8.8","k":"vf","q":"L’atropine diluée à 0,05 % sert à stabiliser l’augmentation de la myopie chez les jeunes.","v":true,"expl":"Oui : même agent, autre but. Diluée, elle sert à « stabiliser l’augmentation » de la myopie; à 1 %, elle est « rarement utilisé pour fins diagnostiques ».","source":"8.1-d19","mod":8},{"id":"m8-038","fam":"m8-fiches","kc":"T8.8","k":"num","q":"Quelle concentration de phényléphrine (Mydfrin) est la plus souvent utilisée? Réponds en %.","rep":{"v":2.5,"u":"%","tol":0,"dec":1},"dem":[["Concentrations","« 2,5 %, 10 % »"],["La plus utilisée","« 2.5% est le plus souvent utilisé »"]],"pieges":[{"v":10,"m":"10 % existe aussi, mais c’est 2,5 % qu’on utilise le plus souvent."},{"v":1,"m":"1 %, c’est le cyclopentolate (ou une formulation du tropicamide)."},{"v":0.5,"m":"0,5 %, c’est une formulation du tropicamide."}],"expl":"La phényléphrine existe à « 2,5 %, 10 % », mais « 2.5% est le plus souvent utilisé ».","source":"8.1-d22, d25","mod":8},{"id":"m8-039","fam":"m8-choix","kc":"T8.9","k":"qcm","q":"Adulte de 40 ans, examen du fond d’œil de routine. Quelle goutte l’optométriste demande-t-il le plus souvent?","choix":[{"t":"Le tropicamide (Mydriacyl)","ok":true},{"t":"L’atropine 1 %","pourquoi":"« rarement utilisé pour fins diagnostiques » : elle dure jusqu’à 2 semaines."},{"t":"La proparacaïne (Alcaine)","pourquoi":"C’est un anesthésique : il sert à toucher la cornée, pas à dilater."},{"t":"La fluorescéine","pourquoi":"C’est un colorant pour le film lacrymal et la cornée, pas pour dilater."}],"expl":"Pour voir le fond d’œil, on dilate. Le tropicamide est le plus utilisé parce qu’il agit vite (environ 20 minutes) et dure habituellement « 5-6 heures ».","source":"8.1-d3, d19, d20","mod":8},{"id":"m8-040","fam":"m8-choix","kc":"T8.9","k":"qcm","q":"Une fillette de 5 ans vient pour une réfraction. On veut surtout relâcher son accommodation. Quelle goutte l’optométriste choisira-t-il le plus souvent?","choix":[{"t":"Le cyclopentolate (Cyclogyl)","ok":true},{"t":"La phényléphrine (Mydfrin)","pourquoi":"Elle dilate sans toucher l’accommodation : inutile pour la réfraction."},{"t":"L’atropine diluée à 0,05 %","pourquoi":"Diluée, elle sert à freiner la myopie des jeunes, pas à la réfraction du jour."},{"t":"La proparacaïne (Alcaine)","pourquoi":"Un anesthésique coupe les influx nerveux; il ne relâche pas l’accommodation."}],"expl":"Cyclopentolate : « Quand on veut surtout un effet de relaxation du corps ciliaire », chez les jeunes enfants, « pour réduire l’accommodation et assurer une réfraction plus précise ».","source":"8.1-d19, d23, d25","mod":8},{"id":"m8-041","fam":"m8-choix","kc":"T8.9","k":"qcm","q":"Il faut enlever un corps étranger sur la cornée. Quelle goutte prépare ce geste?","choix":[{"t":"Un anesthésique, comme l’Alcaine","ok":true},{"t":"Du tropicamide, pour mieux voir","pourquoi":"Le tropicamide dilate la pupille; il ne rend pas la cornée insensible."},{"t":"Du cyclopentolate, pour le confort","pourquoi":"Il relâche l’accommodation; il ne coupe pas la douleur."}],"expl":"Les anesthésiques servent à « enlever des corps étrangers sur la cornée » : ils coupent les influx nerveux, en moins d’une minute.","source":"8.1-d28, d30","mod":8},{"id":"m8-042","fam":"m8-choix","kc":"T8.9","k":"qcm","q":"L’optométriste veut voir si la cornée a des égratignures ou des zones sèches. Que prépares-tu?","choix":[{"t":"La fluorescéine, regardée sous lumière bleue","ok":true},{"t":"Le tropicamide, pour une pupille plus grande","pourquoi":"Dilater sert à voir le fond de l’œil, pas la surface de la cornée."},{"t":"L’anesthésique seul, sans colorant","pourquoi":"L’anesthésique rend la cornée insensible; il ne fait pas voir les égratignures."},{"t":"Le cyclopentolate, pour relâcher l’accommodation","pourquoi":"Il relâche l’accommodation; il ne colore rien."}],"expl":"« On utilise avec lumière bleue pour mettre en évidence des zones de sécheresse ou des égratignures sur la cornée. »","source":"8.1-d38","mod":8},{"id":"m8-043","fam":"m8-choix","kc":"T8.19","k":"qcm","q":"Léo, 6 ans, recevra du cyclopentolate pour sa réfraction. Que dis-tu à ses parents sur le délai et la durée?","choix":[{"t":"Effet après 30-45 minutes; il peut durer 24 heures ou plus","ok":true},{"t":"Effet dans environ 20 minutes; il dure habituellement 5-6 heures","pourquoi":"Ce sont les valeurs du tropicamide."},{"t":"Effet en moins d’une minute; il dure 15-20 minutes","pourquoi":"Ce sont les valeurs de l’anesthésique."},{"t":"Effet après 30-45 minutes; il peut durer jusqu’à 2 semaines","pourquoi":"Deux semaines, c’est l’atropine 1 %, pas le cyclopentolate."}],"expl":"Début après « 30-45 minutes »; la durée « peut être 24 heures ou plus chez certains enfants ». Tu le dis aux parents avant la goutte.","source":"8.1-d23","mod":8},{"id":"m8-044","fam":"m8-choix","kc":"T8.19","k":"qcm","q":"Mme L., 62 ans, petites pupilles, reçoit du tropicamide pour un fond d’œil. Que lui annonces-tu avant?","choix":[{"t":"Éblouissement et flou de près, 5-6 heures, parfois jusqu’à 24 heures","ok":true},{"t":"Œil sec et moins d’envie de cligner pendant 15-20 minutes","pourquoi":"Ce sont les effets d’un anesthésique, pas d’un mydriatique."},{"t":"Aucun changement de la vision de près : seule la taille de la pupille change","pourquoi":"Le tropicamide relâche aussi le corps ciliaire : la vision de près sera floue."},{"t":"Éblouissement pendant deux semaines, comme avec l’atropine","pourquoi":"Deux semaines, c’est l’atropine; le tropicamide dure habituellement 5-6 heures."}],"expl":"Muscle par muscle : pupille grande → éblouissement; corps ciliaire relâché → flou de près. Durée : « 5-6 heures », « jusqu’à 24 heures » chez les personnes sensibles.","source":"8.1-d18, d20","mod":8},{"id":"m8-045","fam":"m8-choix","kc":"T8.19","k":"qcm","q":"Un patient a mal : il a une égratignure sur la cornée. Pour l’examiner, quelles gouttes servent?","choix":[{"t":"Un anesthésique pour le confort, la fluorescéine pour voir l’égratignure","ok":true},{"t":"Du tropicamide pour le confort, la fluorescéine pour voir l’égratignure","pourquoi":"Le tropicamide dilate; c’est l’anesthésique qui assure le confort sur une cornée égratignée."},{"t":"La fluorescéine seule : elle colore et anesthésie à la fois","pourquoi":"La fluorescéine est un « colorant organique », pas un anesthésique."},{"t":"Un anesthésique, puis le flacon remis au patient pour la maison","pourquoi":"Jamais : « une sur-utilisation crée une toxicité au niveau de l’épithélium »."}],"expl":"Deux rôles du cours : « Assurer le confort du patient quand on examine la surface d’un oeil égratigné » (l’anesthésique), et la fluorescéine sous lumière bleue pour voir l’égratignure.","source":"8.1-d3, d28, d38","mod":8},{"id":"m8-046","fam":"m8-anesth","kc":"T8.11","k":"qcm","q":"Comment reconnaître un anesthésique à son nom?","choix":[{"t":"Son nom finit par -aine ou -caine","ok":true},{"t":"Son nom finit par -amide","pourquoi":"-amide, c’est le tropicamide, un mydriatique."},{"t":"Son nom finit par -ate","pourquoi":"-ate, c’est le cyclopentolate, un mydriatique cycloplégique."},{"t":"Son nom commence par Myd- ou par Cyclo-","pourquoi":"Mydriacyl, Mydfrin (Myd-) et Cyclogyl (Cyclo-) dilatent la pupille; ils n’anesthésient pas."}],"expl":"« Les médicaments qui finissent avec –aine ou –caine sont des anesthétiques ». Exemples : la proparacaïne (Alcaine), et la cocaïne, découverte vers 1880-1900 puis abandonnée.","source":"8.1-d28, d29","mod":8},{"id":"m8-047","fam":"m8-anesth","kc":"T8.11","k":"qcm","q":"Après une goutte d’Alcaine, quand l’œil est-il insensible, et pour combien de temps?","choix":[{"t":"En moins d’une minute, pour 15-20 minutes","ok":true},{"t":"Dans environ 20 minutes, pour 5-6 heures","pourquoi":"Ce sont les valeurs du tropicamide."},{"t":"Après 30-45 minutes, pour 24 heures","pourquoi":"30-45 minutes et 24 heures ou plus : c’est le cyclopentolate."},{"t":"En moins d’une minute, pour 2-6 heures","pourquoi":"2-6 heures, c’est la durée de la phényléphrine."}],"expl":"Anesthésie « à l’intérieur d’une minute », pendant « 15-20 minutes ». L’œil peut ensuite sembler sec plus longtemps.","source":"8.1-d27, d28","mod":8},{"id":"m8-048","fam":"m8-anesth","kc":"T8.11","k":"qcm","q":"Comment agit un anesthésique topique comme la proparacaïne?","choix":[{"t":"Il empêche la transmission des influx nerveux","ok":true},{"t":"Il relâche le sphincter de l’iris et le corps ciliaire","pourquoi":"Ça, c’est un mydriatique qui bloque le parasympathique."},{"t":"Il colore la phase aqueuse des larmes","pourquoi":"Ça, c’est la fluorescéine."},{"t":"Il contracte le dilatateur de l’iris","pourquoi":"Ça, c’est la phényléphrine."}],"expl":"« Ils empêchent la transmission d’impulses (sic) nerveux. » Les mydriatiques agissent sur des muscles; l’anesthésique agit sur les nerfs : il change la sensation, pas la vue.","source":"8.1-d28","mod":8},{"id":"m8-049","fam":"m8-anesth","kc":"T8.11","k":"vf","q":"La proparacaïne (Alcaine) fait partie des mydriatiques avec un effet cycloplégique.","v":false,"expl":"Non : c’est un anesthésique topique (-aine). Les « Mydriatiques avec un effet cycloplégique » sont le tropicamide, le cyclopentolate et l’atropine.","source":"8.1-d18, d28","mod":8},{"id":"m8-050","fam":"m8-anesth","kc":"T8.12","k":"qcm","q":"Après l’Alcaine pour un corps étranger, le patient a encore mal. Il te demande le flacon pour la maison. Que fais-tu?","choix":[{"t":"Tu refuses : trop en mettre est toxique pour l’épithélium","ok":true},{"t":"Tu le lui donnes, avec la consigne d’une goutte par jour au maximum","pourquoi":"On ne le remet jamais au patient, quelle que soit la dose : risque de toxicité."},{"t":"Tu le lui donnes s’il le garde au réfrigérateur","pourquoi":"Le froid sert à conserver l’Alcaine; il ne rend pas l’usage à la maison sûr."},{"t":"Tu lui donnes plutôt une unidose, plus pratique","pourquoi":"L’unidose est aussi un anesthésique : même règle, on ne la remet pas."}],"expl":"« Ne pas remettre au patient parce qu’une sur-utilisation crée une toxicité au niveau de l’épithélium ». Le geste qui semble gentil est dangereux.","source":"8.1-d28","mod":8},{"id":"m8-051","fam":"m8-anesth","kc":"T8.12","k":"qcm","q":"Quel est le risque si un patient met lui-même un anesthésique trop souvent?","choix":[{"t":"Une toxicité pour l’épithélium","ok":true},{"t":"Une hausse de la pression sanguine","pourquoi":"C’est un risque de la phényléphrine, qui stimule le sympathique."},{"t":"Un blocage de l’humeur aqueuse","pourquoi":"C’est un risque rare de la dilatation, chez les patients susceptibles."},{"t":"Une vision de function lire(s){
  if(/^\s*pl/i.test(String(s == null ? '' : s))) return 0;  /* « Plano » = 0 */
  const t = String(s == null ? '' : s).trim().replace(/\s/g, '').replace(',', '.').replace(/[−–]/g, '-');

function jugerNum(p, s){
  const r = p.rep, x = lire(s);
  if(x === null) return {vide:true, m:'Écris un nombre.'};
  if(pres(x, r.v, r.tol)) return {ok:true};
  for(const e of (p.pieges || [])) if(pres(x, e.v, r.tol)) return {m:e.m, reconnu:true};

function jugerRx(p, s){

  const axeOk = !rc || pres(a, r.axe, 0.5);  /* un axe s'écrit de 001 à 180 : 000 n'est pas 180 */
  if(pres(sph, r.sph, 0.01) && pres(c, rc, 0.01) && axeOk) return {ok:true};
  for(const e of (p.pieges || [])){ const m = e.test({sph, cyl:c, axe:a}); if(m) return {m, reconnu:true}; }

/* la maîtrise estimée d'une famille (0 à 1), comme dans « Quelle formule ? » : réussite du premier coup, sans aide,

function maitriseFamille(e){
  if(!e || !e.n) return 0;
  if(reussi(e)) return 1;
  const h = histoire(e);
  let w = 1, a = 0, b = 0, k = 0;
  for(let i = h.length - 1; i >= 0; i--){ a += w * h[i]; b += w; k += h[i]; w *= 0.8; }

    if(b.dataset.v !== undefined){ choisirVf(b.dataset.v === '1'); return; }
    if(b.dataset.e !== undefined){ ajouterEtape(+b.dataset.e); return; }
  }
  const a = b.dataset.a;
  if(a === 'valider') valider();
  else if(a === 'depart') depart();
  else if(a === 'suivant') nouveau();
  else if(a === 'passer') passer();
  else if(a === 'copier') copier(b);
  else if(a === 'defaire'){ S.seq.pop(); peindre(); }
  else if(a === 'jumelle'){ const l = TYPES.filter(t => t.fam === S.p.type.fam && t.id !== S.p.type.id); const vu = t => D.typ[t.id] || 0; nouveau(l.length ? l.sort((x, y) => vu(x) - vu(y))[0] : S.p.type, true); }
  else if(a === 'signe'){ const ch = b.dataset.cible === 'rep' ? $('#rep') : $('[data-rx="' + b.dataset.cible + '"]'); if(ch){ const t = ch.value.trim(); ch.value = /^[-−–]/.test(t) ? t.replace(/^[-−–]\s*/, '') : /^\+/.test(t) ? '−' + t.slice(1) : '−' + t; ch.focus(); lireSaisie(); } }
  else if(a === 'brouillon'){ lireSaisie(); S.brouillonOuvert = !S.brouillonOuvert; peindre(); const z = $('#brouillon'); if(z) z.focus(); }
});
document.addEventListener('keydown', e => {
  if(fond){ if(e.key === 'Escape') fermerExpl(); else if(e.key === 'Tab'){ const l = [...fond.querySelectorAll('button, textarea')], i = l.indexOf(document.activeElement); e.preventDefault(); l[(i + (e.shiftKey ? -1 : 1) + l.length) % l.length].focus(); } return; }
  if(e.ctrlKey || e.metaKey || e.altKey || !S || !S.p || S.etape !== 'question') return;
  if(e.target.closest('textarea')) return;
  const dansChamp = !!e.target.closest('input');
  if(S.p.k === 'qcm' && !dansChamp && /^[1-4]$/.test(e.key)){ e.preventDefault(); if(e.repeat) return; const t = document.querySelectorAll('.tuile')[+e.key - 1]; if(t && !t.disabled) t.click(); return; }
  if(S.p.k === 'vf' && !dansChamp && /^[vVfF]$/.test(e.key)){ e.preventDefault(); if(!e.repeat) choisirVf(/v/i.test(e.key)); return; }
  if(e.key === 'Enter' && (S.p.k === 'num' || S.p.k === 'rx') && (dansChamp || e.target === document.body)){ e.preventDefault(); if(!e.repeat) valider(); }
});
document.addEventListener('input', e => { if(e.target.id === 'brouillon' && S) S.brouillon = e.target.value; });
/* ---------- mise en place ---------- */
document.title = COURS.titre;
$('#titre').textContent = COURS.titre;
$('#sous-titre').textContent = COURS.sousTitre;
$('#note').innerHTML = esc(COURS.note) + ' <button type="button" class="lien" id="effacer">Effacer ma progression</button>';
$('#effacer').addEventListener('click', e => {
  const b = e.target;
  if(b.dataset.sur !== '1'){ b.dataset.sur = '1'; b.textContent = 'Touche encore pour tout effacer'; setTimeout(() => { if(b.dataset.sur === '1'){ b.dataset.sur = ''; b.textContent = 'Effacer ma progression'; } }, 5000); return; }
  const p = D.portee, c = D.choix, g = D.guide; D = VIDE(); D.portee = p === 'erreurs' ? 'tout' : p; D.choix = c; D.guide = g; sauver();
  SESS.n = SESS.net = 0; SESS.rappels = []; SESS.dernierFam = ''; SESS.decouverte = false; SESS.mg = null;
  b.dataset.sur = ''; b.textContent = 'Effacer ma progression'; nouveau();
});
/* pour les tests (build/…/test) : afficher une question précise, lire l'état */
window.__drill = {TYPES, FAMILLES, choisirType, jugerNum, jugerRx, maitriseTout, reussi, modGuide, dansGuide, etat:() => ({D, S, SESS}), aller:id => nouveau(TYPES.find(t => t.id === id))};
nouveau();
})();

(() => {

    if(montre || location.protocol === 'file:') return;
    fetch('version.json?_=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(v => {

      const t = document.createElement('span'); t.textContent = 'Une nouvelle version de Lumière est prête.';

      k.style.cssText = 'border:0;border-radius:999px;padding:6px 14px;background:#9BF25C;color:#05070D;font:700 14px system-ui,sans-serif;cursor:pointer';

      b.append(t, k); document.body.appendChild(b);
    }).catch(() => {});
  };
  window.addEventListener('load', verifier);

})();
