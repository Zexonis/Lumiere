<html lang="fr">
<head>
<meta charset="utf-8">

<title>Bureau ophtalmique, UA2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* L'exerciseur de notions : le moteur de « Quelle formule ? » (Optique UA2), pour des cours de notions. Des questions
   mêlées (QCM, vrai ou faux, calcul, mise en ordre, ordonnance), une carte des familles à côté, le critère du blueprint
   §4.2 (trois de suite, sans aide, en au moins cinq essais). Gabarit commun : Guides/_commun/drill-notions/gabarit.html,
   assemblé par construire.py avec la banque d'un cours. Couleurs : celles de « Quelle formule ? ». */
:root{
  --bg:#ECF0F2; --panel:#FFFFFF; --panel-2:#F3F6F8; --ink:#13202A; --ink-2:#465763; --ink-3:#5F717D; --line:#D3DBE0;
  --accent:#9C2F6B; --accent-soft:rgba(156,47,107,.11); --on-accent:#FFFFFF;
  --ok:#1B7A4B; --ok-soft:rgba(27,122,75,.12); --warn:#9A5F0C; --warn-soft:rgba(158,99,13,.14); --bad:#B3352A; --bad-soft:rgba(179,53,42,.11);
  --f-display:"STIX Two Text", Cambria, Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1217; --panel:#131B22; --panel-2:#19232B; --ink:#E1E7EB; --ink-2:#A7B3BC; --ink-3:#8494A0; --line:#26323B;
    --accent:#F08CC4; --accent-soft:rgba(240,140,196,.15); --on-accent:#0C1217;
    --ok:#55C68E; --ok-soft:rgba(85,198,142,.14); --warn:#E5B256; --warn-soft:rgba(229,178,86,.14); --bad:#F2705F; --bad-soft:rgba(242,112,95,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1217; --panel:#131B22; --panel-2:#19232B; --ink:#E1E7EB; --ink-2:#A7B3BC; --ink-3:#8494A0; --line:#26323B;
  --accent:#F08CC4; --accent-soft:rgba(240,140,196,.15); --on-accent:#0C1217;
  --ok:#55C68E; --ok-soft:rgba(85,198,142,.14); --warn:#E5B256; --warn-soft:rgba(229,178,86,.14); --bad:#F2705F; --bad-soft:rgba(242,112,95,.14);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 var(--f-body)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.page{max-width:1080px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.tete{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{margin:0;font:600 30px/1.1 var(--f-display);letter-spacing:-.01em}
.tete p{margin:0;color:var(--ink-2);font-size:15.5px}
.bande{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.puce{min-height:38px;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:15px}
.puce[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.puce .n{margin-left:5px;font:600 12px var(--f-mono);opacity:.8}
.compte{margin-left:auto;font:600 13px var(--f-mono);color:var(--ink-2)}
.corps{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.scene,.cote section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.scene{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:380px}
.sujet{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font:600 12.5px var(--f-mono);color:var(--ink-3)}
.sujet .chip{padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.sujet .sorte{padding:2px 9px;border-radius:999px;background:var(--panel-2)}
.enonce{margin:0;font-size:19px;line-height:1.5;max-width:64ch}
.tuiles{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.tuiles.deux{grid-template-columns:repeat(2,minmax(0,1fr))}
.tuile{display:flex;align-items:center;gap:10px;min-height:56px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);text-align:left;font-size:17px;line-height:1.35}
.tuile:hover:not(:disabled){border-color:var(--accent)}
.tuile kbd{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line);font:600 12px var(--f-mono);color:var(--ink-3)}
.tuile .f{min-width:0;overflow-wrap:anywhere}
.tuile.non{border-color:var(--bad);background:var(--bad-soft)}
.tuile.oui{border-color:var(--ok);background:var(--ok-soft)}
.tuile:disabled{cursor:default}
.qm{position:relative;flex:none;width:28px;height:28px;padding:0;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--ink-2);font:700 14px/1 var(--f-body)}
.qm::after{content:"";position:absolute;inset:-8px}
.qm:hover{border-color:var(--accent);color:var(--accent)}
.suite{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.suite li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:10px;background:var(--ok-soft);font-size:16.5px}
.suite li::before{content:counter(s);flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:var(--panel);font:600 12px var(--f-mono);color:var(--ink-2)}
.suite.vide-s li{background:var(--panel-2);color:var(--ink-3)}
.suite-t{margin:0;font-size:14px;font-weight:700;color:var(--ink-2)}
.expl-fond{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(8,12,16,.5)}
.expl{width:min(440px,100%);height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--panel);border-left:1px solid var(--line)}
.expl h2{margin:0;font:600 24px/1.2 var(--f-display);overflow-wrap:anywhere}
.expl h3{margin:0 0 3px;font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.expl p{margin:0}
.expl .haut{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.expl .ex{padding:10px 12px;border-radius:10px;background:var(--panel-2)}
.expl .piege{padding:10px 12px;border-radius:10px;background:var(--warn-soft)}
.expl small{color:var(--ink-3);font-size:13.5px}
.expl textarea{width:100%;min-height:42vh;padding:10px 12px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font:400 14px/1.5 var(--f-mono)}
.copie-note{flex-basis:100%;color:var(--ink-2);font-size:14.5px}
.saisie{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.saisie input{width:150px;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font:600 18px var(--f-mono)}
.saisie .u{color:var(--ink-2)}
.rx{display:flex;flex-wrap:wrap;gap:10px}
.rx label{display:flex;flex-direction:column;gap:3px;font:600 12px var(--f-mono);color:var(--ink-3)}
.rx input{width:110px;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font:600 18px var(--f-mono)}
.bouton.signe{min-width:46px;padding:8px 10px;font-size:18px}
.bouton{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:700}
.bouton:hover{border-color:var(--accent)}
.bouton.plein{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lien{border:0;background:none;padding:8px 2px;min-height:36px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:15px}
.lien.petit{align-self:flex-start;font-size:14px;color:var(--ink-3)}
.brouillon-boite{display:flex;flex-direction:column;gap:6px}
.brouillon-t{font-size:14px;font-weight:700;color:var(--ink-2)}
.brouillon-t .facultatif{font-weight:400;color:var(--ink-3)}
.brouillon{width:100%;min-height:104px;padding:10px 12px;border:1px dashed var(--ink-3);border-radius:10px;background:var(--panel-2);color:var(--ink);font:400 16px/1.55 var(--f-mono);resize:vertical}
.msg{margin:0;padding:10px 13px;border-radius:10px;font-size:16px}
.msg.bad{background:var(--bad-soft)}
.msg.warn{background:var(--warn-soft)}
.msg.ok{background:var(--ok-soft)}
.msg.info{background:var(--panel-2)}
.dem{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.dem li{display:grid;grid-template-columns:168px minmax(0,1fr);gap:10px;font-size:16px}
.dem .l{color:var(--ink-3);font-size:14px}
.dem .c{font-family:var(--f-mono);font-size:15px;overflow-wrap:anywhere}
.source{margin:0;color:var(--ink-3);font-size:13px}
.bas{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:auto}
.cote{display:flex;flex-direction:column;gap:12px}
.cote section{padding:14px}
.cote h2{margin:0 0 8px;font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.mod-t{margin:10px 0 2px;font:600 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fam{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:0 9px;margin:0 -7px;padding:6px 7px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.3}
.fam.tout,.mod-t + .fam{border-top:0}
.fam .nom small{margin-left:7px;color:var(--ink-3);font-size:12.5px}
.fam .nom small.bon{color:var(--ok);font-weight:700}
.fam .fin{display:flex;align-items:center;gap:7px}
.ser{display:inline-flex;gap:4px;align-items:center;flex:none}
.ser i{width:10px;height:10px;border-radius:50%;background:transparent;border:1px solid var(--ink-3);flex:none}
.ser i.on{background:var(--accent);border-color:var(--accent)}
.ser i.neuf{width:12px;height:12px;background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.ser i.perdu{background:transparent;border:1px dashed var(--bad)}
.fam.eteinte .nom{color:var(--ink-3)}
.fam.eteinte .fin{opacity:.55}
.fam.vient{border-radius:9px;border-top-color:transparent}
.fam.vient + .fam{border-top-color:transparent}
.fam.vient.ok{background:var(--ok-soft);box-shadow:inset 3px 0 0 var(--ok)}
.fam.vient.perdu{background:var(--bad-soft);box-shadow:inset 3px 0 0 var(--bad)}
.fam.vient.neutre{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--ink-3)}
.fam .tag{font:600 12.5px var(--f-mono);font-style:normal;white-space:nowrap}
.fam.vient.ok .tag{color:var(--ok)}
.fam.vient.perdu .tag{color:var(--bad)}
.legende{margin:9px 0 0;font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.inter{position:relative;flex:none;width:36px;height:21px;padding:0;border:1px solid var(--ink-3);border-radius:999px;background:var(--panel-2);cursor:pointer}
.inter::before{content:'';position:absolute;inset:-9px -6px}
.inter span{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--ink-3);transition:transform .15s ease}
.inter[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.inter[aria-checked="true"] span{transform:translateX(15px);background:var(--on-accent)}
.fam.tout{padding-bottom:8px}
.fam.tout .nom{font-weight:700}
.fam.tout .nom small{font-weight:400}
.aide-carte{margin:-2px 0 8px;font-size:12.5px;color:var(--ink-3);line-height:1.35}
.annonce-carte{margin:6px 0 0;font-size:12.5px;color:var(--warn)}
.annonce-carte:empty{display:none}
.maitrise{padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.m-ligne{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.m-t{margin:0;font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.m-pct{font:600 26px/1 var(--f-display)}
.m-delta{padding:1px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font:600 13px var(--f-mono)}
.m-delta.moins{background:var(--bad-soft);color:var(--bad)}
.jauge{flex:1 1 130px;min-width:110px;max-width:240px;height:8px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.jauge i{display:block;height:100%;border-radius:999px;background:var(--accent)}
/* les paliers : un cran à 25, 50 et 75 % (une coupure dans la jauge). Au choix de l'étudiant, dans « Détails et calcul » */
.jauge{position:relative}
.jauge.paliers{height:10px}
.jauge.paliers::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(25% - 1.5px),var(--panel) calc(25% - 1.5px),var(--panel) calc(25% + 1.5px),transparent calc(25% + 1.5px),transparent calc(50% - 1.5px),var(--panel) calc(50% - 1.5px),var(--panel) calc(50% + 1.5px),transparent calc(50% + 1.5px),transparent calc(75% - 1.5px),var(--panel) calc(75% - 1.5px),var(--panel) calc(75% + 1.5px),transparent calc(75% + 1.5px))}
.choix-paliers{display:flex;align-items:flex-start;gap:10px}
.choix-paliers .inter{margin-top:1px}
.choix-paliers label{cursor:pointer}
.bilan .palier{color:var(--ink);font-weight:700}
.m-rep,.m-vit{font-size:13.5px;color:var(--ink-2)}
.m-vit{margin-left:auto}
.calcul{margin-top:6px}
.seul-mobile{display:none}
.calcul summary{font-weight:400;font-size:13px;color:var(--ink-3)}
.calcul p{margin:6px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink-2);max-width:86ch}
.bilan{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:3px 13px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2)}
.bilan.ok{border-color:var(--ok);background:var(--ok-soft)}
.bilan.perdu{border-color:var(--bad);background:var(--bad-soft)}
.bilan p{margin:0;font-size:15.5px;line-height:1.45}
.bilan .sous{grid-column:2;font-size:13.5px;color:var(--ink-2)}
.bilan .ser{gap:5px}
.bilan .ser i{width:15px;height:15px}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.bilan .ser i.neuf{animation:pop .5s ease-out}
@media (prefers-reduced-motion:reduce){.inter span{transition:none} .bilan .ser i.neuf{animation:none}}
@media (min-width:881px){ .cote{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto;scrollbar-width:thin;padding-right:2px} }
.erreurs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.35}
.erreurs li{display:flex;flex-direction:column;gap:2px}
.erreurs .r{color:var(--ok)}
.vide{margin:0;color:var(--ink-3);font-size:14.5px}
details summary{cursor:pointer;font-weight:700;font-size:15px}
.mots{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.35}
.mots li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:center}
.note{margin:0;font-size:13.5px;color:var(--ink-2);max-width:80ch}
/* la progression guidée : module par module, ce qui est réussi sort de la pile */
.guide{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.guide.on{border-color:var(--accent);background:var(--accent-soft)}
.guide label{display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;font-size:14.5px;line-height:1.35}
.guide label b{font-size:15.5px}
.guide label span{color:var(--ink-2)}
.guide .chemin{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:2px;font:600 12.5px var(--f-mono);color:var(--ink-3)}
.guide .chemin i{font-style:normal;padding:1px 8px;border-radius:999px;background:var(--panel)}
.guide .chemin i.fait{color:var(--ok)}
.guide .chemin i.ici{background:var(--accent);color:var(--on-accent)}
.guide .chemin i.hors{background:none;border:1px dashed var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
/* les notions reportées : la prof ne les évalue pas à cet examen. Éteint par défaut */
.reporte{border-style:dashed;border-color:var(--warn);background:var(--warn-soft)}
.reporte.on{border-style:solid;border-color:var(--warn);background:var(--warn-soft)}
.reporte .inter[aria-checked="true"]{background:var(--warn);border-color:var(--warn)}
.reporte .badge,.sujet .hors-ex{align-self:flex-start;padding:1px 9px;border-radius:999px;background:var(--warn);color:var(--panel);font:700 11.5px var(--f-mono);font-style:normal;letter-spacing:.05em;text-transform:uppercase}
.mod-t.hors-t{color:var(--warn)}
.hors-n{margin:0 0 4px;font-size:13px;line-height:1.35;color:var(--ink-2)}
.inter:disabled{opacity:.45;cursor:not-allowed}
/* une table du cours, dans la question ou dans la fiche */
.tableau{display:flex;flex-direction:column;gap:6px}
.tableau-t{margin:0;font-size:14px;font-weight:700;color:var(--ink-2)}
.tableau-c{margin:0;font:600 12.5px var(--f-mono);color:var(--ink-3)}
.paires{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.paires div{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:4px 9px;border-radius:7px;background:var(--panel-2);font:600 14.5px var(--f-mono)}
.paires dt{color:var(--ink-2);font-weight:400}
.paires dd{margin:0}
.paires .fort{box-shadow:inset 0 0 0 1px var(--ink-3)}
.paires .ta-ligne{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.tab-wrap{overflow-x:auto}
.tab-libre{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.4}
.tab-libre th,.tab-libre td{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tab-libre thead th{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tab-libre tbody th{font-weight:700}
.tableau small{color:var(--ink-3);font-size:13px;line-height:1.4}
.figure{margin:0;display:flex;flex-direction:column;gap:5px;align-items:center}
.figure svg{display:block;width:100%;max-width:480px;height:auto;border-radius:10px;border:1px solid var(--line);background:#FAFAF7}
.figure figcaption{font-size:13px;color:var(--ink-3);text-align:center}
/* la loupe, à côté de la conclusion : elle ouvre le dessin du cours, avec ses noms */
.conclu{display:flex;align-items:flex-start;gap:10px}
.conclu #fb{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.modele-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.loupe{flex:none;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:52px;min-height:52px;padding:5px 8px;border:1.5px solid var(--accent);border-radius:14px;background:var(--accent-soft);color:var(--accent);font:700 11.5px/1.2 var(--f-mono)}
.loupe:hover{background:var(--accent);color:var(--on-accent)}
.expl.large{width:min(600px,100%)}
.planche{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.planche-z{width:100%;overflow:auto;border-radius:10px;border:1px solid var(--line);background:#FAFAF7}
.planche-z svg{display:block;width:100%;height:auto;max-height:72vh}
.planche.gros .planche-z{max-height:76vh}
.planche.gros .planche-z svg{width:200%;max-height:none}

<script>
(() => {
'use strict';
/* === données du cours (assemblées par construire.py) === */
const COURS = {"titre":"Bureau ophtalmique, UA2","sousTitre":"Ce que la prof met à l’examen du 23 novembre : croix optique, types d’astigmatisme, transposition, analyse d’ordonnance, Rx multifocale en simple vision et à l’envers, plus les rappels de l’UA1 (prestataires, parcours patient, ordonnance, amétropies, prismes). Le « ? » ouvre la fiche de chaque notion.","nom":"Principes et procédures d’un bureau ophtalmique (ADM 0010)","cle":"drill-bureau-ua2-v1","examen":{"date":"2026-11-23","txt":"lundi 23 novembre (60 min, 50 points)"},"note":"Questions tirées des modules 7 à 10 de la prof (diapos, vidéo, questionnaires de pratique, « Consolidation des concepts ») et, pour les rappels, de ses diapos de l’UA1 ; les ordonnances des calculs sont neuves à chaque fois. Un point = une réponse juste du premier coup, sans aide. Réussie = trois points de suite, en au moins cinq essais. La fiche « ? » ou une copie pour une IA ne donnent pas de point et n’en enlèvent pas.","maitrise":"Ta maîtrise de l’UA2","tout":"Tout l’UA2","modules":{"6":{"long":"Rappels UA1","court":"UA1"}}};
const BANQUE = {"familles":[{"id":"r-prestataires","t":"Les 4 prestataires et leurs titres","mod":6,"carte":{"quoi":"Les 3 O sont réglementés : ophtalmologiste (MD), optométriste (OD), opticien (RO en Ontario, OOD au Québec). Chacun est membre d’un Ordre et a un titre réservé. L’assistant·e optométrique ne l’est pas : rôle de soutien, sous délégation.","quand":"« Différence entre 3O et Assistant.e », « MD, OD, OOD, RO ? », ou une question sur qui a le droit de faire un geste.","piege":"L’ophtalmologiste n’a pas d’Ordre de l’œil : c’est l’« Ordre des médecins et chirurgiens de l’Ontario ». Et OD au bas d’une Rx, c’est l’optométriste, pas l’œil droit.","exemple":"Un acte réglementé confié à l’assistant·e : il faut la délégation directe d’un réglementé, « et ce seulement si l’ordre professionnel le permet ».","source":"M1_c, diapos 6–11, 19, 21–25"}},{"id":"r-parcours","t":"Le parcours patient en 5 étapes","mod":6,"carte":{"quoi":"Réception → Pré-test → Examen de la vue → Orthèses visuelles → Livraison. Chaque étape a son poste : réceptionniste ou assistant·e, assistant·e, OD ou MD, opticien, opticien ou assistant·e sous délégation.","quand":"« Composantes d’un examen de la vue? », « 3 différents types d’orthèses visuelles? », ou qui fait quoi à une étape.","piege":"Prendre les pré-tests pour l’examen : ils donnent seulement des données de départ. Et la vérification finale avant la livraison : « Seul Opticien (ou docteur) ».","exemple":"Examen de la vue = 2 composantes : réfraction (ordonnance, besoins visuels) et santé oculaire. Orthèses : lunetterie, contactologie, dispositif à basse vision.","source":"M2_a ; Consolidation 16 nov."}},{"id":"r-ordonnance","t":"Ce que contient une ordonnance","mod":6,"carte":{"quoi":"Une Rx valide répond à Pour qui ? Quand ? Par qui ? Quoi ? : patient, dates, prescripteur, réfraction. Grille habituelle : SPH, CYL, AXE, PRISME, ADD, sur les lignes OD et OS (ou OU).","quand":"« Composantes d’une ordonnance ophtalmique? », ou une Rx à lire et à classer.","piege":"Croire qu’un cylindre positif est une faute : « Format Cyl positif = MD (ophtalmologiste) ». Mais on analyse toujours en cylindre négatif.","exemple":"OD -2.00 / OS -1.00 -0.50 x 065, signée « Dre. Lise Zhang, OD #17489 » : OD en début de ligne = œil droit ; OD dans la signature = optométriste.","source":"M3_a ; M3_e"}},{"id":"r-ametropies","t":"Les amétropies et la presbytie","mod":6,"carte":{"quoi":"Avec un cylindre négatif ou absent : sphère négative = myope ; sphère positive = hypermétrope ; Plano sans cylindre = emmétrope. Une ADD signale en général une presbytie, la perte d’accommodation.","quand":"« Myopie/Hypermétropie Axial vs Réfractive », ou le signe d’une sphère à interpréter.","piege":"Inverser axiale et réfractive. Axiale parle de longueur (myope trop long, hypermétrope trop court) ; réfractive parle de puissance (trop fort, trop faible).","exemple":"« Myopie AXIALE = Oeil trop long » ; « Hypermétropie RÉFRACTIVE = Oeil trop faible ».","source":"M3_a ; M3_c ; M3_d ; M3_e"}},{"id":"r-prismes","t":"Reconnaître un prisme","mod":6,"carte":{"quoi":"Un prisme déplace l’image. Il s’écrit force + base (2△BI) et rend la Rx prismatique. Il « peut s’ajouter à tous les types » d’ordonnance.","quand":"« PRISMES? » : une colonne PRISME remplie, ou un △ suivi de BI, BE, BH, BB (BI, BO, BU, BD en anglais).","piege":"Mettre un signe devant : « Donc +/- non applicable ». Ou oublier la base : le prisme « doit inclure la direction de la base ».","exemple":"-4.00 2△BI → « Myope, sphérique et prismatique ». BO (Base OUT) s’écrit BE en français.","source":"M3_a ; M3_b ; M3_e"}},{"id":"b-croix-montre","t":"Ce que la croix montre","mod":7,"carte":{"quoi":"La croix optique montre la Rx de loin seulement : SPH, CYL et AXE, posés sur deux méridiens à angle droit. Une croix par œil.","quand":"Dès qu’on te donne une Rx complète à mettre en croix, ou une croix seule à interpréter.","piege":"Mettre l’ADD ou le prisme sur la croix, ou deviner l’œil d’après la croix : « CECI EST DICTÉ PAR RX ».","exemple":"OD -2.25 -0.75 x 180 2△BI Add +2.00 : sur la croix, seulement -2.25 sur 180 et -3.00 sur 090.","source":"7.1-d3, d5, d8–d10, d22–d24, d31–d37, d50 ; 7.3-d38"}},{"id":"b-croix-construire","t":"Construire la croix ① ② ③","mod":7,"carte":{"quoi":"① la sphère va sur le méridien de l’axe ; ② SPH + CYL va sur le 2e méridien ; ③ le 2e méridien = axe ± 090, entre 001 et 180. Sans cylindre, même force partout.","quand":"Toute Rx de loin à mettre en croix.","piege":"Mettre la sphère sur 180 quel que soit l’axe : pour OS -2.00 -0.75 x 090, -2.00 va sur 090.","exemple":"OD -5.00 -1.50 x 160 : -5.00 sur 160 ; (-5.00) + (-1.50) = -6.50 sur 070 (160 - 090).","source":"7.1-d22 ; 7.2-d11–d29, d32 ; 7.3-d15, d18–d28"}},{"id":"b-croix-oblique","t":"Axe oblique : options A et B","mod":7,"carte":{"quoi":"Axe ni 090 ni 180 : option A, tracer les vrais méridiens ; option B, garder une croix droite et étiqueter les bras. Bras horizontal = méridien le plus près de 180 ou 0.","quand":"Quand l’axe de la Rx est oblique.","piege":"Tracer 160 en montant vers la droite : 160 monte vers la gauche, du côté de 180.","exemple":"-5.00 -1.50 x 160, option B : bras horizontal 160 / -5.00, bras vertical 070 / -6.50.","source":"7.3-d13–d17, d28 ; 7.2T-d3, d12–d16"}},{"id":"b-croix-types","t":"Foyers et types d’astigmatisme","mod":7,"carte":{"quoi":"Le signe d’un méridien situe son foyer : négatif devant la rétine, positif derrière, Plano sur la rétine. Les deux signes donnent le type : simple, composé ou mixte.","quand":"Quand on te demande où sont les points focaux, l’amétropie ou le type d’astigmatisme.","piege":"Lire le type avec la sphère seule : +2.50 -3.75 x 090 donne +2.50 et -1.25, donc mixte.","exemple":"+2.00 -2.00 x 135 : +2.00 sur 135, Plano sur 045 → « Astigmatisme Hypermétrope Simple ».","source":"7.1-d40–d41, d50 ; 7.2-d30–d31 ; 7.3-d30–d36 ; UA1 M3"}},{"id":"b-croix-rx","t":"De la croix à la Rx","mod":7,"carte":{"quoi":"À rebours : le méridien le plus positif donne la Rx en CYL négatif (SPH = son pouvoir, AXE = son degré, CYL = l’autre - SPH) ; le plus négatif donne la Rx en CYL positif. Bras égaux : DS.","quand":"« ANALYSE INVERSE », ou une croix à réécrire en Rx ; aussi la croix d’une Rx en CYL positif.","piege":"Prendre le méridien le plus négatif comme sphère pour la Rx en CYL négatif : tu obtiens un cylindre positif.","exemple":"-0.50 sur 180 et -1.50 sur 090 → -0.50 -1.00 x 180 (CYL négatif) et -1.50 +1.00 x 090 (CYL positif).","source":"7.1-d43–d49 ; 7.2T-d5–d12, d18–d25"}},{"id":"b-transposer","t":"Transposer en 4 étapes","mod":8,"carte":{"quoi":"Réécrire la même correction dans l’autre format de cylindre : 1) SPH + CYL = nouveau SPH ; 2) inverser le signe du CYL ; 3) axe ± 090, entre 001 et 180 ; 4) prisme et ADD recopiés.","quand":"Une Rx d’ophtalmologiste (CYL +) à lire comme une Rx d’optométriste (CYL -), ou l’inverse.","piege":"-8.00 +2.00 x 135 : la nouvelle sphère est -6.00 (on monte de 2.00), pas -10.00.","exemple":"-8.00 +2.00 x 135 → (-8.00) + (+2.00) = -6.00 ; -2.00 ; 135 - 090 = 045 → -6.00 -2.00 x 045.","source":"7.1T-d5, d7–d8, d16–d39 ; PDF ; MP4"}},{"id":"b-analyse","t":"Nommer le type d’une Rx","mod":8,"carte":{"quoi":"Avant tout, le CYL doit être absent ou négatif ; sinon tu transposes. Puis : signe de la sphère (myope, hypermétrope), cylindre (sphérique, torique), prisme (prismatique), ADD (presbyte).","quand":"Quand on te demande le type d’une Rx, surtout une Rx en CYL positif.","piege":"Lire la sphère avant de transposer : OD -3.75 +4.00 x 166 devient +0.25 -4.00 x 076, une Rx hypermétrope.","exemple":"OD -3.75 +4.00 x 166 Add +2.00 → +0.25 -4.00 x 076 Add +2.00 → « OD: Hypermétrope Torique et Presbyte ».","source":"7.3T-d4–d17, d30–d42, d61–d67"}},{"id":"b-sv-multi","t":"SV ou multifocal ?","mod":9,"carte":{"quoi":"Une Rx est multifocale seulement si elle a une ADD : elle « DOIT comprendre un pouvoir d’ADDITION ». Sans ADD, c’est une SV : un seul champ (VL, VI ou VP).","quand":"Avant toute commande : « Est-ce qu’il y a un pouvoir d’Addition? »","piege":"Prendre une forte sphère positive pour une ADD : OD +3.25 sans ADD reste une SV.","exemple":"OD -2.00 Add +1.50 / OS -2.50 Add +1.50 : multifocale. OD +4.00 -0.25 x 175, « Notes: Ordinateur » : SV-VI.","source":"d1, d3–d13, d23, d38, d63 ; UA1 M3"}},{"id":"b-adapter","t":"Adapter : 0 %, 50 %, 100 %","mod":9,"carte":{"quoi":"SPH de la SV = SPH + une part de l’ADD : 0 % en SV-VL, 50 % en SV-VI, 100 % en SV-VP. CYL, AXE et prisme se recopient ; l’ADD disparaît.","quand":"Une Rx avec ADD à commander pour un seul champ : loin, ordinateur, lecture.","piege":"En SV-VI avec une ADD impaire (+2.75, +1.75, +2.25), arrondir la moitié vers le haut : il faut « l’addition le plus faible » (sic).","exemple":"OD -1.00 -0.50 x 164 Add +2.00 : SV-VL -1.00 -0.50 x 164 · SV-VI Plano -0.50 x 164 · SV-VP +1.00 -0.50 x 164.","source":"d14–d61"}},{"id":"b-trois-rx","t":"Les trois Rx SV","mod":9,"carte":{"quoi":"Une Rx multifocale donne trois Rx SV : SV-VL (0 %), SV-VI (50 %, au quart du dessous si la moitié tombe entre deux), SV-VP (100 %). Toujours VP ≥ VI ≥ VL.","quand":"« Trouver les trois rx. », ou une commande complète avec CYL, prisme et besoin du patient.","piege":"Lire les réponses du cours dans le mauvais sens : la ligne de vue va de « PROCHE » à « DISTANCE », donc VP, VI, VL.","exemple":"-4.00 Add +2.00 → SV-VL -4.00 · SV-VI -3.00 · SV-VP -2.00.","source":"d62–d68"}},{"id":"b-envers","t":"De la SV à la multifocale","mod":9,"carte":{"quoi":"À rebours : la SV-VL a pris 0 % de l’ADD, la SV-VI 50 %, la SV-VP 100 %. Donc ADD = SV-VP − SV-VL, et la sphère de loin = la sphère de la SV − la part d’ADD qu’elle avait prise. CYL, axe et prisme ne bougent pas.","quand":"On te donne une Rx commandée (une SV) et on te demande la Rx multifocale d’origine, ou son ADD. La prof : « Ex: Rx SV = Rx Mult? ».","piege":"Ajouter la part d’ADD une deuxième fois au lieu de la retirer. Et pour une SV-VI, oublier qu’une ADD impaire avait donné l’addition la plus faible.","exemple":"Commande SV-VP OD +1.50 -0.50 x 090, ADD d’origine +2.00 → Rx d’origine OD -0.50 -0.50 x 090 Add +2.00.","source":"Mod 8.1 d14–d54 (la règle ; à rebours : dérivé) ; module 10, d29"}}],"items":[{"id":"r-001","fam":"r-prestataires","kc":"R1","k":"qcm","q":"Une nouvelle collègue te demande ce qui sépare d’abord l’opticien, l’optométriste et l’ophtalmologiste de l’assistant·e optométrique. Que lui réponds-tu ?","choix":[{"t":"Les trois premiers sont réglementés, membres d’un Ordre ; l’assistant·e ne l’est pas","ok":true},{"t":"L’assistant·e est aussi réglementé·e, mais par un Ordre plus petit que les leurs","pourquoi":"L’assistant·e optométrique est justement l’exemple du cours d’intervenant non réglementé : pas d’Ordre."},{"t":"Seul l’ophtalmologiste est réglementé, parce qu’il est médecin","pourquoi":"Les trois O sont réglementés, chacun par son Ordre : médecins et chirurgiens, optométristes, opticiens."},{"t":"Rien sur le statut : ils diffèrent seulement par la durée des études et le salaire","pourquoi":"La différence maîtresse du module est le statut : « Réglementées vs Non Réglementées »."}],"expl":"Le tableau « Récapitulatif » range Opticien, Optométriste, Ophtalmologiste du côté réglementé, et l’assistant·e optométrique du côté non réglementé.","source":"M1_c, diapos 6–7, 24–25","mod":6},{"id":"r-002","fam":"r-prestataires","kc":"R2","k":"vf","q":"Un professionnel réglementé a besoin d’une supervision pour travailler, alors que l’assistant·e optométrique n’en a pas besoin.","v":false,"expl":"C’est l’inverse. À la ligne « Supervision nécessaire? », c’est ✘ pour le réglementé et ✅ pour l’intervenant non réglementé : la seule ligne inversée du tableau.","source":"M1_c, diapo 25","mod":6},{"id":"r-003","fam":"r-prestataires","kc":"R1","k":"qcm","q":"Selon le tableau du cours, un professionnel réglementé peut-il poser des actes médicaux ?","choix":[{"t":"Oui, mais seulement dans son champ de pratique","ok":true},{"t":"Oui, n’importe lequel, puisqu’il est membre d’un Ordre","pourquoi":"Le ✅ est conditionnel : « Dans son champ de pratique ». Sans cette limite, c’est faux."},{"t":"Non, seuls les médecins posent des actes","pourquoi":"Le tableau coche ✅ pour les trois O, pas seulement pour l’ophtalmologiste."},{"t":"Non, il doit toujours les déléguer à un assistant","pourquoi":"C’est le réglementé qui peut déléguer ; l’intervenant non réglementé, lui, ne pose pas d’actes médicaux (✘)."}],"expl":"La case du réglementé dit ✅, mais « Dans son champ de pratique » : le droit existe, et il est borné.","source":"M1_c, diapo 25","mod":6},{"id":"r-004","fam":"r-prestataires","kc":"R2","k":"qcm","q":"Tu travailles comme assistant·e optométrique. L’opticien veut te confier un acte réglementé. Qu’est-ce qui doit être vrai pour que tu puisses le faire ?","choix":[{"t":"Il te le délègue directement, et son Ordre permet cette délégation","ok":true},{"t":"Il te le délègue directement ; rien d’autre n’est nécessaire","pourquoi":"Il manque la 2e condition : « et ce seulement si l’ordre professionnel le permet »."},{"t":"Tu as réussi ton programme ; aucune délégation n’est requise","pourquoi":"Non réglementé·e, tu ne poses un acte réglementé que sur délégation directe, diplôme ou pas."},{"t":"Le patient est d’accord ; son consentement remplace la délégation","pourquoi":"Le consentement du patient ne remplace ni la délégation directe ni la permission de l’Ordre."}],"expl":"L’intervenant non réglementé ne peut pas faire d’actes réglementés « sans la délégation directe d’un professionnel réglementée et ce seulement si l’ordre professionnel le permet ». Deux conditions, pas une.","source":"M1_c, diapo 11","mod":6},{"id":"r-005","fam":"r-prestataires","kc":"R2","k":"vf","q":"Quand un opticien délègue un acte à un·e assistant·e optométrique, la responsabilité professionnelle passe à l’assistant·e.","v":false,"expl":"Déléguer l’acte ne délègue pas la responsabilité : « la responsabilité professionnelle demeure encadrée par le professionnel réglementé ».","source":"M1_c, diapos 22–23","mod":6},{"id":"r-006","fam":"r-prestataires","kc":"R3","k":"qcm","q":"Au bas d’une Rx, tu lis : « Dre. Lise Zhang, OD #17489 ». Que t’apprend OD ici ?","choix":[{"t":"Elle est optométriste","ok":true},{"t":"La Rx vaut pour l’œil droit (Oculus Dexter)","pourquoi":"Dans une signature, OD est le titre de la prescriptrice, pas la ligne de l’œil droit."},{"t":"Elle est ophtalmologiste","pourquoi":"L’ophtalmologiste est un « MD spécialisé » : il signe MD."},{"t":"Elle est opticienne en Ontario","pourquoi":"L’opticien porte RO en Ontario (OOD au Québec), pas OD. Et il ne signe pas de Rx."}],"expl":"Dans la signature, OD est le titre de l’optométriste (Ordre des optométristes de l’Ontario). En début de ligne, OD veut dire œil droit : c’est le contexte qui décide.","source":"M1_c, diapo 19 ; M3_e","mod":6},{"id":"r-007","fam":"r-prestataires","kc":"R3","k":"qcm","q":"Une opticienne qui exerce au Québec signe OOD. Que veut dire ce titre ?","choix":[{"t":"Opticien d’Ordonnance, le titre de l’opticien au Québec","ok":true},{"t":"Registered Optician, le titre de l’opticien en Ontario","pourquoi":"Ça, c’est RO. OOD est le titre au Québec."},{"t":"Un titre plus élevé que RO, obtenu après des études plus longues","pourquoi":"RO et OOD désignent la même profession dans deux provinces ; aucun n’est au-dessus de l’autre."},{"t":"Optométriste au Québec, l’équivalent de OD","pourquoi":"L’optométriste signe OD ; OOD est un titre d’opticien."}],"expl":"RO = Registered Optician, titre professionnel en Ontario ; OOD = « Opticien d’Ordonnance », titre professionnel au Québec. Même métier, deux provinces.","source":"M1_c, diapo 21","mod":6},{"id":"r-008","fam":"r-prestataires","kc":"R4","k":"qcm","q":"Ton cabinet travaille avec une ophtalmologiste. De quel Ordre doit-elle être membre pour pratiquer en Ontario ?","choix":[{"t":"L’Ordre des médecins et chirurgiens de l’Ontario","ok":true},{"t":"L’Ordre des optométristes de l’Ontario, comme tout docteur de l’œil","pourquoi":"Cet Ordre encadre l’optométriste (OD), pas l’ophtalmologiste."},{"t":"L’Ordre des ophtalmologistes de l’Ontario","pourquoi":"Cet Ordre n’existe pas dans le cours : l’ophtalmologiste est un MD spécialisé, donc un médecin."},{"t":"L’Ordre des opticiens de l’Ontario, qui encadre les 3 O","pourquoi":"Cet Ordre encadre l’opticien (RO). Chaque O a son propre Ordre."}],"expl":"Ophtalmologiste, MD spécialisé → « Ordre des médecins et chirurgiens de l’Ontario ». Des trois O, c’est le seul dont l’Ordre n’est pas propre à l’œil.","source":"M1_c, diapo 19","mod":6},{"id":"r-009","fam":"r-prestataires","kc":"R3","k":"qcm","q":"La prof demande « MD, OD, OOD, RO ? ». Lesquels de ces titres désignent la même profession ?","choix":[{"t":"OOD et RO : l’opticien, au Québec et en Ontario","ok":true},{"t":"MD et OD : tous deux désignent un docteur de l’œil","pourquoi":"MD = ophtalmologiste (MD spécialisé), OD = optométriste : deux professions, deux Ordres."},{"t":"OD et OOD : les deux désignent l’optométriste","pourquoi":"OD = optométriste, mais OOD = Opticien d’Ordonnance, l’opticien au Québec."},{"t":"Aucun : chaque titre est une profession différente","pourquoi":"RO (Ontario) et OOD (Québec) sont la même profession, l’opticien, dans deux provinces."}],"expl":"RO = Registered Optician (Ontario) et OOD = Opticien d’Ordonnance (Québec). MD = ophtalmologiste, OD = optométriste.","source":"M1_c, diapos 19, 21","mod":6},{"id":"r-010","fam":"r-prestataires","kc":"R5","k":"qcm","q":"Lequel de ces rôles revient à l’opticien (RO) ?","choix":[{"t":"Prendre en charge les orthèses visuelles du patient","ok":true},{"t":"Faire l’examen complet de la vue et signer la Rx","pourquoi":"L’examen complet de la vue revient à l’optométriste (OD) ou à l’ophtalmologiste (MD)."},{"t":"Faire une réfraction et délivrer l’ordonnance","pourquoi":"Sous délégation, l’opticien peut faire une réfraction, mais il « Ne peut pas dispenser l’ordonnance »."},{"t":"Prescrire certains médicaments au patient","pourquoi":"C’est l’optométriste : « En Ontario l’optométriste est autorisé à prescrire certains médicaments »."}],"expl":"Dans le parcours, l’étape des orthèses visuelles (lunetterie, contactologie, basse vision) est celle de l’opticien. La réfraction, il peut la faire sous délégation, comme « outil de résolution de problème ».","source":"M2_a","mod":6},{"id":"r-011","fam":"r-prestataires","kc":"R1","k":"vf","q":"Tant que tu n’es pas membre en règle de l’Ordre, tu peux travailler comme opticien·ne, à condition de ne pas porter le titre.","v":false,"expl":"La diapo interdit les deux : « Il est interdit de travailler ou d’employer le titre professionnel si vous n’êtes pas membre en règle de l’Ordre professionnelle. »","source":"M1_c, diapo 10","mod":6},{"id":"r-012","fam":"r-parcours","kc":"R6","k":"ordre","q":"Remets dans l’ordre les étapes du parcours patient.","etapes":["Réception","Pré-test","Examen de la vue","Orthèses visuelles","Livraison"],"expl":"Le parcours de la diapo de révision : « Réception - PréTest - Examen de la vue - Orthèses visuelles - Livraison ».","source":"M2_a ; Consolidation 16 nov.","mod":6},{"id":"r-013","fam":"r-parcours","kc":"R8","k":"qcm","q":"À quoi servent les pré-tests faits avant l’examen de la vue ?","choix":[{"t":"À obtenir des données de référence, point de départ de l’examen","ok":true},{"t":"À poser un premier diagnostic avant que l’optométriste arrive","pourquoi":"Les pré-tests recueillent des données ; l’examen et ses conclusions reviennent à l’OD ou au MD."},{"t":"À remplacer l’examen de la vue quand la Rx est récente","pourquoi":"Ils précèdent l’examen, ils ne le remplacent pas : ils lui servent de « point de départ »."},{"t":"À choisir la monture qui convient au visage","pourquoi":"Le choix « selon morphologie et besoin visuel » se fait à l’étape des orthèses visuelles."}],"expl":"Les pré-tests donnent des « données de référence qui serviront de point de départ à l’examen de la vue ». C’est le poste de l’assistant·e optométrique.","source":"M2_a","mod":6},{"id":"r-014","fam":"r-parcours","kc":"R7","k":"qcm","q":"Au bureau, qui fait habituellement les pré-tests ?","choix":[{"t":"L’assistant·e optométrique","ok":true},{"t":"L’optométriste, au début de l’examen","pourquoi":"L’optométriste fait l’examen ; les pré-tests le précèdent et reviennent à l’assistant·e."},{"t":"La réceptionniste, à l’accueil","pourquoi":"La réceptionniste accueille le patient et gère son dossier et l’horaire ; les tests ne sont pas à son poste."},{"t":"L’opticien, dans tous les cas","pourquoi":"L’opticien peut le faire, « mais plutôt rare »."}],"expl":"Le poste des pré-tests revient à l’assistant·e optométrique. « Ce rôle peut aussi être réalisé par Opticien mais plutôt rare. »","source":"M2_a","mod":6},{"id":"r-015","fam":"r-parcours","kc":"R9","k":"qcm","q":"« Composantes d’un examen de la vue? » Lesquelles ?","choix":[{"t":"La réfraction et la santé oculaire","ok":true},{"t":"La réfraction et les pré-tests","pourquoi":"Les pré-tests viennent avant l’examen ; ils n’en sont pas une composante."},{"t":"La santé oculaire et le choix des lunettes","pourquoi":"Le choix des lunettes se fait à l’étape des orthèses visuelles, après l’examen."},{"t":"La pression intraoculaire et les champs visuels","pourquoi":"Ce sont deux éléments de la santé oculaire ; il manque la réfraction."}],"expl":"L’OD ou le MD « Réalise un examen complet de la vue » en 2 composantes : la réfraction (ordonnance, besoins visuels) et la santé oculaire (segments antérieur et postérieur, pression intraoculaire, champs visuels, signes de maladies).","source":"M2_a","mod":6},{"id":"r-016","fam":"r-parcours","kc":"R9","k":"vf","q":"La pression intraoculaire et les champs visuels font partie de la réfraction.","v":false,"expl":"Ils font partie de la santé oculaire, avec le segment antérieur, le segment postérieur et la détection des signes de maladies. La réfraction, elle, donne l’ordonnance et les besoins visuels.","source":"M2_a","mod":6},{"id":"r-017","fam":"r-parcours","kc":"R10","k":"qcm","q":"« 3 différents types d’orthèses visuelles? » Lesquels ?","choix":[{"t":"Lunetterie, contactologie, dispositif à basse vision","ok":true},{"t":"Lunetterie, contactologie, chirurgie réfractive","pourquoi":"La chirurgie réfractive peut traiter une erreur de réfraction, mais ce n’est pas une orthèse de l’opticien. La 3e est la basse vision."},{"t":"Lunettes de loin, lunettes de près, lentilles cornéennes","pourquoi":"Loin et près sont deux sortes de lunettes, une seule famille : la lunetterie. Il manque la basse vision."},{"t":"Lunetterie ophtalmique, lunetterie non-ophtalmique, contactologie","pourquoi":"Ophtalmique et non-ophtalmique sont deux régimes de la lunetterie, pas deux orthèses. Il manque la basse vision."}],"expl":"Les orthèses visuelles de l’opticien : lunetterie, dispositif à basse vision, contactologie. En M3 : « Lunette », « Lentilles cornéenne (verre de contact) », « Appareil pour la basse vision ».","source":"M2_a ; M3_c","mod":6},{"id":"r-018","fam":"r-parcours","kc":"R7","k":"vf","q":"En lunetterie ophtalmique, l’assistant·e optométrique prend les mesures sous délégation ; c’est alors lui ou elle qui en est responsable.","v":false,"expl":"Faire la mesure n’est pas en être responsable : « Opticien ou Optométriste est responsable des mesures ophtalmiques. »","source":"M2_a","mod":6},{"id":"r-019","fam":"r-parcours","kc":"R11","k":"qcm","q":"Les lunettes de Mme Roy reviennent du laboratoire. Avant la livraison, qui peut faire la vérification finale ?","choix":[{"t":"Seulement l’opticien, ou le docteur","ok":true},{"t":"L’assistant·e optométrique sous délégation","pourquoi":"L’assistant·e peut livrer sous délégation, mais pas faire la vérification finale : « Seul Opticien (ou docteur) »."},{"t":"Le technicien de laboratoire","pourquoi":"Le technicien fait le taillage et le montage ; la sortie vers le patient est réservée à l’opticien (ou au docteur)."},{"t":"Tout membre de l’équipe formé","pourquoi":"Non : la vérification finale avant la livraison est réservée à l’opticien (ou au docteur)."}],"expl":"« Seul Opticien (ou docteur) peut réaliser la vérification final avant la livraison patient » (sic). Le laboratoire est ouvert à plusieurs ; la sortie vers le patient, non.","source":"M2_a ; M2_b","mod":6},{"id":"r-020","fam":"r-parcours","kc":"R11","k":"qcm","q":"Les lunettes sont vérifiées. Qui peut les remettre au patient, à l’étape de la livraison ?","choix":[{"t":"L’opticien, ou l’assistant·e optométrique sous délégation","ok":true},{"t":"L’opticien seulement, jamais l’assistant·e","pourquoi":"L’assistant·e peut livrer, sous délégation. C’est la vérification finale, avant, qui est réservée à l’opticien (ou au docteur)."},{"t":"L’assistant·e optométrique, seul·e, sans délégation","pourquoi":"À la livraison, l’assistant·e figure seulement « sous délégation »."},{"t":"La réceptionniste, à la fin du parcours","pourquoi":"La réceptionniste n’apparaît pas à la livraison : seulement l’opticien et l’assistant·e sous délégation."}],"expl":"Livraison : opticien, ou assistant·e optométrique sous délégation. La vérification finale, juste avant, reste à l’opticien (ou au docteur).","source":"M2_a","mod":6},{"id":"r-021","fam":"r-parcours","kc":"R7","k":"qcm","q":"Une patiente appelle pour prendre rendez-vous avec l’optométriste. À quelle étape du parcours est-elle, et qui s’en occupe ?","choix":[{"t":"Réception : réceptionniste ou assistant·e","ok":true},{"t":"Pré-test : assistant·e optométrique","pourquoi":"Le pré-test se fait au bureau, juste avant l’examen ; les rendez-vous relèvent de la réception."},{"t":"Examen de la vue : l’optométriste lui-même","pourquoi":"L’OD fait l’examen ; la « Gestion horaire » se fait à la réception."},{"t":"Réception : seulement l’opticien","pourquoi":"L’opticien peut le faire « mais plutôt rare » ; la réception revient d’abord à la réceptionniste ou à l’assistant·e."}],"expl":"La réception gère l’accueil, le dossier, le téléphone et l’horaire des rendez-vous. Elle est souvent « le premier contact du patient ».","source":"M2_a","mod":6},{"id":"r-022","fam":"r-ordonnance","kc":"R12","k":"qcm","q":"« Composantes d’une ordonnance ophtalmique? » À quelles 4 questions une Rx valide doit-elle répondre ?","choix":[{"t":"Pour qui ? Quand ? Par qui ? Quoi ?","ok":true},{"t":"Pour qui ? Quand ? Où ? Quoi ?","pourquoi":"Le lieu n’est pas une des 4 questions : il manque « PAR QUI? », le prescripteur."},{"t":"Pour qui ? Pourquoi ? Par qui ? Quoi ?","pourquoi":"La raison de la visite n’est pas exigée : il manque « QUAND? », les dates."},{"t":"Pour qui ? Par qui ? Quoi ? Pour quel œil ?","pourquoi":"L’œil (OD, OS) fait partie de la réfraction, le « Quoi? ». Il manque « QUAND? », les dates."}],"expl":"« Pour QUI? QUAND? PAR QUI? Quoi? » → identification du patient, dates, identification du prescripteur, la réfraction.","source":"M3_a ; M3_e","mod":6},{"id":"r-023","fam":"r-ordonnance","kc":"R12","k":"qcm","q":"Une Rx arrive sans signature ni nom du prescripteur. Quelle composante manque ?","choix":[{"t":"Par qui ? Le prescripteur","ok":true},{"t":"Pour qui ? L’identification du patient","pourquoi":"Le patient, c’est « Pour QUI? ». La signature et le nom désignent le prescripteur."},{"t":"Quand ? La date de l’examen","pourquoi":"Les dates répondent à « QUAND? ». Ici, c’est le prescripteur qui manque."},{"t":"Quoi ? La réfraction elle-même","pourquoi":"La réfraction (SPH, CYL, AXE, PRISME, ADD), c’est le « Quoi? ». Ici, il manque le prescripteur."}],"expl":"L’identification du prescripteur (optométriste ou ophtalmologiste) comprend sa signature et son nom professionnel. L’Ordre des opticiens l’exige pour qu’une Rx soit valide.","source":"M3_a ; M3_e","mod":6},{"id":"r-024","fam":"r-ordonnance","kc":"R13","k":"qcm","q":"Selon l’ACO, quelle durée une ordonnance ne devrait-elle pas dépasser ?","choix":[{"t":"2 ans","ok":true},{"t":"1 an","pourquoi":"Le cours ne donne pas 1 an : « ACO recommend que la durée n’excède pas 2 ans »."},{"t":"7 ans","pourquoi":"7 ans, c’est la durée minimale pendant laquelle l’opticien conserve la copie originale, pas la validité."},{"t":"10 ans","pourquoi":"Aucun 10 ans dans le cours : la recommandation de l’ACO est 2 ans."}],"expl":"« ACO recommend que la durée n’excède pas 2 ans ». Ne confonds pas avec les 7 ans de conservation de la copie originale.","source":"M3_e ; M3_a","mod":6},{"id":"r-025","fam":"r-ordonnance","kc":"R13","k":"vf","q":"Si la Rx porte une date d’expiration, l’opticien doit la respecter.","v":true,"expl":"Pour l’Ordre des opticiens, l’opticien ne livre une orthèse visuelle « que sur la base d’une ordonnance valide » ; si une date d’expiration ou une durée est fournie, il doit la respecter.","source":"M3_e","mod":6},{"id":"r-026","fam":"r-ordonnance","kc":"R14","k":"ordre","q":"Remets dans l’ordre les colonnes de la grille habituelle d’une ordonnance.","etapes":["SPH","CYL","AXE","PRISME","ADD"],"expl":"Grille habituelle : SPH, CYL, AXE, PRISME, ADD, avec les lignes OD et OS. « ADD se retrouve généralement à la fin », mais la grille « n’est pas une absolue » : lis toujours les en-têtes.","source":"M3_a ; M3_e","mod":6},{"id":"r-027","fam":"r-ordonnance","kc":"R14","k":"qcm","q":"Sur une Rx tu lis : OD -1.25 -0.50 x 090. Que représente 090 ?","choix":[{"t":"L’axe de l’astigmatisme, en degrés","ok":true},{"t":"Le cylindre : la puissance de l’astigmatisme","pourquoi":"Le cylindre, c’est -0.50, en dioptries. 090 suit le x : c’est l’axe."},{"t":"L’addition prescrite pour la vision de près","pourquoi":"L’ADD s’écrit en positif avec deux décimales (+X.XX), pas en degrés."},{"t":"La sphère : la force principale de la Rx","pourquoi":"La sphère, c’est -1.25, la « Force Principale de l’ordonnance »."}],"expl":"AXE : « Le degré/orientation de l’astigmatisme ; se mesure en degrés de 1 à 180 ». On l’écrit avec trois chiffres : x 090.","source":"M3_a ; M3_e","mod":6},{"id":"r-028","fam":"r-ordonnance","kc":"R15","k":"qcm","q":"Une Rx arrive avec un cylindre positif aux deux yeux. Selon le cours, quel prescripteur écrit dans ce format ?","choix":[{"t":"L’ophtalmologiste (MD)","ok":true},{"t":"L’optométriste (OD)","pourquoi":"« Format Cyl négatif = OD et RO » : l’optométriste écrit en cylindre négatif."},{"t":"L’opticien (RO)","pourquoi":"L’opticien est du côté du cylindre négatif, avec l’OD."},{"t":"N’importe lequel : le signe du cylindre ne dépend que du patient","pourquoi":"Le format dépend du prescripteur : « Format Cyl positif = MD (ophtalmologiste) »."}],"expl":"« Format Cyl négatif = OD et RO » ; « Format Cyl positif = MD (ophtalmologiste) ». Le format positif est légitime, mais on analyse toujours en cylindre négatif.","source":"M3_a ; M3_g","mod":6},{"id":"r-029","fam":"r-ordonnance","kc":"R17","k":"qcm","q":"Sur une Rx tu lis une seule ligne : OU -2.00. Qu’est-ce que ça veut dire ?","choix":[{"t":"Les deux yeux ont la même Rx : -2.00","ok":true},{"t":"Seul l’œil gauche a une Rx de -2.00","pourquoi":"L’œil gauche, c’est OS (Oculus Sinister). OU, ce sont les deux yeux."},{"t":"Seul l’œil droit a une Rx de -2.00","pourquoi":"L’œil droit, c’est OD (Oculus Dexter). OU, ce sont les deux yeux."},{"t":"L’œil droit a -2.00 et l’œil gauche n’a rien","pourquoi":"OU couvre les deux yeux, « lorsque 2 yeux ont même rx »."}],"expl":"OU = Oculi Uniter (ou Oculus Uterque) : les deux yeux, « lorsque 2 yeux ont même rx ». OD = œil droit, OS = œil gauche.","source":"M3_a ; M3_e","mod":6},{"id":"r-030","fam":"r-ordonnance","kc":"R16","k":"qcm","q":"Quelles sont les quatre catégories principales pour classer une ordonnance ?","choix":[{"t":"Myope ou hypermétrope · sphérique ou torique · presbyte · prismatique","ok":true},{"t":"Myope ou hypermétrope · sphérique ou torique · presbyte · emmétrope","pourquoi":"Emmétrope est une issue de la sphère, avec myope et hypermétrope. La 4e catégorie est prismatique."},{"t":"Myope ou hypermétrope · SV ou multifocal · presbyte · prismatique","pourquoi":"SV ou multifocal, c’est le type de correction. La 2e catégorie est sphérique ou torique."},{"t":"Myope ou astigmate · sphérique ou torique · presbyte · prismatique","pourquoi":"Astigmate va avec torique. La 1re paire se lit sur la sphère : myope ou hypermétrope."}],"expl":"« Quatre Catégorie Principale » : myope ou hypermétrope, sphérique ou torique, presbyte, prismatique. Deux paires où l’on choisit, et deux étiquettes qui s’ajoutent.","source":"M3_e ; Consolidation 16 nov.","mod":6},{"id":"r-031","fam":"r-ametropies","kc":"R18","k":"qcm","q":"Sur une Rx tu lis : OD +1.50 / OS +0.75, sans cylindre. Comment classes-tu ce patient ?","choix":[{"t":"Hypermétrope : la sphère est positive","ok":true},{"t":"Myope : la sphère est positive","pourquoi":"Signes inversés : le myope a un « signe négatif devant la sphère »."},{"t":"Emmétrope : les valeurs sont faibles","pourquoi":"Emmétrope, c’est Plano sans cylindre : aucune correction. Ici la sphère est +."},{"t":"Presbyte : il faut du + pour voir de près","pourquoi":"La presbytie se lit dans une ADD, pas dans le signe de la sphère."}],"expl":"Force POSITIVE → HYPERMÉTROPE ; force NÉGATIVE → MYOPE. L’hypermétropie se repère par un « signe positif devant la sphère ».","source":"M3_a ; M3_d","mod":6},{"id":"r-032","fam":"r-ametropies","kc":"R18","k":"vf","q":"Sur la Rx OD -1.00 +2.50 x 180, la sphère négative suffit pour dire que l’œil est myope.","v":false,"expl":"La sphère dit myope (-) ou hypermétrope (+) « lorsque le cylindre est négatif ou absent ». Ici le cylindre est positif : « n’oubliez pas d’analyser avec cyl négatif ».","source":"M3_e ; M3_g ; Consolidation 16 nov.","mod":6},{"id":"r-033","fam":"r-ametropies","kc":"R19","k":"qcm","q":"Quand l’œil est au repos, les rayons de lumière tombent directement sur la rétine, au fovéa. Cet œil est :","choix":[{"t":"Emmétrope","ok":true},{"t":"Myope","pourquoi":"Chez le myope, l’image d’un objet éloigné se forme en avant de la rétine."},{"t":"Hypermétrope","pourquoi":"Chez l’hypermétrope, l’image se forme en arrière de la rétine."},{"t":"Presbyte","pourquoi":"La presbytie est une perte d’accommodation qui vient avec l’âge ; elle ne dit pas où tombe l’image au repos."}],"expl":"Emmétropie : « Rayons de lumière tombent directement sur la rétine au fovéa » quand l’œil est au repos. Aucune correction requise.","source":"M3_d","mod":6},{"id":"r-034","fam":"r-ametropies","kc":"R19","k":"vf","q":"Un patient emmétrope a besoin d’une ordonnance ophtalmique.","v":false,"expl":"« Px Emmétrope ne requiert pas d’ordonnance ophtalmique ». C’est le patient amétrope qui en requiert une.","source":"M3_c","mod":6},{"id":"r-035","fam":"r-ametropies","kc":"R20","k":"qcm","q":"L’œil d’un patient myope est plus long que la normale. De quelle myopie s’agit-il ?","choix":[{"t":"Myopie axiale","ok":true},{"t":"Myopie réfractive","pourquoi":"Réfractive = « Oeil trop fort (trop convergent) ». La longueur, c’est l’axiale."},{"t":"Hypermétropie axiale","pourquoi":"L’hypermétropie axiale, c’est l’œil trop court. Un œil trop long est myope."},{"t":"Un astigmatisme","pourquoi":"L’astigmatisme vient d’une courbure irrégulière de la cornée, pas de la longueur de l’œil."}],"expl":"« Myopie AXIALE = Oeil trop long » ; « Myopie RÉFRACTIVE = Oeil trop fort (trop convergent) ». Axiale parle de longueur, réfractive de puissance.","source":"M3_c ; M3_d","mod":6},{"id":"r-036","fam":"r-ametropies","kc":"R21","k":"qcm","q":"Un œil hypermétrope a une longueur normale, mais il n’est pas assez convergent. Comment nomme-t-on ce cas ?","choix":[{"t":"Hypermétropie réfractive : œil trop faible","ok":true},{"t":"Hypermétropie axiale : l’œil est trop court","pourquoi":"L’axiale parle de longueur ; ici la longueur est normale."},{"t":"Myopie réfractive : l’œil est trop fort","pourquoi":"Trop fort, c’est la myopie réfractive. Pas assez convergent, c’est trop faible : hypermétropie."},{"t":"Hypermétropie axiale : l’œil est trop faible","pourquoi":"Termes mélangés : axiale = trop court ; trop faible va avec réfractive."}],"expl":"« Hypermétropie AXIALE = Oeil trop court » ; « Hypermétropie RÉFRACTIVE = Oeil trop faible ».","source":"M3_c ; M3_d","mod":6},{"id":"r-037","fam":"r-ametropies","kc":"R21","k":"vf","q":"L’hypermétropie axiale veut dire que l’œil est trop fort.","v":false,"expl":"Trop fort, c’est la myopie réfractive. « Hypermétropie AXIALE = Oeil trop court » ; la réfractive, c’est l’œil trop faible.","source":"M3_c ; M3_d","mod":6},{"id":"r-038","fam":"r-ametropies","kc":"R23","k":"qcm","q":"Chez un myope dont l’œil est au repos, où se forme l’image d’un objet éloigné ?","choix":[{"t":"En avant de la rétine","ok":true},{"t":"En arrière de la rétine","pourquoi":"C’est l’hypermétrope : l’image se forme « en arrière de la rétine »."},{"t":"Directement sur la rétine","pourquoi":"Sur la rétine, au fovéa : c’est l’œil emmétrope, sans erreur de réfraction."},{"t":"À deux endroits, devant et derrière","pourquoi":"Deux points focaux, c’est un œil astigmate (Rx torique), pas une myopie simple."}],"expl":"Myopie : l’image d’un objet éloigné se forme « en avant de la rétine ». La lentille négative déplace ce point de focalisation vers la rétine.","source":"M3_d ; M3_a","mod":6},{"id":"r-039","fam":"r-ametropies","kc":"R22","k":"qcm","q":"Une patiente de 47 ans a une Rx avec Add +1.50. Que t’indique cette ADD ?","choix":[{"t":"Une presbytie (perte d’accommodation)","ok":true},{"t":"Une hypermétropie, puisque l’ADD est positive","pourquoi":"L’hypermétropie se lit sur le signe de la sphère ; l’ADD signale la presbytie."},{"t":"Un prisme à ajouter au verre","pourquoi":"Le prisme a sa propre colonne, avec une base (BI, BE…). L’ADD est une puissance pour le près."},{"t":"Une myopie : elle voit mal de près","pourquoi":"Le myope voit mal au loin : la myopie « N’affecte que la vision à distance »."}],"expl":"La presbytie « se repère sur l’ordonnance par la présence d’une Addition en vision de près ». Elle débute le plus souvent entre 40 et 45 ans.","source":"M3_d ; M3_e","mod":6},{"id":"r-040","fam":"r-ametropies","kc":"R22","k":"vf","q":"Toute ADD sur une Rx veut dire que le patient est presbyte.","v":false,"expl":"Exception du cours : chez un enfant, l’ADD « n’est pas de la presbytie » ; elle sert à soutenir la mise au point de près, pour « prévenir strabisme accomodatif » (sic).","source":"M3_a ; M3_b","mod":6},{"id":"r-041","fam":"r-prismes","kc":"R24","k":"qcm","q":"Sur une Rx tu lis : OD -4.00 2△BI. Comment nommes-tu cette ordonnance ?","choix":[{"t":"Myope, sphérique et prismatique","ok":true},{"t":"Myope, torique et prismatique","pourquoi":"Pas de CYL ni d’AXE : la Rx est sphérique. Le prisme ne rend pas une Rx torique."},{"t":"Myope et presbyte","pourquoi":"Pas d’ADD, donc pas de presbytie. 2△BI est un prisme : prismatique."},{"t":"Hypermétrope, sphérique et prismatique","pourquoi":"La sphère est négative : myope."}],"expl":"C’est l’exemple du cours : « Myope, sphérique et prismatique ». Le prisme « peut s’ajouter à tous les types » d’ordonnance.","source":"M3_e","mod":6},{"id":"r-042","fam":"r-prismes","kc":"R24","k":"qcm","q":"Dans la colonne PRISME d’une Rx, tu lis seulement 2△. Que manque-t-il ?","choix":[{"t":"La direction de la base (BI, BE, BH, BB)","ok":true},{"t":"Le signe + ou - devant la force du prisme","pourquoi":"Pour un prisme : « Donc +/- non applicable »."},{"t":"L’axe du prisme, entre 001 et 180","pourquoi":"L’axe accompagne le cylindre, pas le prisme. Le prisme se note avec sa base."},{"t":"Rien : la force 2△ suffit à elle seule","pourquoi":"Le prisme « doit inclure la direction de la base »."}],"expl":"PRISME : « correction prismatique ; déplacement de l’image à travers le verre ; doit inclure la direction de la base ». On écrit par exemple 2△BI.","source":"M3_a ; M3_e","mod":6},{"id":"r-043","fam":"r-prismes","kc":"R25","k":"qcm","q":"Sur une Rx écrite en anglais, tu lis 3△BO. Comment l’écris-tu en français ?","choix":[{"t":"3△BE : Base Externe (Base Temporal)","ok":true},{"t":"3△BI : Base Interne (Base Nasal)","pourquoi":"BI traduit Base IN, vers le nez. BO veut dire Base OUT."},{"t":"3△BB : Base en Bas (Base Inférieure)","pourquoi":"BB traduit Base DOWN (BD). BO veut dire Base OUT."},{"t":"3△BH : Base en Haut (Base Supérieure)","pourquoi":"BH traduit Base UP (BU). BO veut dire Base OUT."}],"expl":"BO = Base OUT ; en français, BE = Base Externe (Base Temporal). Seule BI garde ses lettres : Base IN = Base Interne.","source":"M3_a","mod":6},{"id":"r-044","fam":"r-prismes","kc":"R25","k":"qcm","q":"Une Rx indique 1△BH. Vers où est la base, et comment l’écrit-on en anglais ?","choix":[{"t":"Vers le haut : Base UP (BU)","ok":true},{"t":"Vers le bas : Base DOWN (BD)","pourquoi":"En bas, c’est BB (Base en Bas). BH = Base en Haut."},{"t":"Vers le côté du nez : Base IN (BI)","pourquoi":"Vers le nez, c’est BI (Base Interne, Base Nasal)."},{"t":"Vers la tempe : Base OUT (BO)","pourquoi":"Vers la tempe, c’est BE (Base Externe, Base Temporal)."}],"expl":"BH = Base en Haut (Base Supérieure) = BU, Base UP. À l’opposé : BB = Base en Bas (Base Inférieure) = BD, Base DOWN.","source":"M3_a","mod":6},{"id":"r-045","fam":"r-prismes","kc":"R26","k":"vf","q":"Un prisme s’écrit avec un signe, par exemple +2△BI.","v":false,"expl":"Le prisme se note par sa force et la direction de sa base : « Donc +/- non applicable ». On écrit 2△BI.","source":"M3_a","mod":6},{"id":"r-046","fam":"r-prismes","kc":"R27","k":"vf","q":"Un prisme peut apparaître sur n’importe quelle ordonnance, même si l’analyse du prisme n’est pas au programme du cours.","v":true,"expl":"« l’analyse de prisme ne sera pas abordé » (sic), mais « toute ordonnance peut inclure une force prismatique ». Tu dois le reconnaître, nommer sa base et ajouter l’étiquette prismatique.","source":"M3_b ; M3_e","mod":6},{"id":"b-001","fam":"b-croix-montre","kc":"B7.1","mod":7,"k":"qcm","q":"La Rx dit : OD -1.50 -0.50 x 180 1△BU Add +2.00. Qu’est-ce qui va sur la croix optique ?","choix":[{"t":"-1.50 sur 180 et -2.00 sur 090, rien d’autre","ok":true},{"t":"-1.50 sur 180, -2.00 sur 090, et l’ADD +2.00","pourquoi":"L’addition reste hors de la croix : « Exclus (sic) Pouvoir d’Addition »."},{"t":"-1.50 sur 180, -2.00 sur 090, et le prisme 1△BU","pourquoi":"Le prisme reste hors de la croix : « Exclus (sic) Prisme »."},{"t":"-1.50 sur 090 et -2.00 sur 180, rien d’autre","pourquoi":"Bras inversés : la sphère va sur le méridien de l’axe, ici 180."}],"expl":"La croix « représente les puissance (sic) de l’ordonnance en vision de loin (VL) » : SPH, CYL, AXE. Pour un prisme ou une addition : « RIEN! ».","source":"7.1-d3, d5 ; 7.3-d37–d38"},{"id":"b-002","fam":"b-croix-montre","kc":"B7.1","mod":7,"k":"vf","q":"Si la Rx a une addition, tu l’écris sur la croix, à côté de la sphère.","v":false,"expl":"Prisme ou addition dans la Rx ? Réponse du cours : « RIEN! ». « La croix optique sert à partager les information (sic) SPH/CYL/AXE ».","source":"7.3-d37–d38"},{"id":"b-003","fam":"b-croix-montre","kc":"B7.1","mod":7,"k":"vf","q":"La croix optique représente la Rx en vision de loin.","v":true,"expl":"Elle « représente les puissance (sic) de l’ordonnance en vision de loin (VL) ». Le près, avec l’addition, n’y est pas.","source":"7.1-d3, d5"},{"id":"b-004","fam":"b-croix-montre","kc":"B7.2","mod":7,"k":"qcm","q":"On te montre seulement une croix : +2.50 sur 180 et +2.50 sur 090. De quel œil s’agit-il ?","choix":[{"t":"On ne peut pas le savoir avec la croix seule","ok":true},{"t":"L’OD, parce que la croix est à gauche de la page","pourquoi":"La place sur la page ne dit rien : c’est la Rx qui dit l’œil."},{"t":"L’OS, parce que la valeur est positive","pourquoi":"Le signe dit l’amétropie (ici hypermétrope), jamais l’œil."},{"t":"L’OD, parce qu’un méridien est à 180","pourquoi":"Les méridiens ne disent pas l’œil : les deux verres ont les mêmes repères."}],"expl":"« OD ou OS ??? » → « Inconnu dans ce scénario ». La croix ne précise pas l’œil : c’est la Rx qui le dit.","source":"7.1-d24, d27–d32"},{"id":"b-005","fam":"b-croix-montre","kc":"B7.2","mod":7,"k":"vf","q":"La croix optique précise toujours s’il s’agit de l’OD ou de l’OS.","v":false,"expl":"« ATTN: LA CROIX OPTIQUE NE PRÉCISE PAS OD/OS, CECI EST DICTÉ PAR RX ».","source":"7.1-d24"},{"id":"b-006","fam":"b-croix-montre","kc":"B7.4","mod":7,"k":"qcm","q":"Sur un verre vu de face, vers où monte le méridien 135 ?","choix":[{"t":"Vers le haut à gauche","ok":true},{"t":"Vers le haut à droite","pourquoi":"Vers le haut à droite, c’est 045. 135 penche du côté de 180, à gauche."},{"t":"Tout droit vers le haut","pourquoi":"Tout droit vers le haut, c’est 090 ; 135 est entre 090 et 180."},{"t":"Vers la gauche, à l’horizontale","pourquoi":"L’horizontale, c’est 180 ; 135 est à mi-chemin entre 180 et 090."}],"expl":"Repères vus de face : 180 à gauche, 090 en haut, 0 à droite ; 135 en haut à gauche, 045 en haut à droite.","source":"7.1-d8–d10, d23"},{"id":"b-007","fam":"b-croix-montre","kc":"B7.4","mod":7,"k":"vf","q":"Sur un verre vu de face, 180 est à gauche et 090 en haut.","v":true,"expl":"Repères du cours : 180 à gauche, 090 en haut, 0 à droite, les mêmes sur les deux verres.","source":"7.1-d8–d10"},{"id":"b-008","fam":"b-croix-montre","kc":"B7.5","mod":7,"k":"qcm","q":"Rx : OD -3.50 · OS -2.75. Combien de croix dessines-tu, et que portent-elles ?","choix":[{"t":"Deux croix : -3.50 sur les deux bras de l’OD, -2.75 sur ceux de l’OS","ok":true},{"t":"Une croix : -3.50 sur 180 et -2.75 sur 090","pourquoi":"Une croix ne mélange pas deux yeux : une croix par œil."},{"t":"Deux croix : -3.50 sur 180 et -2.75 sur 090, sur chacune","pourquoi":"Chaque croix ne porte que les valeurs de son œil."},{"t":"Deux croix : -3.50 sur un seul bras de l’OD, -2.75 sur un seul bras de l’OS","pourquoi":"Rx sphérique : même force sur les deux méridiens de chaque croix."}],"expl":"Une croix par œil. Rx sphérique : « Pouvoir Sphérique = même force dans tous les méridiens de la croix ».","source":"7.1-d22, d33–d37"},{"id":"b-009","fam":"b-croix-montre","kc":"B7.5","mod":7,"k":"vf","q":"Sur des lunettes dessinées vues de face, la croix de l’OD est à gauche.","v":true,"expl":"On regarde les verres en face du patient : l’OD est à gauche, l’OS à droite.","source":"7.1-d34"},{"id":"b-010","fam":"b-croix-construire","kc":"B7.3","mod":7,"k":"qcm","q":"Rx -2.00 DS. Que porte sa croix ?","choix":[{"t":"-2.00 sur les deux méridiens","ok":true},{"t":"-2.00 sur 180 et Plano sur 090","pourquoi":"Sans cylindre, aucun méridien ne change : même force partout."},{"t":"-2.00 sur 180 seulement","pourquoi":"Une valeur sur un seul bras ne suffit pas : les deux méridiens portent -2.00."},{"t":"-1.00 sur chaque méridien","pourquoi":"On ne partage pas la sphère : chaque méridien porte toute la force, -2.00."}],"expl":"« Pouvoir Sphérique = même force dans tous les méridiens de la croix ». Une seule force, un seul foyer.","source":"7.1-d22–d23, d50"},{"id":"b-011","fam":"b-croix-construire","kc":"B7.3","mod":7,"k":"vf","q":"Une Rx avec un cylindre donne une croix torique : deux méridiens, deux forces.","v":true,"expl":"« Croix Optique TORIQUE = Rx avec astigmatisme = 2 méridiens = 2 forces ». Sans cylindre, les deux bras sont égaux.","source":"7.2-d32 ; 7.1-d22"},{"id":"b-012","fam":"b-croix-construire","kc":"B7.6","mod":7,"k":"qcm","q":"OS -2.00 -0.75 x 090. Sur quel méridien poses-tu -2.00 ?","choix":[{"t":"Sur 090, le méridien de l’axe","ok":true},{"t":"Sur 180, comme toujours pour la sphère","pourquoi":"La sphère ne va pas toujours sur 180 : elle suit l’axe, ici 090."},{"t":"Sur les deux méridiens","pourquoi":"Avec un cylindre, les méridiens diffèrent : -2.00 sur l’axe, -2.75 sur l’autre."},{"t":"Sur 180, parce que 090 porte le cylindre","pourquoi":"C’est l’inverse : l’axe est le méridien où le cylindre n’a pas de puissance."}],"expl":"① La sphère va sur l’axe : à l’OD x 180, sur 180 ; à l’OS x 090, sur 090. « L’axe du cylinder (sic) est la position ou (sic) il n’y a pas de puissance » (TO).","source":"7.2-d11, d23–d24 ; TO 5.1-d11"},{"id":"b-013","fam":"b-croix-construire","kc":"B7.6","mod":7,"k":"vf","q":"Le méridien de l’axe est celui où le cylindre agit le plus.","v":false,"expl":"C’est l’inverse : « L’axe du cylinder (sic) est la position ou (sic) il n’y a pas de puissance ». Le méridien de l’axe porte donc la sphère seule.","source":"TO 5.1-d11 ; 7.2-d16–d17"},{"id":"b-014","fam":"b-croix-construire","kc":"B7.6","mod":7,"k":"qcm","q":"-1.25 -0.50 x 180 et -1.25 -0.50 x 090 : qu’est-ce qui change entre leurs deux croix ?","choix":[{"t":"Le bras de -1.25 : 180 pour la 1re, 090 pour la 2e","ok":true},{"t":"Rien : -1.25 va toujours sur 180, quel que soit l’axe","pourquoi":"La sphère suit l’axe : x 090 la met sur 090."},{"t":"Les valeurs : la 2e croix porte -0.75 au lieu de -1.75","pourquoi":"Les valeurs restent -1.25 et -1.75 ; seuls les bras changent."},{"t":"Le signe : la 2e croix porte +1.25 et +1.75","pourquoi":"Changer l’axe ne change aucun signe, seulement le bras de chaque valeur."}],"expl":"Même sphère, même cylindre : -1.25 et -1.75 dans les deux cas. ① met -1.25 sur l’axe : c’est l’axe qui choisit le bras.","source":"7.2-d11, d16–d17, d23"},{"id":"b-015","fam":"b-croix-construire","kc":"B7.6","mod":7,"k":"qcm","q":"Tu fais la croix de +1.50 -0.50 x 090. Quelle croix est juste ?","choix":[{"t":"+1.50 sur 090 et +1.00 sur 180","ok":true},{"t":"+1.50 sur 180 et +1.00 sur 090","pourquoi":"Sphère posée sur 180 par habitude : l’axe est 090, la sphère va sur 090."},{"t":"+1.50 sur 090 et +2.00 sur 180","pourquoi":"Signe du cylindre perdu : +1.50 + (-0.50) = +1.00, pas +2.00."},{"t":"+1.50 sur 090 et -0.50 sur 180","pourquoi":"Cylindre seul sur le 2e méridien : il faut SPH + CYL, soit +1.00."}],"expl":"Axe 090 : ① +1.50 sur 090 ; ② +1.50 + (-0.50) = +1.00 ; ③ 090 + 090 = 180.","source":"7.2-d16–d24"},{"id":"b-016","fam":"b-croix-construire","kc":"B7.7","mod":7,"k":"qcm","q":"OD -1.00 -0.50 x 180. Que porte le méridien 090 ?","choix":[{"t":"-1.50","ok":true},{"t":"-0.50","pourquoi":"Cylindre seul : le 2e méridien porte SPH + CYL, pas le CYL."},{"t":"-1.00","pourquoi":"Sphère recopiée partout : avec un cylindre, le 2e méridien diffère de la sphère."},{"t":"+1.50","pourquoi":"Signe perdu : deux négatifs s’additionnent en un négatif plus grand."}],"expl":"« SPH + CYL = Force du 2e méridien » : « (-1.00) + (-0.50) = -1.50 ».","source":"7.2-d18–d21"},{"id":"b-017","fam":"b-croix-construire","kc":"B7.7","mod":7,"k":"vf","q":"Sur une croix torique, le 2e méridien porte seulement la valeur du cylindre.","v":false,"expl":"Il porte la somme : « SPH + CYL = Force du 2e méridien ». Pour -5.00 -1.50 x 160 : -6.50, pas -1.50.","source":"7.2-d18 ; 7.3-d21–d22"},{"id":"b-018","fam":"b-croix-construire","kc":"B7.8","mod":7,"k":"qcm","q":"+2.00 -2.00 x 135 : que porte le méridien 045 ?","choix":[{"t":"Plano","ok":true},{"t":"-4.00","pourquoi":"Signes contraires : depuis +2.00, on recule de 2.00 et on arrive à zéro."},{"t":"+4.00","pourquoi":"Tu as additionné les valeurs sans regarder le signe du cylindre."},{"t":"-2.00","pourquoi":"Cylindre seul : le 2e méridien porte SPH + CYL, soit zéro."}],"expl":"+2.00 + (-2.00) = zéro, qui s’écrit Plano : « Plano = Emmetrope (sic) = Sur la rétine ».","source":"7.3-d30–d32"},{"id":"b-019","fam":"b-croix-construire","kc":"B7.8","mod":7,"k":"qcm","q":"Croix de +0.25 -0.75 x 090. Que porte le méridien 180 ?","choix":[{"t":"-0.50","ok":true},{"t":"+0.50","pourquoi":"Signe perdu en passant zéro : +0.25 recule de 0.75 et passe sous zéro."},{"t":"-1.00","pourquoi":"Tu as additionné les valeurs (0.25 + 0.75) : les signes sont contraires."},{"t":"Plano","pourquoi":"On dépasse zéro : +0.25 - 0.75 = -0.50."}],"expl":"② +0.25 + (-0.75) = -0.50 sur 180. Le zéro se traverse : un méridien positif, l’autre négatif.","source":"7.2-d30 (n° 6)"},{"id":"b-020","fam":"b-croix-construire","kc":"B7.9","mod":7,"k":"vf","q":"Avec un cylindre négatif, le 2e méridien est toujours plus négatif (ou moins positif) que la sphère.","v":true,"expl":"② ajoute un nombre négatif à la sphère : le 2e méridien descend toujours. Si ton 2e méridien est au-dessus de la sphère, refais le calcul.","source":"déduit de 7.2-d18 ; UA1"},{"id":"b-021","fam":"b-croix-construire","kc":"B7.9","mod":7,"k":"qcm","q":"Pour -2.00 -1.25 x 180, un camarade écrit -2.00 sur 180 et -0.75 sur 090. Quel contrôle montre l’erreur ?","choix":[{"t":"Le 2e méridien devrait être sous la sphère","ok":true},{"t":"La sphère devrait être sur le méridien 090","pourquoi":"L’axe est 180 : la sphère est bien sur 180. L’erreur est ailleurs."},{"t":"Les deux méridiens devraient être égaux","pourquoi":"Égaux, ce serait une Rx sphérique ; ici il y a un cylindre."},{"t":"Le 2e méridien devrait être positif","pourquoi":"Un cylindre négatif fait descendre : le 2e méridien reste négatif ici."}],"expl":"-0.75 est au-dessus de -2.00 : impossible avec un CYL négatif. (-2.00) + (-1.25) = -3.25 ; il a soustrait les valeurs.","source":"déduit de 7.2-d18 ; UA1"},{"id":"b-022","fam":"b-croix-construire","kc":"B7.10","mod":7,"k":"qcm","q":"-5.00 -1.50 x 160 : sur quel méridien poses-tu -6.50 ?","choix":[{"t":"070","ok":true},{"t":"250","pourquoi":"160 + 090 = 250 sort de 001–180 : il faut soustraire, 160 - 090."},{"t":"160","pourquoi":"160 est l’axe : il porte la sphère. Le 2e méridien est à 90° de lui."},{"t":"180","pourquoi":"Le 2e méridien n’est pas toujours 180 : il est à angle droit de l’axe."}],"expl":"③ « +/- 090 (Angle Droit) » : « 160 - 090 = 070 ». On choisit le calcul qui reste entre 001 et 180.","source":"7.3-d15, d23–d26"},{"id":"b-023","fam":"b-croix-construire","kc":"B7.10","mod":7,"k":"qcm","q":"Rx à axe 090. Quel est le 2e méridien ?","choix":[{"t":"180","ok":true},{"t":"000","pourquoi":"090 - 090 = 0, qui n’est pas un axe : additionne, 090 + 090 = 180."},{"t":"090","pourquoi":"C’est l’axe lui-même : le 2e méridien est à 90° de lui."},{"t":"045","pourquoi":"45° n’est pas un angle droit : on ajoute ou on retire 090."}],"expl":"Les deux méridiens sont à angle droit : 090 + 090 = 180. Zéro, « qui n'est pas un axe d'ordonnance » (MP4).","source":"7.3-d15 ; MP4 04:02–05:36"},{"id":"b-024","fam":"b-croix-construire","kc":"B7.11","mod":7,"k":"qcm","q":"Quelle est la croix de -3.25 -2.25 x 100 ?","choix":[{"t":"-3.25 sur 100 et -5.50 sur 010","ok":true},{"t":"-3.25 sur 100 et -5.50 sur 190","pourquoi":"190 dépasse 180 : 100 - 090 = 010."},{"t":"-5.50 sur 100 et -3.25 sur 010","pourquoi":"Bras inversés : la sphère, -3.25, va sur l’axe 100."},{"t":"-3.25 sur 100 et -1.00 sur 010","pourquoi":"Valeurs soustraites : (-3.25) + (-2.25) = -5.50."}],"expl":"① -3.25 sur l’axe 100 ; ② (-3.25) + (-2.25) = -5.50 ; ③ 100 - 090 = 010.","source":"7.3-d36"},{"id":"b-025","fam":"b-croix-construire","kc":"B7.11","mod":7,"k":"ordre","q":"Remets dans l’ordre les étapes pour faire la croix d’une Rx torique.","etapes":["Pose la sphère sur le méridien de l’axe","Calcule SPH + CYL","Trouve le 2e méridien : axe ± 090, entre 001 et 180","Écris chaque valeur au bout du bras de son méridien","Vérifie : avec un CYL négatif, le 2e méridien est plus bas que la sphère"],"expl":"L’ordre du cours pour -5.00 -1.50 x 160 : ① -5.00 sur 160, ② -6.50, ③ 070, puis chaque valeur sur son bras.","source":"7.3-d18–d28"},{"id":"b-026","fam":"b-croix-oblique","kc":"B7.12","mod":7,"k":"qcm","q":"En option A, comment dessines-tu la croix de -5.00 -1.50 x 160 ?","choix":[{"t":"Tu traces les vrais méridiens : à 160 et à 070","ok":true},{"t":"Tu gardes une croix droite et tu étiquettes les bras","pourquoi":"Ça, c’est l’option B. L’option A trace les méridiens réels, en oblique."},{"t":"Tu traces une seule ligne, celle de l’axe 160","pourquoi":"Il faut deux méridiens : l’axe 160 et le 2e méridien 070."},{"t":"Tu traces une ligne à 160 et une à 250 (160 + 090)","pourquoi":"250 n’existe pas : 160 - 090 = 070."}],"expl":"Option A : les méridiens réels. La ligne 160 est presque horizontale, la ligne 070 presque verticale, à angle droit.","source":"7.3-d15, d28"},{"id":"b-027","fam":"b-croix-oblique","kc":"B7.12","mod":7,"k":"qcm","q":"En option A, la ligne 160 est presque horizontale. Verre vu de face, de quel côté monte-t-elle ?","choix":[{"t":"Vers la gauche : 160 en haut à gauche","ok":true},{"t":"Vers la droite : 160 en haut à droite","pourquoi":"Les lignes qui montent vers la droite sont entre 0 et 090, comme 045."},{"t":"Elle ne monte pas : elle est horizontale","pourquoi":"L’horizontale exacte, c’est 180 ; 160 penche de 20°."},{"t":"Elle monte presque à la verticale","pourquoi":"Presque verticale, c’est 070, le 2e méridien."}],"expl":"Vu de face : 180 à gauche, 090 en haut. 160 est à 20° de 180, en haut à gauche (« 160 degrees » sur 7.3-d28).","source":"7.3-d28 ; 7.1-d23"},{"id":"b-028","fam":"b-croix-oblique","kc":"B7.13","mod":7,"k":"qcm","q":"Option B, croix droite. Pour -5.00 -1.50 x 160, quel méridien va sur le bras horizontal ?","choix":[{"t":"160, car il est plus près de 180 que de 090","ok":true},{"t":"070, car c’est le 2e méridien","pourquoi":"Le bras se choisit par la proximité : 160 est à 20° de 180, 070 à 20° de 090."},{"t":"Aucun : en option B, on n’étiquette pas les bras","pourquoi":"Au contraire : l’option B garde une croix droite et étiquette chaque bras."},{"t":"Celui qui porte le plus grand pouvoir","pourquoi":"Le bras se choisit par le degré du méridien, pas par la valeur du pouvoir."}],"expl":"« Méridien Horizontal » = « (axe le plus près de 180 ou 0) » ; « Méridien Vertical » = « (axe le plus près de 090) ».","source":"7.3-d16–d17, d28"},{"id":"b-029","fam":"b-croix-oblique","kc":"B7.13","mod":7,"k":"qcm","q":"Option B pour +2.00 -1.00 x 065 : quel bras porte l’axe 065 ?","choix":[{"t":"Le bras vertical : 065 est à 25° de 090","ok":true},{"t":"Le bras horizontal : l’axe va toujours à l’horizontale","pourquoi":"L’axe ne va pas toujours à l’horizontale : 065 est plus près de 090."},{"t":"Le bras horizontal : 065 est plus près de 0 que de 090","pourquoi":"C’est l’inverse : 065 est à 65° de 0 et à 25° de 090."},{"t":"Aucun : un axe ob
