lique ne se met pas en option B","pourquoi":"L’option B sert justement aux axes obliques : on étiquette les bras."}],"expl":"065 : 25° de 090, 65° de 0. Bras vertical 065 / +2.00 ; bras horizontal 155 / +1.00 (065 + 090).","source":"7.3-d17 ; 7.1-d1"},{"id":"b-030","fam":"b-croix-oblique","kc":"B7.30","mod":7,"k":"qcm","q":"Croix de OD -1.00 +0.50 x 065 : -1.00 sur 065 (bras vertical), -0.50 sur 155 (bras horizontal). Quelles valeurs portent les deux flèches du cylindre ?","choix":[{"t":"-0.50 vers le bras vertical et +0.50 vers le bras horizontal","ok":true},{"t":"+0.50 vers le bras vertical et +0.50 vers le bras horizontal","pourquoi":"Les deux flèches ont des signes contraires : -0.50 et +0.50."},{"t":"+0.50 vers le bras vertical et -0.50 vers le bras horizontal","pourquoi":"Signes inversés : la flèche vers le bras le plus négatif (-1.00) porte -0.50."},{"t":"-1.00 vers le bras vertical et -0.50 vers le bras horizontal","pourquoi":"Ce sont les pouvoirs des bras ; les flèches portent le cylindre, ±0.50."}],"expl":"Deux flèches, dans le quart en bas à droite : le cylindre avec ses deux signes. Vers le bras le plus négatif, -0.50 ; vers l’autre, +0.50.","source":"7.2T-d12–d15"},{"id":"b-031","fam":"b-croix-oblique","kc":"B7.30","mod":7,"k":"vf","q":"Par convention, les flèches du cylindre vont dans le quart en bas à droite de la croix.","v":true,"expl":"Gabarit du cours : deux flèches « CYL » en bas à droite. Elles portent la valeur du cylindre, une fois avec +, une fois avec -.","source":"7.2T-d15–d16 ; YT 01:51–02:15"},{"id":"b-032","fam":"b-croix-types","kc":"B7.14","mod":7,"k":"qcm","q":"Sans correction, où tombe le foyer d’un méridien de -1.50 ?","choix":[{"t":"Devant la rétine","ok":true},{"t":"Derrière la rétine","pourquoi":"Signes inversés : négatif = myope = devant ; positif = derrière."},{"t":"Sur la rétine","pourquoi":"Sur la rétine, c’est Plano (emmétrope) ou un œil corrigé."},{"t":"Ça dépend de l’axe","pourquoi":"L’axe dit où est le méridien, pas où tombe son foyer : c’est le signe qui décide."}],"expl":"« Rappel: Myope Sphérique = 1 points focaux (sic) devant la rétine ». Négatif = myope = foyer devant.","source":"7.1-d50"},{"id":"b-033","fam":"b-croix-types","kc":"B7.14","mod":7,"k":"qcm","q":"Sans correction, un méridien a son foyer derrière la rétine. Quel est le signe de sa puissance ?","choix":[{"t":"Positif","ok":true},{"t":"Négatif","pourquoi":"Négatif, c’est un foyer devant la rétine (myope)."},{"t":"Plano","pourquoi":"Plano met le foyer sur la rétine."},{"t":"On ne peut pas le savoir","pourquoi":"Le signe et la place du foyer vont ensemble : derrière = positif."}],"expl":"« Rappel: Hypermétrope Sphérique = 1 points focaux (sic) derrière la rétine » : positif = hypermétrope = derrière.","source":"7.1-d50"},{"id":"b-034","fam":"b-croix-types","kc":"B7.14","mod":7,"k":"qcm","q":"OD -1.00 DS. Le patient porte sa correction. Où est son foyer ?","choix":[{"t":"Sur la rétine, grâce à la correction","ok":true},{"t":"Devant la rétine, comme sans correction","pourquoi":"Devant, c’est sans correction. Corrigé, le foyer revient sur la rétine."},{"t":"Derrière la rétine, poussé par la correction","pourquoi":"La correction ne pousse pas le foyer derrière : elle le ramène sur la rétine."},{"t":"Deux foyers : devant et sur la rétine","pourquoi":"Une Rx DS a un seul foyer : même force partout."}],"expl":"Sans correction : « OD: UN POINT FOCAUX DEVANT LA RÉTINE » (sic). Corrigé : « OD: UN POINT FOCAUX SUR LA RÉTINE » (sic).","source":"7.1-d40–d41"},{"id":"b-035","fam":"b-croix-types","kc":"B7.14","mod":7,"k":"qcm","q":"Croix : -0.50 sur 180 et -2.00 sur 090. Où sont les foyers sans correction ?","choix":[{"t":"Deux foyers, tous deux devant la rétine","ok":true},{"t":"Deux foyers, un devant et un derrière","pourquoi":"Les deux méridiens sont négatifs : les deux foyers sont devant."},{"t":"Un seul foyer, devant la rétine","pourquoi":"Deux forces différentes : deux foyers, pas un."},{"t":"Deux foyers, un sur la rétine et un devant","pourquoi":"Aucun méridien n’est Plano : aucun foyer n’est sur la rétine."}],"expl":"Chaque méridien a son foyer. Deux négatifs différents : deux foyers devant la rétine (astigmatisme myope composé).","source":"UA1 M3 ; 7.1-d50 ; distillation A3"},{"id":"b-036","fam":"b-croix-types","kc":"B7.15","mod":7,"k":"qcm","q":"+2.50 -3.75 x 090 : quel est le type d’astigmatisme ?","choix":[{"t":"Astigmatisme mixte","ok":true},{"t":"Astigmatisme hypermétrope composé","pourquoi":"Type lu avec la sphère seule : le 2e méridien vaut -1.25, de signe contraire."},{"t":"Astigmatisme hypermétrope simple","pourquoi":"Simple demande un méridien Plano ; ici +2.50 et -1.25."},{"t":"Astigmatisme myope composé","pourquoi":"Composé demande deux signes pareils ; ici un + et un -."}],"expl":"② +2.50 + (-3.75) = -1.25. Un méridien +, un - : « Deux points focaux, 1xmyope et 1x hypermétrope = Mixte ».","source":"7.2-d30 (n° 4) ; UA1 M3"},{"id":"b-037","fam":"b-croix-types","kc":"B7.15","mod":7,"k":"qcm","q":"Croix : +6.50 sur 160 et +5.50 sur 070. Quel type ?","choix":[{"t":"Astigmatisme hypermétrope composé","ok":true},{"t":"Astigmatisme hypermétrope simple","pourquoi":"Simple demande un méridien Plano ; les deux sont positifs."},{"t":"Astigmatisme mixte","pourquoi":"Mixte demande un + et un - ; ici deux +."},{"t":"Hypermétrope sphérique","pourquoi":"Sphérique demande deux méridiens égaux ; +6.50 et +5.50 diffèrent."}],"expl":"Deux positifs différents : « 2 point (sic) focaux du même type d’amétropie = composé ». Corrigé : « Astigmatisme Hypermétrope Composé ».","source":"7.3-d34–d35"},{"id":"b-038","fam":"b-croix-types","kc":"B7.15","mod":7,"k":"qcm","q":"Plano -1.25 x 180 : quel est le type d’astigmatisme ?","choix":[{"t":"Astigmatisme myope simple","ok":true},{"t":"Astigmatisme myope composé","pourquoi":"Composé demande deux méridiens du même signe ; Plano n’a pas de signe."},{"t":"Astigmatisme mixte","pourquoi":"Mixte demande un + et un - ; Plano n’est ni l’un ni l’autre."},{"t":"Astigmatisme hypermétrope simple","pourquoi":"L’autre méridien est négatif (-1.25) : c’est myope, pas hypermétrope."}],"expl":"Plano sur 180, -1.25 sur 090. Un méridien emmétrope, l’autre myope : astigmatisme myope simple.","source":"UA1 M3 ; distillation M7, question 12"},{"id":"b-039","fam":"b-croix-types","kc":"B7.15","mod":7,"k":"qcm","q":"Laquelle de ces Rx est un astigmatisme hypermétrope simple ?","choix":[{"t":"+2.00 -2.00 x 180","ok":true},{"t":"+2.00 -1.75 x 180","pourquoi":"+2.00 et +0.25 : deux positifs, donc composé."},{"t":"+2.00 -2.25 x 180","pourquoi":"+2.00 et -0.25 : signes contraires, donc mixte."},{"t":"+2.00 DS","pourquoi":"Sans cylindre, pas d’astigmatisme : hypermétrope sphérique."}],"expl":"Simple = un méridien Plano. Seul +2.00 + (-2.00) donne Plano. Un quart de dioptrie de plus ou de moins change le type.","source":"UA1 M3 ; 7.2-d30 (n° 2)"},{"id":"b-040","fam":"b-croix-types","kc":"B7.15","mod":7,"k":"vf","q":"Pour trouver le type d’astigmatisme, le signe de la sphère suffit.","v":false,"expl":"Il faut les deux méridiens. +0.25 -0.75 x 090 : +0.25 et -0.50, donc mixte, même si la sphère est positive.","source":"7.2-d30 (n° 6) ; UA1 M3"},{"id":"b-041","fam":"b-croix-types","kc":"B7.16","mod":7,"k":"qcm","q":"+2.00 -2.00 x 135 : quel nom le cours donne-t-il à la Rx, et quel type d’astigmatisme ?","choix":[{"t":"Rx hypermétrope torique ; astigmatisme hypermétrope simple","ok":true},{"t":"Rx hypermétrope simple ; astigmatisme hypermétrope torique","pourquoi":"Réponses échangées : le nom suit la sphère, le type suit les deux méridiens."},{"t":"Rx emmétrope ; astigmatisme hypermétrope simple","pourquoi":"Le nom suit le signe de la sphère, +2.00 : hypermétrope."},{"t":"Rx hypermétrope torique ; astigmatisme hypermétrope composé","pourquoi":"Composé demande deux méridiens positifs ; ici +2.00 et Plano."}],"expl":"Deux questions, deux réponses : « rx: Hypermétrope Torique; » (la sphère + un cylindre) et « Astigmatisme Hypermétrope Simple » (+2.00 / Plano).","source":"7.3-d30–d32"},{"id":"b-042","fam":"b-croix-types","kc":"B7.16","mod":7,"k":"vf","q":"Le nom d’une Rx (par exemple hypermétrope torique) et son type d’astigmatisme répondent à la même question.","v":false,"expl":"Le nom suit le signe de la sphère ; le type suit les deux méridiens. Le cours les demande à part : « Quel est l’amétropie? » (sic) et « Quel est le type d’astigmatisme? ».","source":"7.2-d31 ; 7.3-d32"},{"id":"b-043","fam":"b-croix-types","kc":"B7.18","mod":7,"k":"qcm","q":"Le cours pose deux questions sur les points focaux d’une croix. Qu’est-ce qui change de l’une à l’autre ?","choix":[{"t":"On regarde l’œil sans correction, puis avec","ok":true},{"t":"On regarde l’OD, puis on passe à l’OS","pourquoi":"Les deux questions portent sur le même œil : sans correction, puis avec."},{"t":"On regarde le loin, puis le près avec l’ADD","pourquoi":"La croix est la Rx de loin seulement ; le près n’y est pas."},{"t":"On regarde la sphère, puis le cylindre","pourquoi":"Les deux questions portent sur tous les foyers : sans, puis avec correction."}],"expl":"« Ou se trouve le point focaux lorsque le patient n’est pas corrigé par une orthèse visuelle? » (sic), puis la même avec « EST corrigé ».","source":"7.1-d40"},{"id":"b-044","fam":"b-croix-types","kc":"B7.18","mod":7,"k":"qcm","q":"Quelles questions le cours pose-t-il dans l’« Analyse avancée » d’une croix ?","choix":[{"t":"L’amétropie, les foyers sans correction, le type d’astigmatisme","ok":true},{"t":"L’œil (OD ou OS), le prisme et sa base, l’addition","pourquoi":"La croix ne dit ni l’œil, ni le prisme, ni l’addition."},{"t":"La distance de lecture, l’addition de près, le type d’astigmatisme","pourquoi":"La croix est la Rx de loin : ni addition ni distance de lecture."},{"t":"Le prescripteur, le format du cylindre, l’axe","pourquoi":"L’analyse de la croix porte sur les foyers, l’amétropie et le type."}],"expl":"« Ou se trouve les points focaux lorsque le patient n’est pas corrigé par une orthèse visuelle? » (sic), « Quel est l’amétropie? » (sic), « Quel est le type d’astigmatisme? ».","source":"7.2-d31"},{"id":"b-045","fam":"b-croix-types","kc":"B7.19","mod":7,"k":"qcm","q":"Rx : -6.75 -1.25 x 060. Quelle analyse complète est juste ?","choix":[{"t":"-6.75 sur 060, -8.00 sur 150 ; deux foyers devant ; astigmatisme myope composé","ok":true},{"t":"-6.75 sur 060, -8.00 sur 150 ; deux foyers derrière ; astigmatisme myope composé","pourquoi":"Méridiens négatifs : les foyers sont devant la rétine, pas derrière."},{"t":"-6.75 sur 150, -8.00 sur 060 ; deux foyers devant ; astigmatisme myope composé","pourquoi":"Bras inversés : la sphère -6.75 va sur l’axe 060."},{"t":"-6.75 sur 060, -5.50 sur 150 ; deux foyers devant ; astigmatisme myope composé","pourquoi":"Valeurs soustraites : (-6.75) + (-1.25) = -8.00."}],"expl":"① -6.75 sur 060 ; ② -8.00 ; ③ 060 + 090 = 150. Deux négatifs différents : deux foyers devant, myope composé.","source":"7.3-d36"},{"id":"b-046","fam":"b-croix-types","kc":"B7.19","mod":7,"k":"qcm","q":"Rx : +7.75 -1.00 x 138. Quelle analyse complète est juste (option B) ?","choix":[{"t":"+7.75 sur 138, +6.75 sur 048 ; hypermétrope composé ; 138 au bras horizontal","ok":true},{"t":"+7.75 sur 138, +6.75 sur 048 ; hypermétrope composé ; 138 au bras vertical","pourquoi":"138 est à 42° de 180 et à 48° de 090 : il va à l’horizontale."},{"t":"+7.75 sur 138, +6.75 sur 228 ; hypermétrope composé ; 138 au bras horizontal","pourquoi":"228 dépasse 180 : 138 - 090 = 048."},{"t":"+7.75 sur 138, +6.75 sur 048 ; mixte ; 138 au bras horizontal","pourquoi":"Deux méridiens positifs : composé, deux foyers derrière la rétine."}],"expl":"① +7.75 sur 138 ; ② +7.75 + (-1.00) = +6.75 ; ③ 138 - 090 = 048. Deux + différents : hypermétrope composé.","source":"7.3-d17, d36"},{"id":"b-047","fam":"b-croix-rx","kc":"B7.17","mod":7,"k":"qcm","q":"« ANALYSE INVERSE » : la croix porte +2.00 sur ses deux bras. Quelle est la Rx ?","choix":[{"t":"+2.00 DS","ok":true},{"t":"+2.00 -2.00 x 180","pourquoi":"Deux bras égaux : aucun cylindre, donc une Rx DS."},{"t":"+2.00 +2.00 x 090","pourquoi":"Le cylindre n’est pas la valeur de l’autre bras : bras égaux = pas de cylindre."},{"t":"+1.00 DS","pourquoi":"On ne partage pas : la sphère vaut la force de chaque bras, +2.00."}],"expl":"Même force partout = Rx sphérique : +2.00 DS, hypermétrope sphérique, un foyer derrière la rétine.","source":"7.1-d43–d45"},{"id":"b-048","fam":"b-croix-rx","kc":"B7.17","mod":7,"k":"qcm","q":"Une croix porte -2.00 sur 180 et -3.50 sur 090. Quelle est la Rx en cylindre négatif ?","choix":[{"t":"-2.00 -1.50 x 180","ok":true},{"t":"-3.50 +1.50 x 090","pourquoi":"C’est la Rx en CYL positif. En CYL négatif, la sphère est le méridien le plus positif."},{"t":"-2.00 -3.50 x 180","pourquoi":"Le cylindre n’est pas l’autre valeur : -3.50 - (-2.00) = -1.50."},{"t":"-2.00 -1.50 x 090","pourquoi":"L’axe est le degré de la sphère, 180, pas celui de l’autre méridien."}],"expl":"SPH = le méridien le plus positif (-2.00), AXE = son degré (180), CYL = -3.50 - (-2.00) = -1.50.","source":"distillation M7, question 6 ; 7.2T-d18–d25"},{"id":"b-049","fam":"b-croix-rx","kc":"B7.17","mod":7,"k":"qcm","q":"Une croix porte -0.75 sur 045 et -2.25 sur 135. Quelle est la Rx en cylindre négatif ?","choix":[{"t":"-0.75 -1.50 x 045","ok":true},{"t":"-2.25 -1.50 x 135","pourquoi":"La sphère doit être le méridien le plus positif : -0.75, pas -2.25."},{"t":"-0.75 +1.50 x 045","pourquoi":"Signe du cylindre : -2.25 - (-0.75) = -1.50, négatif."},{"t":"-0.75 -2.25 x 045","pourquoi":"Le cylindre n’est pas l’autre valeur : c’est la différence, -1.50."}],"expl":"Le plus positif (-0.75) devient la sphère, son degré l’axe. Contrôle : -0.75 + (-1.50) = -2.25 sur 135.","source":"distillation M7, question 16"},{"id":"b-050","fam":"b-croix-rx","kc":"B7.28","mod":7,"k":"qcm","q":"Croix de OD -1.00 +0.50 x 065, sans transposer. Quelle croix est juste ?","choix":[{"t":"-1.00 sur 065 et -0.50 sur 155","ok":true},{"t":"-1.00 sur 065 et -1.50 sur 155","pourquoi":"Signe du cylindre perdu : (-1.00) + (+0.50) = -0.50."},{"t":"-0.50 sur 065 et -1.00 sur 155","pourquoi":"Bras inversés : la sphère -1.00 va sur l’axe 065, même en CYL positif."},{"t":"-1.00 sur 065 et +0.50 sur 155","pourquoi":"Cylindre seul : le 2e méridien porte SPH + CYL, soit -0.50."}],"expl":"① ② ③ valent aussi en CYL positif : -1.00 sur 065 ; (-1.00) + (+0.50) = -0.50 sur 155 (065 + 090).","source":"7.2T-d5–d12"},{"id":"b-051","fam":"b-croix-rx","kc":"B7.28","mod":7,"k":"vf","q":"Pour faire la croix d’une Rx en cylindre positif, il faut d’abord la transposer.","v":false,"expl":"Pas obligé : ① ② ③ marchent dans les deux formats. OS -1.50 +0.75 x 105 → -1.50 sur 105, -0.75 sur 015. Transposer d’abord donne la même croix.","source":"7.2T-d5–d12 ; YT"},{"id":"b-052","fam":"b-croix-rx","kc":"B7.29","mod":7,"k":"qcm","q":"Croix : -0.50 sur 180 et -1.50 sur 090. Quelle est la Rx en cylindre positif (format « MD ») ?","choix":[{"t":"-1.50 +1.00 x 090","ok":true},{"t":"-0.50 -1.00 x 180","pourquoi":"C’est la Rx en CYL négatif. En CYL positif, la sphère est le méridien le plus négatif."},{"t":"-1.50 +1.00 x 180","pourquoi":"L’axe est le degré de la sphère choisie : -1.50 est sur 090."},{"t":"-1.50 -1.00 x 090","pourquoi":"En CYL positif, CYL = -0.50 - (-1.50) = +1.00."}],"expl":"Le plus négatif, -1.50 sur 090, devient la sphère : « Rx - MD - CYL POSITIF ». Avec la Rx en CYL négatif : « TRANSPOSITION ! ».","source":"7.2T-d18–d25"},{"id":"b-053","fam":"b-croix-rx","kc":"B7.29","mod":7,"k":"qcm","q":"Croix : +1.00 sur 020 et -0.50 sur 110. Quelle paire de Rx est juste ?","choix":[{"t":"CYL - : +1.00 -1.50 x 020 · CYL + : -0.50 +1.50 x 110","ok":true},{"t":"CYL - : -0.50 -1.50 x 110 · CYL + : +1.00 +1.50 x 020","pourquoi":"Formats croisés : en CYL négatif, la sphère est le plus positif, +1.00."},{"t":"CYL - : +1.00 -0.50 x 020 · CYL + : -0.50 +1.00 x 110","pourquoi":"Le cylindre n’est pas l’autre valeur : c’est la différence, 1.50."},{"t":"CYL - : +1.00 -1.50 x 110 · CYL + : -0.50 +1.50 x 020","pourquoi":"Axes échangés : l’axe est le degré de la sphère choisie."}],"expl":"CYL - : SPH +1.00 (le plus positif), axe 020, CYL = -0.50 - (+1.00) = -1.50. CYL + : SPH -0.50, axe 110, CYL +1.50.","source":"distillation M7 suite, exercice 8 ; 7.2T-d18–d25"},{"id":"b-054","fam":"b-transposer","kc":"B7.20","mod":8,"k":"qcm","q":"En général, qui écrit le cylindre en positif ?","choix":[{"t":"L’ophtalmologiste (MD)","ok":true},{"t":"L’optométriste (OD)","pourquoi":"L’optométriste écrit en général le cylindre en négatif."},{"t":"L’opticien (RO)","pourquoi":"L’opticien, comme l’optométriste, emploie en général le cylindre négatif."},{"t":"Ça dépend de l’œil du patient","pourquoi":"Le format dépend du prescripteur, pas de l’œil."}],"expl":"« MD = + cyl » ; optométristes et opticiens écrivent en cylindre négatif, « en général ».","source":"7.1T-d5, d23 ; PDF p1"},{"id":"b-055","fam":"b-transposer","kc":"B7.20","mod":8,"k":"qcm","q":"Sur une diapo : « RX - OD - CYL NÉGATIF ». Que veut dire OD ici ?","choix":[{"t":"L’optométriste (docteur en optométrie)","ok":true},{"t":"L’œil droit, comme dans un tableau de Rx","pourquoi":"Ici OD nomme le professionnel qui écrit en CYL négatif, pas l’œil."},{"t":"L’ophtalmologiste (le MD)","pourquoi":"L’ophtalmologiste, c’est MD, qui écrit en CYL positif."},{"t":"L’opticien (le RO)","pourquoi":"L’opticien, c’est RO ; OD désigne l’optométriste."}],"expl":"« OD et RO » = optométristes et opticiens, CYL négatif ; « MD » = ophtalmologiste, CYL positif. Dans un tableau de Rx, OD redevient l’œil droit.","source":"7.1T-d5 ; 7.2T-d22"},{"id":"b-056","fam":"b-transposer","kc":"B7.21","mod":8,"k":"vf","q":"Une Rx et sa transposée corrigent deux amétropies différentes.","v":false,"expl":"« Transposer, ce n’est pas changer la correction : c’est apprendre à la lire sous une autre forme. »","source":"7.1T-d7"},{"id":"b-057","fam":"b-transposer","kc":"B7.21","mod":8,"k":"qcm","q":"+2.00 -1.00 x 065 et +1.00 +1.00 x 155 : que peux-tu dire de leurs croix ?","choix":[{"t":"C’est la même croix : +2.00 sur 065, +1.00 sur 155","ok":true},{"t":"Deux croix différentes : la 2e est plus faible","pourquoi":"La sphère a changé, pas la correction : mêmes pouvoirs sur les mêmes méridiens."},{"t":"La même croix, mais tournée de 90°","pourquoi":"Les méridiens ne bougent pas : +2.00 reste sur 065 et +1.00 sur 155."},{"t":"On ne peut pas comparer un CYL - et un CYL +","pourquoi":"On peut : la croix montre les mêmes pouvoirs, quelle que soit l’écriture."}],"expl":"1re : +2.00 sur 065, +2.00 + (-1.00) = +1.00 sur 155. 2e : +1.00 sur 155, +1.00 + 1.00 = +2.00 sur 065. « Rx équivalente ».","source":"7.1T-d7, d10–d15"},{"id":"b-058","fam":"b-transposer","kc":"B7.21","mod":8,"k":"qcm","q":"Pour le même patient, l’optométriste écrit +2.00 -1.00 x 065 et l’ophtalmologiste +1.00 +1.00 x 155. Pourquoi ces nombres différents ?","choix":[{"t":"Ils écrivent la même correction en deux formats de cylindre","ok":true},{"t":"Ils ont trouvé deux amétropies différentes chez ce patient","pourquoi":"Les nombres diffèrent, la correction non : c’est la même Rx transposée."},{"t":"L’un a mesuré la Rx de loin, l’autre celle de près","pourquoi":"Les deux Rx sont de loin ; seul le format du cylindre change."},{"t":"L’ophtalmologiste arrondit ses valeurs à la dioptrie","pourquoi":"Aucun arrondi : les 4 étapes donnent exactement l’autre Rx."}],"expl":"« Une même correction peut s’écrire de deux façons… et corriger la même amétropie. »","source":"7.1T-d2, d7, d23"},{"id":"b-059","fam":"b-transposer","kc":"B7.21","mod":8,"k":"vf","q":"-8.00 +2.00 x 135 et -6.00 -2.00 x 045 mettent les mêmes pouvoirs sur les mêmes méridiens.","v":true,"expl":"Dans les deux écritures : -8.00 sur 135 et -6.00 sur 045. « Même puissance d’optique! »","source":"7.1T-d16–d22"},{"id":"b-060","fam":"b-transposer","kc":"B7.22","mod":8,"k":"qcm","q":"Transposer -8.00 +2.00 x 135 : quel est le nouveau SPH ?","choix":[{"t":"-6.00","ok":true},{"t":"-10.00","pourquoi":"Valeurs additionnées sans le signe : ajouter +2.00, c’est monter de -8.00 vers -6.00."},{"t":"-8.00","pourquoi":"Ancienne sphère gardée : à l’étape 1, SPH + CYL = nouveau SPH."},{"t":"+2.00","pourquoi":"C’est le cylindre d’origine ; le nouveau SPH est la somme SPH + CYL."}],"expl":"« Additionner le SPH et CYL algébriquement » : (-8.00) + (+2.00) = -6.00. Ajouter un positif, c’est monter sur la droite des nombres.","source":"7.1T-d16–d18 ; PDF ; MP4 11:31"},{"id":"b-061","fam":"b-transposer","kc":"B7.22","mod":8,"k":"qcm","q":"Transposer +1.00 -0.75 x 025 : quel est le nouveau SPH ?","choix":[{"t":"+0.25","ok":true},{"t":"+1.75","pourquoi":"Signe du cylindre ignoré : on additionne du négatif, donc on recule de 0.75."},{"t":"-0.25","pourquoi":"Signe perdu : +1.00 - 0.75 = +0.25, on reste au-dessus de zéro."},{"t":"+1.00","pourquoi":"Ancienne sphère gardée : le nouveau SPH est SPH + CYL."}],"expl":"(+1.00) + (-0.75) = +0.25 : « on additionne du négatif. Donc, on doit reculer dans l'échelle » (MP4).","source":"MP4 05:46–07:30"},{"id":"b-062","fam":"b-transposer","kc":"B7.23","mod":8,"k":"vf","q":"À l’étape 2, le cylindre garde sa valeur et change seulement de signe.","v":true,"expl":"« Changer le signe du CYL » (PDF) : +2.00 devient -2.00, -1.00 devient +1.00.","source":"7.1T-d8 ; PDF ; MP4"},{"id":"b-063","fam":"b-transposer","kc":"B7.23","mod":8,"k":"qcm","q":"Transposer -1.00 -0.50 x 090 : quel est le nouveau CYL ?","choix":[{"t":"+0.50","ok":true},{"t":"-0.50","pourquoi":"Signe gardé : l’étape 2 inverse le signe du cylindre."},{"t":"-1.50","pourquoi":"C’est le nouveau SPH (SPH + CYL), pas le nouveau CYL."},{"t":"+1.50","pourquoi":"Le cylindre garde sa valeur, 0.50 ; seul son signe change."}],"expl":"« Inverser la force du CYL = nouveau CYL » : -0.50 devient +0.50. Rx transposée : -1.50 +0.50 x 180.","source":"7.1T-d8 ; MP4 04:02–05:36"},{"id":"b-064","fam":"b-transposer","kc":"B7.24","mod":8,"k":"qcm","q":"Transposer -3.75 +1.00 x 095 Add +1.50 : quel est le nouvel axe ?","choix":[{"t":"005","ok":true},{"t":"185","pourquoi":"185 dépasse 180 : l’axe doit rester entre 001 et 180, donc 095 - 090."},{"t":"095","pourquoi":"Axe gardé : l’étape 3 ajoute ou retire 090."},{"t":"180","pourquoi":"Le nouvel axe n’est pas toujours 180 : il est à 90° de 095."}],"expl":"« 095 - 090 = 005 ». « (Rappel: axe doit se retrouver entre 001 et 180) ». Rx : -2.75 -1.00 x 005 Add +1.50.","source":"7.1T-d8, d30–d34"},{"id":"b-065","fam":"b-transposer","kc":"B7.24","mod":8,"k":"qcm","q":"Transposer Plano -1.00 x 180 : quel est le nouvel axe ?","choix":[{"t":"090","ok":true},{"t":"270","pourquoi":"180 + 090 dépasse 180 : on soustrait, 180 - 090 = 090."},{"t":"180","pourquoi":"Axe gardé : l’étape 3 ajoute ou retire toujours 090."},{"t":"000","pourquoi":"Zéro n’est pas un axe : 180 - 090 = 090."}],"expl":"À 180, additionner « va surpasser le 180 » : on soustrait. Rx transposée : -1.00 +1.00 x 090.","source":"MP4 07:41–09:00"},{"id":"b-066","fam":"b-transposer","kc":"B7.24","mod":8,"k":"vf","q":"Pour un axe de 025, on soustrait 090 à l’étape 3.","v":false,"expl":"025 - 090 donne un axe négatif : « Ceci n'existe pas ». On additionne : 025 + 090 = 115.","source":"MP4 05:46–07:30"},{"id":"b-067","fam":"b-transposer","kc":"B7.25","mod":8,"k":"qcm","q":"Transposer -1.00 -1.00 x 065 1△BU Add +1.50 : que deviennent le prisme et l’addition ?","choix":[{"t":"Ils sont recopiés tels quels : 1△BU Add +1.50","ok":true},{"t":"Ils disparaissent, comme sur la croix","pourquoi":"Absents de la croix, oui, mais pas de la Rx : on les recopie."},{"t":"L’addition change de signe : Add -1.50","pourquoi":"Seul le cylindre change de signe ; l’ADD reste +1.50."},{"t":"Le prisme change de base : 1△BU devient 1△BD","pourquoi":"La base du prisme ne change pas : 1△BU reste 1△BU."}],"expl":"« Pouvoir addition et prisme demeurent les mêmes ». Rx transposée : -2.00 +1.00 x 155 1△BU Add +1.50.","source":"7.1T-d8, d35–d39"},{"id":"b-068","fam":"b-transposer","kc":"B7.25","mod":8,"k":"vf","q":"À la transposition, tu peux laisser tomber le prisme et l’ADD, puisque la croix ne les montre pas.","v":false,"expl":"« Le prisme et l'addition ne changent pas. » « Mais il doit être transféré. » (MP4) : ils passent dans la Rx transposée.","source":"MP4 14:34–14:38 ; 7.1T-d8"},{"id":"b-069","fam":"b-transposer","kc":"B7.26","mod":8,"k":"qcm","q":"Quelle est la transposée de +2.00 -1.50 x 090 Add +1.75 ?","choix":[{"t":"+0.50 +1.50 x 180 Add +1.75","ok":true},{"t":"+0.50 -1.50 x 180 Add +1.75","pourquoi":"Signe du cylindre gardé : -1.50 devient +1.50."},{"t":"+3.50 +1.50 x 180 Add +1.75","pourquoi":"Valeurs additionnées sans signe : (+2.00) + (-1.50) = +0.50."},{"t":"+0.50 +1.50 x 180 Add -1.75","pourquoi":"L’ADD ne change pas de signe : elle se recopie, +1.75."}],"expl":"« Étape 1 : (+2) + (-1.50) = +0.50 » ; -1.50 devient +1.50 ; « 090 + 090 = 180 » ; « Add +1.75 demeure ».","source":"7.1T-d24–d29"},{"id":"b-070","fam":"b-transposer","kc":"B7.26","mod":8,"k":"qcm","q":"Quelle est la transposée de -2.00 +2.00 x 110 ?","choix":[{"t":"Plano -2.00 x 020","ok":true},{"t":"-4.00 -2.00 x 020","pourquoi":"Signe ignoré : (-2.00) + (+2.00) = zéro, donc Plano."},{"t":"Plano -2.00 x 200","pourquoi":"200 dépasse 180 : 110 - 090 = 020."},{"t":"Plano +2.00 x 020","pourquoi":"Signe du cylindre gardé : +2.00 devient -2.00."}],"expl":"(-2.00) + (+2.00) = Plano ; +2.00 devient -2.00 ; 110 + 090 = 200, « qui dépassent le 180 », donc 110 - 090 = 020.","source":"MP4 10:54–12:31"},{"id":"b-071","fam":"b-transposer","kc":"B7.26","mod":8,"k":"ordre","q":"Remets les 4 étapes de la transposition dans l’ordre.","etapes":["SPH + CYL = nouveau SPH","Inverser le signe du CYL","Axe ± 090, pour rester entre 001 et 180","Recopier le prisme et l’ADD"],"expl":"Au tableau, la prof l’abrège : « 1: Sph + Cyl 2: +/- cyl 3: +/- 90 ». Puis « Pouvoir addition et prisme demeurent les mêmes ».","source":"7.1T-d8, d40"},{"id":"b-072","fam":"b-transposer","kc":"B7.26","mod":8,"k":"vf","q":"La Rx -3.00 DS n’a rien à transposer.","v":true,"expl":"« pour faire une transposition, nous devons avoir la cylindre » (MP4) : sans cylindre, -3.00 reste -3.00.","source":"MP4 02:08–03:27"},{"id":"b-073","fam":"b-transposer","kc":"B7.27","mod":8,"k":"qcm","q":"Une Rx transposée vaut -1.25 +0.50 x 095. Quelle était la Rx d’origine ?","choix":[{"t":"-0.75 -0.50 x 005","ok":true},{"t":"-1.75 -0.50 x 005","pourquoi":"Signe du cylindre ignoré : (-1.25) + (+0.50) = -0.75."},{"t":"-0.75 +0.50 x 005","pourquoi":"Le cylindre doit changer de signe : +0.50 devient -0.50."},{"t":"-0.75 -0.50 x 185","pourquoi":"185 dépasse 180 : 095 - 090 = 005."}],"expl":"Transpose la transposée : (-1.25) + (+0.50) = -0.75 ; -0.50 ; 095 - 090 = 005. Deux transpositions redonnent la Rx.","source":"distillation M7 suite, exercice 11 (déduit)"},{"id":"b-074","fam":"b-transposer","kc":"B7.27","mod":8,"k":"vf","q":"Si tu transposes deux fois une Rx, tu retrouves la Rx de départ.","v":true,"expl":"-8.00 +2.00 x 135 → -6.00 -2.00 x 045 → (-6.00) + (-2.00) = -8.00 ; +2.00 ; 045 + 090 = 135.","source":"7.1T-d16–d22 ; distillation M7 suite (déduit)"},{"id":"b-075","fam":"b-analyse","kc":"B7.31","mod":8,"k":"qcm","q":"OD -3.75 +4.00 x 166 Add +2.00. Pour nommer son type, que fais-tu en premier ?","choix":[{"t":"Je la transpose, car son CYL est positif","ok":true},{"t":"Je lis la sphère : -3.75, donc myope","pourquoi":"Lue en CYL positif, la sphère trompe : transposée, elle vaut +0.25."},{"t":"Je regarde l’ADD : presbyte","pourquoi":"L’ADD vient en dernier ; avant tout, le CYL doit être absent ou négatif."},{"t":"Je fais la croix et je lis l’axe","pourquoi":"L’axe ne dit pas le type ; on vérifie d’abord le signe du CYL."}],"expl":"« AVANT TOUT ==== CYL de l’ordonnance doit être ABSENT OU NÉGATIF ». Ici +4.00 : transposer d’abord.","source":"7.3T-d5–d7, d61–d62"},{"id":"b-076","fam":"b-analyse","kc":"B7.31","mod":8,"k":"qcm","q":"OD -3.75 +4.00 x 166 Add +2.00 : quel nom donne le corrigé du cours ?","choix":[{"t":"Hypermétrope Torique et Presbyte","ok":true},{"t":"Myope Torique et Presbyte","pourquoi":"Sphère lue avant de transposer. Transposée : +0.25 -4.00 x 076, hypermétrope."},{"t":"Hypermétrope Torique seulement","pourquoi":"L’ADD +2.00 ajoute presbyte au nom (dernière étape)."},{"t":"Myope Sphérique et Presbyte","pourquoi":"Il y a un cylindre : torique ; et la sphère transposée est positive."}],"expl":"(-3.75) + (+4.00) = +0.25 ; -4.00 ; 166 - 090 = 076. Corrigé : « OD: Hypermétrope Torique et Presbyte ».","source":"7.3T-d61–d62"},{"id":"b-077","fam":"b-analyse","kc":"B7.31","mod":8,"k":"vf","q":"Une Rx écrite en CYL positif avec une sphère négative peut être hypermétrope.","v":true,"expl":"-1.00 +2.50 x 175 se transpose en +1.50 -2.50 x 085 : « Hypermétrope Torique ». Au cours, cinq Rx de ce genre sur sept l’étaient.","source":"7.3T-d61–d67"},{"id":"b-078","fam":"b-analyse","kc":"B7.31","mod":8,"k":"qcm","q":"Laquelle de ces Rx peux-tu analyser sans transposer ?","choix":[{"t":"-1.25 -0.50 x 180","ok":true},{"t":"-1.25 +0.50 x 090","pourquoi":"Le CYL est positif : il faut transposer d’abord."},{"t":"+0.75 +1.00 x 180","pourquoi":"CYL positif : transposée, elle devient +1.75 -1.00 x 090."},{"t":"Plano +0.75 x 090","pourquoi":"CYL positif : transposer d’abord, même avec une sphère Plano."}],"expl":"Étape 1 : « Ordonnance avec CYL Positif = Transposition (à suivre) ». Un CYL absent ou négatif se lit tout de suite.","source":"7.3T-d6–d7"},{"id":"b-079","fam":"b-analyse","kc":"B7.32","mod":8,"k":"ordre","q":"Remets dans l’ordre les étapes pour nommer le type d’une Rx.","etapes":["Le CYL est-il absent ou négatif ? Sinon, transposer","Signe de la sphère : myope ou hypermétrope","Cylindre ? sphérique ou torique","Prisme ? prismatique","Addition ? presbyte"],"expl":"Les 5 étapes du cours, de « Pouvons-nous faire l’analyse? » à « As-t-il un pouvoir d’addition? ». Résultat œil par œil.","source":"7.3T-d31, d33"},{"id":"b-080","fam":"b-analyse","kc":"B7.32","mod":8,"k":"qcm","q":"OD +2.25 -0.50 x 166 Add +2.25 : quel est son type ?","choix":[{"t":"Hypermétrope Torique et Presbyte","ok":true},{"t":"Hypermétrope Sphérique et Presbyte","pourquoi":"Il y a un cylindre (-0.50) et un axe : torique."},{"t":"Myope Torique et Presbyte","pourquoi":"La sphère, +2.25, est positive : hypermétrope."},{"t":"Hypermétrope Torique","pourquoi":"L’ADD +2.25 ajoute presbyte (dernière étape)."}],"expl":"CYL négatif : on analyse. +2.25 → hypermétrope ; cylindre → torique ; pas de prisme ; ADD → presbyte (corrigé du cours).","source":"7.3T-d34–d42"},{"id":"b-081","fam":"b-analyse","kc":"B7.32","mod":8,"k":"qcm","q":"OS +2.75 2△BI Add +2.25 : quel est son type ?","choix":[{"t":"Hypermétrope Sphérique, Prismatique et Presbyte","ok":true},{"t":"Hypermétrope Sphérique et Presbyte","pourquoi":"Le prisme 2△BI ajoute prismatique."},{"t":"Hypermétrope Torique, Prismatique et Presbyte","pourquoi":"Pas de cylindre : sphère seule = sphérique."},{"t":"Myope Sphérique, Prismatique et Presbyte","pourquoi":"La sphère +2.75 est positive : hypermétrope."}],"expl":"« Ordonnance avec Prisme = PRISMATIQUE » ; « Ordonnance avec ADD =PRESBYTE ». Sphère seule, positive : hypermétrope sphérique.","source":"7.3T-d15, d17, d34–d42"},{"id":"b-082","fam":"b-analyse","kc":"B7.33","mod":8,"k":"qcm","q":"OS Plano -0.50 x 180 : que dis-tu des points focaux et du type d’astigmatisme ?","choix":[{"t":"Un foyer sur la rétine, un devant ; astigmatisme myope simple","ok":true},{"t":"Un seul foyer, sur la rétine ; pas d’astigmatisme","pourquoi":"Il y a un cylindre : deux méridiens, deux foyers (Plano et -0.50)."},{"t":"Deux foyers devant la rétine ; astigmatisme myope composé","pourquoi":"Le méridien 180 est Plano : son foyer est sur la rétine, donc simple."},{"t":"Un sur la rétine, un derrière ; astigmatisme hypermétrope simple","pourquoi":"-0.50 est négatif : foyer devant, myope."}],"expl":"Croix : Plano sur 180 (sur la rétine), -0.50 sur 090 (devant). Un emmétrope, un myope : astigmatisme myope simple.","source":"7.3T-d19–d30"},{"id":"b-083","fam":"b-analyse","kc":"B7.33","mod":8,"k":"qcm","q":"OD +0.75 +1.00 x 180. Quelle analyse complète est juste ?","choix":[{"t":"Transposée +1.75 -1.00 x 090 ; Hypermétrope Torique ; astigmatisme hypermétrope composé","ok":true},{"t":"Pas de transposition ; Hypermétrope Torique ; astigmatisme hypermétrope simple","pourquoi":"CYL positif : transposer d’abord. Méridiens +1.75 et +0.75 : composé."},{"t":"Transposée +1.75 -1.00 x 270 ; Hypermétrope Torique ; astigmatisme hypermétrope composé","pourquoi":"270 dépasse 180 : 180 - 090 = 090."},{"t":"Transposée +1.75 -1.00 x 090 ; Hypermétrope Torique ; astigmatisme mixte","pourquoi":"+1.75 et +0.75 ont le même signe : composé, pas mixte."}],"expl":"(+0.75) + (+1.00) = +1.75 ; -1.00 ; 180 - 090 = 090. Croix : +1.75 sur 090, +0.75 sur 180 : deux + différents.","source":"7.3T-d63–d64 ; M7 ⑥"},{"id":"b-084","fam":"b-sv-multi","kc":"B8.1","mod":9,"k":"qcm","q":"Qu’est-ce qui fait qu’une Rx est multifocale ?","choix":[{"t":"Elle a un pouvoir d’addition","ok":true},{"t":"Sa sphère est fortement positive","pourquoi":"Une forte sphère + n’est pas une ADD : OD +3.25 sans ADD reste une SV."},{"t":"Elle a un cylindre et un axe","pourquoi":"Le cylindre rend la Rx torique ; SV et multifocale peuvent être toriques."},{"t":"Elle a un prisme","pourquoi":"Le prisme peut s’ajouter à toute Rx ; c’est l’ADD qui fait la multifocale."}],"expl":"Multifocal : « DOIT comprendre un pouvoir d’ADDITION ». SV : « Aucun pouvoir d’Addition ».","source":"d3"},{"id":"b-085","fam":"b-sv-multi","kc":"B8.1","mod":9,"k":"vf","q":"OD +3.25 / OS +3.50 -0.25 x 180, sans ADD, est une Rx multifocale parce que ses sphères sont fortes.","v":false,"expl":"Sans ADD, c’est une SV : une multifocale « DOIT comprendre un pouvoir d’ADDITION ». Sa note, « Notes: Lecture », dit le champ.","source":"d3, d7"},{"id":"b-086","fam":"b-sv-multi","kc":"B8.1","mod":9,"k":"qcm","q":"Laquelle de ces Rx est multifocale ?","choix":[{"t":"OD -1.00 -0.75 x 037 Add +1.00","ok":true},{"t":"OD -1.00 -0.75 x 037","pourquoi":"Pas d’ADD : c’est une SV, même avec un cylindre."},{"t":"OD +4.00 -0.25 x 175 Notes: Ordinateur","pourquoi":"Pas d’ADD : une SV, malgré la forte sphère positive ; une note n’est pas une ADD."},{"t":"OD -4.00 -1.25 x 090 2△BI","pourquoi":"Un prisme n’est pas une ADD : sans ADD, c’est une SV."}],"expl":"Seule la Rx avec Add +1.00 est multifocale, même si l’ADD est petite : elle « DOIT comprendre un pouvoir d’ADDITION ».","source":"d3, d8, d9, d11"},{"id":"b-087","fam":"b-sv-multi","kc":"B8.1","mod":9,"k":"vf","q":"Une Rx multifocale peut être sphérique ou torique.","v":true,"expl":"« Peut être sphérique ou torique mais DOIT comprendre un pouvoir d’ADDITION ».","source":"d3"},{"id":"b-088","fam":"b-sv-multi","kc":"B8.2","mod":9,"k":"qcm","q":"À quelle distance travaille la vision intermédiaire ?","choix":[{"t":"Environ 60 à 80 cm : ordinateur, télévision","ok":true},{"t":"Environ 30 à 40 cm : lecture, téléphone","pourquoi":"Ça, c’est la vision de près (VP)."},{"t":"Environ 6 m et plus : paysage, signalisation","pourquoi":"Ça, c’est la vision de loin (VL)."}],"expl":"Intermédiaire : « (≈ 60 cm – 80 cm) », « Ex. : ordinateur, télévision ». Près : « (≈ 30 cm – 40 cm) ». Loin : « (≈ 6 m et +) ».","source":"d13, d23, d38, d63"},{"id":"b-089","fam":"b-sv-multi","kc":"B8.2","mod":9,"k":"ordre","q":"Range les trois champs de vision du plus proche au plus loin.","etapes":["SV-VP : environ 30 à 40 cm (lecture, téléphone)","SV-VI : environ 60 à 80 cm (ordinateur, télévision)","SV-VL : environ 6 m et plus (paysage, signalisation)"],"expl":"La ligne de vue du cours va de « PROCHE » à « DISTANCE » : VP, puis VI, puis VL.","source":"d3, d52, d63"},{"id":"b-090","fam":"b-sv-multi","kc":"B8.3","mod":9,"k":"qcm","q":"OD +4.00 -0.25 x 175 / OS +3.75 -0.50 x 005, « Notes: Ordinateur ». Quel type de commande ?","choix":[{"t":"Commande SV-VI","ok":true},{"t":"Commande SV-VP","pourquoi":"L’ordinateur est un usage intermédiaire (60 à 80 cm), pas de près."},{"t":"Commande Multifocal","pourquoi":"Pas d’ADD : une multifocale « DOIT comprendre un pouvoir d’ADDITION »."},{"t":"Commande SV-VL","pourquoi":"La note dit ordinateur : vision intermédiaire, pas de loin."}],"expl":"Pas d’ADD → SV. La note dit le champ : ordinateur = intermédiaire → « Commande SV-VI ».","source":"d3–d4, d8, d38"},{"id":"b-091","fam":"b-sv-multi","kc":"B8.3","mod":9,"k":"qcm","q":"Une Rx sans ADD porte « Notes: Lecture ». Quelle commande ?","choix":[{"t":"SV-VP","ok":true},{"t":"Multifocal","pourquoi":"Sans ADD, pas de multifocale possible."},{"t":"SV-VI","pourquoi":"La lecture est un usage de près (30 à 40 cm), pas intermédiaire."},{"t":"SV-VL","pourquoi":"La note Lecture dit le près, pas le loin."}],"expl":"C’est la note qui dit le champ, pas le signe de la sphère : lecture = près = SV-VP.","source":"d3–d4, d7, d23"},{"id":"b-092","fam":"b-sv-multi","kc":"B8.4","mod":9,"k":"vf","q":"Selon les besoins visuels du patient, l’opticien peut adapter une Rx multifocale en Rx simple vision.","v":true,"expl":"Le cours : « l’opticien peut adapter l’ordonnance multifocal en ordonnance simple vision » (sic), centré sur les besoins visuels du patient.","source":"d1, d12"},{"id":"b-093","fam":"b-sv-multi","kc":"B8.4","mod":9,"k":"qcm","q":"Quand l’opticien adapte une Rx multifocale en SV, que doit-il respecter ?","choix":[{"t":"Les paramètres de l’ordonnance et son champ de pratique","ok":true},{"t":"Rien : il peut changer le cylindre s’il le juge utile","pourquoi":"Il respecte les paramètres de l’ordonnance : CYL et AXE se recopient."},{"t":"Une nouvelle Rx du prescripteur pour chaque champ","pourquoi":"Le cours dit que l’opticien peut adapter lui-même, selon les besoins du patient."},{"t":"La sphère d’origine, qui ne doit jamais changer","pourquoi":"La sphère, justement, reçoit une part de l’ADD ; CYL, AXE et prisme restent."}],"expl":"« tout en respectant les paramètres de l’ordonnance et son champ de pratique » : seul le SPH reçoit une part de l’ADD.","source":"d12"},{"id":"b-094","fam":"b-adapter","kc":"B8.5","mod":9,"k":"qcm","q":"OD +2.00 -0.25 x 135 1△BI Add +2.25 → SV-VL ?","choix":[{"t":"+2.00 -0.25 x 135 1△BI","ok":true},{"t":"+2.00 -0.25 x 135 1△BI Add +2.25","pourquoi":"L’ADD ne reste pas dans une Rx SV : « (Aucun Pouvoir d’ADD) »."},{"t":"+4.25 -0.25 x 135 1△BI","pourquoi":"En VL, on ajoute 0 % de l’ADD : la sphère ne change pas."},{"t":"+2.00 -0.25 x 135","pourquoi":"Le prisme se recopie : seule l’ADD disparaît."}],"expl":"« Addition 0% du pouvoir d’addition au SPH » : on transcrit SPH, CYL, AXE et le prisme, sans ADD.","source":"d14–d17"},{"id":"b-095","fam":"b-adapter","kc":"B8.5","mod":9,"k":"vf","q":"Pour une SV-VL, tu recopies SPH, CYL et AXE, et tu laisses tomber l’ADD.","v":true,"expl":"« (Aucun Pouvoir d’ADD) » « Transcrire » « SPH, CYL, AXE ». Le prisme, s’il y en a un, se recopie aussi.","source":"d14–d17"},{"id":"b-096","fam":"b-adapter","kc":"B8.6","mod":9,"k":"qcm","q":"OD -1.00 -0.50 x 164 Add +2.00 → SV-VP ?","choix":[{"t":"+1.00 -0.50 x 164","ok":true},{"t":"-3.00 -0.50 x 164","pourquoi":"Valeurs additionnées sans signe : (-1.00) + (+2.00) = +1.00."},{"t":"-1.00 +1.50 x 164","pourquoi":"L’ADD va au SPH, jamais au CYL."},{"t":"+1.00 -0.50 x 164 Add +2.00","pourquoi":"L’ADD est versée dans le SPH : elle ne reste pas dans la Rx SV."}],"expl":"« Additionne 100% du Pouvoir ADD au SPH » : « OD: (-1.00) + (+2.00) » = +1.00. « Transcrire CYL, AXE ».","source":"d24–d27"},{"id":"b-097","fam":"b-adapter","kc":"B8.6","mod":9,"k":"qcm","q":"OD -3.75 -0.25 x 125 Add +2.75 → SV-VP ?","choix":[{"t":"-1.00 -0.25 x 125","ok":true},{"t":"+1.00 -0.25 x 125","pourquoi":"Signe perdu : -3.75 monte de 2.75 et reste sous zéro, à -1.00."},{"t":"-6.50 -0.25 x 125","pourquoi":"Valeurs additionnées sans signe : l’ADD positive fait monter la sphère."},{"t":"-2.50 -0.25 x 125","pourquoi":"Ça, c’est la SV-VI (50 %). En VP, on ajoute toute l’ADD."}],"expl":"(-3.75) + (+2.75) = -1.00. Une Rx de près peut rester négative.","source":"d31"},{"id":"b-098","fam":"b-adapter","kc":"B8.6","mod":9,"k":"qcm","q":"OS Plano -0.25 x 015 2△BU Add +3.00 → SV-VP ?","choix":[{"t":"+3.00 -0.25 x 015 2△BU","ok":true},{"t":"Plano -0.25 x 015 2△BU","pourquoi":"Plano vaut zéro : 0 + 3.00 = +3.00 ; la sphère reçoit l’ADD."},{"t":"+3.00 -0.25 x 015","pourquoi":"Le prisme se recopie : 2△BU reste."},{"t":"Plano +2.75 x 015 2△BU","pourquoi":"L’ADD va au SPH, pas au CYL."}],"expl":"Plano = zéro : 0 + (+3.00) = +3.00. CYL, AXE et prisme recopiés : « 2△BU » reste sur l’OS.","source":"d29–d30"},{"id":"b-099","fam":"b-adapter","kc":"B8.7","mod":9,"k":"vf","q":"En SV-VP, le cylindre augmente avec l’ADD.","v":false,"expl":"Seul le SPH reçoit l’ADD : « Transcrire CYL, AXE ». -1.00 -0.50 x 164 Add +2.00 donne +1.00 -0.50 x 164.","source":"d24–d27"},{"id":"b-100","fam":"b-adapter","kc":"B8.7","mod":9,"k":"qcm","q":"En SV-VI ou en SV-VP, l’ADD disparaît. Quelle autre colonne change ?","choix":[{"t":"Seulement le SPH","ok":true},{"t":"Le SPH et le CYL","pourquoi":"Le CYL se recopie : « Transcrire CYL, AXE »."},{"t":"Le SPH et l’axe","pourquoi":"L’axe se recopie, comme le CYL et le prisme."},{"t":"Aucune : on recopie tout","pourquoi":"Tout recopier, c’est la SV-VL. En VI et en VP, le SPH reçoit 50 % ou 100 % de l’ADD."}],"expl":"SPH + une part de l’ADD ; CYL, AXE et prisme transcrits ; l’ADD disparaît.","source":"d24, d39"},{"id":"b-101","fam":"b-adapter","kc":"B8.7","mod":9,"k":"qcm","q":"-1.00 -0.50 x 164 Add +2.00 : au loin, la croix porte -1.00 sur 164 et -1.50 sur 074. Que porte la croix de la SV-VP ?","choix":[{"t":"+1.00 sur 164 et +0.50 sur 074 : les deux montent de 2.00","ok":true},{"t":"+1.00 sur 164 et -1.50 sur 074 : seul l’axe monte","pourquoi":"L’ADD monte la sphère, donc les deux méridiens : SPH et SPH + CYL."},{"t":"+1.00 sur 164 et +1.50 sur 074 : le cylindre change de signe","pourquoi":"Le CYL reste -0.50 : +1.00 + (-0.50) = +0.50."},{"t":"+1.00 sur 074 et +0.50 sur 164 : les bras tournent","pourquoi":"L’axe se recopie : la sphère reste sur 164."}],"expl":"Ajouter +2.00 au SPH monte les deux méridiens de +2.00. Leur écart (le CYL) et leur place (l’axe) ne bougent pas.","source":"d27 ; M7 ① ② (déduit)"},{"id":"b-102","fam":"b-adapter","kc":"B8.7","mod":9,"k":"vf","q":"En SV-VI, tu recopies le SPH d’origine et tu ajoutes la moitié de l’ADD au cylindre.","v":false,"expl":"C’est l’inverse : « Additionne 50% du Pouvoir ADD au SPH », puis « Transcrire CYL, AXE ».","source":"d39"},{"id":"b-103","fam":"b-adapter","kc":"B8.8","mod":9,"k":"qcm","q":"OD -1.00 -0.50 x 164 Add +2.00 → SV-VI ?","choix":[{"t":"Plano -0.50 x 164","ok":true},{"t":"+1.00 -0.50 x 164","pourquoi":"Toute l’ADD ajoutée : ça, c’est la SV-VP. En VI, on ajoute 50 %."},{"t":"-2.00 -0.50 x 164","pourquoi":"Signe perdu : (-1.00) + (+1.00) = zéro, donc Plano."},{"t":"-1.00 +0.50 x 164","pourquoi":"La part d’ADD va au SPH, pas au CYL."}],"expl":"« OD: (-1.00) + (+2.00/2) = (-1.00) + (+1.00) = 0/Plano ». CYL et AXE transcrits.","source":"d39–d42"},{"id":"b-104","fam":"b-adapter","kc":"B8.8","mod":9,"k":"qcm","q":"OD +3.25 -1.75 x 030 2△BD Add +2.50 → SV-VI ?","choix":[{"t":"+4.50 -1.75 x 030 2△BD","ok":true},{"t":"+5.50 -1.75 x 030 2△BD","pourquoi":"Coquille de la diapo d44, confirmée par la prof : +3.25 + 1.25 = +4.50."},{"t":"+5.75 -1.75 x 030 2△BD","pourquoi":"Toute l’ADD ajoutée : c’est la SV-VP. En VI, la moitié, +1.25."},{"t":"+4.50 -1.75 x 030","pourquoi":"Le prisme se recopie : 2△BD reste."}],"expl":"Moitié de +2.50 = +1.25, déjà sur un quart. (+3.25) + (+1.25) = +4.50. La diapo écrit +5.50 : coquille confirmée en classe.","source":"d43–d45 (coquille corrigée le 9 nov.)"},{"id":"b-105","fam":"b-adapter","kc":"B8.9","mod":9,"k":"qcm","q":"Plano Add +2.75 → SV-VI ?","choix":[{"t":"+1.25","ok":true},{"t":"+1.50","pourquoi":"Arrondi vers le haut : pour l’intermédiaire, on prend « l’addition le plus faible » (sic)."},{"t":"+1.375","pourquoi":"1.375 n’est pas un p donnent toutes deux +1.00 en SV-VI. La SV-VP, elle, rend l’ADD exacte.","fam":"b-envers","kc":"B8.11","mod":9,"source":"Mod 8.1 d12, d14–d54 (à rebours : dérivé) ; module 10, d15, d29"},{"id":"b-120","k":"ordre","q":"Remets dans l’ordre : retrouver la Rx multifocale d’origine à partir d’une SV-VP et de l’ADD.","etapes":["Lis la sphère de la SV-VP","Retire 100 % de l’ADD : c’est la sphère de loin","Recopie le CYL, l’axe et le prisme","Ajoute l’ADD en fin de ligne"],"expl":"C’est l’adaptation à l’envers : la SV-VP avait reçu toute l’ADD, on la retire de la sphère, puis l’ADD revient en fin de ligne.","fam":"b-envers","kc":"B8.11","mod":9,"source":"Mod 8.1 d12, d14–d54 (à rebours : dérivé) ; module 10, d15, d29"},{"id":"b-121","k":"qcm","q":"Le dossier montre « rx original » (avec l’ADD) et, dessous, la « rx SV-VL ». Le patient veut des lunettes de loin. Laquelle part au laboratoire ?","choix":[{"t":"La rx SV-VL, sans ADD","ok":true},{"t":"La rx original, avec son ADD","pourquoi":"Avec l’ADD, le laboratoire ferait un verre multifocal : ce n’est pas la commande voulue."},{"t":"Les deux, pour que le labo choisisse","pourquoi":"C’est l’opticien qui adapte et commande une seule Rx, selon les besoins du patient."},{"t":"Aucune : le labo travaille avec la croix","pourquoi":"La croix sert à analyser la Rx, pas à la commander."}],"expl":"La Rx commandée est la Rx adaptée au besoin : ici la SV-VL, qui a gardé la sphère de loin et perdu l’ADD.","fam":"b-envers","kc":"B8.11","mod":9,"source":"Mod 8.1 d12, d14–d54 (à rebours : dérivé) ; module 10, d15, d29"}]};
const FIGURES = {};
/* Générateurs du drill Bureau UA2 : une ordonnance neuve à chaque calcul. Écrits d'après la spec « generateurs » de
   banque-notions.json (règles, notation, cas limites et exemples du cours, 14 nov.). Notation du cours : signe toujours
   écrit, deux décimales, point décimal, tiret pour le moins, Plano pour zéro, axe à trois chiffres (x 045), prisme collé
   à sa base (1△BU), Add +2.00 en fin de ligne. Testés par test_generateurs.js (exemples du cours recalculés). */
const GENERATEURS = (() => {
  const Q = n => Math.round(n * 4) / 4;
  const proche = (a, b) => Math.abs(a - b) < 0.005;
  const un = a => a[Math.floor(Math.random() * a.length)];
  const entre = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pw = x => (Math.abs(x) < 0.005 ? 'Plano' : (x > 0 ? '+' : '-') + Math.abs(x).toFixed(2));   /* une sphère, un pouvoir */
  const cy = x => (x > 0 ? '+' : '-') + Math.abs(x).toFixed(2);                                    /* un cylindre : jamais Plano */
  const ax = a => String(a).padStart(3, '0');
  const rx = (s, c, a) => pw(s) + (c ? ' ' + cy(c) + ' x ' + ax(a) : '');
  const m2 = a => (a <= 90 ? a + 90 : a - 90);   /* ③ : ≤ 090 on ajoute, sinon on enlève ; reste entre 001 et 180 */
  const op = a => (a <= 90 ? ' + 090 = ' : ' - 090 = ');
  const oeil = () => un(['OD', 'OS']);
  const sphere = (min, max) => (Math.random() < 0.1 ? 0 : Q(entre(min * 4, max * 4) / 4));
  const cylindre = () => un([0.25, 0.50, 0.75, 1.00, 1.25, 1.50, 1.75, 2.00, 2.50, 3.00]);
  const axe = () => (Math.random() < 0.3 ? un([90, 180, 45, 135, 5, 95, 175, 85, 1, 91, 89, 179]) : entre(1, 180));
  const prisme = () => entre(1, 3) + '△' + un(['BU', 'BD', 'BI', 'BO']);
  const add = () => un([1.00, 1.25, 1.50, 1.75, 2.00, 2.25, 2.50, 2.75, 3.00]);
  const addTxt = x => 'Add +' + x.toFixed(2);

  /* ---------- transposition (7.1T-d8 et la vidéo) ---------- */
  function transposition(){
    let s, c;
    do { s = sphere(-8, 6); c = un([-1, 1]) * cylindre(); } while(Math.abs(s + c) > 12);
    const a = axe(), r = Math.random();
    const extras = r < 0.25 ? ' ' + addTxt(add()) : r < 0.4 ? ' ' + prisme() : r < 0.5 ? ' ' + prisme() + ' ' + addTxt(add()) : '';
    const s2 = Q(s + c), c2 = -c, a2 = m2(a), o = oeil();
    return {k:'rx', q:'Transpose cette ordonnance : ' + o + ' ' + rx(s, c, a) + extras + '.',
      rep:{sph:s2, cyl:c2, axe:a2}, repTxt:o + ' ' + rx(s2, c2, a2) + extras,
      extra:extras ? 'Le prisme et l’addition n’ont pas de case ici : tu sais ce qu’ils deviennent.' : '',
      dem:[['Étape 1 : nouveau SPH', '(' + pw(s) + ') + (' + cy(c) + ') = ' + pw(s2)], ['Étape 2 : nouveau CYL', cy(c) + ' devient ' + cy(c2)],
        ['Étape 3 : nouvel axe', ax(a) + op(a) + ax(a2)], ['Étape 4 : prisme et ADD', extras ? extras.trim() + ' demeure' : 'rien d’autre à recopier']],
      pieges:[
        {test:x => (x.axe === a ? 'L’axe change aussi : ' + ax(a) + op(a) + ax(a2) + '.' : '')},
        {test:x => (proche(x.cyl, c) ? 'Le CYL garde sa valeur mais change de signe : ' + cy(c) + ' devient ' + cy(c2) + '.' : '')},
        {test:x => (proche(x.sph, s) && !proche(s, s2) ? 'Le SPH change aussi : nouveau SPH = SPH + CYL.' : '')},
        {test:x => (proche(x.sph, Q(s - c)) && !proche(s - c, s2) ? 'C’est SPH + CYL, une somme algébrique : (' + pw(s) + ') + (' + cy(c) + ').' : '')},
        {test:x => (x.axe > 180 || x.axe < 1 ? 'L’axe doit rester entre 001 et 180 : ici ' + ax(a) + op(a) + ax(a2) + '.' : '')}
      ],
      expl:'La transposée donne la même croix : « Même puissance d’optique! ». Nouveau SPH = SPH + CYL, le CYL change de signe, l’axe ± 090 (entre 001 et 180) ; prisme et ADD demeurent.',
      source:'7.1T-d8, vidéo Transposition'};
  }

  /* ---------- la croix : ① ② ③ (7.2-d18, 7.3-d15) ---------- */
  function croix(){
    let s, c;
    do { s = sphere(-7, 5); c = Math.random() < 0.8 ? -cylindre() : cylindre(); } while(Math.abs(s + c) > 10);
    const a = axe(), a2 = m2(a), p2 = Q(s + c), o = oeil(), ligne = o + ' ' + rx(s, c, a), sorte = un(['axe', 'deux', 'meridien']);
    const dem = [['① La sphère', pw(s) + ' sur ' + ax(a)], ['② Le 2e pouvoir', '(' + pw(s) + ') + (' + cy(c) + ') = ' + pw(p2)], ['③ Le 2e méridien', ax(a) + op(a) + ax(a2)]];
    const expl = 'La croix de ' + ligne + ' : ' + pw(s) + ' sur ' + ax(a) + ', ' + pw(p2) + ' sur ' + ax(a2) + '. « SPH + CYL = Force du 2e méridien ».';
    if(sorte === 'meridien') return {k:'num', q:'Sur la croix optique de ' + ligne + ', quel est le 2e méridien ?',
      rep:{v:a2, u:'', tol:0.1, dec:0}, repTxt:ax(a2), dem, expl, source:'7.3-d15',
      pieges:[{v:a, m:'Ça, c’est le méridien de l’axe (la sphère). L’autre est à angle droit : ± 090.'}, {v:a + 90, m:'Le méridien doit rester entre 001 et 180 : ici on enlève 090.'}, {v:a - 90, m:'Le méridien doit rester entre 001 et 180 : ici on ajoute 090.'}]};
    if(sorte === 'axe') return {k:'num', q:'Sur la croix optique de ' + ligne + ', quel pouvoir va sur le méridien ' + ax(a) + ' ?',
      rep:{v:s, u:'D', tol:0.01, dec:2, signe:true}, repTxt:pw(s), dem, expl, source:'7.2-d18',
      pieges:[{v:p2, m:'Ça, c’est le pouvoir du 2e méridien (SPH + CYL). Sur le méridien de l’axe, on met la sphère.'}, {v:c, m:'Le CYL seul ne va sur aucun bras : sur le méridien de l’axe, c’est la sphère.'}]};
    return {k:'num', q:'Sur la croix optique de ' + ligne + ', quel pouvoir va sur le méridien ' + ax(a2) + ' ?',
      rep:{v:p2, u:'D', tol:0.01, dec:2, signe:true}, repTxt:pw(p2), dem, expl, source:'7.2-d18',
      pieges:[{v:s, m:'Ça, c’est le pouvoir du méridien de l’axe. Le 2e méridien porte SPH + CYL.'}, {v:c, m:'Pas le CYL seul : le 2e méridien porte SPH + CYL.'}, {v:Q(s - c), m:'C’est une somme algébrique : (' + pw(s) + ') + (' + cy(c) + ').'}]};
  }

  /* ---------- le type d'astigmatisme, d'après les deux pouvoirs (7.3-d32, d35) ---------- */
  const TYPES_A = {
    ms:{t:'Astigmatisme myope simple', def:'un méridien Plano et l’autre négatif'},
    hs:{t:'Astigmatisme hypermétrope simple', def:'un méridien Plano et l’autre positif'},
    mc:{t:'Astigmatisme myope composé', def:'deux méridiens négatifs différents'},
    hc:{t:'Astigmatisme hypermétrope composé', def:'deux méridiens positifs différents'},
    mx:{t:'Astigmatisme mixte', def:'un méridien positif et un méridien négatif'}
  };
  function typeAstig(){
    const cle = un(Object.keys(TYPES_A)), q4 = (a, b) => Q(entre(a * 4, b * 4) / 4);
    let p1, p2;   /* p1 ≥ p2 : la Rx en CYL négatif s'en déduit (SPH = le plus positif) */
    if(cle === 'ms'){ p1 = 0; p2 = -q4(0.25, 3); }
    else if(cle === 'hs'){ p1 = q4(0.25, 3); p2 = 0; }
    else if(cle === 'mc'){ p1 = -q4(0.25, 5); p2 = p1 - q4(0.25, 3); }
    else if(cle === 'hc'){ p2 = q4(0.25, 4); p1 = p2 + q4(0.25, 3); }
    else { p1 = q4(0.25, 3); p2 = -q4(0.25, 3); }
    const a = axe(), a2 = m2(a), ligne = oeil() + ' ' + rx(p1, Q(p2 - p1), a);
    const ici = ' Ici : ' + pw(p1) + ' sur ' + ax(a) + ' et ' + pw(p2) + ' sur ' + ax(a2) + '.';

const SESS = {n:0, net:0, rappels:[], dernierFam:'', dernierType:'', decouverte:false, avis:[], mg:null};

/* ---------- la prochaine question : les rappels d'abord (une autre question de la même notion si possible) ---------- */
function prochain(){

  const du = SESS.rappels.find(x => x.dans <= 0 && l.some(t => t.fam === x.fam && t.fam !== SESS.dernierFam));
  if(du){

    const meme = l.filter(t => t.kc && t.kc === du.kc && t.id !== du.id), fam = l.filter(t => t.fam === du.fam && t.id !== du.id);
    const vu = t => D.typ[t.id] || 0, pire = a => a.sort((x, y) => vu(x) - vu(y))[0];
    return (meme.length ? pire(meme) : fam.length ? pire(fam) : null) || l.find(t => t.id === du.id) || l[0];
  }
  const r = choisirType(l, {fam:D.fam, typ:D.typ, it:D.it, dernierFam:SESS.dernierFam, dernierType:SESS.dernierType, decouverte:SESS.decouverte});

const melange = a => { if(a.length < 2) return a.slice(); let r; do { r = a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]); } while(r.every((x, i) => x === a[i])); return r; };

      ? '<p class="msg ok">Aucune erreur en attente : chaque question ratée a été réussie depuis. Choisis une autre portée en haut.</p>'
      : '<p class="msg warn">Aucune notion allumée. Allume celles que tu veux pratiquer sur ta carte (à droite, ou plus bas sur un téléphone), et la question suivante arrive.</p>';

  if(p.k === 'ordre') p.ordreEtapes = melange(p.etapes.map((e, i) => i));

/* ce qu'il reste dans la pile guidée d'un module */
const resteGuide = m => famsDuModule(m).filter(f => !reussi(D.fam[f])).length;
const notions = n => n + ' notion' + (n > 1 ? 's' : '');
function avisGuide(m, avant){
  if(m === undefined) return {c:'ok', t:'Tous les modules sont réussis ✓. La progression guidée passe en entretien : tout l’UA2, mêlé.'};
  const k = resteGuide(m), n = famsDuModule(m).length;
  if(typeof avant === 'number' && !resteGuide(avant)) return {c:'ok', t:modLong(avant) + ' : terminé ✓. Ensuite, ' + modLong(m) + ' : ' + notions(k) + ' à réussir.' + (m === APRES && REP.badge ? ' Rappel : ' + REP.badge.toLowerCase() + '.' : '')};
  return {c:'info', t:'Progression guidée · ' + modLong(m) + ' : ' + notions(k) + ' à réussir' + (k < n ? ' (sur ' + n + ')' : '') + '. Chacune sort de ta pile dès qu’elle est réussie.'};

/* une table du cours (carte.tableau) : « paires » (deux colonnes, en grille compacte) ou un tableau ordinaire.
   o.ligne : la ligne à surligner (une fois la question finie) */
function tableauHtml(T, o = {}){
  if(!T || !T.lignes) return '';

  if(T.forme === 'paires'){
    h += '<p class="tableau-c">' + esc(T.cols.join(' → ')) + '</p><dl class="paires">' + T.lignes.map(([a, b]) => '<div class="' + (String(a) === String(o.ligne) ? 'ta-ligne' : String(a) === String(T.fort) ? 'fort' : '') + '"><dt>' + esc(a) + '</dt><dd>' + esc(b) + '</dd></div>').join('') + '</dl>';
  } else {
    h += '<div class="tab-wrap"><table class="tab-libre"><thead><tr>' + T.cols.map(c => '<th scope="col">' + esc(c) + '</th>').join('') + '</tr></thead><tbody>'
      + T.lignes.map(r => '<tr>' + r.map((c, i) => i ? '<td>' + esc(c) + '</td>' : '<th scope="row">' + esc(c) + '</th>').join('') + '</tr>').join('') + '</tbody></table></div>';
  }

function plancheHtml(v){

/* le SVG est posé après nb(), pour ne pas y toucher ; les repères entourés s'ajoutent par-dessus */
function poserPlanches(racine){

    const F = FIGURES[z.dataset.planche], ici = z.dataset.ici ? z.dataset.ici.split(' ') : [];
    const vb = (F.svg.match(/viewBox="([^"]+)"/) || [0, '0 0 460 300'])[1].split(/[\s,]+/).map(Number), trait = (vb[2] / 130).toFixed(1);
    /* une place : [x, y] ou [x, y, r] (un cercle), [x, y, l, h] (un cadre) ; ou une liste de places */
    const une = q => q.length > 3
      ? '<rect x="' + (q[0] - 5) + '" y="' + (q[1] - 5) + '" width="' + (q[2] + 10) + '" height="' + (q[3] + 10) + '" rx="12" fill="none" stroke="#D92D20" stroke-width="' + trait + '"/>'
      : '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="' + (q[2] || 19) + '" fill="none" stroke="#D92D20" stroke-width="' + trait + '"/>';
    const marques = ici.filter(k => F.pos && F.pos[k]).map(k => (Array.isArray(F.pos[k][0]) ? F.pos[k] : [F.pos[k]]).map(une).join('')).join('');

  + 'process(i,o){const s=o[0];if(s&&s[0])this.a.process(s[0],s[1]||s[0],s[0].length);return !this.fini;}}\n'
  + 'registerProcessor("bruit-lumiere",P);';
let ctx = null, maitre = null, analyse = null, courant = null, joue = '', charge = '', module = null, jeton = 0, tampon = null;
function contexte(){
  if(ctx) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return false;
  ctx = new AC(); maitre = ctx.createGain(); analyse = ctx.createAnalyser(); analyse.fftSize = 2048;
  /* un limiteur avant la sortie : rien ne doit jamais surprendre dans des écouteurs */
  const limite = ctx.createDynamicsCompressor();
  limite.threshold.value = -8; limite.knee.value = 6; limite.ratio.value = 12; limite.attack.value = 0.003; limite.release.value = 0.2;
  maitre.connect(limite); limite.connect(analyse); limite.connect(ctx.destination);
  if(ctx.audioWorklet && window.AudioWorkletNode && window.Blob && window.URL){
    const url = URL.createObjectURL(new Blob([WORKLET], {type:'application/javascript'}));
    module = ctx.audioWorklet.addModule(url).then(() => true, () => false);
  } else module = Promise.resolve(false);
  return true;
}
/* un bruit : le moteur, branché sur « sortie ». Rend de quoi l'arrêter */
function bruit(nom, sortie){
  return module.then(ok => {
    let n;
    if(ok) n = new AudioWorkletNode(ctx, 'bruit-lumiere', {numberOfInputs:0, numberOfOutputs:1, outputChannelCount:[2], processorOptions:{nom}});
    else {
      const a = fabriqueCouleurs().creer(nom, ctx.sampleRate, Math.random);
      n = ctx.createScriptProcessor(2048, 1, 2);
      n.onaudioprocess = e => { const b = e.outputBuffer; a.process(b.getChannelData(0), b.getChannelData(1), b.length); };
    }
    return {type:n.port ? 'worklet' : 'script', lancer(){ n.connect(sortie); }, fin(){ try{ n.disconnect(); }catch(e){} if(n.port) n.port.postMessage('fin'); else n.onaudioprocess = null; }};
  });
}
/* une prise de son : le fichier, cherché à côté de la page (le site), dans _commun/sons (le dossier de travail), puis sur
   le site depuis n'importe où. Une seule reste en mémoire à la fois (une minute et demie de son décodé pèse 40 Mo) */
function charger(nom){
  if(tampon && tampon.nom === nom) return Promise.resolve(tampon.buf);
  tampon = null;
  const f = PRISES[nom] + '?v=' + V_SONS;
  const ici = /^https?:$/.test(location.protocol) ? ['sons/', '../_commun/sons/', '../../sons/'].map(b => new URL(b, document.baseURI).href) : [];
  const bases = ici.concat(LUMIERE + 'sons/').filter((b, i, l) => l.indexOf(b) === i);
  const essai = i => i >= bases.length ? Promise.reject(new Error('son'))
    : fetch(bases[i] + f).then(r => { if(!r.ok) throw new Error('absent'); return r.arrayBuffer(); })
        .then(ab => new Promise((ok, ko) => ctx.decodeAudioData(ab, ok, ko)))
        .then(buf => { if(!buf || buf.duration < 20) throw new Error('court'); return buf; })
        .catch(() => essai(i + 1));
  return essai(0).then(buf => { tampon = {nom, buf}; return buf; });
}
/* le fondu à puissance égale : la somme des deux passages garde le même niveau */
const MONTE = new Float32Array(64), DESCEND = new Float32Array(64);
for(let i = 0; i < 64; i++){ const u = i / 63 * Math.PI / 2; MONTE[i] = Math.sin(u); DESCEND[i] = Math.cos(u); }
/* la boucle : le premier passage part d'un endroit au hasard ; chaque passage finit en fondu pendant que le suivant
   commence. Il y a toujours un passage d'avance, posé à l'échantillon près dès que le précédent se tait : aucune
   minuterie, donc rien ne se décale dans un onglet caché */
function boucle(buf, sortie){
  const debut = BORD, fin = buf.duration - BORD, X = Math.min(FONDU, (fin - debut) / 4), passes = new Set();
  let vivant = true, prochain = 0;
  const passe = (t, depuis, entree) => {
    const s = ctx.createBufferSource(), g = ctx.createGain(), duree = fin - depuis;
    s.buffer = buf; s.connect(g); g.connect(sortie);
    if(entree) g.gain.setValueCurveAtTime(MONTE, t, X); else g.gain.setValueAtTime(1, t);
    g.gain.setValueCurveAtTime(DESCEND, t + duree - X, X);
    s.onended = () => { passes.delete(s); try{ g.disconnect(); }catch(e){} if(vivant) prochain = passe(prochain, debut, true); };
    s.start(t, depuis, duree); passes.add(s);
    return t + duree - X;
  };
  prochain = passe(ctx.currentTime + 0.05, debut + Math.random() * Math.max(0, fin - debut - 3 * X - 1), false);
  prochain = passe(prochain, debut, true);
  return {type:'prise', lancer(){}, fin(){ vivant = false; passes.forEach(s => { try{ s.stop(); }catch(e){} }); passes.clear(); }};
}
function arreter(){
  jeton++; charge = '';
  if(!courant) return;
  const c = courant, t = ctx.currentTime;
  courant = null; joue = '';
  c.sortie.gain.cancelScheduledValues(t); c.sortie.gain.setTargetAtTime(0, t, 0.08);
  setTimeout(() => { if(c.source) c.source.fin(); try{ c.sortie.disconnect(); }catch(e){} }, 600);
}
function jouer(nom){
  if(!contexte()) return false;
  if(ctx.state === 'suspended') ctx.resume();
  arreter();
  const mien = ++jeton, sortie = ctx.createGain(), prise = !!PRISES[nom];
  sortie.gain.value = 0; sortie.connect(maitre);
  if(!prise) tampon = null;   /* un bruit n'a pas besoin de la prise de son gardée en mémoire */
  courant = {sortie, source:null}; joue = nom; charge = prise && !(tampon && tampon.nom === nom) ? nom : '';
  regler(etat.vol);
  (prise ? charger(nom).then(buf => (mien === jeton ? boucle(buf, sortie) : null)) : bruit(nom, sortie)).then(src => {
    if(mien !== jeton || !courant){ if(src) src.fin(); return; }
    courant.source = src; src.lancer(); charge = '';
    sortie.gain.setTargetAtTime(1, ctx.currentTime, prise ? 0.5 : 0.3);
    dire(''); peindre();
  }, () => {
    if(mien !== jeton) return;
    arreter(); dire('Ce son se télécharge à la première écoute : vérifie ta connexion, puis touche-le encore.'); peindre();
  });
  etat.son = nom; garder();
  return true;
}
/* le volume : au carré, pour que le curseur suive l'oreille */
function regler(v){ etat.vol = v; if(maitre) maitre.gain.setTargetAtTime(v * v * 0.9, ctx.currentTime, 0.04); }

/* ---------- le bouton et son panneau ---------- */
const style = document.createElement('style');
style.textContent = `
.bruit{position:fixed;z-index:15;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;font:15px/1.4 var(--f-body,system-ui,sans-serif)}
.bruit-btn{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line,#D3DBE0);background:var(--panel,#fff);color:var(--ink-2,#465763);cursor:pointer;box-shadow:0 2px 10px rgba(8,12,16,.14)}

.bruit-btn svg{width:22px;height:22px}
.bruit.joue .bruit-btn{background:var(--accent,#0F6E8C);border-color:var(--accent,#0F6E8C);color:var(--on-accent,#fff)}

.bruit.joue .bruit-btn path:nth-child(3){animation-delay:-.6s}
.bruit.joue .bruit-btn path:nth-child(4){animation-delay:-.15s}
.bruit.joue .bruit-btn path:nth-child(5){animation-delay:-.45s}
@keyframes bruit-barre{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.bruit-panneau{width:min(290px,calc(100vw - 28px));max-height:calc(100vh - 140px);overflow-y:auto;padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;border-radius:14px;border:1px solid var(--line,#D3DBE0);background:var(--panel,#fff);color:var(--ink,#13202A);box-shadow:0 8px 28px rgba(8,12,16,.2)}
.bruit-panneau[hidden]{display:none}
.bruit-t{margin:0;font:600 12px var(--f-mono,ui-monospace,monospace);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3,#5F717D)}
.bruit-g{margin:2px 0 -4px;font-size:12.5px;color:var(--ink-3,#5F717D)}
.bruit-sons{display:flex;flex-wrap:wrap;gap:6px}
.bruit-son{min-height:38px;padding:5px 12px;border:1px solid var(--line,#D3DBE0);border-radius:999px;background:var(--panel-2,#F3F6F8);color:inherit;font:inherit;cursor:pointer}
.bruit-son:hover{border-color:var(--accent,#0F6E8C)}
.bruit-son[aria-pressed="true"]{background:var(--accent,#0F6E8C);border-color:var(--accent,#0F6E8C);color:var(--on-accent,#fff);font-weight:700}
.bruit-son[aria-busy="true"]{animation:bruit-charge 1s ease-in-out infinite}
@keyframes bruit-charge{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.bruit.joue .bruit-btn path,.bruit-son[aria-busy="true"]{animation:none}}
.bruit-vol{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2,#465763)}
.bruit-vol input{flex:1;min-width:0;height:28px;accent-color:var(--accent,#0F6E8C)}
.bruit-aide{margin:0;font-size:12.5px;line-height:1.35;color:var(--ink-3,#5F717D)}
.bruit-aide:empty{display:none}
.bruit-credits{font-size:12px;line-height:1.4;color:var(--ink-3,#5F717D)}
.bruit-credits summary{cursor:pointer;min-height:24px}
.bruit-credits p{margin:4px 0 0}
.bruit-credits a{color:inherit}
@media print{.bruit{display:none}}`;
document.head.appendChild(style);

const AIDE = 'Touche un son pour le lancer, touche-le encore pour l’arrêter.';
const puces = l => '<div class="bruit-sons">' + l.map(([k, t]) => '<button type="button" class="bruit-son" data-son="' + k + '" aria-pressed="false">' + t + '<\/button>').join('') + '<\/div>';
const racine = document.createElement('div');
racine.className = 'bruit';
racine.innerHTML = '<div class="bruit-panneau" id="bruit-panneau" role="group" aria-label="Bruit de fond" hidden><p class="bruit-t">Bruit de fond<\/p>'
  + '<p class="bruit-g">Ambiances (de vraies prises de son)<\/p>' + puces(AMBIANCES)
  + '<p class="bruit-g">Bruits<\/p>' + puces(BRUITS)
  + '<label class="bruit-vol"><span>Volume<\/span><input type="range" min="0" max="100" step="1" id="bruit-vol" aria-label="Volume du bruit de fond"><\/label>'
  + '<p class="bruit-aide" id="bruit-aide" role="status">' + AIDE + '<\/p>'
  + '<details class="bruit-credits"><summary>D’où viennent les ambiances<\/summary><p>Enregistrées dehors, par des preneurs de son qui les ont placées dans le domaine public (radio aporee, sur l’<a href="https://archive.org/details/radio-aporee-maps" target="_blank" rel="noopener">Internet Archive<\/a>). Les vagues : Félix Blume, Caleta Portales, au Chili. La pluie : David J. Pitt, Malvern Wells, en Angleterre. Le vent dans les pins : Bojan Marušič, Miren, en Slovénie. Le feu de camp : Jeremy Hegge, Royal National Park, en Australie.<\/p><\/details><\/div>'
  + '<button type="button" class="bruit-btn" id="bruit-btn" aria-expanded="false" aria-controls="bruit-panneau" aria-label="Bruit de fond pour se concentrer" title="Bruit de fond">'
  + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/><\/svg><\/button>';
document.body.appendChild(racine);
const $ = s => racine.querySelector(s), panneau = $('#bruit-panneau'), bouton = $('#bruit-btn'), curseur = $('#bruit-vol');
curseur.value = Math.round(etat.vol * 100);
const nomDe = k => SONS.find(([x]) => x === k)[1];
function dire(t){ $('#bruit-aide').textContent = t || (charge ? nomDe(charge) + ' : chargement…' : AIDE); }
function peindre(){
  racine.classList.toggle('joue', !!joue && !charge);
  racine.querySelectorAll('[data-son]').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.son === joue)); if(b.dataset.son === charge) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy'); });
  bouton.setAttribute('aria-label', joue ? 'Bruit de fond : ' + nomDe(joue) + (charge ? ', chargement' : ' joue') : 'Bruit de fond pour se concentrer');
}
function ouvrir(v){ panneau.hidden = !v; bouton.setAttribute('aria-expanded', String(v)); if(v){ const b = racine.querySelector('[data-son="' + (joue || etat.son || 'pluie') + '"]'); if(b) b.focus({preventScroll:true}); } }
/* les gestes restent dans le module : la page ne les voit pas (ses raccourcis clavier non plus). Un bouton qu'une page
   pose dans ce coin (au-dessus du bouton de bruit) s'écoute lui-même : son clic ne remonte pas plus haut non plus */
racine.addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('button'); if(!b || !panneau.contains(b) && b !== bouton) return;
  if(b === bouton){ ouvrir(panneau.hidden); return; }
  const k = b.dataset.son; if(!k) return;
  if(joue === k){ arreter(); dire(''); }
  else if(jouer(k)) dire('');
  else dire('Ton navigateur ne peut pas jouer de son ici.');
  peindre();
});
racine.addEventListener('keydown', e => { e.stopPropagation(); if(e.key === 'Escape' && !panneau.hidden){ ouvrir(false); bouton.focus({preventScroll:true}); } });
curseur.addEventListener('input', () => { regler(curseur.value / 100); garder(); });
document.addEventListener('click', () => { if(!panneau.hidden) ouvrir(false); });
peindre();

/* pour les tests : ce qui joue, par quel chemin, et le niveau mesuré à la sortie (0 = silence) ; boucle, ctx, tampon :
   pour répéter la boucle sur un court extrait. racine, bouton, fermer : le coin et son bouton, pour qu'une page y pose
   le sien (au-dessus) */
window.__bruit = {SONS, PRISES, racine, bouton, boucle, ctx:() => ctx, tampon:() => tampon && tampon.buf, fermer:() => ouvrir(false), jouer:k => { const r = jouer(k); dire(''); peindre(); return r; }, arreter:() => { arreter(); dire(''); peindre(); },
  etat:() => ({joue, charge, vol:etat.vol, dernier:etat.son, contexte:ctx ? ctx.state : 'aucun', noeud:courant && courant.source ? courant.source.type : '', duree:tampon ? tampon.buf.duration : 0}),
  niveau(){ if(!analyse) return 0; const d = new Float32Array(analyse.fftSize); analyse.getFloatTimeDomainData(d); let s = 0; for(const x of d) s += x * x; return Math.sqrt(s / d.length); }};
})();

</script>
<script>
(() => {
  const ICI = 'a52a16f0a6ef';
  let montre = false;
  const verifier = () => {
    if(montre || location.protocol === 'file:') return;
    fetch('version.json?_=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(v => {
      if(!v || !v.version || v.version === ICI || montre) return;
      montre = true;
      const b = document.createElement('div');
      b.setAttribute('role', 'status');
      b.style.cssText = 'position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:400;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);padding:9px 10px 9px 14px;border-radius:12px;background:#0B0F1A;color:#F3F5FB;border:1px solid #9BF25C;font:600 14.5px system-ui,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.4)';
      const t = document.createElement('span'); t.textContent = 'Une nouvelle version de Lumière est prête.';
      const k = document.createElement('button'); k.type = 'button'; k.textContent = 'Recharger';
      k.style.cssText = 'border:0;border-radius:999px;padding:6px 14px;background:#9BF25C;color:#05070D;font:700 14px system-ui,sans-serif;cursor:pointer';
      k.addEventListener('click', () => location.reload());
      b.append(t, k); document.body.appendChild(b);
    }).catch(() => {});
  };
