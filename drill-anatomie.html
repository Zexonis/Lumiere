<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anatomie et physiologie oculaires, UA2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* L'exerciseur de notions : le moteur de « Quelle formule ? » (Optique UA2), pour des cours de notions. Des questions
   mêlées (QCM, vrai ou faux, calcul, mise en ordre, ordonnance), une carte des familles à côté, le critère du blueprint
   §4.2 (trois de suite, sans aide, en au moins cinq essais). Gabarit commun : Guides/_commun/drill-notions/gabarit.html,
   assemblé par construire.py avec la banque d'un cours. Couleurs : celles de « Quelle formule ? ». */
:root{
  --bg:#ECF0F2; --panel:#FFFFFF; --panel-2:#F3F6F8; --ink:#13202A; --ink-2:#465763; --ink-3:#5F717D; --line:#D3DBE0;
  --accent:#2C5BB0; --accent-soft:rgba(44,91,176,.11); --on-accent:#FFFFFF;
  --ok:#1B7A4B; --ok-soft:rgba(27,122,75,.12); --warn:#9A5F0C; --warn-soft:rgba(158,99,13,.14); --bad:#B3352A; --bad-soft:rgba(179,53,42,.11);
  --f-display:"STIX Two Text", Cambria, Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1217; --panel:#131B22; --panel-2:#19232B; --ink:#E1E7EB; --ink-2:#A7B3BC; --ink-3:#8494A0; --line:#26323B;
    --accent:#8DB4FF; --accent-soft:rgba(141,180,255,.15); --on-accent:#0C1217;
    --ok:#55C68E; --ok-soft:rgba(85,198,142,.14); --warn:#E5B256; --warn-soft:rgba(229,178,86,.14); --bad:#F2705F; --bad-soft:rgba(242,112,95,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1217; --panel:#131B22; --panel-2:#19232B; --ink:#E1E7EB; --ink-2:#A7B3BC; --ink-3:#8494A0; --line:#26323B;
  --accent:#8DB4FF; --accent-soft:rgba(141,180,255,.15); --on-accent:#0C1217;
  --ok:#55C68E; --ok-soft:rgba(85,198,142,.14); --warn:#E5B256; --warn-soft:rgba(229,178,86,.14); --bad:#F2705F; --bad-soft:rgba(242,112,95,.14);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 var(--f-body)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.page{max-width:1080px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.tete{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{margin:0;font:600 30px/1.1 var(--f-display);letter-spacing:-.01em}
.tete p{margin:0;color:var(--ink-2);font-size:15.5px}
.bande{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.puce{min-height:38px;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:15px}
.puce[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.puce .n{margin-left:5px;font:600 12px var(--f-mono);opacity:.8}
.compte{margin-left:auto;font:600 13px var(--f-mono);color:var(--ink-2)}
.corps{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.scene,.cote section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.scene{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:380px}
.sujet{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font:600 12.5px var(--f-mono);color:var(--ink-3)}
.sujet .chip{padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.sujet .sorte{padding:2px 9px;border-radius:999px;background:var(--panel-2)}
.enonce{margin:0;font-size:19px;line-height:1.5;max-width:64ch}
.tuiles{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.tuiles.deux{grid-template-columns:repeat(2,minmax(0,1fr))}
.tuile{display:flex;align-items:center;gap:10px;min-height:56px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);text-align:left;font-size:17px;line-height:1.35}
.tuile:hover:not(:disabled){border-color:var(--accent)}
.tuile kbd{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line);font:600 12px var(--f-mono);color:var(--ink-3)}
.tuile .f{min-width:0;overflow-wrap:anywhere}
.tuile.non{border-color:var(--bad);background:var(--bad-soft)}
.tuile.oui{border-color:var(--ok);background:var(--ok-soft)}
.tuile:disabled{cursor:default}
.qm{position:relative;flex:none;width:28px;height:28px;padding:0;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--ink-2);font:700 14px/1 var(--f-body)}
.qm::after{content:"";position:absolute;inset:-8px}
.qm:hover{border-color:var(--accent);color:var(--accent)}
.suite{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.suite li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:10px;background:var(--ok-soft);font-size:16.5px}
.suite li::before{content:counter(s);flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:var(--panel);font:600 12px var(--f-mono);color:var(--ink-2)}
.suite.vide-s li{background:var(--panel-2);color:var(--ink-3)}
.suite-t{margin:0;font-size:14px;font-weight:700;color:var(--ink-2)}
.expl-fond{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(8,12,16,.5)}
.expl{width:min(440px,100%);height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--panel);border-left:1px solid var(--line)}
.expl h2{margin:0;font:600 24px/1.2 var(--f-display);overflow-wrap:anywhere}
.expl h3{margin:0 0 3px;font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.expl p{margin:0}
.expl .haut{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.expl .ex{padding:10px 12px;border-radius:10px;background:var(--panel-2)}
.expl .piege{padding:10px 12px;border-radius:10px;background:var(--warn-soft)}
.expl small{color:var(--ink-3);font-size:13.5px}
.expl textarea{width:100%;min-height:42vh;padding:10px 12px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font:400 14px/1.5 var(--f-mono)}
.copie-note{flex-basis:100%;color:var(--ink-2);font-size:14.5px}
.saisie{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.saisie input{width:150px;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font:600 18px var(--f-mono)}
.saisie .u{color:var(--ink-2)}
.rx{display:flex;flex-wrap:wrap;gap:10px}
.rx label{display:flex;flex-direction:column;gap:3px;font:600 12px var(--f-mono);color:var(--ink-3)}
.rx input{width:110px;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font:600 18px var(--f-mono)}
.bouton.signe{min-width:46px;padding:8px 10px;font-size:18px}
.bouton{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:700}
.bouton:hover{border-color:var(--accent)}
.bouton.plein{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lien{border:0;background:none;padding:8px 2px;min-height:36px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:15px}
.lien.petit{align-self:flex-start;font-size:14px;color:var(--ink-3)}
.brouillon-boite{display:flex;flex-direction:column;gap:6px}
.brouillon-t{font-size:14px;font-weight:700;color:var(--ink-2)}
.brouillon-t .facultatif{font-weight:400;color:var(--ink-3)}
.brouillon{width:100%;min-height:104px;padding:10px 12px;border:1px dashed var(--ink-3);border-radius:10px;background:var(--panel-2);color:var(--ink);font:400 16px/1.55 var(--f-mono);resize:vertical}
.msg{margin:0;padding:10px 13px;border-radius:10px;font-size:16px}
.msg.bad{background:var(--bad-soft)}
.msg.warn{background:var(--warn-soft)}
.msg.ok{background:var(--ok-soft)}
.msg.info{background:var(--panel-2)}
.dem{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.dem li{display:grid;grid-template-columns:168px minmax(0,1fr);gap:10px;font-size:16px}
.dem .l{color:var(--ink-3);font-size:14px}
.dem .c{font-family:var(--f-mono);font-size:15px;overflow-wrap:anywhere}
.source{margin:0;color:var(--ink-3);font-size:13px}
.bas{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:auto}
.cote{display:flex;flex-direction:column;gap:12px}
.cote section{padding:14px}
.cote h2{margin:0 0 8px;font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.mod-t{margin:10px 0 2px;font:600 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fam{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:0 9px;margin:0 -7px;padding:6px 7px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.3}
.fam.tout,.mod-t + .fam{border-top:0}
.fam .nom small{margin-left:7px;color:var(--ink-3);font-size:12.5px}
.fam .nom small.bon{color:var(--ok);font-weight:700}
.fam .fin{display:flex;align-items:center;gap:7px}
.ser{display:inline-flex;gap:4px;align-items:center;flex:none}
.ser i{width:10px;height:10px;border-radius:50%;background:transparent;border:1px solid var(--ink-3);flex:none}
.ser i.on{background:var(--accent);border-color:var(--accent)}
.ser i.neuf{width:12px;height:12px;background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.ser i.perdu{background:transparent;border:1px dashed var(--bad)}
.fam.eteinte .nom{color:var(--ink-3)}
.fam.eteinte .fin{opacity:.55}
.fam.vient{border-radius:9px;border-top-color:transparent}
.fam.vient + .fam{border-top-color:transparent}
.fam.vient.ok{background:var(--ok-soft);box-shadow:inset 3px 0 0 var(--ok)}
.fam.vient.perdu{background:var(--bad-soft);box-shadow:inset 3px 0 0 var(--bad)}
.fam.vient.neutre{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--ink-3)}
.fam .tag{font:600 12.5px var(--f-mono);font-style:normal;white-space:nowrap}
.fam.vient.ok .tag{color:var(--ok)}
.fam.vient.perdu .tag{color:var(--bad)}
.legende{margin:9px 0 0;font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.inter{position:relative;flex:none;width:36px;height:21px;padding:0;border:1px solid var(--ink-3);border-radius:999px;background:var(--panel-2);cursor:pointer}
.inter::before{content:'';position:absolute;inset:-9px -6px}
.inter span{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--ink-3);transition:transform .15s ease}
.inter[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.inter[aria-checked="true"] span{transform:translateX(15px);background:var(--on-accent)}
.fam.tout{padding-bottom:8px}
.fam.tout .nom{font-weight:700}
.fam.tout .nom small{font-weight:400}
.aide-carte{margin:-2px 0 8px;font-size:12.5px;color:var(--ink-3);line-height:1.35}
.annonce-carte{margin:6px 0 0;font-size:12.5px;color:var(--warn)}
.annonce-carte:empty{display:none}
.maitrise{padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.m-ligne{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.m-t{margin:0;font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.m-pct{font:600 26px/1 var(--f-display)}
.m-delta{padding:1px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font:600 13px var(--f-mono)}
.m-delta.moins{background:var(--bad-soft);color:var(--bad)}
.jauge{flex:1 1 130px;min-width:110px;max-width:240px;height:8px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.jauge i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.m-rep,.m-vit{font-size:13.5px;color:var(--ink-2)}
.m-vit{margin-left:auto}
.calcul{margin-top:6px}
.seul-mobile{display:none}
.calcul summary{font-weight:400;font-size:13px;color:var(--ink-3)}
.calcul p{margin:6px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink-2);max-width:86ch}
.bilan{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:3px 13px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2)}
.bilan.ok{border-color:var(--ok);background:var(--ok-soft)}
.bilan.perdu{border-color:var(--bad);background:var(--bad-soft)}
.bilan p{margin:0;font-size:15.5px;line-height:1.45}
.bilan .sous{grid-column:2;font-size:13.5px;color:var(--ink-2)}
.bilan .ser{gap:5px}
.bilan .ser i{width:15px;height:15px}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.bilan .ser i.neuf{animation:pop .5s ease-out}
@media (prefers-reduced-motion:reduce){.inter span{transition:none} .bilan .ser i.neuf{animation:none}}
@media (min-width:881px){ .cote{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto;scrollbar-width:thin;padding-right:2px} }
.erreurs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.35}
.erreurs li{display:flex;flex-direction:column;gap:2px}
.erreurs .r{color:var(--ok)}
.vide{margin:0;color:var(--ink-3);font-size:14.5px}
details summary{cursor:pointer;font-weight:700;font-size:15px}
.mots{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.35}
.mots li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:center}
.note{margin:0;font-size:13.5px;color:var(--ink-2);max-width:80ch}
/* la progression guidée : module par module, ce qui est réussi sort de la pile */
.guide{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.guide.on{border-color:var(--accent);background:var(--accent-soft)}
.guide label{display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;font-size:14.5px;line-height:1.35}
.guide label b{font-size:15.5px}
.guide label span{color:var(--ink-2)}
.guide .chemin{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:2px;font:600 12.5px var(--f-mono);color:var(--ink-3)}
.guide .chemin i{font-style:normal;padding:1px 8px;border-radius:999px;background:var(--panel)}
.guide .chemin i.fait{color:var(--ok)}
.guide .chemin i.ici{background:var(--accent);color:var(--on-accent)}
/* une table du cours, dans la question ou dans la fiche */
.tableau{display:flex;flex-direction:column;gap:6px}
.tableau-t{margin:0;font-size:14px;font-weight:700;color:var(--ink-2)}
.tableau-c{margin:0;font:600 12.5px var(--f-mono);color:var(--ink-3)}
.paires{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.paires div{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:4px 9px;border-radius:7px;background:var(--panel-2);font:600 14.5px var(--f-mono)}
.paires dt{color:var(--ink-2);font-weight:400}
.paires dd{margin:0}
.paires .fort{box-shadow:inset 0 0 0 1px var(--ink-3)}
.paires .ta-ligne{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.tab-wrap{overflow-x:auto}
.tab-libre{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.4}
.tab-libre th,.tab-libre td{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tab-libre thead th{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tab-libre tbody th{font-weight:700}
.tableau small{color:var(--ink-3);font-size:13px;line-height:1.4}
.figure{margin:0;display:flex;flex-direction:column;gap:5px;align-items:center}
.figure svg{display:block;width:100%;max-width:480px;height:auto;border-radius:10px;border:1px solid var(--line);background:#FAFAF7}
.figure figcaption{font-size:13px;color:var(--ink-3);text-align:center}
/* courte réponse : on écrit, on compare à la réponse attendue, on se corrige élément par élément */
.court-zone{display:flex;flex-direction:column;gap:6px}
.court{width:100%;min-height:104px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font:400 16.5px/1.5 var(--f-body);resize:vertical}
.modele{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2)}
.modele h3{margin:0;font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.modele p{margin:0}
.ta-rep{margin:0;padding:8px 12px;border-left:3px solid var(--ink-3);color:var(--ink-2);font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.points label{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);cursor:pointer;font-size:16px;line-height:1.35}
.points input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent)}
.points .fait{display:flex;gap:10px;padding:8px 12px;border-radius:10px;font-size:16px;line-height:1.35}
.points .fait.oui{background:var(--ok-soft)}
.points .fait.non{background:var(--bad-soft)}
/* schéma : un nom par repère */
.reperes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.repere{display:flex;align-items:center;gap:8px;min-width:0}
.repere b{flex:none;min-width:30px;height:30px;padding:0 6px;display:grid;place-items:center;border-radius:999px;border:1.5px solid var(--ink-2);background:var(--panel);font:700 14px var(--f-mono)}
.repere select{flex:1;min-width:0;min-height:44px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font:inherit;font-size:16px}
.repere.non select{border-color:var(--bad);background:var(--bad-soft)}
.repere.oui select{border-color:var(--ok);background:var(--ok-soft)}
.repere .nom{flex:1;min-width:0;padding:8px 12px;border-radius:10px;background:var(--ok-soft);font-size:16px;line-height:1.3}
.repere.non .nom{background:var(--bad-soft)}
.repere small{color:var(--ink-2);font-size:13.5px}
.formats{display:flex;flex-direction:column;gap:6px}
.formats p{margin:0;font-size:14px;line-height:1.4;color:var(--ink-2);max-width:86ch}
@media (max-width:880px){ .corps{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){
  h1{font-size:26px}
  .scene{padding:15px}
  .enonce{font-size:18px}
  .tuiles.deux{grid-template-columns:repeat(2,minmax(0,1fr))}

<script>
(() => {
'use strict';
/* === données du cours (assemblées par construire.py) === */
const COURS = {"titre":"Anatomie et physiologie oculaires, UA2","sousTitre":"Modules 6 à 9, dans les trois formats de l’examen : choix multiples, courtes réponses, schémas à étiqueter. Système nerveux et réflexes, larmes, cornée, cristallin et vitré, rétine, voies visuelles, champ visuel, réflexes pupillaires. Le « ? » ouvre la fiche de chaque notion.","nom":"Anatomie et physiologie oculaires (SCI 23545)","cle":"drill-anat-ua2-v1","examen":{"date":"2026-11-20","txt":"vendredi 20 novembre, 9 h, sur papier"},"note":"Questions tirées des modules 6 à 9 de la prof (diapos, fiches de cas, feuilles, projet UA2, et sa rétroaction sur les réflexes). Un point = une réponse juste du premier coup, sans aide. Pour une courte réponse, tu te corriges toi-même : un point si ta réponse contenait tous les éléments attendus. Réussie = trois points de suite, en au moins cinq essais. La fiche « ? » ou une copie pour une IA ne donnent pas de point et n’en enlèvent pas. « Mes erreurs » reprend les questions ratées jusqu’à ce que tu les réussisses.","maitrise":"Ta maîtrise de l’UA2","tout":"Tout l’UA2","formats":{"txt":"L’examen est sur papier : « 6-10 questions choix multiples, 4-6 courtes réponses et 1-3 schémas et/ou identification de structures étudiées en classe ». Apporte crayons à la mine, gomme à effacer et stylo ; pas besoin de calculatrice. Pratique un format à la fois :","liste":[["qcm","Choix multiples"],["court","Courtes réponses"],["schema","Schémas"]]}};
const BANQUE = {"familles":[{"id":"a6-systeme","t":"Le système nerveux","mod":6,"carte":{"quoi":"Le SNC, c’est le cerveau et la moelle épinière. Le SNP, ce sont les nerfs : ils surveillent et commandent, de façon volontaire (somatique) ou involontaire (autonome). L’autonome a trois divisions : sympathique, parasympathique, entérique.","quand":"On te demande à quel niveau appartient une partie ou une action, ou quel système commande les larmes.","piege":"Mettre les nerfs crâniens de l’œil dans le SNC parce qu’ils partent du cerveau, ou donner les larmes au sympathique. Or « La sécrétion des larmes est sous le contôle (sic) du système parasympatique (sic) ».","exemple":"Pleurer devant un oignon : action involontaire, donc autonome, et la sécrétion relève du parasympathique (« repos et digestion »), pas du sympathique (« mettre en action »).","source":"A6–A10, A19"}},{"id":"a6-arc","t":"L’arc réflexe","mod":6,"carte":{"quoi":"Tout réflexe suit cinq maillons : stimulus → récepteur sensoriel → neurone/nerf → centre nerveux → effecteur (« muscle ou glande »). Le message monte au centre par un nerf sensitif (le V sent) et l’ordre en revient par un nerf moteur (le III et le VII commandent).","quand":"On te demande un maillon, le nerf qui sent ou celui qui commande, ou ce qui arrive si un lien est coupé.","piege":"Le deck écrit « Nerf oculo-moteur 5 » et « Nerf oculo-moteur 7 » : le V ne fait pas bouger l’œil, il sent. Seul le III est l’oculomoteur. Et l’effecteur peut être une glande.","exemple":"Le larmoiement : cornée (récepteur) → V (sensitif) → tronc cérébral (centre) → VII (moteur) → glande lacrymale (effecteur).","source":"A3, A5, A11, A13, A15, A17"}},{"id":"a6-nerfs","t":"Les nerfs de l’œil","mod":6,"carte":{"quoi":"II : le nerf optique. III : certains mouvements de l’œil, constriction de la pupille, accommodation, élévation de la paupière (releveur). V : la sensation (iris, corps ciliaire, glande lacrymale, conjonctive, cornée). VII : les larmes et la fermeture des paupières (orbiculaire). Un nerf atteint perd ses fonctions, et seulement les siennes.","quand":"Une fonction à relier à son nerf, un muscle de la paupière, ou un patient dont un nerf est atteint (Bell).","piege":"Donner l’ouverture à l’orbiculaire : au M6, le releveur (III) ouvre et l’orbiculaire (VII) ferme. Et croire que Bell fait pleurer : le signe du deck est la « sécheresse oculaire ».","exemple":"« Paralysie de Bell (inflammation du 7e nerf crânien) » : la paupière ne ferme plus et il se fait moins de larmes, d’où la sécheresse.","source":"A11–A18, C12–C15"}},{"id":"a6-larmoiement","t":"Le larmoiement réflexe","mod":6,"carte":{"quoi":"Un irritant ou une lumière vive touche la cornée; le V porte le message au tronc cérébral; le VII porte l’ordre à la glande lacrymale, qui fait les larmes réflexes. La version de la prof : « Réflexe larmoiement: lumière, cornée, nerf sensitif V (voie afférente), tronc cérébral, nerf VII (efférente) vers la glande lacrymale, larmoiement. »","quand":"« Pourquoi les yeux pleurent quand on coupe un oignon? », le vent, une poussière, une lumière vive qui fait larmoyer.","piege":"Mettre la rétine comme récepteur, « une erreur fréquente » : « C'est la cornée qui recoit le stimulus et non la rétine ». La rétine, c’est le réflexe de la pupille.","exemple":"L’oignon : irritant → cornée → V → tronc cérébral → VII → glande lacrymale principale → de l’eau salée diluée « pour noyer et rincer l'irritant ».","source":"A4, A15, A17, A19, B11, B13, RETRO"}},{"id":"a6-couches","t":"Les couches et leurs glandes","mod":6,"carte":{"quoi":"De la cornée vers l’extérieur : mucinique (cellules caliciformes de la conjonctive), aqueuse (glande lacrymale principale; un peu Krause et Wolfring), lipidique (glandes de Meibomius, dans le tarse). Les couches ne sont pas séparées : « Il y a une continuité entre les couches. »","quand":"Les « Concepts essentiels à retenir » de B10 : où sont les glandes, quelle couche elles font, la « Disposition des couches de larmes ».","piege":"Les sosies : Zeis (huile, aux cils) n’est pas Meibomius (tarse); Krause et Wolfring, dans la conjonctive palpébrale, font de l’aqueuse, pas de la mucine.","exemple":"« 3 couches de larmes sur 3 couches de cornée » : la mucine contre l’épithélium, l’aqueuse au milieu, les lipides dehors.","source":"B3–B10, B15"}},{"id":"a6-roles","t":"Rôles des couches, sortes de larmes","mod":6,"carte":{"quoi":"Lipides : ils « limitent l’evaporation (sic) et stabilisent le film ». Aqueuse : « hydratation, protection contre infections (protéines et enzymes), nettoyage, apport d’oxygène dissout ». Mucines : étalement et adhérence sur l’épithélium. Trois sortes de larmes : basales (protection), réflexes (rincer), émotionnelles (communication).","quand":"Une couche manque et on te demande ce qui cesse, la question « Est-ce qu’on peut remplacer les larmes avec de l’eau uniquement? », ou une situation à classer (oignon, chagrin).","piege":"Croire que les larmes réflexes sont les plus riches en protéines : elles en ont le moins en proportion, « car elles sont produites en très grand volume ». Les plus riches sont les émotionnelles.","exemple":"L’eau seule : ni lipides (elle s’évapore), ni mucines (elle ne tient pas), ni protéines protectrices. Donc non (réponse déduite de B9 et B12).","source":"B2, B3, B9, B11–B14"}},{"id":"a6-clignement","t":"Le clignement","mod":6,"carte":{"quoi":"« On cligne normalement 15-20x par minute » : nettoyage, nutriments, cornée transparente, et une « mise à jour visuelle pour ne pas fatiguer le cerveau ». Six étapes : ouverture (releveur, III), fermeture et apposition (orbiculaire, VII), points lacrymaux orientés, pompe, drainage, réouverture.","quand":"Une situation où l’on cligne plus ou moins (lecture, écran, conversation), ou les étapes à remettre en ordre.","piege":"Croire qu’on cligne plus quand on se concentre : on cligne moins « quand on regarde des détails fins et encore moins lorsqu’on est concentré ». Et oublier l’étape 3, la position des points.","exemple":"Devant un écran, tu fixes des détails : moins de clignements, film exposé plus longtemps, plus d’évaporation (F08, lecture déduite).","source":"C2–C6, C12–C20"}},{"id":"a6-drainage","t":"Le drainage des larmes","mod":6,"carte":{"quoi":"Le chemin : points lacrymaux → canalicules → sac lacrymal → conduit nasolacrymal → cavité nasale. La pompe : quand l’œil ferme, les larmes partent du lac vers les canalicules et le sac; quand il rouvre, elles sont aspirées vers le sac.","quand":"Un trajet à remettre en ordre, un orbiculaire faible qui draine mal, un point lacrymal ou une paupière mal placés.","piege":"Mettre le sac avant les canalicules, ou finir ailleurs que dans le nez. Et confondre l’ectropion (tout le bord de la paupière tourné vers l’extérieur) avec l’éversion du point seul.","exemple":"F03 : le point lacrymal inférieur est tourné vers l’extérieur, il n’est plus dans le lac. La larme n’entre plus dans les voies : l’œil pleure, problème de drainage.","source":"C8, C16–C20, F03, DR"}},{"id":"a6-fiches","t":"Le trajet des larmes et les fiches","mod":6,"carte":{"quoi":"Quatre étapes : production, répartition, évaporation, drainage. Une étape en panne fait pencher le bilan : surface sèche (trop peu produit, mal réparti, trop évaporé) ou larmes sur la joue (drainage insuffisant : épiphora; irritation : larmoiement réflexe).","quand":"Chaque fiche de cas : structure, effet, puis « 3. S’agit-il surtout d’un problème de production, de répartition, d’évaporation ou de drainage des larmes? Justifiez votre choix. »","piege":"Croire que des larmes sur la joue disent l’étape : trop de production et pas assez de drainage donnent le même signe. Cherche la cause (un irritant ou une sortie bloquée), et ne pose pas de diagnostic.","exemple":"F05 : le conduit nasolacrymal est obstrué, les larmes débordent sur la joue (épiphora) : drainage.","source":"C8, C12–C21, F01–F10"}},{"id":"a7-milieux","t":"Les quatre milieux transparents","mod":7,"carte":{"quoi":"La lumière traverse quatre milieux transparents jusqu’à la rétine : cornée, humeur aqueuse, cristallin, vitré. Deux seulement la dévient : la cornée (« 2/3 ») et le cristallin (« 1/3 »).","quand":"Une question de localisation, le trajet de la lumière, ou une case du tableau de l’activité (« 1. Localisation », « 3. Fonction principale »).","piege":"Mettre l’humeur aqueuse seulement devant l’iris (elle remplit les deux chambres), ou compter le vitré parmi les structures qui réfractent : il transmet la lumière.","exemple":"L’humeur aqueuse remplit la « chambre antérieure (cornée à l’iris) » et la « chambre postérieure (iris au cristallin/corps ciliaire) »; le vitré va « derrière le cristallin jusqu’à la rétine ».","source":"A2, A8, C4, D3; ACT; Anatomie 3.1, diapos 8 et 10"}},{"id":"a7-couches","t":"Les cinq couches de la cornée","mod":7,"carte":{"quoi":"De l’avant vers l’arrière (dessin A4) : A épithélium, B membrane de Bowman, C stroma (D = ses kératocytes), E membrane de Descemet, F endothélium. Chaque couche a son rôle (A5).","quand":"Le dessin A4 à étiqueter, ou une question sur le rôle d’une couche.","piege":"Faire de D une couche (ce sont les kératocytes du stroma), inverser Bowman et Descemet, ou donner l’eau à l’épithélium : la « régulation de l'hydratation du stroma », c’est l’endothélium.","exemple":"L’épithélium est une « barrière protectrice »; l’endothélium, « 1 seule couche de cellules », règle l’eau du stroma.","source":"A3, A4, A5, A12, A14"}},{"id":"a7-clarte","t":"Pourquoi la cornée est transparente","mod":7,"carte":{"quoi":"Cornée et sclère sont faites de collagène. La cornée est claire parce que ses fibres sont rangées régulièrement; la sclère est opaque parce qu’elles le sont moins. L’endothélium pompe pour garder la cornée « à 78% eau ».","quand":"« 2. Pourquoi est-il transparent? », une cornée qui devient trouble, la comparaison cornée-sclère, les fibres du cristallin.","piege":"Dire que la cornée n’a pas de collagène (elle en a : c’est l’ordre qui compte), ou croire que plus d’eau la rend plus claire : imbibée d’eau, elle perd sa transparence.","exemple":"Un endothélium abîmé ne pompe plus : « la cornée perd de sa transparence parce qu’elle devient imbibée d’eau ».","source":"A2, A5, A12–A16, B5, B6, C9"}},{"id":"a7-refraction","t":"La cornée : 2/3 du pouvoir, 42 D","mod":7,"carte":{"quoi":"La cornée fait les 2/3 du pouvoir de l’œil, environ 42 D, parce qu’elle touche l’air : « Différence de 0.376 », le plus grand saut d’indice de l’œil. Elle mesure 0,52 mm au centre et 0,67 mm en périphérie.","quand":"« Quelles structures de l’œil contribuent à la réfraction de la lumière? », un nageur sans lunettes, une valeur de la cornée à reconnaître.","piege":"Prendre le cristallin pour la lentille principale, ou croire que l’œil devient myope sous l’eau : il devient hypermétrope, car la cornée perd son saut d’indice.","exemple":"« Dans l’eau les yeux des humains deviennent hypermétropes »; des lunettes de natation remettent de l’air devant la cornée et la vision redevient nette.","source":"A6–A11; Optique M6 D16; TO 5.1, diapo 32"}},{"id":"a7-limbe","t":"Le limbe et la sclère","mod":7,"carte":{"quoi":"Le limbe, « zone de transition entre la cornée et la sclère », est vascularisé et garde les cellules souches qui renouvellent l’épithélium. L’endothélium, lui, ne se renouvelle jamais. La sclère, riche en collagène, garde la forme du globe et reçoit les muscles; sa couleur montre ce qu’il y a dessous.","quand":"Une égratignure de l’épithélium, la perte des cellules endothéliales, une sclère bleutée ou jaunâtre.","piege":"Croire que toutes les cellules de la cornée se renouvellent, ou donner la même cause aux deux jaunes : des lipides chez la personne âgée, de l’urée dans l’atteinte des reins.","exemple":"Une sclère « Bleutée » chez un bébé est plus transparente : on voit la choroïde à travers.","source":"A16, B2–B7"}},{"id":"a7-cristallin","t":"Le cristallin : rôles, puissance, UV","mod":7,"carte":{"quoi":"Trois fonctions : « 1. Pouvoir réfractif », « 2. Pouvoir accommodatif en jeunesse », « 3. Absorption des rayons UV pour protéger la rétine ». Il fait 18-20 D, jusqu’à 30 D en accommodant; il est très bombé parce qu’il baigne dans le liquide.","quand":"La « Fonction principale » du cristallin, sa puissance, l’accommodation de près, une longueur d’onde UV.","piege":"Croire que le cristallin, si bombé, est plus puissant que la cornée : dans le liquide, son saut d’indice est petit. Ou inverser les deux bandes d’UV.","exemple":"Un UVA de 350 nm traverse la cornée (qui arrête 280-320 nm) et s’arrête au cristallin (320-400 nm).","source":"C3, C4, C8, C9, C12; Anatomie 3.2, diapo 5"}},{"id":"a7-fibres","t":"Le dessin du cristallin (CD)","mod":7,"carte":{"quoi":"Le cristallin grandit par couches : les cellules naissent sous la capsule antérieure (A), deviennent des fibres à l’équateur (E) et forment le cortex récent (C); les plus vieilles sont au centre (N1). P, la capsule postérieure, fait barrière avec le vitré.","quand":"Le dessin CD à étiqueter, ou une question sur l’âge des fibres selon leur place.","piege":"Mettre les fibres les plus vieilles en périphérie : c’est l’inverse, « vieux fibres (sic) au centre N1 ». Ou inverser A et P (l’avant est à gauche sur CD).","exemple":"Du bord vers le centre de CD : C, les « fibres plus récentes », puis N3, N2 et N1, de plus en plus vieux.","source":"C10, C11, CD"}},{"id":"a7-vitre","t":"Le vitré et son décollement","mod":7,"carte":{"quoi":"Le vitré, « la structure la plus grande dans l’oeil » (80 % du volume), est un gel : « 99% eau avec collagène et acide hyaluronique pour en faire un gel ». Avec l’âge, il devient plus liquide et peut se retirer de la rétine.","quand":"Des corps flottants, des éclairs, un patient de plus de 50 ans, les rôles du vitré.","piege":"Confondre décollement du vitré et décollement de rétine : le premier est « habituellement sans conséquence »; le second ne suit que rarement, s’il y a un point d’adhérence.","exemple":"Les corps flottants semblent à l’avant de l’œil, mais « ils flottent en réalité dans le vitré et sont perçus comme des ombres par la rétine ».","source":"D3–D5, D10"}},{"id":"a7-age","t":"Chaque milieu vieillit à sa façon","mod":7,"carte":{"quoi":"Cornée : perte de cellules endothéliales, imbibée d’eau si c’est sévère, moins sensible. Sclère : jaunâtre. Cristallin : il durcit (presbytie), puis jaunit et s’opacifie (cataracte). Vitré : plus liquide, il se décolle.","quand":"« 4. Changement possible avec l’âge », ou la plainte d’un patient âgé à relier au bon milieu.","piege":"Croire que la presbytie vient d’un muscle ciliaire affaibli : « L’œil ne devient pas faible, il devient moins flexible ».","exemple":"Flou de près, net de loin : presbytie. Tout devient flou et terne : cataracte, « Souvent problématique vers les 70-80 ans ».","source":"A11, A16, B7, C6, C13–C16, D4"}},{"id":"a8-carte","t":"Une rétine, trois sorties","mod":8,"carte":{"quoi":"La rétine change la lumière en signal électrique. Ce signal sert à trois choses : « voir, modifier le diamètre pupillaire et synchroniser l’horloge biologique ». Voir passe par les voies visuelles; la pupille et l’horloge, par les voies non-visuelles.","quand":"On te demande à quoi sert l’information de la rétine, ou si une fonction passe par une voie visuelle ou non-visuelle.","piege":"Croire que tout va au cortex pour faire une image, ou qu’une voie non-visuelle part d’ailleurs que la rétine : elle envoie « l’information de la rétine à d’autres centres au cerveau ».","exemple":"Reconnaître un visage : voie visuelle (cortex). La pupille qui rétrécit au soleil, le sommeil qui vient le soir : voies non-visuelles (centre réflexe, horloge).","source":"8A1, 8C1"}},{"id":"a8-photo","t":"Cônes, bâtonnets, phototransduction","mod":8,"carte":{"quoi":"La phototransduction change la lumière en impulsions électriques dans les disques des photorécepteurs, avec un dérivé de la vitamine A (le rétinal). Cônes : couleurs, vision centrale fine, lumière intense. Bâtonnets : lumière moins intense, très peu de lumière.","quand":"Une question sur l’endroit où la lumière devient un signal, ou une situation où il faut dire quel photorécepteur travaille.","piege":"Placer la phototransduction dans les cellules ganglionnaires, ou lire S, M et L comme des tailles de cônes : ce sont trois sortes de cônes.","exemple":"Lire une étiquette en couleurs en plein jour : les cônes. Marcher dans une pièce presque noire : les bâtonnets, activés « par très peu de lumière ».","source":"8A2–8A5"}},{"id":"a8-couches","t":"La rétine en coupe, le parcours","mod":8,"carte":{"quoi":"Du côté de la lumière vers le fond : fibres nerveuses, cellules ganglionnaires, cellules bipolaires, photorécepteurs, épithélium pigmentaire. La lumière traverse tout et atteint les photorécepteurs en dernier; le signal repart en sens inverse.","quand":"Une coupe de rétine à étiqueter (la feuille F1), ou un parcours à remettre en ordre.","piege":"Mettre les photorécepteurs du côté de la lumière, ou croire que la lumière voyage dans le nerf : « Le langage du cerveau est impulsions électriques et non lumière ».","exemple":"F1, de haut en bas : N « Fibres Nerveuses », G « cellule Ganglionale (sic) », les cellules du milieu, P « Cones (sic) » et « Batonnets (sic) », E « Épithélum pigmentaire (sic) ». À l’examen, écris le mot de la diapo : cellules ganglionnaires.","source":"8A3, 8A5, 8B3, 8F1"}},{"id":"a8-disque","t":"Le nerf optique au disque optique","mod":8,"carte":{"quoi":"Sur F2 (vue transversale), de haut en bas : « Vitré », A « Rétine », B « Choroïde », C « sclère ». N, les fibres nerveuses, longent la rétine et plongent dans le nerf; V, les vaisseaux sanguins, au centre. Le nerf optique est le nerf crânien II.","quand":"La feuille F2 à compléter, ou la question : pourquoi a-t-on un point aveugle ?","piege":"Inverser A, B et C : le vitré est en haut, donc l’intérieur de l’œil aussi. Et prendre la papille pour la macula, ou le point aveugle pour une maladie.","exemple":"Au disque optique, les rangées de la rétine s’arrêtent de chaque côté du nerf : « Absence de photorécepteurs au niveau du nerf optique », d’où le point aveugle.","source":"8F2, 8A1; Anatomie 4.2, d3, d6, d7"}},{"id":"a8-trajet","t":"De l’œil au cortex occipital","mod":8,"carte":{"quoi":"Nerf optique → chiasma optique → tractus optique → CGL du thalamus → cortex visuel, « en arrière du cerveau dans le lobe occipital ». Le croisement sert à « voir le même champ de vision avec chaque œil »; les relais transforment ou ajoutent de l’information.","quand":"Un trajet à remettre en ordre, la feuille F3, ou la question : où est le cortex visuel, à quoi sert le chiasma ?","piege":"Placer le chiasma après le CGL, ou le cortex visuel à l’avant, derrière les yeux.","exemple":"Sur F3 : « Nerf optique », « Chiasma optique », l’accolade « relais », puis « cortex visuel gauche » et « Cortex visuel droit ».","source":"8B3, 8B4, 8B6–8B9, 8F3"}},{"id":"a8-croix","t":"Champ, rétine et chiasma","mod":8,"carte":{"quoi":"Les rayons se croisent dans l’œil : le champ droit tombe sur la rétine nasale de OD et la rétine temporale de OS. Au chiasma, les fibres nasales croisent, les temporales restent. Chaque tractus porte une moitié de chaque œil et une seule moitié du champ.","quand":"Un point dans le champ visuel, un hémisphère, un tractus ou une lésion : il faut dire quelles moitiés de rétine et quel côté du cerveau.","piege":"Confondre champ et rétine : la rétine nasale reçoit le champ temporal. Et croire que le tractus gauche, c’est l’œil gauche : il porte les deux yeux.","exemple":"Point dans le champ droit : rétine nasale de OD (croise) + rétine temporale de OS (reste) → tractus gauche → cortex gauche. « le cerveau gauche traite l’information du champ visuel droit ».","source":"8B3, 8B4, 8B6, 8C12, 8F3"}},{"id":"a8-horloge","t":"L’horloge : bleu et mélatonine","mod":8,"carte":{"quoi":"La lumière bleue est captée par des cellules de la rétine, qui envoient un signal au noyau supra-chiasmatique, l’horloge biologique. Celle-ci règle la glande pinéale : lumière, mélatonine supprimée et éveil; noirceur, mélatonine sécrétée et sommeil.","quand":"Une question sur le sommeil, l’écran du soir, la mélatonine, la lumière bleue, le rythme circadien ou la lumière naturelle et la myopie.","piege":"Croire que la glande pinéale reçoit elle-même la lumière : c’est la rétine qui la capte, puis un signal passe par l’horloge. Et prendre la mélatonine pour une hormone de l’éveil.","exemple":"Tablette à 23 h : le bleu dit au cerveau qu’il fait jour, et le noyau supra-chiasmatique bloque la mélatonine. « La production de mélatonine étant retardée, l’endormissement l’est également. »","source":"8C2–8C7"}},{"id":"a8-arc","t":"Le réflexe pupillaire, un arc","mod":8,"carte":{"quoi":"Lumière, puis rétine et nerf optique (voie afférente), centre réflexe du cerveau, nerf III parasympathique et sphincter (voie efférente), et la réponse : la pupille plus petite. Une lumière dans un seul œil fait contracter les deux pupilles.","quand":"Les sept étapes à remettre en ordre, un segment à classer afférent ou efférent, ou un patient dont une pupille ne réagit pas.","piege":"Dire le nerf optique efférent parce qu’il part de l’œil : il apporte l’information vers le centre, il est afférent. Et croire que seule la pupille éclairée réagit.","exemple":"Lumière dans l’œil droit : aucune pupille ne bouge. Lumière dans l’œil gauche : les deux se contractent. Le nerf optique droit (afférent) est coupé.","source":"8C8–8C12, 8SEQ"}},{"id":"a8-muscles","t":"Myosis, mydriase, deux muscles","mod":8,"carte":{"quoi":"Lumière forte : la pupille se contracte, c’est le myosis (sphincter, parasympathique, nerf III). Lumière basse : elle s’élargit, c’est la mydriase (dilatateur, sympathique, né dans l’hypothalamus). « Le sphincter domine sur les 2. »","quand":"Un éclairage, une taille de pupille, un muscle, un système nerveux, ou les gouttes de dilatation.","piege":"Échanger myosis et mydriase. Et suivre le titre de 8C14 (« sympatique (sic) qui se rend au sphincter ») : la voie sympathique va au dilatateur.","exemple":"Les gouttes de l’examen « inhibent le système parasympathique » : le sphincter ne se contracte plus, le dilatateur l’emporte, la pupille reste grande.","source":"8C8, 8C11, 8C13, 8C14"}},{"id":"a8-deux-arcs","t":"Deux réflexes : cornée ou rétine","mod":8,"carte":{"quoi":"Deux réflexes partent de la lumière. Larmoiement : cornée, nerf sensitif V (afférent), tronc cérébral, nerf VII (efférent) vers la glande lacrymale. Pupille : rétine, nerf optique II, centre réflexe du cerveau, nerf III parasympathique, sphincter, myosis.","quand":"Un arc à compléter qui part de la lumière : regarde d’abord la réponse (des larmes ou une petite pupille) pour choisir le récepteur.","piege":"Mettre la rétine dans le larmoiement, « une erreur fréquente » selon la prof : « C'est la cornée qui recoit le stimulus et non la rétine ».","exemple":"Une lumière vive te fait larmoyer : cornée → V → tronc cérébral → VII → glande lacrymale. La même lumière rétrécit ta pupille : rétine → II → centre réflexe → III → sphincter.","source":"RETRO, 8SEQ"}},{"id":"a9-carte","t":"L’île de vision, les quadrants","mod":9,"carte":{"quoi":"Le champ visuel est comme une île : la zone la plus sensible est la macula, au centre. Elle détecte les détails et les couleurs. On divise l’œil en quatre quadrants, avec la fovéa au centre : supérieur temporal, supérieur nasal, inférieur temporal et inférieur nasal.","quand":"On te demande où la vision est la plus sensible, ou de nommer une partie de la rétine ou du champ visuel.","piege":"Mettre le centre des quadrants sur la papille, là où part le nerf optique : la prof écrit « avec la fovéa au centre ». Et croire que la papille est sensible : il n’y a pas de photorécepteurs à cet endroit.","exemple":"Un point en haut de la rétine, du côté du nez : c’est le quadrant supérieur nasal.","source":"9A1, 9A2"}},{"id":"a9-inverse","t":"Œil inversé : champ et rétine","mod":9,"carte":{"quoi":"« Le champ visuel inverse l’anatomie de l’oeil. » La rétine supérieure est responsable du champ inférieur, la rétine inférieure du champ supérieur, la rétine nasale du champ temporal, la rétine temporale du champ nasal. La raison : l’œil a deux lentilles convexes, qui créent une image inversée.","quand":"On te donne une partie de la rétine et on te demande la partie du champ visuel, ou l’inverse. Si un œil est nommé, dis aussi le côté : à gauche ou à droite.","piege":"Garder le même mot : la rétine nasale n’est pas responsable du champ nasal, mais du champ temporal. Et oublier de dire de quel œil tu parles.","exemple":"Rétine nasale de l’œil gauche : champ temporal de l’œil gauche, donc le côté gauche, vers la tempe.","source":"9A3–9A6, PROJ q10"}},{"id":"a9-zones","t":"Zones 1 et 2 : rétine, nerf optique","mod":9,"carte":{"quoi":"Trois zones affectent le champ visuel : la rétine, le nerf optique, le parcours visuel dans le cerveau après le chiasma. Avant le chiasma, un seul œil est touché. Rétine atteinte : le défaut est à l’opposé. Nerf optique : le glaucome, ou un défaut en altitude quand une artère est bloquée.","quand":"Un défaut dans le champ d’un seul œil, un relevé de champ visuel à lire, ou la question : nomme les trois zones.","piege":"Placer le défaut du même côté que la rétine atteinte : si la rétine supérieure ne fonctionne plus, c’est le champ inférieur qui est perdu. Et prendre le glaucome pour une maladie du cristallin : c’est une « maladie du nerf optique ».","exemple":"Sur le relevé d’un œil, la moitié du haut est noire et la limite suit l’horizontale : défaut en altitude, artère bloquée au niveau du nerf optique.","source":"9A7, 9A9–9A14"}},{"id":"a9-chiasma","t":"Chiasma et après : les 4 anomalies","mod":9,"carte":{"quoi":"Nerf optique droit atteint : l’œil droit perd tout son champ. Chiasma : les fibres nasales sont touchées, chaque œil perd sa moitié temporale (défaut bi-temporal). Après le chiasma : les deux yeux perdent le même côté du champ, du côté opposé à la lésion, et le défaut respecte le méridien vertical.","quand":"On te décrit ce que perd chaque œil et tu dois trouver l’endroit atteint, ou l’inverse.","piege":"Lire “perte à gauche” comme “l’œil gauche” : les deux yeux perdent leur côté gauche. Et croire que des fibres nasales atteintes donnent une perte nasale : la rétine nasale est responsable du champ temporal.","exemple":"Un patient ne voit plus ce qui est du côté de ses deux tempes : défaut bi-temporal, atteinte du chiasma.","source":"9A15–9A17"}},{"id":"a9-feuille","t":"La feuille des voies, de A à G","mod":9,"carte":{"quoi":"Sur la feuille des voies visuelles, sept noms de haut en bas : A rétine, B nerf optique, C chiasma optique, D tractus optique, E corps genouillé latéral, F radiations optiques, G cortex visuel primaire. Deux couleurs : le vert pour le champ visuel gauche, le rouge pour le champ visuel droit.","quand":"Un schéma des voies visuelles à étiqueter ou à compléter, ou une structure à placer sur le trajet.","piege":"Échanger le tractus optique et les radiations optiques : le tractus vient juste après le chiasma, les radiations juste avant le cortex. Et mêler ce code de couleur avec celui de ta feuille du module 8.","exemple":"Après le chiasma, le côté gauche du cerveau n’a que du rouge : il porte le champ visuel droit des deux yeux.","source":"9B1, 9A16"}},{"id":"a9-projet","t":"Révision : couches de l’œil, conjonctive","mod":9,"carte":{"quoi":"De l’extérieur vers l’intérieur de l’œil : muscles extra-oculaires, sclère, choroïde, photorécepteurs, fibres nerveuses, vitré. La conjonctive est une muqueuse qui tapisse la sclère et la paupière et protège la surface du globe. On y trouve des vaisseaux sanguins, des glandes à mucus et des glandes lacrymales accessoires.","quand":"Deux questions de la feuille de projet du 13 novembre : ranger six structures, décrire la conjonctive.","piege":"Mettre les fibres nerveuses à l’extérieur des photorécepteurs : dans la rétine, les photorécepteurs sont au fond, du côté de la choroïde, et les fibres nerveuses du côté du vitré.","exemple":"La choroïde « est entre la sclère et la rétine » : donc la sclère, puis la choroïde, puis les photorécepteurs.","source":"PROJ q5, PROJ q9; Anatomie 2.3, 4.1"}}],"items":[{"id":"a6-001","fam":"a6-systeme","kc":"A6.1","k":"qcm","q":"Le nerf facial (VII) part du cerveau et va jusqu’aux paupières. À quelle partie du système nerveux appartient-il ?","choix":[{"t":"Au système nerveux central, puisqu’il part du cerveau","pourquoi":"Le SNC, c’est le cerveau et la moelle épinière. Les nerfs qui en partent font partie du SNP."},{"t":"Au système nerveux périphérique (SNP)","ok":true},{"t":"À la moelle épinière","pourquoi":"La moelle épinière fait partie du SNC : elle « permet la communication entre le cerveau et le restant du corps ». Un nerf crânien est un nerf du SNP."},{"t":"Au système entérique","pourquoi":"L’entérique est une division de l’autonome, liée à la digestion (le « 2e cerveau »)."}],"expl":"Le SNC, c’est le « 1. Cerveau » et la moelle épinière. Les nerfs crâniens de l’œil, qui surveillent et commandent, font partie du SNP.","source":"A6–A8","mod":6},{"id":"a6-002","fam":"a6-systeme","kc":"A6.1","k":"qcm","q":"Tu fermes les yeux exprès pour te reposer. Plus tard, en coupant un oignon, tes yeux pleurent. Comment classer ces deux actions ?","choix":[{"t":"Les deux sont volontaires (somatiques), puisque c’est ton œil qui agit","pourquoi":"On ne décide pas de pleurer : c’est involontaire, donc autonome."},{"t":"Fermer exprès : autonome. Pleurer : somatique.","pourquoi":"C’est l’inverse : ce que tu décides est somatique, ce qui se fait tout seul est autonome."},{"t":"Fermer exprès : volontaire (somatique). Pleurer : involontaire (autonome).","ok":true},{"t":"Les deux sont involontaires (autonomes), puisque ce sont des réflexes de l’œil","pourquoi":"Fermer les yeux exprès est un choix : c’est volontaire, donc somatique. Seul le larmoiement est un réflexe."}],"expl":"Le SNP fait des actions « volontaires (somatiques) ou involontaires (autonomes) ». Fermer les yeux exprès se décide; larmoyer devant un oignon, non.","source":"A8","mod":6},{"id":"a6-003","fam":"a6-systeme","kc":"A6.1","k":"vf","q":"Le système nerveux autonome a trois divisions : le sympathique, le parasympathique et l’entérique.","v":true,"expl":"« Dans le système autonome nous avons 3 divisions » : sympathique (« mettre en action »), parasympathique (« repos et digestion ») et entérique (la digestion, le « 2e cerveau »).","source":"A9, A10","mod":6},{"id":"a6-004","fam":"a6-systeme","kc":"A6.2","k":"qcm","q":"Tu pleures en coupant un oignon. Quelle division du système nerveux commande la sécrétion de ces larmes ?","choix":[{"t":"Le parasympathique","ok":true},{"t":"Le sympathique, puisque pleurer est une réaction à l’irritant","pourquoi":"Le sympathique sert à « mettre en action ». La sécrétion des larmes relève du parasympathique (A19)."},{"t":"Le système somatique, puisque c’est une action de l’œil","pourquoi":"Le somatique fait les actions volontaires. On ne décide pas de larmoyer : c’est autonome."},{"t":"Le système nerveux central seul, sans nerf","pourquoi":"Le centre traite l’information, mais l’ordre part par un nerf (le VII), sous contrôle parasympathique."}],"expl":"« La sécrétion des larmes est sous le contôle (sic) du système parasympatique (sic) ». Le parasympathique est une division de l’autonome, donc involontaire.","source":"A10, A19","mod":6},{"id":"a6-005","fam":"a6-systeme","kc":"A6.2","k":"vf","q":"Les larmes émotionnelles viennent du stress : elles relèvent donc du système sympathique.","v":false,"expl":"Le cours les relie au « système parasympathique qui veut calmer » (B11). Et toute sécrétion de larmes est sous contrôle parasympathique (A19).","source":"B11, B14, A19","mod":6},{"id":"a6-006","fam":"a6-arc","kc":"A6.3","k":"ordre","q":"Remets dans l’ordre les cinq éléments d’un arc réflexe simple.","etapes":["Stimulus : un changement détecté par l’organisme","Récepteur sensoriel : il détecte ce changement","Neurone/nerf : il transmet l’information","Centre nerveux : il reçoit ou traite l’information","Effecteur : le muscle ou la glande qui agit"],"expl":"C’est l’ordre de A5 : sentir, transmettre, traiter, agir. L’effecteur est un « muscle ou glande qui effectue en (sic) changement ».","source":"A5","mod":6},{"id":"a6-007","fam":"a6-arc","kc":"A6.3","k":"vf","q":"Dans un arc réflexe, le message du récepteur peut aller directement à l’effecteur, sans passer par un centre nerveux.","v":false,"expl":"Le message passe par le centre nerveux, qui « recoit (sic) ou traite l’information », avant que l’effecteur agisse. Sans centre, pas de réponse.","source":"A5","mod":6},{"id":"a6-008","fam":"a6-arc","kc":"A6.4","k":"qcm","q":"Le deck appelle le V « Nerf oculo-moteur 5 ». Que fait le V pour l’œil ?","choix":[{"t":"Il fait bouger l’œil, comme son nom l’indique","pourquoi":"Le nom « oculo-moteur » trompe : la figure A11 l’appelle « Trijumeau ». Seul le III est l’oculomoteur."},{"t":"Il commande la fermeture des paupières","pourquoi":"Ça, c’est le VII, qui commande l’orbiculaire."},{"t":"Il commande la production des larmes","pourquoi":"C’est le VII, « responsible (sic) de la production de larmes ». Le V, lui, porte la sensation."},{"t":"Il porte la sensation de la cornée et de l’iris","ok":true}],"expl":"Le V est « responsible (sic) de la sensation au niveau de l’iris, le corps ciliare (sic), la glande lacrymal (sic), conjonctive et cornée ». C’est le nerf qui sent.","source":"A11, A15, A17","mod":6},{"id":"a6-009","fam":"a6-arc","kc":"A6.4","k":"qcm","q":"Laquelle de ces fonctions est un message sensitif, qui va de l’œil vers le centre ?","choix":[{"t":"Contracter la pupille","pourquoi":"C’est une commande du III vers un muscle : elle part du centre."},{"t":"Sentir une poussière sur la cornée","ok":true},{"t":"Fermer les paupières","pourquoi":"C’est une commande du VII vers l’orbiculaire : elle part du centre."},{"t":"Lever la paupière supérieure le matin","pourquoi":"C’est une commande du III vers le releveur : elle part du centre."}],"expl":"La sensation de la cornée passe par le V, vers le centre. Le III et le VII portent des ordres : c’est la « commande mortice (sic) » de l’objectif 1.","source":"A3, A13, A15, A17","mod":6},{"id":"a6-010","fam":"a6-arc","kc":"A6.4","k":"vf","q":"Dans le larmoiement réflexe, le VII sent l’irritant sur la cornée et le V commande la glande lacrymale.","v":false,"expl":"C’est l’inverse : « nerf sensitif V (voie afférente) », puis « nerf VII (efférente) vers la glande lacrymale ». Le V sent, le VII commande.","source":"RETRO, A15, A17","mod":6},{"id":"a6-011","fam":"a6-arc","kc":"A6.4","k":"qcm","q":"Le III et le VII ont un point commun dans l’arc réflexe. Lequel ?","choix":[{"t":"Ils portent la sensation de la cornée vers le centre","pourquoi":"Ça, c’est le V, le nerf sensitif."},{"t":"Ils sont tous deux des nerfs oculomoteurs","pourquoi":"Sur la figure A11, le VII s’appelle « Facial ». Seul le III est l’« Oculomoteur »."},{"t":"Ils portent des ordres du centre vers un muscle ou une glande","ok":true},{"t":"Ils captent le stimulus","pourquoi":"Capter le stimulus, c’est le rôle du récepteur, pas d’un nerf qui commande."}],"expl":"Le III commande la pupille et le releveur; le VII commande les larmes et l’orbiculaire. Tous deux vont du centre vers l’effecteur : c’est la commande motrice.","source":"A11, A13, A17","mod":6},{"id":"a6-012","fam":"a6-nerfs","kc":"A6.5","k":"qcm","q":"Quel nerf commande la constriction de la pupille et l’accommodation ?","choix":[{"t":"Le III (oculomoteur)","ok":true},{"t":"Le V (trijumeau)","pourquoi":"Le V porte la sensation (iris, cornée, conjonctive) : ces deux fonctions ne sont pas les siennes."},{"t":"Le VII (nerf facial)","pourquoi":"Le VII fait « la production de larmes et fermeture des paupières »."},{"t":"Le II (nerf optique)","pourquoi":"Le II, c’est le « nerf optique » : il n’a pas ces fonctions dans le cours."}],"expl":"Le III est responsable de « certains mouvements oculaires, constriction de la pupille, accommodation et élévation de la paupière ».","source":"A13","mod":6},{"id":"a6-013","fam":"a6-nerfs","kc":"A6.5","k":"qcm","q":"Une patiente souffre de migraines. Selon le cours, quel nerf crânien reçoit les signaux de douleur ?","choix":[{"t":"Le VII","pourquoi":"Le VII fait les larmes et ferme les paupières. La douleur de la migraine passe par le V."},{"t":"Le III","pourquoi":"Le III commande des muscles (pupille, accommodation, releveur), pas la douleur."},{"t":"Le V","ok":true},{"t":"Le II","pourquoi":"Le II est le nerf optique."}],"expl":"Dans la migraine, des « changements dans le cerveau envoient des signaux de douleur au 5e nerf crânien » (A16).","source":"A16","mod":6},{"id":"a6-014","fam":"a6-nerfs","kc":"A6.6","k":"qcm","q":"Tu ouvres les yeux le matin. Quel muscle lève ta paupière supérieure, et quel nerf le commande ?","choix":[{"t":"L’orbiculaire, commandé par le VII","pourquoi":"L’orbiculaire ferme : « Muscle orbiculaire qui permet la fermeture des paupières ». Au M6, c’est le releveur qui ouvre."},{"t":"Le releveur de la paupière supérieure, commandé par le VII","pourquoi":"Bon muscle, mauvais nerf : le releveur est « controlé (sic) par le 3e nerf crânien »."},{"t":"L’orbiculaire, commandé par le V","pourquoi":"Le V sent, il ne commande pas les paupières. Et l’orbiculaire ferme."},{"t":"Le releveur de la paupière supérieure, commandé par le III","ok":true}],"expl":"Étape 1 du clignement : l’ouverture se fait « Par le muscle releveur de la paupière supérieure », commandé par le III (C13).","source":"C12, C13, C15","mod":6},{"id":"a6-015","fam":"a6-nerfs","kc":"A6.6","k":"vf","q":"Selon le module 6, l’orbiculaire sert à ouvrir et à fermer les paupières.","v":false,"expl":"Au M6, le releveur ouvre (C12) et l’orbiculaire ferme : « Muscle orbiculaire qui permet la fermeture des paupières ». Une diapo du module 2 disait autrement; le M6 donne l’ouverture au releveur (III).","source":"C12, C15","mod":6},{"id":"a6-016","fam":"a6-nerfs","kc":"A6.7","k":"qcm","q":"Un patient a une « Paralysie de Bell (inflammation du 7e nerf crânien) ». De quoi se plaint-il souvent à la clinique, selon le cours ?","choix":[{"t":"D’un œil qui larmoie sans arrêt","pourquoi":"Le VII fait aussi produire les larmes : atteint, il en fait moins. Le deck parle de « sécheresse oculaire »."},{"t":"De sécheresse oculaire","ok":true},{"t":"D’une pupille qui ne se contracte plus","pourquoi":"La constriction de la pupille, c’est le III, pas le VII."},{"t":"De ne plus sentir sa cornée","pourquoi":"La sensation de la cornée passe par le V. Bell touche le VII."}],"expl":"Bell est « Fréquemment mentionné en clinique d’optométrie par les patients en raison de sécheresse oculaire » (A18).","source":"A18","mod":6},{"id":"a6-017","fam":"a6-nerfs","kc":"A6.7","k":"qcm","q":"Pourquoi l’œil d’un patient atteint de Bell devient-il sec ?","choix":[{"t":"Le V ne sent plus la cornée, donc l’œil cligne trop","pourquoi":"Bell touche le VII, pas le V : « inflammation du 7e nerf crânien »."},{"t":"Les glandes de Meibomius sont bouchées par l’inflammation","pourquoi":"Le cours n’en parle pas. Bell est une atteinte du VII, qui perd ses deux fonctions."},{"t":"La paupière ferme mal et il se fait moins de larmes","ok":true},{"t":"Le releveur ne lève plus la paupière","pourquoi":"Le releveur dépend du III. Avec Bell, c’est la fermeture (VII) qui manque."}],"expl":"Le VII fait « la production de larmes et fermeture des paupières ». Atteint, il perd les deux : l’œil reste ouvert (« Inability to close eyelid ») et reçoit moins de larmes.","source":"A17, A18, C14","mod":6},{"id":"a6-018","fam":"a6-nerfs","kc":"A6.7","k":"qcm","q":"Le III d’un patient ne fonctionne plus. Que risques-tu d’observer ?","choix":[{"t":"Une paupière qui ne se lève plus et une pupille qui ne se contracte plus","ok":true},{"t":"Un œil qui ne se ferme plus et qui s’assèche","pourquoi":"Ça, c’est le VII (Bell), qui commande l’orbiculaire et les larmes."},{"t":"Une cornée qui ne sent plus les poussières","pourquoi":"La sensation de la cornée dépend du V."},{"t":"Un œil qui ne fait plus de larmes réflexes","pourquoi":"Les larmes dépendent du V (le message) et du VII (l’ordre), pas du III."}],"expl":"Le III fait l’« élévation de la paupière » (par le releveur) et la « constriction de la pupille ». Atteint, il perd ces fonctions, et seulement les siennes.","source":"A13, C13","mod":6},{"id":"a6-019","fam":"a6-nerfs","kc":"A6.7","k":"vf","q":"Le V d’un patient est atteint : sa cornée ne sent plus rien. Le vent le fera quand même larmoyer par réflexe.","v":false,"expl":"Sans message sensitif, l’arc est coupé dès le premier nerf : pas de larmoiement réflexe malgré l’irritant (lecture déduite de A5 et A15).","source":"A5, A15","mod":6},{"id":"a6-020","fam":"a6-larmoiement","kc":"A6.8","k":"ordre","q":"Remets dans l’ordre le réflexe de larmoiement, comme la prof l’a écrit.","etapes":["Lumière","Cornée","Nerf sensitif V (voie afférente)","Tronc cérébral","Nerf VII (voie efférente)","Glande lacrymale","Larmoiement"],"expl":"« Réflexe larmoiement: lumière, cornée, nerf sensitif V (voie afférente), tronc cérébral, nerf VII (efférente) vers la glande lacrymale, larmoiement. »","source":"RETRO","mod":6},{"id":"a6-021","fam":"a6-larmoiement","kc":"A6.8","k":"qcm","q":"Une lumière vive te fait larmoyer. Quelle structure reçoit le stimulus ?","choix":[{"t":"La rétine, puisque c’est de la lumière","pourquoi":"C’est l’erreur fréquente relevée par la prof : « C'est la cornée qui recoit le stimulus et non la rétine »."},{"t":"La glande lacrymale","pourquoi":"La glande est l’effecteur, au bout de l’arc : elle fait les larmes."},{"t":"La cornée","ok":true},{"t":"Le tronc cérébral","pourquoi":"Le tronc cérébral est le centre : il reçoit le message du V, pas le stimulus lui-même."}],"expl":"La chaîne de la prof commence par « lumière, cornée, nerf sensitif V (voie afférente) ». La rétine, c’est le réflexe de la pupille.","source":"RETRO","mod":6},{"id":"a6-022","fam":"a6-larmoiement","kc":"A6.8","k":"qcm","q":"Un collègue écrit : lumière → rétine → nerf optique II → tronc cérébral → VII → glande lacrymale. Que faut-il corriger ?","choix":[{"t":"Remplacer le VII par le III","pourquoi":"Le VII est juste : c’est le « nerf VII (efférente) vers la glande lacrymale ». Le III commande la pupille."},{"t":"Remplacer rétine et nerf II par cornée et nerf sensitif V","ok":true},{"t":"Rien : la rétine capte bien la lumière","pourquoi":"« C'est la cornée qui recoit le stimulus et non la rétine ». Rétine et nerf optique, c’est le réflexe de la pupille."},{"t":"Remplacer le tronc cérébral par la moelle épinière","pourquoi":"La prof nomme le centre de ce réflexe : le « tronc cérébral »."}],"expl":"Rétine et « nerf optique II » appartiennent au réflexe de la pupille. Le larmoiement part de la cornée : « nerf sensitif V (voie afférente), tronc cérébral, nerf VII (efférente) vers la glande lacrymale ».","source":"RETRO","mod":6},{"id":"a6-023","fam":"a6-larmoiement","kc":"A6.8","k":"vf","q":"Quand une lumière vive te fait larmoyer, c’est la rétine qui reçoit le stimulus.","v":false,"expl":"« C'est la cornée qui recoit le stimulus et non la rétine ». Même quand le stimulus est la lumière, le message part de la cornée par le V.","source":"RETRO","mod":6},{"id":"a6-024","fam":"a6-larmoiement","kc":"A6.8","k":"ordre","q":"Une poussière entre dans ton œil et tu larmoies. Remets l’arc dans l’ordre.","etapes":["La poussière irrite la surface de l’œil","La cornée capte l’irritation","Le V porte le message sensitif","Le tronc cérébral traite l’information","Le VII porte l’ordre","La glande lacrymale produit les larmes"],"expl":"Stimulus, récepteur, nerf sensitif, centre, nerf moteur, effecteur : l’arc de A5 appliqué aux larmes. Ici l’effecteur est une glande : A5 le dit, « muscle ou glande ».","source":"A5, A15, A17, RETRO","mod":6},{"id":"a6-025","fam":"a6-larmoiement","kc":"A6.8","k":"qcm","q":"Le vent frappe tes yeux et ils larmoient. Quelle chaîne est juste ?","choix":[{"t":"Vent → rétine → V → tronc cérébral → VII → glande lacrymale","pourquoi":"Le récepteur n’est pas la rétine : « C'est la cornée qui recoit le stimulus et non la rétine »."},{"t":"Vent → cornée → VII → tronc cérébral → V → glande lacrymale","pourquoi":"Le V et le VII sont intervertis : le V sent (voie afférente), le VII commande (voie efférente)."},{"t":"Vent → cornée → V → glande lacrymale","pourquoi":"Il manque le centre et le nerf qui commande : le V ne va pas directement à la glande."},{"t":"Vent → cornée → V → tronc cérébral → VII → glande lacrymale","ok":true}],"expl":"Même chaîne que la lumière dans la version de la prof : la cornée, puis « nerf sensitif V (voie afférente), tronc cérébral, nerf VII (efférente) vers la glande lacrymale ».","source":"RETRO, A15, A17, F09","mod":6},{"id":"a6-026","fam":"a6-larmoiement","kc":"A6.8","k":"qcm","q":"Dans les deux chaînes de la prof, la lumière est reçue par la rétine dans un réflexe et par la cornée dans l’autre. Lequel est lequel ?","choix":[{"t":"Rétine : réflexe de la pupille. Cornée : réflexe de larmoiement.","ok":true},{"t":"Rétine : réflexe de larmoiement. Cornée : réflexe de la pupille.","pourquoi":"C’est l’inverse, et c’est l’erreur fréquente : pour le larmoiement, « C'est la cornée qui recoit le stimulus et non la rétine »."},{"t":"La rétine reçoit la lumière dans les deux réflexes.","pourquoi":"Pas pour le larmoiement : la prof y met la cornée."},{"t":"La cornée reçoit la lumière dans les deux réflexes.","pourquoi":"Pour la pupille, la prof écrit « lumière, rétine, nerf optique II »."}],"expl":"Pupille : « lumière, rétine, nerf optique II ». Larmoiement : « lumière, cornée, nerf sensitif V (voie afférente) ». Ne les mélange pas.","source":"RETRO","mod":6},{"id":"a6-027","fam":"a6-couches","kc":"A6.9","k":"ordre","q":"Remets les couches du film lacrymal dans l’ordre, de la cornée vers l’extérieur.","etapes":["Couche mucinique","Couche aqueuse","Couche lipidique"],"expl":"La mucine touche l’épithélium, l’aqueuse est au milieu, les lipides dehors. Pour t’en souvenir : « 3 couches de larmes sur 3 couches de cornée ».","source":"B3, B4, B15","mod":6},{"id":"a6-028","fam":"a6-couches","kc":"A6.9","k":"vf","q":"Les trois couches du film lacrymal ne sont pas complètement séparées : il y a une continuité entre elles.","v":true,"expl":"« Les larmes n’existent pas comme 3 couches complètement séparées. Il y a une continuité entre les couches. »","source":"B4","mod":6},{"id":"a6-029","fam":"a6-couches","kc":"A6.10","k":"qcm","q":"La couche lipidique d’une patiente est trop mince. Quelles glandes travaillent mal ?","choix":[{"t":"Les glandes de Zeis, autour des cils","pourquoi":"Zeis fait de l’huile près des cils, mais pas la couche lipidique : « Les glandes de meibomius produisent la couche lipidique »."},{"t":"Les glandes de Meibomius, dans le tarse","ok":true},{"t":"Les cellules caliciformes de la conjonctive","pourquoi":"Elles font la mucine, la couche interne."},{"t":"Les glandes de Krause et de Wolfring","pourquoi":"Elles font un peu de la couche aqueuse."}],"expl":"« Les glandes de meibomius produisent la couche lipidique ». Et B10 : « Glandes de Meibomius dans le tarse de la paupière ».","source":"B5, B6, B10","mod":6},{"id":"a6-030","fam":"a6-couches","kc":"A6.10","k":"qcm","q":"D’où vient la couche mucinique ?","choix":[{"t":"Des cellules caliciformes de la conjonctive","ok":true},{"t":"Des glandes de Krause et de Wolfring, dans la conjonctive palpébrale","pourquoi":"Elles sont bien dans la conjonctive, mais elles « produisent un peu de la couche aqueuse »."},{"t":"Du tarse de la paupière","pourquoi":"Le tarse contient les glandes de Meibomius : des lipides, pas de la mucine."},{"t":"Des glandes de Moll, près des cils","pourquoi":"Moll fait de la sueur, près des cils. Il ne fait aucune couche du film."}],"expl":"« La couche mucinique provient de la conjonctive (cellules caliciformes) ». B10 : « Glandes qui produisent de la mucine (dans la conjonctive) ».","source":"B6, B9, B10","mod":6},{"id":"a6-031","fam":"a6-couches","kc":"A6.10","k":"qcm","q":"Qui produit la plus grande partie de la couche aqueuse ?","choix":[{"t":"Les glandes de Krause et de Wolfring","pourquoi":"Ces glandes accessoires « produisent un peu de la couche aqueuse », pas la plupart."},{"t":"Les cellules caliciformes","pourquoi":"Elles font la mucine."},{"t":"Les glandes de Meibomius","pourquoi":"Elles font la couche lipidique."},{"t":"La glande lacrymale principale","ok":true}],"expl":"« La glande lacrymale principale produit la plupart de la couche aqueuse »; Krause et Wolfring en font « un peu ».","source":"B6","mod":6},{"id":"a6-032","fam":"a6-couches","kc":"A6.10","k":"vf","q":"Les glandes de Krause et de Wolfring sont dans la conjonctive palpébrale : elles produisent donc la mucine.","v":false,"expl":"Elles sont bien dans la conjonctive palpébrale, mais ce sont des glandes lacrymales accessoires : elles « produisent un peu de la couche aqueuse ». La mucine vient des cellules caliciformes.","source":"B6, B7","mod":6},{"id":"a6-033","fam":"a6-couches","kc":"A6.11","k":"qcm","q":"Où se trouvent les glandes de Meibomius ?","choix":[{"t":"Au bord libre de la paupière, avec les cils","pourquoi":"Avec les cils, ce sont Zeis (huile) et Moll (sueur)."},{"t":"Dans le fornix de la conjonctive palpébrale","pourquoi":"C’est la place des glandes de Krause."},{"t":"Dans le tarse de la paupière","ok":true},{"t":"Dans le sac lacrymal","pourquoi":"Le sac lacrymal fait partie des voies de drainage : il reçoit les larmes, il n’en produit pas."}],"expl":"B10 : « Glandes de Meibomius dans le tarse de la paupière ». Il y en a 30 à 40 en haut et 20 à 30 en bas (B8).","source":"B7, B8, B10","mod":6},{"id":"a6-034","fam":"a6-couches","kc":"A6.11","k":"qcm","q":"B10 demande de savoir où sont les glandes. Laquelle de ces associations est juste ?","choix":[{"t":"Meibomius : avec les cils, au bord libre","pourquoi":"Meibomius est « dans le tarse ». Avec les cils, ce sont Moll (sueur) et Zeis (huile)."},{"t":"Krause : dans le fornix de la conjonctive palpébrale","ok":true},{"t":"Cellules caliciformes : dans le tarse","pourquoi":"Elles sont dans la conjonctive : « Glandes qui produisent de la mucine (dans la conjonctive) »."},{"t":"Zeis : dans le fornix de la conjonctive","pourquoi":"Zeis est avec les cils (huile). Le fornix, c’est Krause."}],"expl":"« Glandes de Krause (lacrimal accessoire) dans le fornix de la conjonctive palpébrale. Glande de Wolfring (lacrimal accessoire) dans la conjonctive palpébrale. »","source":"B5, B7, B10","mod":6},{"id":"a6-035","fam":"a6-couches","kc":"A6.11","k":"vf","q":"La paupière supérieure a plus de glandes de Meibomius que la paupière inférieure.","v":true,"expl":"Le schéma de B8 en compte « 30-40 glandes supérieure (sic) » et « 20-30 glandes inférieures ».","source":"B8","mod":6},{"id":"a6-036","fam":"a6-roles","kc":"A6.12","k":"qcm","q":"Les glandes de Meibomius d’une patiente fonctionnent mal. Quel travail du film souffre d’abord ?","choix":[{"t":"Faire adhérer le film à l’épithélium","pourquoi":"Ça, c’est la mucine, qui vient des cellules caliciformes."},{"t":"Protéger contre les infections grâce aux protéines","pourquoi":"C’est l’aqueuse : « protection contre infections (protéines et enzymes) »."},{"t":"Freiner l’évaporation et stabiliser le film","ok":true},{"t":"Lubrifier l’œil, puisque ce sont des lipides","pourquoi":"Le cours donne ce rôle à la mucine : « La couche interne qui aide l'œil à rester lubrifié »."}],"expl":"Meibomius fait les lipides, qui « limitent l’evaporation (sic) et stabilisent le film ». Sans eux, le film s’évapore plus vite.","source":"B3, B6, B9","mod":6},{"id":"a6-037","fam":"a6-roles","kc":"A6.12","k":"qcm","q":"« Est-ce qu’on peut remplacer les larmes avec de l’eau uniquement? » Quelle réponse suit le cours ?","choix":[{"t":"Oui, puisque les larmes sont environ 98 % d’eau","pourquoi":"Les larmes basales sont « Environ 98 % d'eau. », mais le reste compte : sans lipides l’eau s’évapore, sans mucines elle ne tient pas."},{"t":"Non : sans lipides ni mucines, l’eau ne tiendrait pas","ok":true},{"t":"Non, mais seulement parce que l’eau du robinet n’est pas salée","pourquoi":"Le sel manque, oui, mais surtout les lipides (évaporation), les mucines (adhérence) et les protéines (protection)."},{"t":"Oui, si on en remet assez souvent pour compenser l’évaporation","pourquoi":"Sans lipides ni mucines, l’eau ne tient pas sur la cornée; sans protéines, elle ne protège pas."}],"expl":"Les larmes sont « Une structure en trois couches (lipidique, aqueuse et muqueuse) pour stabiliser le film lacrymal. » L’eau seule n’en fait qu’une partie (réponse déduite de B9 et B12).","source":"B2, B9, B12","mod":6},{"id":"a6-038","fam":"a6-roles","kc":"A6.12","k":"vf","q":"Sans la couche mucinique, le film lacrymal s’étalerait mal et adhérerait mal à l’épithélium.","v":true,"expl":"Les mucines « favorisent l’étalement et l’adherence (sic) du film lacrymal sur l’épithlium (sic) ».","source":"B9","mod":6},{"id":"a6-039","fam":"a6-roles","kc":"A6.13","k":"qcm","q":"Des trois sortes de larmes, lesquelles sont les plus riches en protéines ?","choix":[{"t":"Les larmes réflexes, puisqu’elles protègent contre l’irritant","pourquoi":"Elles en ont le moins en proportion, « car elles sont produites en très grand volume » : elles sont diluées."},{"t":"Les larmes émotionnelles","ok":true},{"t":"Les larmes basales, celles de tous les jours","pourquoi":"Elles ont des protéines protectrices (lysozymes, lactotransferrines), mais les émotionnelles en ont plus."}],"expl":"Les émotionnelles sont « Plus riches en protéines que les deux autres types. » Elles contiennent aussi des hormones du stress.","source":"B12–B14","mod":6},{"id":"a6-040","fam":"a6-roles","kc":"A6.13","k":"qcm","q":"Une amie pleure à un enterrement. Quelle sorte de larmes, et à quoi servent-elles selon le cours ?","choix":[{"t":"Émotionnelles : communication et régulation des émotions","ok":true},{"t":"Réflexes : rincer l’œil","pourquoi":"Les larmes réflexes répondent à une irritation (oignon, vent). Ici, c’est l’émotion."},{"t":"Basales : la protection de base","pourquoi":"Les basales sont là tout le temps, pour la protection. Le chagrin donne des larmes émotionnelles."},{"t":"Émotionnelles : commandées par le sympathique, à cause du stress","pourquoi":"Bonne sorte, mauvais système : le cours parle du « système parasympathique qui veut calmer »."}],"expl":"Les émotionnelles servent à la « communication, régulariser les émotions, système parasympathique qui veut calmer » (B11).","source":"B11, B14","mod":6},{"id":"a6-041","fam":"a6-roles","kc":"A6.13","k":"vf","q":"Les larmes réflexes contiennent moins de protéines, en proportion, que les larmes basales, parce qu’elles sont produites en très grand volume.","v":true,"expl":"B13 : une « plus faible concentration relative de protéines spécifiques par rapport aux larmes basales, car elles sont produites en très grand volume ».","source":"B13","mod":6},{"id":"a6-042","fam":"a6-clignement","kc":"A6.14","k":"qcm","q":"Combien de fois par minute cligne-t-on normalement ?","choix":[{"t":"2 à 5 fois seulement","pourquoi":"C’est trop peu : « On cligne normalement 15-20x par minute »."},{"t":"Environ 50 à 60 fois","pourquoi":"C’est trop : la moyenne du cours est de 15 à 20 par minute."},{"t":"15 à 20 fois","ok":true},{"t":"Une seule fois, quand l’œil devient sec","pourquoi":"On ne cligne pas seulement pour mouiller : on cligne même « plus que necessaire (sic) pour les fonctions de base »."}],"expl":"« On cligne normalement 15-20x par minute » (C2).","source":"C2, C3","mod":6},{"id":"a6-043","fam":"a6-clignement","kc":"A6.14","k":"qcm","q":"Un étudiant lit un texte en petits caractères, très concentré. Que fait la fréquence de ses clignements ?","choix":[{"t":"Elle diminue","ok":true},{"t":"Elle augmente, pour garder la cornée mouillée","pourquoi":"C’est l’inverse : on cligne moins « quand on regarde des détails fins et encore moins lorsqu’on est concentré »."},{"t":"Elle reste à 15-20 par minute, quoi qu’il fasse","pourquoi":"15-20, c’est la normale; la fréquence varie selon ce qu’on regarde."},{"t":"Elle augmente, parce que le cerveau reçoit plus d’information","pourquoi":"On cligne plus en interactions sociales. Devant des détails fins, il y a « Moins de nouvelle information de nature visuelle. »"}],"expl":"« On cligne moins quand on regarde des détails fins et encore moins lorsqu’on est concentré. »","source":"C3, C6","mod":6},{"id":"a6-044","fam":"a6-clignement","kc":"A6.15","k":"ordre","q":"Remets dans l’ordre les six étapes du clignement.","etapes":["Ouverture des paupières (releveur, III)","Fermeture et apposition des paupières (orbiculaire, VII)","Points lacrymaux orientés vers le lac lacrymal","Action de la pompe lacrymale","Drainage lacrymal jusqu’à la cavité nasale","Les paupières ouvrent de nouveau"],"expl":"C12 à C20 : ouverture, fermeture et apposition (le film se répartit), positionnement des points, pompe, drainage, puis « Le relâchement de l'orbiculaire et l'action des muscles d'ouverture permettent aux paupières de se rouvrir. »","source":"C12–C20","mod":6},{"id":"a6-045","fam":"a6-clignement","kc":"A6.15","k":"qcm","q":"À quelle étape du clignement les paupières répartissent-elles le film lacrymal sur la cornée ?","choix":[{"t":"L’ouverture des paupières (étape 1)","pourquoi":"L’ouverture lève la paupière (releveur, III). C’est en se fermant que les paupières « répartissent le film lacrymal sur la cornée »."},{"t":"L’action de la pompe lacrymale (étape 4)","pourquoi":"La pompe déplace les larmes vers le sac : c’est du drainage, pas de la répartition."},{"t":"Le positionnement des points lacrymaux (étape 3)","pourquoi":"Les points doivent être orientés vers le lac pour drainer; ils ne répartissent pas le film."},{"t":"La fermeture et l’apposition (
