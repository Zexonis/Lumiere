sement"}},{"id":"a8-028","fam":"a8-croix","kc":"A8.9","k":"vf","q":"La rétine nasale d’un œil reçoit la partie nasale de son champ visuel.","v":false,"expl":"C’est l’inverse : la rétine nasale reçoit le champ temporal, parce que les rayons se croisent dans l’œil.","source":"8B3, 8B4","mod":8,"voir":{"p":"voies-croisement"}},{"id":"a8-029","fam":"a8-croix","kc":"A8.10","k":"qcm","q":"Au chiasma optique, quelles fibres croisent vers l’autre côté du cerveau ?","choix":[{"t":"Les fibres de la rétine nasale de chaque œil.","ok":true},{"t":"Toutes les fibres des deux yeux.","pourquoi":"Ce n’est pas un X complet : les fibres temporales restent du même côté."},{"t":"Les fibres temporales de chaque œil.","pourquoi":"Sens inversé : les temporales restent, les nasales croisent."},{"t":"Les fibres de l’œil droit seulement.","pourquoi":"Les deux yeux envoient des fibres qui croisent : la moitié nasale de chacun."}],"expl":"« les fibres de rétine nasale traversent le chiasma » (8C12). Sur F3, le bleu (« Rétine Nasale ») croise; le vert et l’orange (« R-Temp ») restent.","source":"8C12, 8F3, 8B3, 8B4","mod":8,"voir":{"p":"voies-croisement","r":["chiasma"]}},{"id":"a8-030","fam":"a8-croix","kc":"A8.10","k":"vf","q":"Au chiasma, les fibres de la rétine temporale restent du même côté du cerveau.","v":true,"expl":"Seules les nasales croisent. Sur F3, le vert (« R-Temp » de OS) reste à gauche et l’orange (« R-Temp » de OD) reste à droite.","source":"8F3, 8C12","mod":8,"voir":{"p":"voies-croisement","r":["chiasma"]}},{"id":"a8-031","fam":"a8-croix","kc":"A8.10","k":"qcm","q":"8B6 parle des « fibres du champ visuel nasal »; 8C12 dit « fibres de rétine nasale », et ta feuille F3 « Rétine Nasale ». Quelle réponse suit les figures du cours ?","choix":[{"t":"Les fibres de la rétine nasale croisent; elles portent le champ temporal.","ok":true},{"t":"Les fibres temporales croisent; elles portent le champ nasal.","pourquoi":"Les temporales restent du même côté (le vert et l’orange sur F3)."},{"t":"Les fibres du champ nasal croisent; elles viennent de la rétine nasale.","pourquoi":"Champ et rétine s’inversent : le champ nasal tombe sur la rétine temporale, qui ne croise pas."},{"t":"Toutes croisent, et le mot exact n’a pas d’importance.","pourquoi":"Le mot compte : lu tel quel, celui de 8B6 enverrait le champ droit au cerveau droit, contre le titre de 8B4."}],"expl":"8C12 écrit « les fibres de rétine nasale traversent le chiasma ». La rétine nasale reçoit le champ temporal : c’est ce que montrent les figures de 8B3 et 8B4. Le mot de 8B6 reste à vérifier avec la prof.","source":"8B6, 8C12, 8F3, 8B3, 8B4","mod":8,"voir":{"p":"voies-croisement","r":["chiasma"]}},{"id":"a8-032","fam":"a8-croix","kc":"A8.29","k":"qcm","q":"Que porte le tractus optique gauche, après le chiasma ?","choix":[{"t":"Temporale de OS et nasale de OD : le champ droit.","ok":true},{"t":"Tout l’œil gauche, ses deux moitiés de rétine.","pourquoi":"Ça, c’est le nerf optique gauche, avant le chiasma. Après, un tractus porte une moitié de chaque œil."},{"t":"Nasale de OS et temporale de OD : le champ gauche.","pourquoi":"Ça, c’est le tractus droit (orange + bleu sur F3)."},{"t":"La rétine temporale de OS seulement, sans aucune fibre de OD.","pourquoi":"Il manque le bleu qui a croisé : la rétine nasale de OD rejoint le tractus gauche."}],"expl":"Tractus gauche = vert + bleu sur F3 : rétine temporale de OS + rétine nasale de OD. Les deux regardent le champ droit, d’où « le cerveau gauche traite l’information du champ visuel droit ».","source":"8F3, 8B3, 8B4","mod":8,"voir":{"p":"voies-croisement"}},{"id":"a8-033","fam":"a8-croix","kc":"A8.29","k":"vf","q":"Le tractus optique gauche porte seulement les fibres de l’œil gauche.","v":false,"expl":"Après le chiasma, un tractus porte une moitié de chaque œil : le gauche, la temporale de OS (vert) et la nasale de OD (bleu).","source":"8F3, 8B3","mod":8,"voir":{"p":"voies-croisement"}},{"id":"a8-034","fam":"a8-croix","kc":"A8.29","k":"qcm","q":"Un patient a le tractus optique droit coupé. Que perd-il ?","choix":[{"t":"Le champ visuel gauche, pour les deux yeux.","ok":true},{"t":"Toute la vision de l’œil droit.","pourquoi":"Ça, c’est le nerf optique droit coupé, avant le chiasma. Le tractus droit porte une moitié de chaque œil."},{"t":"Le champ visuel droit, pour les deux yeux.","pourquoi":"Le tractus droit mène au cerveau droit, qui traite le champ gauche."},{"t":"Rien : le tractus gauche prend le relais du droit.","pourquoi":"Chaque tractus porte une moitié du champ que l’autre ne porte pas."}],"expl":"Tractus droit = orange + bleu : temporale de OD + nasale de OS, qui regardent toutes deux le champ gauche. Coupé, il fait perdre le champ gauche des deux yeux (déduit de la règle du croisement).","source":"8F3, 8B4","mod":8,"voir":{"p":"voies-croisement"}},{"id":"a8-035","fam":"a8-croix","kc":"A8.11","k":"qcm","q":"Un signal arrive au cortex occipital gauche. De quel champ visuel vient-il ?","choix":[{"t":"Du champ droit, vu par les deux yeux.","ok":true},{"t":"Du champ gauche, vu par les deux yeux.","pourquoi":"Sens inversé : « le cerveau gauche traite l’information du champ visuel droit »."},{"t":"De tout le champ de l’œil droit.","pourquoi":"Ce n’est pas un œil entier qui va à un hémisphère : c’est une moitié du champ, vue par les deux yeux."},{"t":"De tout le champ de l’œil gauche.","pourquoi":"Le cerveau gauche reçoit le champ droit, des deux yeux, pas un œil entier."}],"expl":"« le cerveau gauche traite l’information du champ visuel droit. Cerveau droit traite l’information du champ visuel gauche » (8B4).","source":"8B4","mod":8,"voir":{"p":"voies-croisement"}},{"id":"a8-036","fam":"a8-croix","kc":"A8.11","k":"ordre","q":"Un point est dans ton champ visuel droit. Remets dans l’ordre le trajet de son image, pour l’œil droit (OD).","etapes":["Le point tombe sur la rétine nasale de OD","La fibre suit le nerf optique droit","Au chiasma, elle croise vers la gauche","Elle suit le tractus optique gauche","Relais au CGL gauche","Cortex occipital gauche"],"expl":"Rétine nasale, donc elle croise. Champ droit → cerveau gauche, comme le dit 8B4.","source":"8B3, 8B4","mod":8,"voir":{"p":"voies-croisement"}},{"id":"a8-037","fam":"a8-croix","kc":"A8.11","k":"qcm","q":"Une lésion coupe seulement les fibres qui croisent, au milieu du chiasma. Quelle partie du champ de chaque œil est perdue ?","choix":[{"t":"La moitié temporale (extérieure) du champ de chaque œil.","ok":true},{"t":"La moitié nasale du champ de chaque œil.","pourquoi":"Les fibres qui croisent viennent de la rétine nasale, qui reçoit le champ temporal. C’est le champ temporal qui est perdu."},{"t":"Tout le champ de l’œil droit.","pourquoi":"La lésion touche les deux yeux, mais seulement leur moitié nasale de rétine."},{"t":"Rien : les fibres temporales prennent le relais.","pourquoi":"Les temporales ne portent que le champ nasal : le champ temporal n’a plus de chemin."}],"expl":"Au milieu du chiasma passent les fibres de la rétine nasale des deux yeux. Elles portent le champ temporal : chaque œil perd la moitié extérieure de son champ (déduit de la règle du croisement).","source":"8B3, 8B4, 8C12","mod":8,"voir":{"p":"voies-lesions","r":["2"]}},{"id":"a8-038","fam":"a8-croix","kc":"A8.11","k":"vf","q":"Toute l’information de l’œil droit est traitée par l’hémisphère gauche.","v":false,"expl":"Seule la rétine nasale de OD croise vers la gauche; la rétine temporale de OD reste à droite. C’est le champ droit, pas l’œil droit, qui va au cerveau gauche.","source":"8B4, 8C12","mod":8,"voir":{"p":"voies-croisement"}},{"id":"a8-039","fam":"a8-horloge","kc":"A8.17","k":"ordre","q":"Remets dans l’ordre la voie de l’horloge, de l’écran du soir au sommeil retardé.","etapes":["La lumière bleue de l’écran","Des cellules de la rétine la captent","Le noyau supra-chiasmatique, l’horloge","La glande pinéale : mélatonine bloquée","L’endormissement est retardé"],"expl":"Les courtes longueurs d’onde de l’écran « sont captées par des cellules rétiniennes spécifiques »; le noyau suprachiasmatique « bloque la production de mélatonine », hormone de la glande pinéale; l’endormissement est retardé (8C6).","source":"8C6, 8C3","mod":8,"voir":{"p":"horloge"}},{"id":"a8-040","fam":"a8-horloge","kc":"A8.17","k":"qcm","q":"Le soir, la lumière bleue d’un écran retarde ton sommeil. Qui capte cette lumière ?","choix":[{"t":"Des cellules spécifiques de la rétine.","ok":true},{"t":"La glande pinéale, directement.","pourquoi":"La lumière est captée dans l’œil, « par des cellules rétiniennes spécifiques ». La glande reçoit ensuite un signal, par l’horloge."},{"t":"Le noyau supra-chiasmatique.","pourquoi":"Le noyau est l’horloge, dans le cerveau : il reçoit le signal de la rétine."},{"t":"Le cristallin, qui filtre le bleu.","pourquoi":"Le cristallin laisse passer la lumière. Ce sont des cellules de la rétine qui captent le bleu."}],"expl":"« Les courtes longueurs d’ondes de la lumière bleue des écrans sont captées par des cellules rétiniennes spécifiques » (8C6). 8C5 écrit « La lumière voyage à une glande » : lis-le comme un raccourci, car ce qui voyage ensuite est un signal.","source":"8C6, 8C5","mod":8,"voir":{"p":"horloge","r":["H2"]}},{"id":"a8-041","fam":"a8-horloge","kc":"A8.17","k":"vf","q":"La mélanopsine est activée surtout par la lumière bleue, aux courtes longueurs d’onde.","v":true,"expl":"La mélanopsine est activée par le bleu (8C2). 8C2 écrit « fréquences courtes »; la figure de 8C6 dit « courtes longueurs d’ondes » : retiens les longueurs d’onde.","source":"8C2, 8C6","mod":8,"voir":{"p":"horloge","r":["H2"]}},{"id":"a8-042","fam":"a8-horloge","kc":"A8.18","k":"qcm","q":"Tu passes dans le noir à 21 h. Que fait ta glande pinéale ?","choix":[{"t":"Elle sécrète la mélatonine, signal de dormir.","ok":true},{"t":"Elle supprime la mélatonine pour te garder éveillé.","pourquoi":"C’est ce qui se passe à la lumière : « Quand il y a de la lumière la mélatonine est supprimée pour garder le corps plus éveillé. »"},{"t":"Elle sécrète la mélatonine pour te réveiller.","pourquoi":"Sens inversé : la mélatonine est « notre hormone du sommeil »."},{"t":"Elle capte le peu de lumière bleue qui reste dans la pièce.","pourquoi":"La glande ne capte pas la lumière : c’est la rétine. Dans le noir, elle sécrète la mélatonine."}],"expl":"« En noirceur, la glande pinéale secrète (sic) la mélatonine ce qui signale le corps de dormir. » (8C5)","source":"8C5, 8C6","mod":8,"voir":{"p":"horloge","r":["H4"]}},{"id":"a8-043","fam":"a8-horloge","kc":"A8.18","k":"qcm","q":"Tu regardes ta tablette à 23 h. Selon 8C6, que se passe-t-il ?","choix":[{"t":"La mélatonine arrive plus tard, et l’endormissement aussi.","ok":true},{"t":"Le bleu abîme la rétine, et c’est pour ça que tu dors mal.","pourquoi":"8C6 ne parle pas de dommage à l’œil : le bleu décale l’horloge."},{"t":"La mélatonine monte plus tôt : tu t’endors plus vite.","pourquoi":"Sens inversé : le noyau suprachiasmatique « bloque la production de mélatonine »."},{"t":"Rien : l’horloge ne réagit qu’au soleil.","pourquoi":"La diapo dit l’inverse : la lumière de l’écran « trompe notre horloge biologique »."}],"expl":"« La production de mélatonine étant retardée, l’endormissement l’est également. Ce décalage peut être de plusieurs heures. » (8C6)","source":"8C6","mod":8,"voir":{"p":"horloge","r":["C"]}},{"id":"a8-044","fam":"a8-horloge","kc":"A8.15","k":"vf","q":"Le rythme circadien règle seulement le sommeil.","v":false,"expl":"Il contrôle « les processus physiologiques et cognitives (sic) » dans « un cyle (sic) d’environ 24 heures » (8C3). La figure ajoute « humeur », « hormones », « mémoire », « activité motrice »…","source":"8C3","mod":8,"voir":{"p":"horloge"}},{"id":"a8-045","fam":"a8-horloge","kc":"A8.16","k":"qcm","q":"Sur le cadran du corps en 24 heures (8C4), quand commence la sécrétion de mélatonine ?","choix":[{"t":"Le soir.","ok":true},{"t":"Le matin, au réveil.","pourquoi":"Le matin, le cadran place la « Sécrétion de cortisol » et la « Meilleure vigilance »."},{"t":"L’après-midi.","pourquoi":"L’après-midi, c’est le « Meilleur temps de réaction »."},{"t":"Au milieu de la nuit, en sommeil profond.","pourquoi":"La nuit, c’est le « Sommeil profond » : la mélatonine a commencé avant, le soir."}],"expl":"Le cadran place le « Début de sécrétion de mélatonine » le soir. La figure ne donne pas d’heure précise : seulement la partie de la journée.","source":"8C4","mod":8,"voir":{"p":"horloge","r":["C"]}},{"id":"a8-046","fam":"a8-horloge","kc":"A8.19","k":"num","q":"Pour réduire les risques de myopie chez les jeunes enfants, combien d’heures à l’extérieur la recommandation générale donne-t-elle (8C7) ?","rep":{"v":2,"tol":0.5,"dec":0,"u":"heures"},"pieges":[{"v":24,"m":"24 heures, c’est la durée du rythme circadien. La recommandation sur la myopie est plus courte."}],"expl":"« La recommendation (sic) générale est 2 heures à l’extérieur » pour réduire les risques de myopie chez les jeunes enfants. La diapo ne dit pas sur quelle période.","source":"8C7","mod":8},{"id":"a8-047","fam":"a8-horloge","kc":"A8.19","k":"vf","q":"On sait déjà quelles voies non-visuelles expliquent l’effet de la lumière naturelle sur la myopie.","v":false,"expl":"« On ne sais (sic) pas encore quelles voies non-visuelles sont impliquées » (8C7).","source":"8C7","mod":8},{"id":"a8-048","fam":"a8-arc","kc":"A8.23","k":"ordre","q":"Remets dans l’ordre les sept étapes du réflexe pupillaire à la lumière (la feuille de la prof).","etapes":["Lumière","Rétine","Nerf optique","Centre réflexes du cerveau","Nerf oculomoteur III-voie motrice parasympathique","Contraction du sphincter de l’iris","Pupille plus petite (myosis)"],"expl":"Le stimulus, la voie afférente (rétine, nerf optique), le centre, la voie efférente (nerf III, sphincter), puis la réponse : « Pupille plus petite (myosis) ».","source":"8SEQ, 8C10","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-049","fam":"a8-arc","kc":"A8.23","k":"qcm","q":"Dans la séquence du réflexe à la lumière, quelle étape vient juste après le centre réflexe du cerveau ?","choix":[{"t":"Le nerf oculomoteur III, voie parasympathique.","ok":true},{"t":"Le nerf optique.","pourquoi":"Le nerf optique vient avant le centre : il lui apporte le message."},{"t":"La voie sympathique, qui va vers le dilatateur de l’iris.","pourquoi":"Le sympathique dilate la pupille. Ici, la lumière commande la contraction, par le parasympathique."},{"t":"La contraction du sphincter de l’iris.","pourquoi":"Le sphincter est l’effecteur : il faut d’abord le nerf qui lui porte l’ordre."}],"expl":"Après le centre : « Nerf oculomoteur III-voie motrice parasympathique », puis « Contraction du sphincter de l’iris ».","source":"8SEQ, 8C11","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-050","fam":"a8-arc","kc":"A8.22","k":"vf","q":"Dans le réflexe pupillaire, le nerf optique fait partie de la voie efférente, puisqu’il part de l’œil.","v":false,"expl":"Il part de l’œil, mais il apporte l’information vers le centre : il est afférent. « Voie afférente: apporte de l’information de la périphérie vers le système nerveux central. Permet au corps de ressentir »","source":"8C10","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-051","fam":"a8-arc","kc":"A8.22","k":"qcm","q":"Laquelle de ces définitions décrit la voie efférente (8C10) ?","choix":[{"t":"Elle porte les ordres du système nerveux central aux muscles et aux glandes.","ok":true},{"t":"Elle apporte l’information de la périphérie vers le système nerveux central, pour ressentir.","pourquoi":"Ça, c’est la voie afférente : elle permet « de ressentir »."},{"t":"Elle relie les deux yeux au chiasma optique.","pourquoi":"Le chiasma est sur la voie visuelle; ce n’est pas une définition d’efférent."},{"t":"Elle porte la lumière de la rétine jusqu’au cerveau.","pourquoi":"Aucune voie ne porte de lumière, seulement des impulsions électriques. Et vers le cerveau, c’est afférent."}],"expl":"« Voie efférente: transport (sic) les orders (sic) émis par de system (sic) nerveux central vers la périphérie (muscles et glandes). Permet au corps d’agir »","source":"8C10","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-052","fam":"a8-arc","kc":"A8.22","k":"vf","q":"Le nerf oculomoteur III, qui va au sphincter de l’iris, fait partie de la voie efférente.","v":true,"expl":"Il porte l’ordre du centre vers le muscle : « Permet au corps d’agir ». La séquence l’écrit : « Nerf oculomoteur III-voie motrice parasympathique ».","source":"8C10, 8SEQ","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-053","fam":"a8-arc","kc":"A8.24","k":"qcm","q":"On éclaire seulement l’œil gauche d’un patient en santé. Que font les pupilles ?","choix":[{"t":"Les deux pupilles se contractent.","ok":true},{"t":"Seule la pupille gauche se contracte.","pourquoi":"Le signal passe des deux côtés du cerveau, et le message part « aux 2 nerfs oculomoteurs (III) »."},{"t":"Seule la pupille droite se contracte.","pourquoi":"La pupille éclairée réagit aussi : les deux sphincters reçoivent l’ordre."},{"t":"La gauche se contracte, et la droite se dilate un peu.","pourquoi":"Aucune dilatation ici : la lumière commande la contraction, et les deux pupilles la reçoivent."}],"expl":"« parce que les fibres de rétine nasale traversent le chiasma, les 2 cotés (sic) du cerveau recoivent (sic) le signal et les 2 pupilles se constrictent » (8C12).","source":"8C12, 8C9","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-054","fam":"a8-arc","kc":"A8.25","k":"qcm","q":"Lumière dans l’œil droit : aucune pupille ne bouge. Lumière dans l’œil gauche : les deux se contractent. Quel lien est coupé ?","choix":[{"t":"Le nerf optique droit (afférent).","ok":true},{"t":"Le nerf III droit (efférent).","pourquoi":"Si le III droit était coupé, la pupille droite ne bougerait jamais, même avec la lumière à gauche. Ici, elle répond."},{"t":"Le nerf optique gauche (afférent).","pourquoi":"Éclairer l’œil gauche marche : son nerf optique transmet bien."},{"t":"Le nerf III gauche, qui commande le sphincter (efférent).","pourquoi":"La pupille gauche se contracte quand on éclaire l’œil gauche : son III fonctionne."}],"expl":"L’œil droit n’envoie plus rien, mais les deux III obéissent quand l’autre œil est éclairé : la panne est afférente, à droite (cas d’exercice, déduit de l’arc).","source":"8C9, 8C12","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-055","fam":"a8-arc","kc":"A8.25","k":"qcm","q":"Quel que soit l’œil éclairé, la pupille gauche se contracte et la droite ne bouge jamais. Quel lien est coupé ?","choix":[{"t":"Le nerf III droit (efférent).","ok":true},{"t":"Le nerf optique droit (afférent).","pourquoi":"Avec le nerf optique droit coupé, éclairer l’œil gauche contracterait les deux pupilles. Ici, la droite ne bouge jamais."},{"t":"Le nerf optique gauche (afférent).","pourquoi":"Éclairer l’œil gauche fait réagir la pupille gauche : le nerf optique gauche transmet."},{"t":"Le sphincter de l’iris gauche.","pourquoi":"La pupille gauche se contracte bien : c’est le côté droit qui n’obéit plus."}],"expl":"Une panne efférente suit la pupille : le message arrive au centre, mais la pupille droite ne reçoit plus l’ordre (cas d’exercice, déduit de l’arc).","source":"8C9, 8C12","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-056","fam":"a8-arc","kc":"A8.25","k":"vf","q":"Pour trouver la panne, il suffit d’éclairer un seul œil et de regarder sa pupille.","v":false,"expl":"On éclaire chaque œil tour à tour et on regarde les deux pupilles. Une panne afférente suit l’œil éclairé; une panne efférente suit la pupille.","source":"8C9","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-057","fam":"a8-arc","kc":"A8.25","k":"qcm","q":"Pourquoi mesure-t-on la réaction des pupilles ?","choix":[{"t":"Pour vérifier le parcours nerveux, de l’œil au cerveau.","ok":true},{"t":"Pour mesurer la vision des couleurs.","pourquoi":"Les couleurs sont le travail des cônes; la pupille teste le trajet nerveux du réflexe."},{"t":"Pour mesurer la force du muscle dilatateur de l’iris.","pourquoi":"La lumière fait travailler le sphincter, et le test vérifie tout le trajet, pas un seul muscle."},{"t":"Pour voir si le patient est myope et a besoin de lunettes.","pourquoi":"La myopie ne se voit pas à la pupille. La réaction des pupilles renseigne sur le trajet nerveux."}],"expl":"« On mesure l’intégrité du parcours neurologique des voies optiques de l’oeil à travers plusieurs parties du cerveau. » (8C9) C’est aussi pourquoi les paramédiques vérifient les pupilles.","source":"8C9","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-058","fam":"a8-muscles","kc":"A8.20","k":"qcm","q":"Tu sors en plein soleil et ta pupille devient plus petite. Comment s’appelle cette réaction ?","choix":[{"t":"Le myosis.","ok":true},{"t":"La mydriase.","pourquoi":"La mydriase, c’est l’inverse : « En illumination basse, la pupille s’élargit. On appel (sic) ceci mydriase. »"},{"t":"La phototransduction.","pourquoi":"La phototransduction se passe dans les disques des photorécepteurs; ce n’est pas un changement de pupille."}],"expl":"« En illumination forte, elle se constricte. On appelle ceci myosis. » (8C8)","source":"8C8, 8SEQ","mod":8,"voir":{"p":"iris-muscles","r":["1"]}},{"id":"a8-059","fam":"a8-muscles","kc":"A8.20","k":"vf","q":"Dans une pièce sombre, la pupille s’élargit : c’est la mydriase.","v":true,"expl":"« En illumination basse, la pupille s’élargit. On appel (sic) ceci mydriase. » (8C8)","source":"8C8","mod":8,"voir":{"p":"iris-muscles","r":["2"]}},{"id":"a8-060","fam":"a8-muscles","kc":"A8.21","k":"qcm","q":"Quel muscle contracte la pupille, et par quel système ?","choix":[{"t":"Le sphincter de l’iris, par le parasympathique.","ok":true},{"t":"Le dilatateur de l’iris, par le sympathique.","pourquoi":"Le dilatateur élargit la pupille : c’est la mydriase (8C13)."},{"t":"Le sphincter de l’iris, par le sympathique.","pourquoi":"Le titre de 8C14 le laisse croire, mais le sympathique va au dilatateur (8C13, figure de 8C14)."},{"t":"Le dilatateur de l’iris, commandé par le nerf optique.","pourquoi":"Le nerf optique est afférent : il ne commande aucun muscle. Et le dilatateur élargit la pupille."}],"expl":"« La voie efférente parasympatique (sic) emprunte le trajet du 3e nerf crânien et se termine au niveau du sphincter de l’iris. » (8C11)","source":"8C11, 8C13","mod":8,"voir":{"p":"iris-muscles","r":["1"]}},{"id":"a8-061","fam":"a8-muscles","kc":"A8.21","k":"qcm","q":"D’où part la voie sympathique qui dilate la pupille, et où arrive-t-elle ?","choix":[{"t":"De l’hypothalamus, jusqu’au dilatateur de l’iris.","ok":true},{"t":"De l’hypothalamus, jusqu’au sphincter de l’iris.","pourquoi":"C’est le titre de 8C14 (« sympatique (sic) qui se rend au sphincter »), mais le texte de 8C13 et la figure de 8C14 disent le dilatateur."},{"t":"Du nerf III, jusqu’au sphincter de l’iris.","pourquoi":"Ça, c’est la voie parasympathique, qui contracte la pupille."},{"t":"Du nerf V, jusqu’au dilatateur de l’iris.","pourquoi":"Selon 8C13, la voie qui dilate « nait dans l’hypothalamus ». Le V est le nerf sensitif du larmoiement."}],"expl":"« Elle nait dans l’hypothalamus et suit un trajet complex (sic) et arrive au muscle dilatateur de l’iris. » (8C13)","source":"8C13, 8C14","mod":8,"voir":{"p":"iris-muscles","r":["2"]}},{"id":"a8-062","fam":"a8-muscles","kc":"A8.21","k":"vf","q":"Des deux muscles de l’iris, c’est le sphincter qui domine.","v":true,"expl":"« Le sphincter domine sur les 2. » (8C8)","source":"8C8","mod":8,"voir":{"p":"iris-muscles","r":["1"]}},{"id":"a8-063","fam":"a8-muscles","kc":"A8.26","k":"qcm","q":"Les gouttes de l’examen dilatent la pupille. Comment, selon 8C11 ?","choix":[{"t":"Elles inhibent le parasympathique : le sphincter lâche.","ok":true},{"t":"Elles stimulent le dilatateur, qui tire plus fort.","pourquoi":"C’est la méprise : selon 8C11, elles coupent le système opposé, le parasympathique."},{"t":"Elles bloquent le nerf optique : l’œil ne voit plus la lumière.","pourquoi":"Le nerf optique n’est pas visé : les gouttes agissent entre les nerfs et le muscle du sphincter."},{"t":"Elles inhibent le sympathique : le dilatateur se relâche.","pourquoi":"Inhiber le sympathique ferait l’inverse : le dilatateur cesserait d’ouvrir la pupille."}],"expl":"Les gouttes « inhibent le système parasympathique », « en changeant les récepteurs entre les nerfs et le muscle du sphincter » (8C11). Le sphincter, qui domine, lâche : la pupille reste grande.","source":"8C11, 8C8","mod":8,"voir":{"p":"iris-muscles","r":["2"]}},{"id":"a8-064","fam":"a8-muscles","kc":"A8.26","k":"ordre","q":"Remets dans l’ordre ce qui se passe après les gouttes de dilatation.","etapes":["Les gouttes inhibent le système parasympathique","Le sphincter de l’iris ne se contracte plus","Le dilatateur l’emporte","La pupille reste grande : mydriase"],"expl":"Les gouttes « inhibent le système parasympathique » (8C11). Le sphincter, qui « domine » d’habitude (8C8), ne se contracte plus : le dilatateur l’emporte (déduit).","source":"8C11, 8C8","mod":8,"voir":{"p":"iris-muscles","r":["2"]}},{"id":"a8-065","fam":"a8-muscles","kc":"A8.26","k":"qcm","q":"On approche une lumière d’un œil dilaté par ces gouttes. Que devrait faire sa pupille ?","choix":[{"t":"Rester grande : l’ordre passe par le parasympathique.","ok":true},{"t":"Se contracter : la lumière est plus forte que les gouttes.","pourquoi":"L’ordre de contraction passe par le nerf III, parasympathique, que les gouttes inhibent."},{"t":"Se dilater encore plus.","pourquoi":"La lumière commande la contraction, pas la dilatation. Ici, la pupille ne peut juste pas se contracter."}],"expl":"Le réflexe se termine par le nerf III, parasympathique, et le sphincter. Les gouttes « inhibent le système parasympathique » : la pupille reste grande (déduit de 8C11 et de la séquence).","source":"8C11, 8SEQ","mod":8,"voir":{"p":"iris-muscles","r":["2"]}},{"id":"a8-066","fam":"a8-muscles","kc":"A8.27","k":"qcm","q":"Sur la figure de 8C14 (en anglais), où se termine la voie sympathique ?","choix":[{"t":"Au « Dilator iridis m ».","ok":true},{"t":"Au « Sphincter pupillae m ».","pourquoi":"C’est la fin de la voie parasympathique, celle du nerf III."},{"t":"Au « Pretectal nucleus ».","pourquoi":"C’est un relais au début de la voie parasympathique, juste après le « Optic tract »."},{"t":"Au « Superior cervical ganglion ».","pourquoi":"C’est une station du milieu de la voie sympathique, pas sa fin."}],"expl":"Voie sympathique : « Superior cervical ganglion » → « Carotid plexus » → « Ophthalmic n » → « Long ciliary n » → « Dilator iridis m ». La prof dit ce trajet « très compliqué »; le texte de 8C13 en donne le début (l’hypothalamus) et la fin (le dilatateur).","source":"8C14, 8C13","mod":8,"voir":{"p":"iris-muscles","r":["2"]}},{"id":"a8-067","fam":"a8-deux-arcs","kc":"A8.30","k":"qcm","q":"En sortant au grand soleil, tu plisses les yeux et tu larmoies. Quel est le récepteur de ce réflexe de larmoiement ?","choix":[{"t":"La cornée.","ok":true},{"t":"La rétine.","pourquoi":"C’est « une erreur fréquente » : « C'est la cornée qui recoit le stimulus et non la rétine »."},{"t":"Le nerf optique.","pourquoi":"Le nerf optique est l’afférent du réflexe de la pupille. Pour le larmoiement, c’est le nerf sensitif V."},{"t":"La glande lacrymale.","pourquoi":"Elle est au bout de l’arc : c’est elle qui fait les larmes."}],"expl":"Réflexe larmoiement : « lumière, cornée, nerf sensitif V (voie afférente), tronc cérébral, nerf VII (efférente) vers la glande lacrymale, larmoiement ».","source":"RETRO","mod":8,"voir":{"p":"deux-reflexes","r":["L2"]}},{"id":"a8-068","fam":"a8-deux-arcs","kc":"A8.30","k":"qcm","q":"Lequel des deux réflexes à la lumière passe par la rétine ?","choix":[{"t":"Le réflexe de la pupille.","ok":true},{"t":"Le réflexe de larmoiement.","pourquoi":"Le larmoiement part de la cornée : « C'est la cornée qui recoit le stimulus et non la rétine »."},{"t":"Les deux, puisqu’ils partent tous deux de la lumière.","pourquoi":"Ils partent de la lumière, mais pas du même récepteur : la cornée pour les larmes, la rétine pour la pupille."},{"t":"Aucun : la rétine sert seulement à voir.","pourquoi":"La rétine sert aussi aux voies non-visuelles, dont la pupille : « rétine, nerf optique II »."}],"expl":"Réflexe pupille : « lumière, rétine, nerf optique II, centre réflexes du cerveau, nerf oculomoteur III (parasympathique), contraction du sphincter de l'iris, myosis ».","source":"RETRO, 8SEQ","mod":8,"voir":{"p":"deux-reflexes","r":["P2"]}},{"id":"a8-069","fam":"a8-deux-arcs","kc":"A8.30","k":"vf","q":"Dans le réflexe de larmoiement, c’est la rétine qui reçoit le stimulus lumineux.","v":false,"expl":"« C'est la cornée qui recoit le stimulus et non la rétine ». La rétine, c’est le départ du réflexe de la pupille.","source":"RETRO","mod":8,"voir":{"p":"deux-reflexes","r":["L2"]}},{"id":"a8-070","fam":"a8-deux-arcs","kc":"A8.30","k":"ordre","q":"Remets dans l’ordre le réflexe de larmoiement, tel que la prof l’a écrit.","etapes":["Lumière","Cornée","Nerf sensitif V (voie afférente)","Tronc cérébral","Nerf VII (efférente) vers la glande lacrymale","Larmoiement"],"expl":"« C'est la cornée qui recoit le stimulus et non la rétine » : le V apporte le message au tronc cérébral, le VII porte l’ordre à la glande lacrymale.","source":"RETRO","mod":8,"voir":{"p":"deux-reflexes"}},{"id":"a8-071","fam":"a8-deux-arcs","kc":"A8.30","k":"qcm","q":"Une camarade écrit l’arc du larmoiement : lumière, rétine, nerf V, tronc cérébral, nerf VII, glande lacrymale, larmoiement. Où est l’erreur ?","choix":[{"t":"La rétine : c’est la cornée qui reçoit le stimulus.","ok":true},{"t":"Le nerf V : il faudrait le nerf optique.","pourquoi":"Le nerf optique part de la rétine, vers le réflexe de la pupille. Pour les larmes, c’est le « nerf sensitif V (voie afférente) »."},{"t":"Le nerf VII : il faudrait le nerf III.","pourquoi":"Le III va au sphincter de l’iris. Vers la glande lacrymale, c’est le « nerf VII (efférente) »."},{"t":"Le tronc cérébral : il faudrait le centre réflexe du cerveau.","pourquoi":"Dans les mots de la prof, le centre du larmoiement est le « tronc cérébral »; le « centre réflexes du cerveau » est celui de la pupille."}],"expl":"C’est « une erreur fréquente » : la rétine glisse du réflexe de la pupille dans celui des larmes. « C'est la cornée qui recoit le stimulus et non la rétine ».","source":"RETRO","mod":8,"voir":{"p":"deux-reflexes","r":["L2"]}},{"id":"a8-072","fam":"a8-deux-arcs","kc":"A8.30","k":"qcm","q":"Dans les deux chaînes de la prof, larmoiement et pupille, quel élément est commun ?","choix":[{"t":"La lumière, au départ de l’arc.","ok":true},{"t":"La rétine.","pourquoi":"Seulement dans le réflexe de la pupille; le larmoiement part de la cornée."},{"t":"Le nerf VII.","pourquoi":"Seulement dans le larmoiement : il porte l’ordre vers la glande lacrymale."},{"t":"Le nerf optique II.","pourquoi":"Seulement dans le réflexe de la pupille : c’est son afférent."}],"expl":"Les deux arcs partent de la lumière, puis se séparent au récepteur : la cornée pour les larmes, la rétine pour la pupille.","source":"RETRO","mod":8,"voir":{"p":"deux-reflexes","r":["L1","P1"]}},{"id":"a8-073","fam":"a8-deux-arcs","kc":"A8.30","k":"qcm","q":"Dans le réflexe de larmoiement, quel nerf est la voie afférente ?","choix":[{"t":"Le nerf sensitif V.","ok":true},{"t":"Le nerf optique II.","pourquoi":"C’est l’afférent du réflexe de la pupille, qui part de la rétine."},{"t":"Le nerf VII, vers la glande lacrymale.","pourquoi":"Le VII est l’efférent du larmoiement : il porte l’ordre à la glande lacrymale."},{"t":"Le nerf oculomoteur III.","pourquoi":"C’est l’efférent du réflexe de la pupille, vers le sphincter."}],"expl":"« nerf sensitif V (voie afférente) » : il apporte le message de la cornée au « tronc cérébral ».","source":"RETRO","mod":8,"voir":{"p":"deux-reflexes","r":["L3"]}},{"id":"a8-074","fam":"a8-deux-arcs","kc":"A8.30","k":"vf","q":"Les deux réflexes sortent par le parasympathique : ils se séparent au récepteur, cornée ou rétine.","v":true,"expl":"Pupille : « nerf oculomoteur III (parasympathique) ». Larmes : « La sécrétion des larmes est sous le contôle (sic) du système parasympatique (sic) » (M6). Les arcs se séparent à la cornée ou à la rétine.","source":"RETRO; M6 A19","mod":8,"voir":{"p":"deux-reflexes","r":["L5","P5"]}},{"id":"a8-075","fam":"a8-deux-arcs","kc":"A8.30","k":"num","q":"Réflexe de la pupille : quel est le numéro du nerf crânien qui porte l’ordre jusqu’au sphincter de l’iris ?","rep":{"v":3,"tol":0.5,"dec":0},"pieges":[{"v":2,"m":"Le II, c’est le nerf optique : il apporte l’information au centre (afférent)."},{"v":7,"m":"Le VII porte l’ordre du larmoiement, vers la glande lacrymale."},{"v":5,"m":"Le V est le nerf sensitif du larmoiement, qui part de la cornée."}],"expl":"« nerf oculomoteur III (parasympathique) » : c’est la voie efférente, vers le sphincter. Le II (nerf optique) est l’afférent.","source":"RETRO, 8C11","mod":8,"voir":{"p":"deux-reflexes","r":["P5"]}},{"id":"a9-001","fam":"a9-carte","kc":"A9.1","k":"qcm","q":"Dans l’île de vision de la prof, quelle est la zone la plus sensible ?","choix":[{"t":"La papille, où part le nerf optique.","pourquoi":"À la papille, il n’y a pas de photorécepteurs : c’est le point aveugle, pas la zone la plus sensible."},{"t":"La macula, au centre de la rétine.","ok":true},{"t":"La rétine périphérique, sur les bords.","pourquoi":"La prof place la zone la plus sensible au centre, pas sur les bords."},{"t":"Le chiasma, où les fibres croisent.","pourquoi":"Le chiasma est un carrefour de fibres dans le cerveau : il ne capte pas la lumière."}],"expl":"« Île de vision: la zone la plus sensible est la macula au centre. Elle détecte détails et les couleurs »","source":"9A1","mod":9,"voir":{"p":"fond-oeil","r":["macula"]}},{"id":"a9-002","fam":"a9-carte","kc":"A9.1","k":"qcm","q":"Que détecte surtout la macula, selon la prof ?","choix":[{"t":"Les détails et les couleurs.","ok":true},{"t":"Les mouvements sur les côtés.","pourquoi":"La diapo dit détails et couleurs, au centre. Elle ne parle pas de ce qui bouge sur les côtés."},{"t":"La lumière très faible, la nuit.","pourquoi":"La lumière très faible est l’affaire des bâtonnets (module 8). La macula sert aux détails et aux couleurs."},{"t":"La lumière bleue, pour l’horloge.","pourquoi":"Le bleu de l’horloge passe par une voie non-visuelle (module 8), pas par la vision fine de la macula."}],"expl":"La macula « détecte détails et les couleurs » : c’est le travail des cônes, faits pour la « vision des couleurs et la vision centrale fine » (module 8).","source":"9A1; 8A2","mod":9,"voir":{"p":"fond-oeil","r":["macula"]}},{"id":"a9-003","fam":"a9-carte","kc":"A9.2","k":"qcm","q":"On divise l’œil en quatre quadrants. Qu’est-ce que la prof place au centre ?","choix":[{"t":"La papille, départ du nerf optique.","pourquoi":"C’est le piège de la figure : sa croix est tracée sur la papille, mais le titre de la prof dit « avec la fovéa au centre »."},{"t":"Le cristallin, derrière l’iris.","pourquoi":"Le cristallin est à l’avant de l’œil. Les quadrants découpent le fond de l’œil."},{"t":"La fovéa, au centre de la macula.","ok":true},{"t":"Le chiasma, où les fibres croisent.","pourquoi":"Le chiasma est dans le cerveau, après les deux nerfs optiques."}],"expl":"« On divise l’œil en quadrants avec la fovéa au centre: supérieur temporal, supérieur nasal, inférieur temporal et inférieur nasal »","source":"9A2","mod":9,"voir":{"p":"fond-quadrants"}},{"id":"a9-004","fam":"a9-carte","kc":"A9.2","k":"vf","q":"Les quatre quadrants de la rétine sont : supérieur temporal, supérieur nasal, inférieur temporal et inférieur nasal.","v":true,"expl":"« On divise l’œil en quadrants avec la fovéa au centre: supérieur temporal, supérieur nasal, inférieur temporal et inférieur nasal »","source":"9A2","mod":9,"voir":{"p":"fond-quadrants"}},{"id":"a9-005","fam":"a9-carte","kc":"A9.1","k":"vf","q":"La zone la plus sensible du champ visuel correspond à la papille, là où le nerf optique quitte l’œil.","v":false,"expl":"La zone la plus sensible est « la macula au centre ». À la papille, c’est le contraire : « Absence de photorécepteurs au niveau du nerf optique », d’où le point aveugle.","source":"9A1; Anatomie 4.2, d6","mod":9,"voir":{"p":"fond-oeil","r":["macula","papille"]}},{"id":"a9-006","fam":"a9-inverse","kc":"A9.3","k":"qcm","q":"La rétine supérieure est responsable de quelle partie du champ visuel ?","choix":[{"t":"Du champ visuel supérieur.","pourquoi":"C’est l’erreur à éviter : « Le champ visuel inverse l’anatomie de l’oeil. » Le haut de la rétine voit le bas."},{"t":"Du champ visuel temporal.","pourquoi":"Temporal va avec nasal : la rétine nasale est responsable du champ temporal. Ici, on parle du haut et du bas."},{"t":"Du champ visuel central.","pourquoi":"Le centre, c’est la macula. La rétine supérieure, elle, voit le bas du champ."},{"t":"Du champ visuel inférieur.","ok":true}],"expl":"« La rétine supérieure est responsable du champ visuel inférieur »","source":"9A6","mod":9,"voir":{"p":"oeil-inverse","r":["vrh","vb"]}},{"id":"a9-007","fam":"a9-inverse","kc":"A9.3","k":"qcm","q":"Quelle partie de la rétine est responsable du champ visuel nasal ?","choix":[{"t":"La rétine nasale.","pourquoi":"La rétine nasale est responsable du champ temporal : les deux mots s’inversent."},{"t":"La rétine temporale.","ok":true},{"t":"La rétine supérieure.","pourquoi":"La rétine supérieure est responsable du champ visuel inférieur."},{"t":"La rétine inférieure.","pourquoi":"La rétine inférieure est responsable du champ visuel supérieur."}],"expl":"« La rétine temporale est responsable du champ visuel nasal. »","source":"9A6","mod":9,"voir":{"p":"oeil-inverse","r":["crh","cb"]}},{"id":"a9-008","fam":"a9-inverse","kc":"A9.4","k":"qcm","q":"Pourquoi le champ visuel est-il l’inverse de la rétine ?","choix":[{"t":"L’œil a deux lentilles convexes, qui inversent l’image.","ok":true},{"t":"Le cerveau retourne l’image avant de la traiter.","pourquoi":"La prof ne dit rien de tel : l’inversion vient des lentilles de l’œil, avant même la rétine."},{"t":"Les fibres nasales croisent au niveau du chiasma.","pourquoi":"Le chiasma range les fibres par côté du champ. Il n’explique pas l’inversion, qui se fait dans l’œil."},{"t":"Les photorécepteurs sont au fond de la rétine.","pourquoi":"C’est vrai (module 8), mais ce n’est pas la raison donnée : ce sont les « 2 lentilles convexes »."}],"expl":"« L’oeil a 2 lentilles convexes qui créent une image inversée » : c’est la lentille convexe de l’optique géométrique.","source":"9A3, 9A4","mod":9,"voir":{"p":"oeil-inverse"}},{"id":"a9-009","fam":"a9-inverse","kc":"A9.4","k":"qcm","q":"Après l’image inversée, la prof écrit « Simplification ». Que précise-t-elle ?","choix":[{"t":"L’image n’est pas inversée : elle est seulement plus petite que l’objet.","pourquoi":"La diapo ne revient pas sur l’inversion. Elle précise ce qui se forme : pas une image, un signal."},{"t":"L’œil n’a qu’une lentille, et non deux : le cristallin fait tout.","pourquoi":"La diapo d’avant dit « 2 lentilles convexes », et la précision ne porte pas là-dessus."},{"t":"Sur la rétine, la lumière devient un signal électrique, et non une image.","ok":true},{"t":"L’image se forme sur le nerf optique, et non pas sur la rétine elle-même.","pourquoi":"La lumière s’arrête à la rétine, où elle est transformée en signal. Le nerf transporte ce signal."}],"expl":"« Ce n’est pas une image qui est créée sur la rétine mais plutot (sic) de la lumière qui est transformée en signale (sic) électrique » : c’est la phototransduction du module 8.","source":"9A5","mod":9,"voir":{"p":"oeil-inverse"}},{"id":"a9-010","fam":"a9-inverse","kc":"A9.5","k":"qcm","q":"Un point de la rétine est dans le quadrant supérieur temporal. Dans quel quadrant du champ visuel de cet œil voit-il ?","choix":[{"t":"Supérieur temporal.","pourquoi":"C’est le même quadrant : tu n’as rien inversé. Le haut voit le bas, et le temporal voit le nasal."},{"t":"Inférieur temporal.","pourquoi":"Tu as inversé le haut et le bas, mais pas le côté : la rétine temporale est responsable du champ nasal."},{"t":"Supérieur nasal.","pourquoi":"Tu as inversé le côté, mais pas la hauteur : la rétine supérieure est responsable du champ inférieur."},{"t":"Inférieur nasal.","ok":true}],"expl":"Deux inversions à la fois : supérieur devient inférieur, temporal devient nasal. La prof donne les deux règles séparément; les combiner est une déduction.","source":"9A2, 9A6","mod":9,"voir":{"p":"oeil-inverse","r":["vrh","vb","crh","cb"]}},{"id":"a9-011","fam":"a9-inverse","kc":"A9.5","k":"qcm","q":"La rétine temporale de l’œil droit est responsable de quelle partie du champ visuel ?","choix":[{"t":"Du champ temporal de l’œil droit, donc du côté droit.","pourquoi":"Tu n’as pas inversé : la rétine temporale est responsable du champ nasal."},{"t":"Du champ nasal de l’œil droit, donc du côté gauche.","ok":true},{"t":"Du champ nasal de l’œil gauche, donc du côté droit.","pourquoi":"Une rétine ne voit que pour son œil : celle de l’œil droit donne une partie du champ de l’œil droit."},{"t":"Du champ temporal de l’œil gauche, donc du côté gauche.","pourquoi":"Le côté est le bon, mais pas l’œil : la rétine de l’œil droit voit le champ de l’œil droit."}],"expl":"Rétine temporale, champ nasal. Pour l’œil droit, le nez est à gauche : c’est le côté gauche. Sur la feuille de la prof, « champ nasal OD » a la même couleur que « champ temporal OS » : le champ visuel gauche.","source":"9A6, 9B1","mod":9,"voir":{"p":"oeil-inverse","r":["crh","cb"]}},{"id":"a9-012","fam":"a9-inverse","kc":"A9.3","k":"vf","q":"La rétine nasale est responsable du champ visuel nasal.","v":false,"expl":"« La rétine nasale est responsable du champ visuel temporal. » Le champ visuel inverse la rétine.","source":"9A6","mod":9,"voir":{"p":"oeil-inverse","r":["crb","ch"]}},{"id":"a9-013","fam":"a9-inverse","kc":"A9.4","k":"ordre","q":"Remets dans l’ordre ce qui arrive à la lumière d’un objet placé en haut de ton champ visuel.","etapes":["La lumière part de l’objet, en haut du champ","Elle traverse les deux lentilles convexes de l’œil, qui inversent","Elle arrive sur la rétine inférieure","Elle y est transformée en signal électrique","Le signal quitte l’œil par le nerf optique"],"expl":"Les lentilles inversent, donc le haut du champ tombe sur le bas de la rétine. Là, la lumière devient un signal électrique, qui suit le nerf optique.","source":"9A4, 9A5, 9A6, 9A8","mod":9,"voir":{"p":"oeil-inverse"}},{"id":"a9-014","fam":"a9-inverse","kc":"A9.3","k":"court","q":"On dit que le champ visuel inverse l’anatomie de l’œil. Donne les quatre correspondances entre la rétine et le champ visuel.","rep":"La rétine supérieure est responsable du champ visuel inférieur, et la rétine inférieure du champ visuel supérieur. La rétine nasale est responsable du champ visuel temporal, et la rétine temporale du champ visuel nasal.","points":["Rétine supérieure → champ visuel inférieur","Rétine inférieure → champ visuel supérieur","Rétine nasale → champ visuel temporal","Rétine temporale → champ visuel nasal"],"expl":"Ce sont les quatre phrases de la diapo « Œil inversé! ».","source":"9A6","mod":9,"voir":{"p":"oeil-inverse"}},{"id":"a9-015","fam":"a9-inverse","kc":"A9.5","k":"court","q":"Question du projet UA2 : « La rétine nasale de l’oeil gauche est responsible de quelle partie du champ visuel? »","rep":"Du champ visuel temporal de l’œil gauche : la partie du champ située à gauche, du côté de la tempe.","points":["Le champ visuel temporal","Celui de l’œil gauche : le côté gauche, vers la tempe"],"expl":"C’est la question 10 du projet du 13 novembre. « La rétine nasale est responsable du champ visuel temporal. » Sur la feuille des voies visuelles, « champ temporal OS » a la couleur du champ visuel gauche.","source":"PROJ q10, 9A6, 9B1","mod":9,"voir":{"p":"oeil-inverse","r":["crb","ch"]}},{"id":"a9-016","fam":"a9-inverse","kc":"A9.4","k":"court","q":"Explique pourquoi le champ visuel est inversé par rapport à la rétine.","rep":"L’œil a deux lentilles convexes, qui créent une image inversée, comme une lentille convexe en optique géométrique. En réalité, ce n’est pas une image qui se forme sur la rétine : la lumière y est transformée en signal électrique.","points":["L’œil a deux lentilles convexes","Elles créent une image inversée","Précision : pas une vraie image, mais de la lumière transformée en signal électrique"],"expl":"Les deux lentilles sont la cornée et le cristallin. La prof ne les nomme pas sur cette diapo : c’est déduit du module 7.","source":"9A3, 9A4, 9A5","mod":9,"voir":{"p":"oeil-inverse"}},{"id":"a9-017","fam":"a9-zones","kc":"A9.6","k":"qcm","q":"Laquelle de ces listes donne les trois grandes zones du système visuel qui affectent le champ visuel ?","choix":[{"t":"Cornée, cristallin, vitré : les milieux transparents.","pourquoi":"Ce sont des milieux que la lumière traverse (module 7), pas les trois zones de la diapo."},{"t":"Rétine, chiasma, glande pinéale : les trois sorties.","pourquoi":"La glande pinéale appartient à la voie de l’horloge (module 8), pas au champ visuel."},{"t":"Rétine, nerf optique, parcours visuel après le chiasma.","ok":true},{"t":"Macula, fovéa, papille : les repères du fond d’œil.","pourquoi":"Ce sont des repères de la rétine, donc d’une seule des trois zones."}],"expl":"« 1. Rétine », « 2. Nerf optique », « 3. Parcours visuel dans le cerveau après le chiasma ».","source":"9A7","mod":9,"voir":{"p":"voies-zones"}},{"id":"a9-018","fam":"a9-zones","kc":"A9.6","k":"court","q":"Nomme les trois grandes zones du système visuel qui affectent le champ visuel.","rep":"1. La rétine. 2. Le nerf optique. 3. Le parcours visuel dans le cerveau, après le chiasma.","points":["La rétine","Le nerf optique","Le parcours visuel dans le cerveau, après le chiasma"],"expl":"« 1. Rétine », « 2. Nerf optique », « 3. Parcours visuel dans le cerveau après le chiasma ». Le chiasma lui-même, entre la zone 2 et la zone 3, a son propre défaut : le défaut bi-temporal.","source":"9A7","mod":9,"voir":{"p":"voies-zones"}},{"id":"a9-019","fam":"a9-zones","kc":"A9.7","k":"qcm","q":"Un décollement touche la rétine supérieure d’un œil : elle ne fonctionne plus. Où est le défaut dans le champ visuel de cet œil ?","choix":[{"t":"Dans le champ inférieur.","ok":true},{"t":"Dans le champ supérieur.","pourquoi":"C’est l’erreur à éviter : « La rétine supérieure est responsable du champ visuel inférieur »."},{"t":"Dans le champ temporal.","pourquoi":"Le côté du champ dépend de la rétine nasale ou temporale. Ici, c’est le haut de la rétine qui est atteint."},{"t":"Au centre, autour du point fixé.","pourquoi":"Le centre correspond à la macula. Ici, c’est la rétine du haut qui est décollée."}],"expl":"C’est la question de la prof : « Ou (sic) serait le défaut au niveau du champ visuel? Rétine supérieure non-fonctionnel (sic) ». La diapo ne donne pas la réponse : elle se déduit de la règle de l’œil inversé.","source":"9A10, 9A6","mod":9,"voir":{"p":"oeil-inverse","r":["vrh","vb"]}},{"id":"a9-020","fam":"a9-zones","kc":"A9.7","k":"court","q":"La rétine supérieure d’un œil n’est plus fonctionnelle (décollement de rétine). Où est le défaut dans le champ visuel ? Explique ta réponse.","rep":"Le défaut est dans le champ visuel inférieur de cet œil, parce que le champ visuel inverse la rétine : la rétine supérieure est responsable du champ visuel inférieur.","points":["Le défaut est dans le champ visuel inférieur","La raison : le champ visuel inverse la rétine (rétine supérieure, champ inférieur)","Un seul œil est touché : la rétine est avant le chiasma"],"expl":"Le troisième élément est déduit : la diapo ne le dit pas, mais la figure des anomalies montre qu’avant le chiasma un seul œil perd du champ.","source":"9A10, 9A6","mod":9,"voir":{"p":"oeil-inverse","r":["vrh","vb"]}},{"id":"a9-021","fam":"a9-zones","kc":"A9.7","k":"qcm","q":"Une lésion abîme la rétine nasale d’un œil. Quel défaut attends-tu dans le champ visuel de cet œil ?","choix":[{"t":"Une perte du côté du nez.","pourquoi":"Le défaut est à l’opposé de la rétine atteinte : la rétine nasale est responsable du champ temporal."},{"t":"Une perte du côté de la tempe.","ok":true},{"t":"Une perte dans le haut du champ.","pourquoi":"Le haut du champ dépend de la rétine inférieure. Ici, c’est la rétine nasale qui est atteinte."},{"t":"Une perte dans les deux yeux.","pourquoi":"La rétine est avant le chiasma : seul le champ de cet œil est touché (déduit de la figure des anomalies)."}],"expl":"Zone 1 : le défaut est à l’opposé de la rétine atteinte. « La rétine nasale est responsable du champ visuel temporal. »","source":"9A6, 9A9","mod":9,"voir":{"p":"oeil-inverse","r":["crb","ch"]}},{"id":"a9-022","fam":"a9-zones","kc":"A9.8","k":"qcm","q":"Dans laquelle des trois zones la prof range-t-elle le glaucome ?","choix":[{"t":"Zone 1 : c’est une maladie de la rétine.","pourquoi":"La prof écrit « glaucome (maladie du nerf optique) » : c’est la zone 2."},{"t":"Zone 3 : c’est une maladie du cortex visuel.","pourquoi":"Après le chiasma, les deux yeux sont touchés du même côté. Le glaucome est une maladie du nerf optique."},{"t":"Aucune : c’est une maladie du cristallin.","pourquoi":"Tu penses à la cataracte (module 7). Le glaucome est une « maladie du nerf optique »."},{"t":"Zone 2 : c’est une maladie du nerf optique.","ok":true}],"expl":"« Pertes de vision avec glaucome (maladie du nerf optique) ».","source":"9A13","mod":9,"voir":{"p":"voies-zones","r":["2"]}},{"id":"a9-023","fam":"a9-zones","kc":"A9.8","k":"qcm","q":"Juste avant les champs visuels du glaucome, que rappelle la prof sur les axones des cellules ganglionnaires ?","choix":[{"t":"Ils s’insèrent dans le nerf optique dans un ordre particulier.","ok":true},{"t":"Ils croisent tous au chiasma avant d’entrer dans le nerf optique.","pourquoi":"Le chiasma vient après le nerf optique, et seules les fibres nasales y croisent."},{"t":"Ils transforment la lumière en signal dans leurs disques.","pourquoi":"Ce sont les photorécepteurs qui ont des disques et font la phototransduction (module 8)."},{"t":"Ils quittent l’œil par la macula, au centre de la rétine.","pourquoi":"Les fibres quittent l’œil au disque optique (la papille), pas à la macula."}],"expl":"« Rappel: les axones des ganglions s’insèrent dans le nerf optique dans un ordre particulier ». Sur la figure, les fibres contournent la fovéa en arcs pour rejoindre le disque optique.","source":"9A12","mod":9,"voir":{"p":"voies-zones","r":["2"]}},{"id":"a9-024","fam":"a9-zones","kc":"A9.9","k":"qcm","q":"Sur le relevé d’un œil, la moitié du haut du champ est noire et la limite suit la ligne horizontale. Quelle cause la prof donne-t-elle à ce défaut en altitude ?","choix":[{"t":"Une lésion au milieu du chiasma optique.","pourquoi":"Au chiasma, le défaut est bi-temporal : les deux yeux, chacun du côté de sa tempe."},{"t":"Une lésion du cortex visuel occipital.","pourquoi":"Après le chiasma, les deux yeux perdent le même côté. Ici, c’est un œil, et la moitié du haut."},{"t":"Une artère bloquée au niveau du nerf optique.","ok":true},{"t":"Un cristallin devenu opaque avec l’âge.","pourquoi":"La cataracte brouille toute la vision (module 7). Elle ne coupe pas le champ en deux."}],"expl":"« Défaut en altitude du (sic) à un blocage d’un vaisseau sanguin (artère) au niveau du nerf optique ». L’aspect (moitié du haut noire, limite horizontale) est lu sur la figure de la prof.","source":"9A14","mod":9,"voir":{"p":"voies-zones","r":["2"]}},{"id":"a9-025","fam":"a9-zones","kc":"A9.6","k":"vf","q":"Une atteinte de la rétine ou du nerf optique d’un œil fait perdre du champ visuel dans les deux yeux.","v":false,"expl":"Avant le chiasma, un nerf optique ne porte que le champ de son œil : sur la figure des anomalies, la lésion du nerf optique droit laisse l’œil gauche intact. C’est après le chiasma qu’il y a « Atteinte des 2 yeux ». Pour la rétine, c’est une déduction.","source":"9A16, 9A17","mod":9,"voir":{"p":"voies-zones","r":["1","2"]}},{"id":"a9-026","fam":"a9-zones","kc":"A9.9","k":"court","q":"Qu’est-ce qu’un défaut en altitude du champ visuel, et quelle cause la prof en donne-t-elle ?","rep":"C’est la perte d’une moitié du champ visuel d’un œil selon la hauteur : sur la figure de la prof, la moitié du haut est noire et la limite suit la ligne horizontale. Il est dû au blocage d’un vaisseau sanguin (une artère) au niveau du nerf optique.","points":["Une moitié du champ perdue selon la hauteur (sur la figure : la moitié du haut)","La limite suit l’horizontale","La cause : le blocage d’un vaisseau sanguin (une artère)","Au niveau du nerf optique (zone 2)"],"expl":"La prof ne définit pas le mot : les deux premiers éléments sont lus sur sa figure.","source":"9A14","mod":9,"voir":{"p":"voies-zones","r":["2"]}},{"id":"a9-027","fam":"a9-zones","kc":"A9.6","k":"ordre","q":"Remets dans l’ordre, de l’œil vers l’arrière du cerveau, les endroits où une atteinte touche le champ visuel.","etapes":["Rétine (zone 1)","Nerf optique (zone 2)","Chiasma","Parcours visuel après le chiasma (zone 3)"],"expl":"Ce sont les trois zones de la prof, avec le chiasma entre la zone 2 et la zone 3 : il a son propre défaut, bi-temporal.","source":"9A7, 9A16","mod":9,"voir":{"p":"voies-zones"}},{"id":"a9-028","fam":"a9-chiasma","kc":"A9.10","k":"qcm","q":"Un patient ne voit plus la moitié extérieure de son champ visuel, du côté des tempes, dans les deux yeux. Où est l’atteinte ?","choix":[{"t":"Dans les deux rétines temporales à la fois.","pourquoi":"La rétine temporale est responsable du champ nasal : ce serait une perte du côté du nez."},{"t":"Au chiasma : les fibres nasales des deux yeux y passent.","ok":true},{"t":"Après le chiasma, d’un seul côté du cerveau.","pourquoi":"Après le chiasma, les deux yeux perdent le même côté, tout à gauche ou tout à droite, pas les deux côtés extérieurs."},{"t":"Dans le nerf optique d’un seul des deux yeux.","pourquoi":"Un nerf optique atteint ne touche que son œil. Ici, les deux yeux sont touchés."}],"expl":"« Anomalie 2: chiasma (fibres nasales alors défaut bi-temporal) » : la rétine nasale est responsable du champ temporal, donc chaque œil perd sa moitié extérieure.","source":"9A16, 9A6","mod":9,"voir":{"p":"voies-lesions","r":["2"]}},{"id":"a9-029","fam":"a9-chiasma","kc":"A9.10","k":"court","q":"Une lésion touche le milieu du chiasma. Quel défaut du champ visuel donne-t-elle, et pourquoi ?","rep":"Un défaut bi-temporal : chaque œil perd la moitié temporale (extérieure) de son champ. Au chiasma, ce sont les fibres nasales qui sont touchées, et la rétine nasale est responsable du champ visuel temporal.","points":["Un défaut bi-temporal","Chaque œil perd sa moitié temporale, du côté de la tempe","Les fibres touchées sont les fibres nasales","La rétine nasale est responsable du champ visuel temporal"],"expl":"« Anomalie 2: chiasma (fibres nasales alors défaut bi-temporal) ». Les fibres nasales sont celles qui croisent au chiasma (module 8).","source":"9A16, 9A6","mod":9,"voir":{"p":"voies-lesions","r":["2"]}},{"id":"a9-030","fam":"a9-chiasma","kc":"A9.11","k":"qcm","q":"Un patient perd le côté gauche de son champ visuel, dans les deux yeux. Où est la lésion ?","choix":[{"t":"Après le chiasma, du côté droit du cerveau.","ok":true},{"t":"Après le chiasma, du côté gauche du cerveau.","pourquoi":"C’est le cerveau droit qui traite le champ visuel gauche (module 8) : la lésion est du côté opposé à la perte."},{"t":"Dans le nerf optique de l’œil gauche.","pourquoi":"Un nerf optique atteint fait perdre tout le champ d’un seul œil, pas un côté des deux."},{"t":"Au milieu du chiasma optique.","pourquoi":"Au chiasma, chaque œil perd sa moitié temporale : des côtés opposés, pas le même côté."}],"expl":"« Anomalies 3 et 4: après le chiasma (perte champ visuel a (sic) gauche) » : sur la figure, ces deux lésions sont à droite. « Cerveau droit traite l’information du champ visuel gauche ».","source":"9A16; 8B4","mod":9,"voir":{"p":"voies-lesions","r":["3"]}},{"id":"a9-031","fam":"a9-chiasma","kc":"A9.11","k":"qcm","q":"Selon la prof, que respectent la plupart des défauts du champ visuel de cause neurologique ?","choix":[{"t":"La ligne horizontale.","pourquoi":"La limite horizontale se voit sur le défaut en altitude, au nerf optique. Après le chiasma, c’est la verticale."},{"t":"Le tour de la macula.","pourquoi":"La diapo ne parle pas de la macula ici : elle dit « méridien vertical »."},{"t":"Le bord de la papille.","pourquoi":"La papille donne le point aveugle. La diapo sur les causes neurologiques parle du méridien vertical."},{"t":"Le méridien vertical.","ok":true}],"expl":"« La plupart des défauts respectent le méridien vertical. Atteinte des 2 yeux après le chiasma ».","source":"9A17","mod":9,"voir":{"p":"voies-lesions","r":["3"]}},{"id":"a9-032","fam":"a9-chiasma","kc":"A9.12","k":"qcm","q":"Sur la figure des quatre anomalies, l’anomalie 1 est une lésion du nerf optique droit. Que montrent les deux ronds ?","choix":[{"t":"Œil gauche : tout le champ perdu. Œil droit : champ conservé.","pourquoi":"C’est l’inverse : le nerf optique droit porte le champ de l’œil droit."},{"t":"Les deux yeux perdent le côté droit de leur champ.","pourquoi":"Perdre le même côté dans les deux yeux, c’est après le chiasma. Avant, un nerf porte tout un œil."},{"t":"Œil gauche : champ conservé. Œil droit : tout le champ perdu.","ok":true},{"t":"Chaque œil perd la moitié de son champ du côté de la tempe.","pourquoi":"C’est l’anomalie 2, au chiasma : le défaut bi-temporal."}],"expl":"« Anomalie 1: nerf optique droit » : avant le chiasma, un nerf optique porte tout le champ d’un œil, et rien de l’autre.","source":"9A16","mod":9,"voir":{"p":"voies-lesions","r":["1"]}},{"id":"a9-033","fam":"a9-chiasma","kc":"A9.12","k":"qcm","q":"Les anomalies 3 et 4 sont toutes deux après le chiasma et donnent une perte à gauche. Selon la figure de la prof, qu’est-ce qui change en 4, au cortex occipital ?","choix":[{"t":"Un seul œil reste touché : l’autre garde tout son champ.","pourquoi":"Les deux lésions sont après le chiasma : dans les deux cas, les deux yeux sont touchés."},{"t":"Les deux yeux ont la même perte : c’est plus symétrique.","ok":true},{"t":"La perte passe du côté droit, pour les deux yeux.","pourquoi":"Les deux lésions sont du côté droit du cerveau : la perte reste à gauche."},{"t":"La perte devient bi-temporale, comme au chiasma.","pourquoi":"Le défaut bi-temporal est celui du chiasma, l’anomalie 2."}],"expl":"La figure le dit : « En cas de lésions rétro-chiasmatiques, les anomalies du champ visuel deviennent plus symétriques (conformes), comme le montre la lésion occipitale en #4. » Le titre de la prof, lui, réunit 3 et 4.","source":"9A16","mod":9,"voir":{"p":"voies-lesions","r":["3"]}},{"id":"a9-034","fam":"a9-chiasma","kc":"A9.11","k":"vf","q":"Après le chiasma, une lésion du côté droit du cerveau fait perdre le champ visuel de l’œil droit.","v":false,"expl":"Elle fait perdre le côté gauche du champ, dans les deux yeux : « Atteinte des 2 yeux après le chiasma ». L’œil droit garde son côté droit.","source":"9A16, 9A17","mod":9,"voir":{"p":"voies-lesions","r":["3"]}},{"id":"a9-035","fam":"a9-chiasma","kc":"A9.10","k":"vf","q":"Dans un défaut bi-temporal, chaque œil garde la moitié de son champ située du côté du nez.","v":true,"expl":"Bi-temporal : ce sont les deux moitiés temporales qui sont perdues. Les moitiés nasales restent : elles dépendent des rétines temporales, dont les fibres ne croisent pas au chiasma (module 8).","source":"9A16; 8C12","mod":9,"voir":{"p":"voies-lesions","r":["2"]}},{"id":"a9-036","fam":"a9-chiasma","kc":"A9.11","k":"court","q":"Un patient perd le côté gauche de son champ visuel dans les deux yeux. Où se situe la lésion ? Quel méridien ce défaut respecte-t-il ?","rep":"La lésion est après le chiasma, du côté droit du cerveau. Après le chiasma, les deux yeux sont atteints, et le défaut respecte le méridien vertical.","points":["Après le chiasma","Du côté droit du cerveau, à l’opposé de la perte","Les deux yeux sont atteints","Le défaut respecte le méridien vertical"],"expl":"« La plupart des défauts respectent le méridien vertical. Atteinte des 2 yeux après le chiasma ». Le côté droit se lit sur la figure des anomalies et vient du module 8 : « Cerveau droit traite l’information du champ visuel gauche ».","source":"9A16, 9A17; 8B4","mod":9,"voir":{"p":"voies-lesions","r":["3"]}},{"id":"a9-037","fam":"a9-chiasma","kc":"A9.12","k":"court","q":"Compare ce que perd un patient dans ces deux cas : une lésion du nerf optique droit; une lésion après le chiasma, du côté droit.","rep":"Nerf optique droit : l’œil droit perd tout son champ, l’œil gauche garde le sien. Après le chiasma, à droite : les deux yeux perdent le côté gauche de leur champ et gardent le côté droit.","points":["Nerf optique droit : tout le champ de l’œil droit est perdu","L’œil gauche garde tout son champ","Après le chiasma, à droite : c’est le côté gauche du champ qui est perdu","Dans les deux yeux"],"expl":"C’est l’anomalie 1 contre les anomalies 3 et 4. Avant le chiasma, un nerf porte un œil. Après, un côté du cerveau porte un côté du champ, pour les deux yeux.","source":"9A16","mod":9,"voir":{"p":"voies-lesions","r":["1","3"]}},{"id":"a9-038","fam":"a9-feuille","kc":"A9.13","k":"ordre","q":"Remets dans l’ordre, de A à G, les structures de la feuille des voies visuelles.","etapes":["Rétine","Nerf optique","Chiasma optique","Tractus optique","Corps genouillé latéral","Radiations optiques","Cortex visuel primaire"],"expl":"A « rétine », B « nerf optique », C « chiasma optique », D « tractus optique », E « corps genouillé latéral », F « radiations optiques », G « cortex visuel primaire ».","source":"9B1","mod":9,"voir":{"p":"voies-feuille"}},{"id":"a9-039","fam":"a9-feuille","kc":"A9.13","k":"qcm","q":"Sur la feuille des voies visuelles, quelle structure vient juste après le chiasma optique ?","choix":[{"t":"Les radiations optiques.","pourquoi":"Les radiations viennent plus loin : après le corps genouillé latéral, juste avant le cortex."},{"t":"Le corps genouillé latéral.","pourquoi":"Il vient après le tractus optique : chiasma, tractus, puis corps genouillé latéral."},{"t":"Le tractus optique.","ok":true},{"t":"Le nerf optique.","pourquoi":"Le nerf optique est avant le chiasma : c’est la lettre B."}],"expl":"C « chiasma optique », puis D « tractus optique », E « corps genouillé latéral », F « radiations optiques », G « cortex visuel primaire ».","source":"9B1","mod":9,"voir":{"p":"voies-feuille","r":["C","D"]}},{"id":"a9-040","fam":"a9-feuille","kc":"A9.13","k":"qcm","q":"Sur la feuille de la prof, le vert est le champ visuel gauche et le rouge le champ visuel droit. Après le chiasma, que porte le côté gauche du cerveau ?","choix":[{"t":"Seulement du vert : le champ gauche des deux yeux.","pourquoi":"Le vert, le champ gauche, finit du côté droit du cerveau."},{"t":"Du rouge et du vert : tout le champ de l’œil gauche.","pourquoi":"C’est vrai avant le chiasma, dans un nerf optique. Après, chaque côté n’a qu’une couleur."},{"t":"Du rouge et du vert : la moitié nasale de chaque œil.","pourquoi":"Après le chiasma, chaque côté du cerveau ne porte qu’une couleur, donc un seul côté du champ."},{"t":"Seulement du rouge : le champ droit des deux yeux.","ok":true}],"expl":"Les fibres nasales croisent : après le chiasma, le côté gauche réunit les deux rouges, la rétine temporale de l’œil gauche et la rétine nasale de l’œil droit. « le cerveau gauche traite l’information du champ visuel droit ».","source":"9B1; 8B4","mod":9,"voir":{"p":"voies-feuille","r":["D"]}},{"id":"a9-041","fam":"a9-feuille","kc":"A9.13","k":"vf","q":"Sur la feuille des voies visuelles, les radiations optiques sont placées entre le corps genouillé latéral et le cortex visuel primaire.","v":true,"expl":"E « corps genouillé latéral », F « radiations optiques », G « cortex visuel primaire » : F est entre E et G. Ce sont les lignes en éventail, à l’arrière du cerveau.","source":"9B1","mod":9,"voir":{"p":"voies-feuille","r":["E","F","G"]}},{"id":"a9-042","fam":"a9-projet","kc":"A9.14","k":"ordre","q":"Remets ces structures dans l’ordre, de la plus externe à la plus interne.","etapes":["Muscles extra-oculaires","Sclère","Choroïde","Photorécepteurs","Fibres nerveuses","Vitré"],"expl":"Les muscles « s’insèrent dans la sclére (sic) », par dehors. La choroïde « est entre la sclère et la rétine ». Dans la rétine, les photorécepteurs sont au fond, du côté de la choroïde, et les fibres nerveuses du côté du vitré (feuilles F1 et F2 du module 8). Aucune diapo ne donne cet ordre d’un seul tenant : il est assemblé à partir de ces sources.","source":"PROJ q9; Anatomie 4.1, d4–d6; 8F1, 8F2","mod":9,"voir":{"p":"paroi-oeil"}},{"id":"a9-043","fam":"a9-projet","kc":"A9.14","k":"court","q":"Question du projet UA2 : « Placez ces structures en ordre en débutant avec la structures la plus externe jusqu’a la structure la plus interne: choroide, sclère, photorécepteurs, fibres nerveuses, muscles extra-oculaire, vitré »","rep":"Muscles extra-oculaires, sclère, choroïde, photorécepteurs, fibres nerveuses, vitré.","points":["Les muscles extra-oculaires en premier : ils s’insèrent dans la sclère, par dehors","La sclère, puis la choroïde","Dans la rétine : les photorécepteurs avant les fibres nerveuses","Le vitré en dernier, à l’intérieur du globe"],"expl":"C’est la question 9 du projet du 13 novembre. L’ordre est assemblé à partir de l’UA1 (les trois tuniques de l’œil) et des feuilles F1 et F2 du module 8.","source":"PROJ q9; Anatomie 4.1, d4–d6; 8F1, 8F2","mod":9,"voir":{"p":"paroi-oeil"}},{"id":"a9-044","fam":"a9-projet","kc":"A9.15","k":"court","q":"Question du projet UA2 : « Quel est le rôle de la conjonctive? Quelles glandes et structures s’y trouvent? »","rep":"La conjonctive est une membrane muqueuse qui tapisse la sclère et la paupière : elle protège la surface du globe oculaire. On y trouve beaucoup de vaisseaux sanguins, des glandes à mucus (cellules caliciformes), qui donnent la couche mucinique des larmes, et les glandes lacrymales accessoires de Krause et Wolfring, qui donnent un peu de la couche aqueuse.","points":["Le rôle : protéger la surface du globe oculaire","Une muqueuse qui tapisse la sclère et la paupière","Beaucoup de vaisseaux sanguins","Des glandes à mucus (cellules caliciformes) : la couche mucinique des larmes","Les glandes lacrymales accessoires (Krause, Wolfring) : un peu de la couche aqueuse"],"expl":"C’est la question 5 du projet du 13 novembre. « Elle confère une protection à la surface du globe oculaire. » Tu peux ajouter ses trois régions : bulbaire, palpébrale et cul-de-sac (fornix). Le cours ne donne pas de liste de structures plus précise.","source":"PROJ q5; Anatomie 2.3, d5, d7; 6B6","mod":9,"voir":{"p":"conjonctive-coupe"}},{"id":"a9-045","fam":"a9-projet","kc":"A9.15","k":"vf","q":"Les glandes de Meibomius se trouvent dans la conjonctive.","v":false,"expl":"Elles sont « dans le tarse de la paupière » et produisent la couche lipidique des larmes. Dans la conjonctive, on trouve les glandes à mucus et les glandes lacrymales accessoires.","source":"6B10, 6B6","mod":9,"voir":{"p":"paupiere-coupe","r":["3","4","5"]}},{"id":"a6-c01","fam":"a6-larmoiement","kc":"A6.8","k":"court","q":"Question du projet UA2 : « Décrivez le réflexe de larmoiement qui survient chez certaines personnes lorsqu’ils sont exposées à une lumière vive tel le soleil ou la caméra rétinienne. »","rep":"Lumière, cornée, nerf sensitif V (voie afférente), tronc cérébral, nerf VII (voie efférente) vers la glande lacrymale, larmoiement. C’est la cornée qui reçoit le stimulus, pas la rétine.","points":["Le récepteur : la cornée (pas la rétine)","La voie afférente : le nerf sensitif V","Le centre : le tronc cérébral","La voie efférente : le nerf VII, vers la glande lacrymale","La réponse : le larmoiement"],"expl":"La prof a relevé « une erreur fréquente » dans ce travail : mettre la rétine. « C'est la cornée qui recoit le stimulus et non la rétine ».","source":"PROJ q3 ; RETRO","mod":6,"voir":{"p":"deux-reflexes"}},{"id":"a6-c02","fam":"a6-couches","kc":"A6.9","k":"court","q":"Question du projet UA2 : « Dessinez les 3 couches de larmes. Indiquer le nom et la provenance des 3 couches. »","rep":"De l’air vers la cornée : la couche lipidique (glandes de Meibomius), la couche aqueuse (glande lacrymale principale, un peu Krause et Wolfring), la couche mucinique (cellules caliciformes de la conjonctive).","points":["L’ordre : lipidique dehors, aqueuse au milieu, mucinique contre la cornée","Lipidique : les glandes de Meibomius","Aqueuse : la glande lacrymale principale","Mucinique : les cellules caliciformes de la conjonctive"],"figureRep":"film-lacrymal","expl":"Les couches ne sont pas complètement séparées : il y a une continuité entre elles.","source":"PROJ q2 ; B4–B10","mod":6,"voir":{"p":"film-lacrymal"}},{"id":"a6-c03","fam":"a6-arc","kc":"A6.3","k":"court","q":"Nomme, dans l’ordre, les cinq éléments d’un arc réflexe.","rep":"Stimulus, récepteur sensoriel, neurone ou nerf qui transmet, centre nerveux, effecteur (un muscle ou une glande).","points":["Le stimulus","Le récepteur sensoriel","Le neurone ou le nerf qui transmet","Le centre nerveux","L’effecteur : un muscle ou une glande"],"source":"A3, A5, A11, A13, A15, A17","mod":6,"voir":{"p":"arc-reflexe"}},{"id":"a6-c04","fam":"a6-nerfs","kc":"A6.5","k":"court","q":"Donne une fonction pour l’œil de chacun de ces nerfs crâniens : II, III, V et VII.","rep":"II : le nerf optique, la vision. III : certains mouvements de l’œil, la constriction de la pupille, l’accommodation, l’élévation de la paupière. V : la sensation (cornée, conjonctive, iris, corps ciliaire, glande lacrymale). VII : la production de larmes et la fermeture des paupières.","points":["II : le nerf optique (la vision)","III : mouvements de l’œil, pupille, accommodation ou paupière qui se lève","V : la sensation, par exemple celle de la cornée","VII : les larmes ou la fermeture des paupières"],"source":"A11–A18, C12–C15","mod":6,"voir":{"p":"nerfs-oeil"}},{"id":"a6-c05","fam":"a6-nerfs","kc":"A6.5","k":"court","q":"Un patient a une paralysie de Bell. Quel nerf est atteint, et pourquoi son œil devient-il sec ?","rep":"Le VII, le nerf facial. Il commande la fermeture des paupières (l’orbiculaire) et la production de larmes : la paupière ferme mal et il se fait moins de larmes.","points":["Le nerf atteint : le VII (7e nerf crânien)","La paupière ferme mal","Il se fait moins de larmes"],"source":"A11–A18, C12–C15","mod":6,"voir":{"p":"nerfs-oeil","r":["2","5"]}},{"id":"a6-c06","fam":"a6-roles","kc":"A6.12","k":"court","q":"Donne le rôle de chacune des trois couches du film lacrymal.","rep":"Lipidique : elle limite l’évaporation et stabilise le film. Aqueuse : hydratation, protection contre les infections, nettoyage, apport d’oxygène. Mucinique : elle étale le film et le fait adhérer à l’épithélium.","points":["Lipidique : freiner l’évaporation, stabiliser le film","Aqueuse : hydrater, protéger contre les infections, nettoyer ou apporter l’oxygène","Mucinique : étaler le film et le faire adhérer à l’épithélium"],"source":"B2, B3, B9, B11–B14","mod":6,"voir":{"p":"film-lacrymal"}},{"id":"a6-c07","fam":"a6-roles","kc":"A6.12","k":"court","q":"Nomme les trois sortes de larmes et dis à quoi sert chacune.","rep":"Basales : les larmes de base, la protection. Réflexes : rincer l’œil devant un irritant, en grand volume. Émotionnelles : la communication et la régulation des émotions ; ce sont les plus riches en protéines.","points":["Basales : la protection de base","Réflexes : rincer l’œil","Émotionnelles : communication, régulation des émotions"],"source":"B2, B3, B9, B11–B14","mod":6,"voir":{"p":"film-lacrymal"}},{"id":"a6-c08","fam":"a6-drainage","kc":"A6.16","k":"court","q":"Décris le trajet d’une larme, du lac lacrymal jusqu’au nez.","rep":"Les points lacrymaux, les canalicules, le sac lacrymal, le conduit nasolacrymal, puis la cavité nasale.","points":["Les points lacrymaux","Les canalicules","Le sac lacrymal","Le conduit nasolacrymal","La cavité nasale"],"figureRep":"voies-lacrymales","source":"C8, C16–C20, F03, DR","mod":6,"voir":{"p":"larmes-anatomie"}},{"id":"a6-c09","fam":"a6-clignement","kc":"A6.14","k":"court","q":"Combien de fois par minute cligne-t-on normalement, et à quoi sert le clignement ?","rep":"Environ 15 à 20 fois par minute. Le clignement nettoie, distribue les nutriments et garde la cornée transparente ; il donne aussi une mise à jour visuelle qui repose le cerveau.","points":["15 à 20 fois par minute","Nettoyer la surface de l’œil","Distribuer les nutriments et garder la cornée transparente"],"source":"C2–C6, C12–C20","mod":6,"voir":{"p":"clignement","r":["2"]}},{"id":"a6-c10","fam":"a6-fiches","kc":"A6.20","k":"court","q":"Deux patientes ont des larmes qui coulent sur la joue. Explique la différence entre une épiphora et un larmoiement réflexe.","rep":"L’épiphora est un débordement : le drainage est insuffisant (un point mal orienté, un canalicule ou un conduit bloqué). Le larmoiement réflexe est une production : un irritant sur la cornée lance l’arc réflexe et la glande lacrymale fait plus de larmes.","points":["Épiphora : un problème de drainage","Larmoiement réflexe : une production de larmes en réponse à un irritant","Même signe, deux étapes différentes du trajet des larmes"],"source":"C8, C12–C21, F01–F10","mod":6,"voir":{"p":"larmes-quatre-etapes","r":["1","4"]}},{"id":"a7-c01","fam":"a7-couches","kc":"A7.2","k":"court","q":"Question du projet UA2 : « Dessinez les 5 couches de la cornée et indiquer le nom de chaque couche »","rep":"De l’avant (côté air et larmes) vers l’arrière (côté humeur aqueuse) : épithélium, membrane de Bowman, stroma, membrane de Descemet, endothélium.","points":["L’épithélium, à l’avant","La membrane de Bowman, sous l’épithélium","Le stroma, la couche la plus épaisse","La membrane de Descemet, sous le stroma","L’endothélium, à l’arrière"],"figureRep":"cornee-couches","expl":"Sur le dessin de la classe, D désigne les kératocytes, les cellules du stroma : ce n’est pas une sixième couche.","source":"PROJ q1 ; A4, A5","mod":7,"voir":{"p":"cornee-couches"}},{"id":"a7-c02","fam":"a7-clarte","kc":"A7.5","k":"court","q":"Question du projet UA2 : « La cornée et la sclère sont tous les 2 composées de filaments de collagène. Pourquoi est-ce que la cornée est transparente tandis que la sclère est opaque? »","rep":"C’est l’organisation du collagène : dans la cornée, les fibres sont rangées de façon régulière ; dans la sclère, elles le sont moins. Même matière, autre ordre.","points":["Cornée : des fibres de collagène en organisation régulière","Sclère : des fibres moins bien organisées, donc opaque"],"expl":"L’endothélium aide aussi : sa pompe garde la cornée légèrement déshydratée ; imbibée d’eau, elle perd sa transparence.","source":"PROJ q4 ; A5, A13, B5","mod":7,"voir":{"p":"cornee-clarte","r":["1","2"]}},{"id":"a7-c03","fam":"a7-clarte","kc":"A7.6","k":"court","q":"L’endothélium de la cornée est très abîmé. Explique ce qui arrive à la cornée.","rep":"L’endothélium est une pompe qui garde la cornée à 78 % d’eau. Abîmé, il ne pompe plus assez : la cornée s’imbibe d’eau et perd sa transparence. Ses cellules ne se reproduisent pas.","points":["L’endothélium règle l’eau de la cornée (rôle de pompe)","La cornée s’imbibe d’eau","Elle perd sa transparence"],"source":"A2, A5, A12–A16, B5, B6, C9","mod":7,"voir":{"p":"cornee-clarte","r":["1","3"]}},{"id":"a7-c04","fam":"a7-refraction","kc":"A7.7","k":"court","q":"Pourquoi la cornée donne-t-elle les 2/3 du pouvoir optique de l’œil, plus que le cristallin ?","rep":"La cornée est en contact avec l’air : la différence d’indice de réfraction est grande. Le cristallin, lui, baigne dans du liquide (humeur aqueuse devant, vitré derrière) : son saut d’indice est petit.","points":["La cornée touche l’air","Une grande différence d’indice de réfraction, donc une grande puissance","Le cristallin est entouré de liquide : petit saut d’indice"],"source":"A6–A11; Optique M6 D16; TO 5.1, diapo 32","mod":7,"voir":{"p":"refraction-cornee","r":["1"]}},{"id":"a7-c05","fam":"a7-limbe","kc":"A7.10","k":"court","q":"Qu’est-ce que le limbe, et que contient-il d’important pour la cornée ?","rep":"La zone de transition entre la cornée et la sclère. Il contient les cellules souches qui renouvellent l’épithélium de la cornée, et il est vascularisé : nutrition et immunité.","points":["La zone de transition entre la cornée et la sclère","Les cellules souches qui renouvellent l’épithélium cornéen","Des vaisseaux : nutrition et immunité"],"source":"A16, B2–B7","mod":7,"voir":{"p":"limbe","r":["limbe"]}},{"id":"a7-c06","fam":"a7-cristallin","kc":"A7.14","k":"court","q":"Nomme les trois fonctions du cristallin.","rep":"Le pouvoir réfractif, le pouvoir accommodatif en jeunesse, et l’absorption des rayons UV pour protéger la rétine.","points":["Le pouvoir réfractif","Le pouvoir accommodatif (en jeunesse)","L’absorption des UV, qui protège la rétine"],"source":"C3, C4, C8, C9, C12; Anatomie 3.2, diapo 5","mod":7,"voir":{"p":"milieux","r":["cristallin"]}},{"id":"a7-c07","fam":"a7-age","kc":"A7.23","k":"court","q":"Question du projet UA2 : « Vers 40-45 ans, les personnes emmétropes vont souvent porter des lunettes uniquement pour la vision de près. En te basant sur la structure et la croissance des fibres du cristallin, explique la presbytie. »","rep":"Le cristallin grandit par couches : de nouvelles fibres s’ajoutent, les plus vieilles restent au centre. Pour voir de près, il doit s’arrondir, et ses fibres doivent glisser les unes sur les autres. Avec l’âge, il durcit : il devient moins flexible, s’arrondit moins, et le près devient flou. Ce n’est pas le muscle ciliaire qui faiblit.","points":["De nouvelles fibres s’ajoutent ; les plus vieilles restent au centre","Pour accommoder, le cristallin doit se déformer (ses fibres glissent)","Avec l’âge, le cristallin durcit et devient moins flexible","Ce n’est pas le muscle ciliaire : « L’œil ne devient pas faible, il devient moins flexible. »"],"expl":"Les diapos constatent le durcissement (C13) et disent que la capsule « perd sa souplesse » (C6) ; relier ce durcissement à l’accumulation des fibres est une lecture déduite.","source":"PROJ q6 ; C6, C9, C10, C13","mod":7,"voir":{"p":"accommodation"}},{"id":"a7-c08","fam":"a7-vitre","kc":"A7.21","k":"court","q":"Question du projet UA2 : « Décrivez le vieillissement du vitré »","rep":"Avec l’âge, le vitré devient plus liquide et peut se retirer de la rétine : c’est le décollement du vitré postérieur. Il peut donner des éclairs et des corps flottants. Rarement, s’il y a un point d’adhérence, il mène à un décollement de rétine.","points":["Le vitré devient plus liquide","Il peut se retirer de la rétine : décollement du vitré postérieur","Des corps flottants ou des éclairs peuvent apparaître","Rarement, un décollement de rétine (s’il y a un point d’adhérence)"],"source":"PROJ q7 ; D5–D10","mod":7,"voir":{"p":"vitre","r":["2"]}},{"id":"a7-c09","fam":"a7-milieux","kc":"A7.1","k":"court","q":"Nomme, dans l’ordre, les quatre milieux transparents que la lumière traverse avant la rétine. Lesquels la réfractent ?","rep":"La cornée, l’humeur aqueuse, le cristallin, le vitré. Deux la réfractent : la cornée (2/3 du pouvoir) et le cristallin (1/3).","points":["L’ordre : cornée, humeur aqueuse, cristallin, vitré","La cornée réfracte : 2/3 du pouvoir","Le cristallin réfracte : 1/3"],"source":"A2, A8, C4, D3; ACT; Anatomie 3.1, diapos 8 et 10","mod":7,"voir":{"p":"milieux"}},{"id":"a8-c01","fam":"a8-photo","kc":"A8.2","k":"court","q":"Question du projet UA2 : « La lumière provient des objets mais notre cerveau travaille avec des signaux électrique. Quelle partie de la rétine est responsible de la transformation du signal et quel est le nom de ce processus? »","rep":"Les photorécepteurs, cônes et bâtonnets, dans leurs disques (segment externe). Le processus s’appelle la phototransduction.","points":["Les photorécepteurs
