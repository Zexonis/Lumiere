 (cônes et bâtonnets), dans leurs disques","Le nom du processus : la phototransduction"],"expl":"La phototransduction est une réaction biochimique qui utilise un dérivé de la vitamine A, le rétinal.","source":"PROJ q8 ; 8A3, 8A4","mod":8,"voir":{"p":"photorecepteur","r":["A"]}},{"id":"a8-c02","fam":"a8-photo","kc":"A8.2","k":"court","q":"Compare les cônes et les bâtonnets : à quoi sert chacun, et de combien de lumière a-t-il besoin ?","rep":"Les cônes servent à la vision des couleurs et à la vision centrale fine ; il leur faut une lumière intense. Les bâtonnets sont activés par très peu de lumière : ils servent dans la pénombre.","points":["Cônes : couleurs et vision centrale fine","Cônes : besoin de lumière intense","Bâtonnets : activés par très peu de lumière"],"source":"8A2–8A5","mod":8,"voir":{"p":"photorecepteur","r":["G","H"]}},{"id":"a8-c03","fam":"a8-couches","kc":"A8.5","k":"court","q":"Nomme les couches de la rétine de ta feuille, dans l’ordre où la lumière les traverse.","rep":"Les fibres nerveuses, les cellules ganglionnaires, les cellules bipolaires, les photorécepteurs (cônes et bâtonnets), puis l’épithélium pigmentaire. La lumière atteint les photorécepteurs en dernier.","points":["Les fibres nerveuses (N), du côté de la lumière","Les cellules ganglionnaires (G)","Les cellules bipolaires, au milieu","Les photorécepteurs (P)","L’épithélium pigmentaire (E), au fond"],"figureRep":"retine-coupe","source":"8A3, 8A5, 8B3, 8F1","mod":8,"voir":{"p":"retine-coupe"}},{"id":"a8-c04","fam":"a8-disque","kc":"A8.7","k":"court","q":"Pourquoi a-t-on un point aveugle dans chaque œil ?","rep":"Au disque optique, les fibres nerveuses sortent de l’œil pour former le nerf optique : à cet endroit, il n’y a pas de photorécepteurs.","points":["C’est au disque optique (la papille), là où les fibres sortent de l’œil","Il n’y a pas de photorécepteurs à cet endroit"],"source":"8F2, 8A1; Anatomie 4.2, d3, d6, d7","mod":8,"voir":{"p":"fond-oeil","r":["papille"]}},{"id":"a8-c05","fam":"a8-trajet","kc":"A8.8","k":"court","q":"Nomme, dans l’ordre, les stations de la voie visuelle, de la rétine jusqu’au cortex.","rep":"Rétine, nerf optique, chiasma optique, tractus optique, CGL du thalamus, puis le cortex visuel, dans le lobe occipital.","points":["Le nerf optique","Le chiasma optique","Le tractus optique","Le CGL du thalamus","Le cortex visuel, dans le lobe occipital"],"figureRep":"voies-visuelles","source":"8B3, 8B4, 8B6–8B9, 8F3","mod":8,"voir":{"p":"voies-visuelles"}},{"id":"a8-c06","fam":"a8-croix","kc":"A8.9","k":"court","q":"Au chiasma optique, quelles fibres croisent, et qu’est-ce que chaque côté du cerveau reçoit ?","rep":"Les fibres de la rétine nasale de chaque œil croisent ; celles de la rétine temporale restent du même côté. Chaque côté du cerveau reçoit ainsi le champ visuel opposé, vu par les deux yeux : le cerveau gauche traite le champ droit.","points":["Les fibres de la rétine nasale croisent","Les fibres de la rétine temporale restent du même côté","Le cerveau gauche traite le champ visuel droit (et l’inverse)"],"source":"8B3, 8B4, 8B6, 8C12, 8F3","mod":8,"voir":{"p":"voies-croisement"}},{"id":"a8-c07","fam":"a8-arc","kc":"A8.22","k":"court","q":"Décris, dans l’ordre, le réflexe de la pupille à la lumière.","rep":"Lumière, rétine, nerf optique II (voie afférente), centre réflexe du cerveau, nerf oculomoteur III, parasympathique (voie efférente), contraction du sphincter de l’iris : la pupille rétrécit, c’est le myosis.","points":["Le récepteur : la rétine","La voie afférente : le nerf optique (II)","Le centre réflexe, dans le cerveau","La voie efférente : le nerf oculomoteur III (parasympathique)","Le sphincter de l’iris se contracte : myosis"],"source":"8SEQ ; RETRO","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-c08","fam":"a8-arc","kc":"A8.22","k":"court","q":"On éclaire un seul œil, et les deux pupilles se contractent. Pourquoi ?","rep":"Une partie des fibres croise au chiasma : les deux côtés du cerveau reçoivent le signal, et les deux nerfs III commandent les deux sphincters.","points":["Des fibres croisent au chiasma","Les deux côtés du cerveau reçoivent le signal","Les deux pupilles reçoivent l’ordre de se contracter"],"source":"8C8–8C12, 8SEQ","mod":8,"voir":{"p":"reflexe-pupille"}},{"id":"a8-c09","fam":"a8-muscles","kc":"A8.20","k":"court","q":"Compare le myosis et la mydriase : la lumière, le muscle de l’iris et le système nerveux de chacun.","rep":"Myosis : en lumière forte, le sphincter de l’iris contracte la pupille, par le parasympathique (nerf III). Mydriase : en lumière basse, le dilatateur l’élargit, par le sympathique.","points":["Myosis : lumière forte, la pupille rétrécit","Myosis : le sphincter, parasympathique (nerf III)","Mydriase : lumière basse, la pupille s’élargit","Mydriase : le dilatateur, sympathique"],"source":"8C8, 8C11, 8C13, 8C14","mod":8,"voir":{"p":"iris-muscles"}},{"id":"a8-c10","fam":"a8-horloge","kc":"A8.15","k":"court","q":"Explique comment la lumière d’un écran, le soir, retarde le sommeil.","rep":"La lumière bleue de l’écran est captée par des cellules de la rétine, qui préviennent le noyau supra-chiasmatique, l’horloge biologique. La glande pinéale retarde alors la mélatonine, et l’endormissement est retardé lui aussi.","points":["La lumière bleue est captée par des cellules de la rétine","Le signal va au noyau supra-chiasmatique, l’horloge biologique","La mélatonine (glande pinéale) est retardée","L’endormissement est retardé"],"source":"8C2–8C7","mod":8,"voir":{"p":"horloge"}},{"id":"a8-c11","fam":"a8-deux-arcs","kc":"A8.30","k":"court","q":"La lumière déclenche deux réflexes : le larmoiement et la contraction de la pupille. Compare-les : récepteur, nerf afférent, nerf efférent, réponse.","rep":"Larmoiement : cornée, nerf sensitif V, tronc cérébral, nerf VII, glande lacrymale. Pupille : rétine, nerf optique II, centre réflexe, nerf oculomoteur III, sphincter de l’iris (myosis).","points":["Les récepteurs : la cornée (larmes), la rétine (pupille)","Les afférents : le V (larmes), le II (pupille)","Les efférents : le VII (larmes), le III (pupille)","Les réponses : le larmoiement, le myosis"],"source":"RETRO","mod":8,"voir":{"p":"deux-reflexes"}},{"id":"a7-s01","fam":"a7-couches","kc":"A7.2","k":"schema","figure":"cornee-couches","q":"Nomme chaque repère du dessin de la cornée.","reperes":[{"l":"A","t":"Épithélium"},{"l":"B","t":"Membrane de Bowman"},{"l":"C","t":"Stroma"},{"l":"D","t":"Kératocytes"},{"l":"E","t":"Membrane de Descemet"},{"l":"F","t":"Endothélium"}],"leurres":["Conjonctive"],"expl":"A épithélium, B membrane de Bowman, C stroma, avec ses kératocytes en D, E membrane de Descemet, F endothélium.","source":"A4, A5","mod":7,"voir":{"p":"cornee-couches"}},{"id":"a7-s02","fam":"a7-fibres","kc":"A7.17","k":"schema","figure":"cristallin-coupe","q":"Nomme les repères du dessin du cristallin.","reperes":[{"l":"A","t":"Capsule antérieure"},{"l":"P","t":"Capsule postérieure"},{"l":"E","t":"Zone équatoriale"},{"l":"C","t":"Cortex (fibres récentes)"},{"l":"N1","t":"Noyau, au centre (les plus vieilles fibres)"}],"leurres":["Zonule","Corps ciliaire"],"expl":"A capsule antérieure, E zone équatoriale, où les cellules deviennent des fibres, C cortex, N1 à N3 les noyaux, P capsule postérieure.","source":"C10","mod":7,"voir":{"p":"cristallin-coupe"}},{"id":"a6-s01","fam":"a6-couches","kc":"A6.9","k":"schema","figure":"film-lacrymal","q":"Nomme les trois couches du film lacrymal.","reperes":[{"l":"A","t":"Couche lipidique"},{"l":"B","t":"Couche aqueuse"},{"l":"C","t":"Couche mucinique"}],"leurres":["Épithélium de la cornée"],"expl":"De l’air vers la cornée : lipidique, aqueuse, mucinique.","source":"B4, B10","mod":6,"voir":{"p":"film-lacrymal"}},{"id":"a6-s02","fam":"a6-couches","kc":"A6.10","k":"schema","figure":"film-lacrymal","q":"D’où vient chaque couche du film lacrymal ?","reperes":[{"l":"A","t":"Glandes de Meibomius"},{"l":"B","t":"Glande lacrymale principale"},{"l":"C","t":"Cellules caliciformes de la conjonctive"}],"leurres":["Glandes de Zeis","Glandes de Moll"],"expl":"Lipidique : Meibomius, dans le tarse. Aqueuse : la glande lacrymale principale (un peu Krause et Wolfring). Mucinique : les cellules caliciformes de la conjonctive.","source":"B5–B10","mod":6,"voir":{"p":"film-lacrymal"}},{"id":"a6-s03","fam":"a6-drainage","kc":"A6.16","k":"schema","figure":"voies-lacrymales","q":"Nomme chaque repère du trajet des larmes.","reperes":[{"l":"A","t":"Glande lacrymale"},{"l":"B","t":"Points lacrymaux"},{"l":"C","t":"Canalicules"},{"l":"D","t":"Sac lacrymal"},{"l":"E","t":"Conduit nasolacrymal"},{"l":"F","t":"Cavité nasale"}],"expl":"Les larmes viennent de la glande, puis sortent par les points lacrymaux, les canalicules, le sac lacrymal et le conduit nasolacrymal, jusqu’à la cavité nasale.","source":"C19, DR","mod":6,"voir":{"p":"larmes-anatomie"}},{"id":"a8-s01","fam":"a8-couches","kc":"A8.5","k":"schema","figure":"retine-coupe","q":"Nomme chaque rang de la feuille de la rétine.","reperes":[{"l":"N","t":"Fibres nerveuses"},{"l":"G","t":"Cellules ganglionnaires"},{"l":"?","t":"Cellules bipolaires"},{"l":"P","t":"Photorécepteurs (cônes et bâtonnets)"},{"l":"E","t":"Épithélium pigmentaire"}],"leurres":["Choroïde"],"expl":"La lumière traverse N, G et les bipolaires avant d’atteindre P ; l’épithélium E est derrière.","source":"8F1, 8B3","mod":8,"voir":{"p":"retine-coupe"}},{"id":"a8-s02","fam":"a8-disque","kc":"A8.7","k":"schema","figure":"disque-optique","q":"Nomme chaque repère de la feuille du disque optique.","reperes":[{"l":"?","t":"Vitré"},{"l":"A","t":"Rétine"},{"l":"B","t":"Choroïde"},{"l":"C","t":"Sclère"},{"l":"N","t":"Fibres nerveuses"},{"l":"V","t":"Vaisseaux sanguins"}],"leurres":["Cornée"],"expl":"De haut en bas : le vitré, A la rétine, B la choroïde, C la sclère. N, les fibres nerveuses, plongent dans le nerf ; V, les vaisseaux, sont au centre.","source":"8F2","mod":8,"voir":{"p":"disque-optique"}},{"id":"a8-s03","fam":"a8-trajet","kc":"A8.8","k":"schema","figure":"voies-visuelles","q":"Nomme les stations de la voie visuelle.","reperes":[{"l":"1","t":"Nerf optique"},{"l":"2","t":"Chiasma optique"},{"l":"3","t":"Tractus optique"},{"l":"4","t":"CGL du thalamus"},{"l":"5","t":"Cortex visuel (lobe occipital)"}],"leurres":["Glande pinéale"],"expl":"Nerf optique, chiasma optique, tractus optique, CGL du thalamus, cortex visuel.","source":"8B3, 8B4, 8F3","mod":8,"voir":{"p":"voies-visuelles"}},{"id":"a8-s04","fam":"a8-photo","kc":"A8.4","k":"schema","figure":"photorecepteur","q":"Nomme chaque repère du dessin des photorécepteurs.","reperes":[{"l":"A","t":"Disques"},{"l":"B","t":"Noyau"},{"l":"C","t":"Mitochondries"},{"l":"D","t":"Terminaisons synaptiques"},{"l":"E","t":"Segment externe"},{"l":"F","t":"Segment interne"},{"l":"G","t":"Cône"},{"l":"H","t":"Bâtonnet"}],"expl":"Les disques sont dans le segment externe ; le noyau et les mitochondries, dans le segment interne ; les terminaisons synaptiques, tout au bout.","source":"8A4","mod":8,"voir":{"p":"photorecepteur"}},{"id":"a9-s01","fam":"a9-chiasma","kc":"A9.12","k":"schema","figure":"voies-lesions","q":"Trois lésions sont marquées sur les voies visuelles. Quel défaut du champ visuel donne chacune ?","reperes":[{"l":"1","t":"L’œil droit perd tout son champ"},{"l":"2","t":"Défaut bi-temporal : chaque œil perd son côté tempe"},{"l":"3","t":"Les deux yeux perdent le côté gauche du champ"}],"leurres":["Les deux yeux perdent le côté droit du champ","L’œil gauche perd tout son champ"],"expl":"« Anomalie 1: nerf optique droit » : un seul œil. « Anomalie 2: chiasma (fibres nasales alors défaut bi-temporal) ». Après le chiasma, à droite : les deux yeux perdent le côté gauche, et le défaut respecte le méridien vertical.","source":"9A16, 9A17","mod":9,"voir":{"p":"voies-lesions"}},{"id":"a9-s02","fam":"a9-carte","kc":"A9.2","k":"schema","figure":"fond-quadrants","q":"Sur ce fond d’œil, la papille est du côté du nez. Nomme les quatre quadrants.","reperes":[{"l":"A","t":"Supérieur temporal"},{"l":"B","t":"Supérieur nasal"},{"l":"C","t":"Inférieur temporal"},{"l":"D","t":"Inférieur nasal"}],"expl":"Les quadrants se divisent « avec la fovéa au centre » ; le côté de la papille est le côté nasal.","source":"9A2","mod":9,"voir":{"p":"fond-quadrants"}},{"id":"a9-s03","fam":"a9-feuille","kc":"A9.13","k":"schema","figure":"voies-feuille","q":"Nomme les sept repères de la feuille des voies visuelles, de A à G.","reperes":[{"l":"A","t":"Rétine"},{"l":"B","t":"Nerf optique"},{"l":"C","t":"Chiasma optique"},{"l":"D","t":"Tractus optique"},{"l":"E","t":"Corps genouillé latéral"},{"l":"F","t":"Radiations optiques"},{"l":"G","t":"Cortex visuel primaire"}],"expl":"Le tractus optique vient juste après le chiasma ; les radiations optiques, juste avant le cortex.","source":"9B1","mod":9,"voir":{"p":"voies-feuille"}}]};

.bruit.joue .bruit-btn path:nth-child(2){animation-delay:-.3s}
.bruit.joue .bruit-btn path:nth-child(3){animation-delay:-.6s}
.bruit.joue .bruit-btn path:nth-child(4){animation-delay:-.15s}
.bruit.joue .bruit-btn path:nth-child(5){animation-delay:-.45s}
@keyframes bruit-barre{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.bruit-panneau{width:min(290px,calc(100vw - 28px));max-height:calc(100vh - 140px);overflow-y:auto;padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;border-radius:14px;border:1px solid var(--line,#D3DBE0);background:var(--panel,#fff);color:var(--ink,#13202A);box-shadow:0 8px 28px rgba(8,12,16,.2)}

.bruit-g{margin:2px 0 -4px;font-size:12.5px;color:var(--ink-3,#5F717D)}
.bruit-sons{display:flex;flex-wrap:wrap;gap:6px}
.bruit-son{min-height:38px;padding:5px 12px;border:1px solid var(--line,#D3DBE0);border-radius:999px;background:var(--panel-2,#F3F6F8);color:inherit;font:inherit;cursor:pointer}
.bruit-son:hover{border-color:var(--accent,#0F6E8C)}
.bruit-son[aria-pressed="true"]{background:var(--accent,#0F6E8C);border-color:var(--accent,#0F6E8C);color:var(--on-accent,#fff);font-weight:700}
.bruit-son[aria-busy="true"]{animation:bruit-charge 1s ease-in-out infinite}
@keyframes bruit-charge{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.bruit.joue .bruit-btn path,.bruit-son[aria-busy="true"]{animation:none}}
.bruit-vol{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2,#465763)}
.bruit-vol input{flex:1;min-width:0;height:28px;accent-color:var(--accent,#0F6E8C)}
.bruit-aide{margin:0;font-size:12.5px;line-height:1.35;color:var(--ink-3,#5F717D)}
.bruit-aide:empty{display:none}
.bruit-credits{font-size:12px;line-height:1.4;color:var(--ink-3,#5F717D)}
.bruit-credits summary{cursor:pointer;min-height:24px}
.bruit-credits p{margin:4px 0 0}
.bruit-credits a{color:inherit}
@media print{.bruit{display:none}}`;
document.head.appendChild(style);

const AIDE = 'Touche un son pour le lancer, touche-le encore pour l’arrêter.';
const puces = l => '<div class="bruit-sons">' + l.map(([k, t]) => '<button type="button" class="bruit-son" data-son="' + k + '" aria-pressed="false">' + t + '<\/button>').join('') + '<\/div>';
const racine = document.createElement('div');
racine.className = 'bruit';
racine.innerHTML = '<div class="bruit-panneau" id="bruit-panneau" role="group" aria-label="Bruit de fond" hidden><p class="bruit-t">Bruit de fond<\/p>'
  + '<p class="bruit-g">Ambiances (de vraies prises de son)<\/p>' + puces(AMBIANCES)
  + '<p class="bruit-g">Bruits<\/p>' + puces(BRUITS)
  + '<label class="bruit-vol"><span>Volume<\/span><input type="range" min="0" max="100" step="1" id="bruit-vol" aria-label="Volume du bruit de fond"><\/label>'
  + '<p class="bruit-aide" id="bruit-aide" role="status">' + AIDE + '<\/p>'
  + '<details class="bruit-credits"><summary>D’où viennent les ambiances<\/summary><p>Enregistrées dehors, par des preneurs de son qui les ont placées dans le domaine public (radio aporee, sur l’<a href="https://archive.org/details/radio-aporee-maps" target="_blank" rel="noopener">Internet Archive<\/a>). Les vagues : Félix Blume, Caleta Portales, au Chili. La pluie : David J. Pitt, Malvern Wells, en Angleterre. La pluie et le tonnerre : Félix Blume, Ban Na Tin, en Thaïlande (le tonnerre y est adouci, pour ne pas te faire sursauter). Le vent dans les pins : Bojan Marušič, Miren, en Slovénie. Le feu de camp : Jeremy Hegge, Royal National Park, en Australie.<\/p><\/details><\/div>'
  + '<button type="button" class="bruit-btn" id="bruit-btn" aria-expanded="false" aria-controls="bruit-panneau" aria-label="Bruit de fond pour se concentrer" title="Bruit de fond">'
  + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/><\/svg><\/button>';
document.body.appendChild(racine);
const $ = s => racine.querySelector(s), panneau = $('#bruit-panneau'), bouton = $('#bruit-btn'), curseur = $('#bruit-vol');
curseur.value = Math.round(etat.vol * 100);
const nomDe = k => SONS.find(([x]) => x === k)[1];
function dire(t){ $('#bruit-aide').textContent = t || (charge ? nomDe(charge) + ' : chargement…' : AIDE); }
function peindre(){
  racine.classList.toggle('joue', !!joue && !charge);
  racine.querySelectorAll('[data-son]').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.son === joue)); if(b.dataset.son === charge) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy'); });
  bouton.setAttribute('aria-label', joue ? 'Bruit de fond : ' + nomDe(joue) + (charge ? ', chargement' : ' joue') : 'Bruit de fond pour se concentrer');
}
function ouvrir(v){ panneau.hidden = !v; bouton.setAttribute('aria-expanded', String(v)); if(v){ const b = racine.querySelector('[data-son="' + (joue || etat.son || 'pluie') + '"]'); if(b) b.focus({preventScroll:true}); } }
/* les gestes restent dans le module : la page ne les voit pas (ses raccourcis clavier non plus). Un bouton qu'une page
   pose dans ce coin (au-dessus du bouton de bruit) s'écoute lui-même : son clic ne remonte pas plus haut non plus */
racine.addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('button'); if(!b || !panneau.contains(b) && b !== bouton) return;
  if(b === bouton){ ouvrir(panneau.hidden); return; }
  const k = b.dataset.son; if(!k) return;
  if(joue === k){ arreter(); dire(''); }
  else if(jouer(k)) dire('');
  else dire('Ton navigateur ne peut pas jouer de son ici.');
  peindre();
});
racine.addEventListener('keydown', e => { e.stopPropagation(); if(e.key === 'Escape' && !panneau.hidden){ ouvrir(false); bouton.focus({preventScroll:true}); } });
curseur.addEventListener('input', () => { regler(curseur.value / 100); garder(); });
document.addEventListener('click', () => { if(!panneau.hidden) ouvrir(false); });
peindre();

/* pour les tests : ce qui joue, par quel chemin, et le niveau mesuré à la sortie (0 = silence) ; boucle, ctx, tampon :
   pour répéter la boucle sur un court extrait. racine, bouton, fermer : le coin et son bouton, pour qu'une page y pose
   le sien (au-dessus) */
window.__bruit = {SONS, PRISES, racine, bouton, boucle, ctx:() => ctx, tampon:() => tampon && tampon.buf, fermer:() => ouvrir(false), jouer:k => { const r = jouer(k); dire(''); peindre(); return r; }, arreter:() => { arreter(); dire(''); peindre(); },
  etat:() => ({joue, charge, vol:etat.vol, dernier:etat.son, contexte:ctx ? ctx.state : 'aucun', noeud:courant && courant.source ? courant.source.type : '', duree:tampon ? tampon.buf.duration : 0}),
  niveau(){ if(!analyse) return 0; const d = new Float32Array(analyse.fftSize); analyse.getFloatTimeDomainData(d); let s = 0; for(const x of d) s += x * x; return Math.sqrt(s / d.length); }};
})();

</script>
<script>
(() => {
  const ICI = '746784e34efa';
  let montre = false;
  const verifier = () => {
    if(montre || location.protocol === 'file:') return;
    fetch('version.json?_=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(v => {
      if(!v || !v.version || v.version === ICI || montre) return;
      montre = true;
      const b = document.createElement('div');
      b.setAttribute('role', 'status');
      b.style.cssText = 'position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:400;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);padding:9px 10px 9px 14px;border-radius:12px;background:#0B0F1A;color:#F3F5FB;border:1px solid #9BF25C;font:600 14.5px system-ui,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.4)';
      const t = document.createElement('span'); t.textContent = 'Une nouvelle version de Lumière est prête.';
      const k = document.createElement('button'); k.type = 'button'; k.textContent = 'Recharger';
      k.style.cssText = 'border:0;border-radius:999px;padding:6px 14px;background:#9BF25C;color:#05070D;font:700 14px system-ui,sans-serif;cursor:pointer';
      k.addEventListener('click', () => location.reload());
      b.append(t, k); document.body.appendChild(b);
    }).catch(() => {});
  };
  window.addEventListener('load', verifier);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) verifier(); });
})();
