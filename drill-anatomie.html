x, N1 à N3 les noyaux, P capsule postérieure.","source":"C10","mod":7},{"id":"a6-s01","fam":"a6-couches","kc":"A6.9","k":"schema","figure":"film-lacrymal","q":"Nomme les trois couches du film lacrymal.","reperes":[{"l":"A","t":"Couche lipidique"},{"l":"B","t":"Couche aqueuse"},{"l":"C","t":"Couche mucinique"}],"leurres":["Épithélium de la cornée"],"expl":"De l’air vers la cornée : lipidique, aqueuse, mucinique.","source":"B4, B10","mod":6},{"id":"a6-s02","fam":"a6-couches","kc":"A6.10","k":"schema","figure":"film-lacrymal","q":"D’où vient chaque couche du film lacrymal ?","reperes":[{"l":"A","t":"Glandes de Meibomius"},{"l":"B","t":"Glande lacrymale principale"},{"l":"C","t":"Cellules caliciformes de la conjonctive"}],"leurres":["Glandes de Zeis","Glandes de Moll"],"expl":"Lipidique : Meibomius, dans le tarse. Aqueuse : la glande lacrymale principale (un peu Krause et Wolfring). Mucinique : les cellules caliciformes de la conjonctive.","source":"B5–B10","mod":6},{"id":"a6-s03","fam":"a6-drainage","kc":"A6.16","k":"schema","figure":"voies-lacrymales","q":"Nomme chaque repère du trajet des larmes.","reperes":[{"l":"A","t":"Glande lacrymale"},{"l":"B","t":"Points lacrymaux"},{"l":"C","t":"Canalicules"},{"l":"D","t":"Sac lacrymal"},{"l":"E","t":"Conduit nasolacrymal"},{"l":"F","t":"Cavité nasale"}],"expl":"Les larmes viennent de la glande, puis sortent par les points lacrymaux, les canalicules, le sac lacrymal et le conduit nasolacrymal, jusqu’à la cavité nasale.","source":"C19, DR","mod":6},{"id":"a8-s01","fam":"a8-couches","kc":"A8.5","k":"schema","figure":"retine-coupe","q":"Nomme chaque rang de la feuille de la rétine.","reperes":[{"l":"N","t":"Fibres nerveuses"},{"l":"G","t":"Cellules ganglionnaires"},{"l":"?","t":"Cellules bipolaires"},{"l":"P","t":"Photorécepteurs (cônes et bâtonnets)"},{"l":"E","t":"Épithélium pigmentaire"}],"leurres":["Choroïde"],"expl":"La lumière traverse N, G et les bipolaires avant d’atteindre P ; l’épithélium E est derrière.","source":"8F1, 8B3","mod":8},{"id":"a8-s02","fam":"a8-disque","kc":"A8.7","k":"schema","figure":"disque-optique","q":"Nomme chaque repère de la feuille du disque optique.","reperes":[{"l":"?","t":"Vitré"},{"l":"A","t":"Rétine"},{"l":"B","t":"Choroïde"},{"l":"C","t":"Sclère"},{"l":"N","t":"Fibres nerveuses"},{"l":"V","t":"Vaisseaux sanguins"}],"leurres":["Cornée"],"expl":"De haut en bas : le vitré, A la rétine, B la choroïde, C la sclère. N, les fibres nerveuses, plongent dans le nerf ; V, les vaisseaux, sont au centre.","source":"8F2","mod":8},{"id":"a8-s03","fam":"a8-trajet","kc":"A8.8","k":"schema","figure":"voies-visuelles","q":"Nomme les stations de la voie visuelle.","reperes":[{"l":"1","t":"Nerf optique"},{"l":"2","t":"Chiasma optique"},{"l":"3","t":"Tractus optique"},{"l":"4","t":"CGL du thalamus"},{"l":"5","t":"Cortex visuel (lobe occipital)"}],"leurres":["Glande pinéale"],"expl":"Nerf optique, chiasma optique, tractus optique, CGL du thalamus, cortex visuel.","source":"8B3, 8B4, 8F3","mod":8},{"id":"a8-s04","fam":"a8-photo","kc":"A8.4","k":"schema","figure":"photorecepteur","q":"Nomme chaque repère du dessin des photorécepteurs.","reperes":[{"l":"A","t":"Disques"},{"l":"B","t":"Noyau"},{"l":"C","t":"Mitochondries"},{"l":"D","t":"Terminaisons synaptiques"},{"l":"E","t":"Segment externe"},{"l":"F","t":"Segment interne"},{"l":"G","t":"Cône"},{"l":"H","t":"Bâtonnet"}],"expl":"Les disques sont dans le segment externe ; le noyau et les mitochondries, dans le segment interne ; les terminaisons synaptiques, tout au bout.","source":"8A4","mod":8},{"id":"a9-s01","fam":"a9-chiasma","kc":"A9.12","k":"schema","figure":"voies-lesions","q":"Trois lésions sont marquées sur les voies visuelles. Quel défaut du champ visuel donne chacune ?","reperes":[{"l":"1","t":"L’œil droit perd tout son champ"},{"l":"2","t":"Défaut bi-temporal : chaque œil perd son côté tempe"},{"l":"3","t":"Les deux yeux perdent le côté gauche du champ"}],"leurres":["Les deux yeux perdent le côté droit du champ","L’œil gauche perd tout son champ"],"expl":"« Anomalie 1: nerf optique droit » : un seul œil. « Anomalie 2: chiasma (fibres nasales alors défaut bi-temporal) ». Après le chiasma, à droite : les deux yeux perdent le côté gauche, et le défaut respecte le méridien vertical.","source":"9A16, 9A17","mod":9},{"id":"a9-s02","fam":"a9-carte","kc":"A9.2","k":"schema","figure":"fond-quadrants","q":"Sur ce fond d’œil, la papille est du côté du nez. Nomme les quatre quadrants.","reperes":[{"l":"A","t":"Supérieur temporal"},{"l":"B","t":"Supérieur nasal"},{"l":"C","t":"Inférieur temporal"},{"l":"D","t":"Inférieur nasal"}],"expl":"Les quadrants se divisent « avec la fovéa au centre » ; le côté de la papille est le côté nasal.","source":"9A2","mod":9},{"id":"a9-s03","fam":"a9-feuille","kc":"A9.13","k":"schema","figure":"voies-feuille","q":"Nomme les sept repères de la feuille des voies visuelles, de A à G.","reperes":[{"l":"A","t":"Rétine"},{"l":"B","t":"Nerf optique"},{"l":"C","t":"Chiasma optique"},{"l":"D","t":"Tractus optique"},{"l":"E","t":"Corps genouillé latéral"},{"l":"F","t":"Radiations optiques"},{"l":"G","t":"Cortex visuel primaire"}],"expl":"Le tractus optique vient juste après le chiasma ; les radiations optiques, juste avant le cortex.","source":"9B1","mod":9}]};

<script>
/* ======================================================================
   Bruit de fond : un petit bouton pour se concentrer pendant l'étude.
   Blanc, rose, brun, et quatre ambiances imitées : vagues, pluie, vent,
   feu de foyer. Tout est fabriqué dans le navigateur (Web Audio) : aucun
   fichier son, rien à télécharger, rien d'envoyé. Le module ne dépend de
   rien : il pose son bouton (en bas à droite) et son style lui-même ; il
   prend les couleurs de la page si elle les définit (--panel, --ink…).
   Le dernier son et le volume sont gardés sur l'appareil (lumiere-bruit),
   mais rien ne joue tout seul : il faut toucher un son.
   Inclus dans les exerciseurs par drill-notions/construire.py, et dans
   « Quelle formule ? » par outils/poser_bruit.py.
   ====================================================================== */
(() => {
'use strict';
if(window.__bruit) return;

/* === bruit : début (pur, testé par outils/test_bruit.js) === */
/* n échantillons d'un bruit qui boucle sans « clic » : on en fabrique un peu plus (f), et la queue se fond dans la tête */
function fabriquerBruit(type, n, f, rnd = Math.random){
  const d = new Float32Array(n + f);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, dernier = 0;
  for(let i = 0; i < n + f; i++){
    const w = rnd() * 2 - 1;
    if(type === 'blanc') d[i] = w * 0.5;
    else if(type === 'rose'){   /* le filtre de Paul Kellet : −3 dB par octave */
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856; b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
    } else { dernier = (dernier + 0.02 * w) / 1.02; d[i] = dernier * 3.5; }   /* brun : un intégrateur qui fuit, −6 dB par octave */
  }
  const c = new Float32Array(n);
  for(let i = 0; i < n; i++) c[i] = d[i];
  for(let i = 0; i < f; i++){ const t = i / f; c[i] = d[i] * Math.sqrt(t) + d[n + i] * Math.sqrt(1 - t); }
  for(let i = 0; i < n; i++) c[i] = Math.max(-1, Math.min(1, c[i]));
  return c;
}
/* des éclats : de très courtes bouffées de bruit qui s'éteignent (crépitements du feu, gouttes de pluie).
   Presque toutes sont faibles, quelques-unes fortes (puissance 3) ; la fin du tampon reste vide pour boucler proprement */
function fabriquerEclats(n, sr, parSec, durMin, durMax, ampMin, ampMax, rnd = Math.random){
  const c = new Float32Array(n), N = Math.floor(n / sr * parSec), marge = Math.floor(sr * (durMax + 0.02));
  for(let k = 0; k < N; k++){
    const p = Math.floor(rnd() * (n - marge)), L = Math.max(2, Math.floor(sr * (durMin + rnd() * (durMax - durMin))));
    const a = ampMin + Math.pow(rnd(), 3) * (ampMax - ampMin);
    for(let i = 0; i < L; i++) c[p + i] += (rnd() * 2 - 1) * a * Math.exp(-6 * i / L);
  }
  for(let i = 0; i < n; i++) c[i] = Math.max(-1, Math.min(1, c[i]));
  return c;
}
/* === bruit : fin === */

const CLE = 'lumiere-bruit';
const SONS = [['blanc', 'Blanc'], ['rose', 'Rose'], ['brun', 'Brun'], ['vagues', 'Vagues'], ['pluie', 'Pluie'], ['vent', 'Vent'], ['feu', 'Feu de foyer']];
const etat = {son:'', vol:0.5};
try{ const s = JSON.parse(localStorage.getItem(CLE)); if(s && typeof s === 'object'){ if(SONS.some(([k]) => k === s.son)) etat.son = s.son; if(typeof s.vol === 'number' && s.vol >= 0 && s.vol <= 1) etat.vol = s.vol; } }catch(e){}
const garder = () => { try{ localStorage.setItem(CLE, JSON.stringify(etat)); }catch(e){} };

let ctx = null, maitre = null, analyse = null, courant = null, joue = '';
const tampons = {};
function tampon(cle, fabrique){
  if(!tampons[cle]){ const d = fabrique(ctx.sampleRate), b = ctx.createBuffer(1, d.length, ctx.sampleRate); b.getChannelData(0).set(d); tampons[cle] = b; }
  return tampons[cle];
}
const bruit = (type, sec) => tampon(type + sec, sr => fabriquerBruit(type, Math.floor(sr * sec), Math.floor(sr * 0.3)));
const eclats = (nom, sec, ...r) => tampon(nom, sr => fabriquerEclats(Math.floor(sr * sec), sr, ...r));

/* chaque son : une fonction qui branche ses nœuds sur « sortie » et rend ceux qu'il faudra arrêter */
function monter(nom, sortie){
  const aArreter = [];
  const source = b => { const s = ctx.createBufferSource(); s.buffer = b; s.loop = true; s.start(0, Math.random() * b.duration); aArreter.push(s); return s; };
  const gain = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const filtre = (type, hz, q) => { const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = hz; if(q) f.Q.value = q; return f; };
  /* un oscillateur très lent qui fait monter et descendre un réglage (la houle, les rafales, la flamme) */
  const lent = (hz, ampleur, param) => { const o = ctx.createOscillator(), g = gain(ampleur); o.frequency.value = hz; o.connect(g).connect(param); o.start(); aArreter.push(o); };

  if(nom === 'blanc') source(bruit('blanc', 4)).connect(gain(0.3)).connect(sortie);
  else if(nom === 'rose') source(bruit('rose', 5)).connect(gain(0.85)).connect(sortie);
  else if(nom === 'brun') source(bruit('brun', 6)).connect(gain(1)).connect(sortie);
  else if(nom === 'vagues'){
    /* le corps de la vague : du bruit brun dont le volume et la clarté montent et retombent, à deux rythmes qui ne tombent jamais ensemble */
    const lp = filtre('lowpass', 480, 0.5), g = gain(0.55);
    source(bruit('brun', 6)).connect(lp).connect(g).connect(sortie);
    lent(0.083, 0.38, g.gain); lent(0.131, 0.12, g.gain); lent(0.083, 300, lp.frequency);
    /* l'écume : un souffle aigu qui arrive avec la vague */
    const hp = filtre('highpass', 1700), g2 = gain(0.045);
    source(bruit('rose', 5)).connect(hp).connect(g2).connect(sortie);
    lent(0.083, 0.04, g2.gain);
  } else if(nom === 'pluie'){
    const g = gain(0.5);
    source(bruit('rose', 5)).connect(filtre('highpass', 450)).connect(filtre('lowpass', 8500)).connect(g).connect(sortie);
    lent(0.05, 0.07, g.gain);
    source(eclats('gouttes', 7, 150, 0.001, 0.005, 0.02, 0.45)).connect(filtre('bandpass', 3200, 0.6)).connect(gain(0.7)).connect(sortie);
  } else if(nom === 'vent'){
    const bp = filtre('bandpass', 430, 0.9), g = gain(0.95);
    source(bruit('rose', 5)).connect(bp).connect(g).connect(sortie);
    lent(0.071, 210, bp.frequency); lent(0.19, 90, bp.frequency); lent(0.113, 0.4, g.gain); lent(0.047, 0.2, g.gain);
    source(bruit('brun', 6)).connect(filtre('lowpass', 160)).connect(gain(0.35)).connect(sortie);
  } else if(nom === 'feu'){
    /* le ronflement de la flamme, qui vacille */
    const g = gain(0.6);
    source(bruit('brun', 6)).connect(filtre('lowpass', 420)).connect(g).connect(sortie);
    lent(0.9, 0.09, g.gain); lent(2.3, 0.05, g.gain); lent(0.17, 0.1, g.gain);
    /* les crépitements : beaucoup de petits, quelques claquements */
    source(eclats('crepite', 11, 11, 0.003, 0.028, 0.03, 1)).connect(filtre('highpass', 1100)).connect(gain(0.55)).connect(sortie);
    source(eclats('braise', 13, 1.3, 0.02, 0.07, 0.15, 0.9)).connect(filtre('bandpass', 520, 0.7)).connect(gain(0.5)).connect(sortie);
  }
  return aArreter;
}
function arreter(){
  if(!courant) return;
  const c = courant, t = ctx.currentTime;
  courant = null; joue = '';

  setTimeout(() => { c.noeuds.forEach(x => { try{ x.stop(); }catch(e){} }); try{ c.sortie.disconnect(); }catch(e){} }, 600);
}
function jouer(nom){
  if(!ctx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    ctx = new AC(); maitre = ctx.createGain(); analyse = ctx.createAnalyser(); analyse.fftSize = 2048;
    /* un limiteur avant la sortie : un claquement du feu ne doit jamais surprendre dans des écouteurs */

    limite.threshold.value = -8; limite.knee.value = 6; limite.ratio.value = 12; limite.attack.value = 0.003; limite.release.value = 0.2;

  sortie.gain.setTargetAtTime(1, t, 0.25);

}
/* le volume : au carré, pour que le curseur suive l'oreille */
function regler(v){ etat.vol = v; if(maitre) maitre.gain.setTargetAtTime(v * v * 0.9, ctx.currentTime, 0.04); }

/* ---------- le bouton et son panneau ---------- */
const style = document.createElement('style');

.bruit-btn{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line,#D3DBE0);background:var(--panel,#fff);color:var(--ink-2,#465763);cursor:pointer;box-shadow:0 2px 10px rgba(8,12,16,.14)}
.bruit-btn:hover{border-color:var(--accent,#0F6E8C);color:var(--accent,#0F6E8C)}
.bruit-btn svg{width:22px;height:22px}
.bruit.joue .bruit-btn{background:var(--accent,#0F6E8C);border-color:var(--accent,#0F6E8C);color:var(--on-accent,#fff)}
.bruit.joue .bruit-btn path{transform-box:fill-box;transform-origin:center;animation:bruit-barre 1.1s ease-in-out infinite}
.bruit.joue .bruit-btn path:nth-child(2){animation-delay:-.3s}

.bruit.joue .bruit-btn path:nth-child(4){animation-delay:-.15s}

.bruit-t{margin:0;font:600 12px var(--f-mono,ui-monospace,monospace);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3,#5F717D)}

document.head.appendChild(style);

const racine = document.createElement('div');
racine.className = 'bruit';
racine.innerHTML = '<div class="bruit-panneau" id="bruit-panneau" role="group" aria-label="Bruit de fond" hidden><p class="bruit-t">Bruit de fond<\/p>'
  + '<div class="bruit-sons">' + SONS.map(([k, t]) => '<button type="button" class="bruit-son" data-son="' + k + '" aria-pressed="false">' + t + '<\/button>').join('') + '<\/div>'
  + '<label class="bruit-vol"><span>Volume<\/span><input type="range" min="0" max="100" step="1" id="bruit-vol" aria-label="Volume du bruit de fond"><\/label>'
  + '<p class="bruit-aide" id="bruit-aide">Touche un son pour le lancer, touche-le encore pour l’arrêter.<\/p><\/div>'
  + '<button type="button" class="bruit-btn" id="bruit-btn" aria-expanded="false" aria-controls="bruit-panneau" aria-label="Bruit de fond pour se concentrer" title="Bruit de fond">'
  + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/><\/svg><\/button>';
document.body.appendChild(racine);
const $ = s => racine.querySelector(s), panneau = $('#bruit-panneau'), bouton = $('#bruit-btn'), curseur = $('#bruit-vol');
curseur.value = Math.round(etat.vol * 100);
function peindre(){
  racine.classList.toggle('joue', !!joue);
  racine.querySelectorAll('[data-son]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.son === joue)));
  bouton.setAttribute('aria-label', joue ? 'Bruit de fond : ' + SONS.find(([k]) => k === joue)[1] + ' joue' : 'Bruit de fond pour se concentrer');

racine.addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('button'); if(!b) return;
  if(b === bouton){ ouvrir(panneau.hidden); return; }
  const k = b.dataset.son; if(!k) return;
  if(joue === k) arreter();
  else if(!jouer(k)) $('#bruit-aide').textContent = 'Ton navigateur ne peut pas fabriquer de son ici.';
  peindre();
});
racine.addEventListener('keydown', e => { e.stopPropagation(); if(e.key === 'Escape' && !panneau.hidden){ ouvrir(false); bouton.focus({preventScroll:true}); } });
curseur.addEventListener('input', () => { regler(curseur.value / 100); garder(); });
document.addEventListener('click', () => { if(!panneau.hidden) ouvrir(false); });
peindre();

/* pour les tests : ce qui joue, et le niveau mesuré à la sortie (0 = silence) */
window.__bruit = {SONS, jouer:k => { const r = jouer(k); peindre(); return r; }, arreter:() => { arreter(); peindre(); },
  etat:() => ({joue, vol:etat.vol, dernier:etat.son, contexte:ctx ? ctx.state : 'aucun'}),
  niveau(){ if(!analyse) return 0; const d = new Float32Array(analyse.fftSize); analyse.getFloatTimeDomainData(d); let s = 0; for(const x of d) s += x * x; return Math.sqrt(s / d.length); }};
})();

</script>
<script>
(() => {
  const ICI = 'c81d634ae220';
  let montre = false;
  const verifier = () => {
    if(montre || location.protocol === 'file:') return;
    fetch('version.json?_=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(v => {
      if(!v || !v.version || v.version === ICI || montre) return;
      montre = true;
      const b = document.createElement('div');
      b.setAttribute('role', 'status');
      b.style.cssText = 'position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:400;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);padding:9px 10px 9px 14px;border-radius:12px;background:#0B0F1A;color:#F3F5FB;border:1px solid #9BF25C;font:600 14.5px system-ui,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.4)';
      const t = document.createElement('span'); t.textContent = 'Une nouvelle version de Lumière est prête.';
      const k = document.createElement('button'); k.type = 'button'; k.textContent = 'Recharger';
      k.style.cssText = 'border:0;border-radius:999px;padding:6px 14px;background:#9BF25C;color:#05070D;font:700 14px system-ui,sans-serif;cursor:pointer';
      k.addEventListener('click', () => location.reload());
      b.append(t, k); document.body.appendChild(b);
    }).catch(() => {});
  };
  window.addEventListener('load', verifier);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) verifier(); });
})();
</script>
