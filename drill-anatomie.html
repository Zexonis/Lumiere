la moyenne du cours est de 15 à 20 par minute."},{"t":"15 à 20 fois","ok":true},{"t":"Une seule fois, quand l’œil devient sec","pourquoi":"On ne cligne pas seulement pour mouiller : on cligne même « plus que necessaire (sic) pour les fonctions de base »."}],"expl":"« On cligne normalement 15-20x par minute » (C2).","source":"C2, C3","mod":6},{"id":"a6-043","fam":"a6-clignement","kc":"A6.14","k":"qcm","q":"Un étudiant lit un texte en petits caractères, très concentré. Que fait la fréquence de ses clignements ?","choix":[{"t":"Elle diminue","ok":true},{"t":"Elle augmente, pour garder la cornée mouillée","pourquoi":"C’est l’inverse : on cligne moins « quand on regarde des détails fins et encore moins lorsqu’on est concentré »."},{"t":"Elle reste à 15-20 par minute, quoi qu’il fasse","pourquoi":"15-20, c’est la normale; la fréquence varie selon ce qu’on regarde."},{"t":"Elle augmente, parce que le cerveau reçoit plus d’information","pourquoi":"On cligne plus en interactions sociales. Devant des détails fins, il y a « Moins de nouvelle information de nature visuelle. »"}],"expl":"« On cligne moins quand on regarde des détails fins et encore moins lorsqu’on est concentré. »","source":"C3, C6","mod":6},{"id":"a6-044","fam":"a6-clignement","kc":"A6.15","k":"ordre","q":"Remets dans l’ordre les six étapes du clignement.","etapes":["Ouverture des paupières (releveur, III)","Fermeture et apposition des paupières (orbiculaire, VII)","Points lacrymaux orientés vers le lac lacrymal","Action de la pompe lacrymale","Drainage lacrymal jusqu’à la cavité nasale","Les paupières ouvrent de nouveau"],"expl":"C12 à C20 : ouverture, fermeture et apposition (le film se répartit), positionnement des points, pompe, drainage, puis « Le relâchement de l'orbiculaire et l'action des muscles d'ouverture permettent aux paupières de se rouvrir. »","source":"C12–C20","mod":6,"voir":{"p":"clignement"}},{"id":"a6-045","fam":"a6-clignement","kc":"A6.15","k":"qcm","q":"À quelle étape du clignement les paupières répartissent-elles le film lacrymal sur la cornée ?","choix":[{"t":"L’ouverture des paupières (étape 1)","pourquoi":"L’ouverture lève la paupière (releveur, III). C’est en se fermant que les paupières « répartissent le film lacrymal sur la cornée »."},{"t":"L’action de la pompe lacrymale (étape 4)","pourquoi":"La pompe déplace les larmes vers le sac : c’est du drainage, pas de la répartition."},{"t":"Le positionnement des points lacrymaux (étape 3)","pourquoi":"Les points doivent être orientés vers le lac pour drainer; ils ne répartissent pas le film."},{"t":"La fermeture et l’apposition (étape 2)","ok":true}],"expl":"C14 : l’orbiculaire se contracte et « les paupières répartissent le film lacrymal sur la cornée ».","source":"C12–C16","mod":6,"voir":{"p":"clignement","r":["2"]}},{"id":"a6-046","fam":"a6-clignement","kc":"A6.15","k":"vf","q":"La position des points lacrymaux fait partie des étapes du clignement : ils doivent être orientés vers le lac lacrymal.","v":true,"expl":"Étape 3 : « les points lacrymaux doivent être correctement orientés vers le lac lacrymal ». Mal orientés, ils ne drainent plus.","source":"C16","mod":6,"voir":{"p":"clignement","r":["3"]}},{"id":"a6-047","fam":"a6-drainage","kc":"A6.17","k":"ordre","q":"Remets dans l’ordre le trajet d’une larme, du lac lacrymal jusqu’au nez.","etapes":["Points lacrymaux","Canalicules","Sac lacrymal","Conduit nasolacrymal","Cavité nasale"],"expl":"« Les larmes passent par les points lacrymaux, les canalicules, le sac lacrymal, puis le conduit nasolacrymal jusqu’à la cavité nasale » (C19).","source":"C16, C19, DR","mod":6,"voir":{"p":"larmes-anatomie"}},{"id":"a6-048","fam":"a6-drainage","kc":"A6.17","k":"qcm","q":"Où se termine le conduit nasolacrymal ?","choix":[{"t":"Dans la gorge, derrière le nez","pourquoi":"Le trajet du cours se termine « jusqu’à la cavité nasale »."},{"t":"Dans la cavité nasale","ok":true},{"t":"Dans les canalicules, qui le suivent","pourquoi":"C’est l’ordre inverse : canalicules et sac viennent avant le conduit."},{"t":"Dans un sinus du visage","pourquoi":"Le trajet du cours se termine dans le nez, à la cavité nasale."}],"expl":"Le conduit nasolacrymal est le dernier tronçon : il mène les larmes « jusqu’à la cavité nasale » (C19).","source":"C16, C19","mod":6,"voir":{"p":"larmes-anatomie","r":["7"]}},{"id":"a6-049","fam":"a6-drainage","kc":"A6.16","k":"qcm","q":"Que se passe-t-il pour les larmes quand l’œil se ferme ?","choix":[{"t":"Elles partent du lac vers les canalicules et le sac","ok":true},{"t":"Elles restent dans le lac jusqu’à la prochaine ouverture","pourquoi":"La fermeture les pousse : « Quand l’oeil ferme, les larmes quittent le lac lacrymal par les point (sic) lacrymaux »."},{"t":"Elles coulent vers le nez par la seule gravité","pourquoi":"Le cours décrit une pompe : « Les variations de pression associées au cycle de clignement participent au renouvellement et au drainage des larmes. »"},{"t":"Elles remontent vers la glande lacrymale","pourquoi":"Les larmes ne retournent pas à la glande : elles s’en vont vers les voies de drainage."}],"expl":"« Quand l’oeil ferme, les larmes quittent le lac lacrymal par les point (sic) lacrymaux et vont vers les cannalicules (sic) et le sac lacrymal » (C17).","source":"C17, C20","mod":6,"voir":{"p":"larmes-anatomie","r":["3","6","4"]}},{"id":"a6-050","fam":"a6-drainage","kc":"A6.16","k":"vf","q":"Quand l’œil s’ouvre de nouveau, les larmes sont aspirées vers le sac lacrymal.","v":true,"expl":"« Quand l’oeil ouvre de nouveau, les larmes sont suctionnées vers le sac lacrymal » (C17). La fermeture pousse, l’ouverture aspire.","source":"C17","mod":6,"voir":{"p":"larmes-anatomie","r":["4"]}},{"id":"a6-051","fam":"a6-drainage","kc":"A6.16","k":"qcm","q":"Un patient a un orbiculaire faible : il ferme mal ses paupières. Que devient son drainage ?","choix":[{"t":"Il est meilleur : l’œil reste ouvert et les larmes coulent mieux","pourquoi":"La pompe a besoin du cycle fermeture-ouverture : « Les variations de pression associées au cycle de clignement participent au renouvellement et au drainage des larmes. »"},{"t":"Il ne change pas : les larmes descendent par gravité","pourquoi":"Le cours décrit une pompe, pas une simple descente."},{"t":"Il est moins efficace : la pompe pousse moins bien","ok":true},{"t":"Il dépend seulement du releveur, qui n’est pas touché","pourquoi":"Le releveur ouvre (III). C’est la fermeture par l’orbiculaire (VII) qui pousse les larmes vers les canalicules."}],"expl":"La fermeture par l’orbiculaire pousse les larmes du lac vers les canalicules et le sac. Si elle est faible, la pompe draine moins bien (lecture déduite de C17 et C20, fiche F06).","source":"C17, C20, F06","mod":6,"voir":{"p":"larmes-anatomie"}},{"id":"a6-052","fam":"a6-drainage","kc":"A6.18","k":"qcm","q":"Quelle est la différence entre un ectropion et une éversion du point lacrymal ?","choix":[{"t":"Ectropion : la paupière tournée vers l’intérieur. Éversion : vers l’extérieur.","pourquoi":"L’ectropion est une « Éversion du bord de la paupière, généralement inférieure, vers l'extérieur. »"},{"t":"C’est la même chose sous deux noms.","pourquoi":"L’ectropion touche tout le bord de la paupière; dans F03, seul le point lacrymal est tourné vers l’extérieur."},{"t":"Ectropion : un point bouché. Éversion : un canalicule bouché.","pourquoi":"Ce sont des problèmes de position, pas d’obstruction. Un canalicule obstrué, c’est F04."},{"t":"Ectropion : tout le bord de la paupière. Éversion : le point seul.","ok":true}],"expl":"Ectropion : « Éversion du bord de la paupière, généralement inférieure, vers l'extérieur. » Dans F03, c’est seulement le point lacrymal qui est tourné vers l’extérieur.","source":"C8, F03","mod":6,"voir":{"p":"points-lacrymaux","r":["2","3"]}},{"id":"a6-053","fam":"a6-drainage","kc":"A6.18","k":"qcm","q":"Fiche F03 : « Une patiente présente un point lacrymal inférieur orienté vers l’extérieur plutôt que vers le lac lacrymal. Son œil pleure régulièrement. » Pourquoi son œil pleure-t-il ?","choix":[{"t":"Sa glande lacrymale produit trop de larmes","pourquoi":"Rien n’indique un excès de production : c’est l’entrée des voies qui est mal placée (étape 3)."},{"t":"Le point n’est plus tourné vers le lac : les larmes n’entrent plus","ok":true},{"t":"Son conduit nasolacrymal est bouché","pourquoi":"Le conduit n’est pas en cause : c’est la position du point, à l’entrée des voies."},{"t":"Sa paupière ne ferme plus bien, donc le film s’évapore trop vite","pourquoi":"La fermeture n’est pas touchée. Le problème est l’orientation du point lacrymal."}],"expl":"Étape 3 : les points doivent être « correctement orientés vers le lac lacrymal ». Ici, la larme n’atteint plus l’entrée des voies : problème de drainage.","source":"C16, F03","mod":6,"voir":{"p":"points-lacrymaux","r":["3"]}},{"id":"a6-054","fam":"a6-fiches","kc":"A6.19","k":"ordre","q":"Remets dans l’ordre les quatre étapes du trajet des larmes.","etapes":["Production (les glandes)","Répartition (le clignement)","Évaporation (freinée par les lipides)","Drainage (des points jusqu’au nez)"],"expl":"C’est le cadre de la question 3 des fiches : « production, de répartition, d’évaporation ou de drainage des larmes ». On fait les larmes, on les étale, une partie s’évapore, le reste est drainé.","source":"F01–F10, C12–C20","mod":6,"voir":{"p":"larmes-quatre-etapes"}},{"id":"a6-055","fam":"a6-fiches","kc":"A6.20","k":"qcm","q":"Deux patientes ont des larmes sur la joue. La première marche au vent; la seconde a un conduit nasolacrymal obstrué. Laquelle a une épiphora ?","choix":[{"t":"La première, parce que le vent la fait pleurer","pourquoi":"Le vent irrite : c’est un larmoiement réflexe, « Augmentation de la production de larmes en réponse à une irritation »."},{"t":"Les deux, puisque les larmes coulent sur la joue","pourquoi":"Même signe, causes opposées : l’épiphora vient d’un drainage insuffisant, le larmoiement réflexe d’une irritation."},{"t":"La seconde : ses larmes ne s’évacuent plus","ok":true},{"t":"Aucune : l’épiphora veut dire un œil sec","pourquoi":"L’épiphora est un « Débordement des larmes sur la joue »."}],"expl":"Épiphora : « Débordement des larmes sur la joue, notamment lorsque leur drainage est insuffisant. » Le vent, lui, donne un larmoiement réflexe.","source":"C8, F05, F09","mod":6,"voir":{"p":"larmes-quatre-etapes","r":["4"]}},{"id":"a6-056","fam":"a6-fiches","kc":"A6.20","k":"vf","q":"Un œil qui larmoie a forcément des glandes qui produisent trop de larmes.","v":false,"expl":"Les larmes sur la joue peuvent venir d’une production réflexe ou d’un drainage insuffisant (épiphora). Cherche la cause : un irritant, ou une sortie bloquée.","source":"C8","mod":6,"voir":{"p":"larmes-quatre-etapes","r":["1","4"]}},{"id":"a6-057","fam":"a6-fiches","kc":"A6.19","k":"qcm","q":"Fiche F01 : « Une patiente remarque une sensation de sécheresse, surtout en fin de journée. Lorsqu’elle cligne des yeux, sa paupière supérieure ne rejoint pas toujours complètement la paupière inférieure. » Quelle étape du trajet est surtout touchée ?","choix":[{"t":"Le drainage des larmes","pourquoi":"Rien n’indique un problème de sortie : elle a une sensation de sécheresse, pas des larmes sur la joue."},{"t":"La production de larmes","pourquoi":"Les glandes ne sont pas en cause : c’est la fermeture incomplète qui laisse une bande de cornée non couverte."},{"t":"L’évaporation seulement, à cause des lipides","pourquoi":"Rien n’indique que les lipides manquent. La surface sèche parce qu’elle est mal couverte : la cause première est la répartition."},{"t":"La répartition","ok":true}],"expl":"La fermeture et l’apposition (étape 2) répartissent le film; si les paupières ne se rejoignent pas, une bande de cornée sèche. Lecture déduite : les fiches n’ont pas de corrigé.","source":"F01, C14","mod":6,"voir":{"p":"larmes-quatre-etapes","r":["2"]}},{"id":"a6-058","fam":"a6-fiches","kc":"A6.19","k":"qcm","q":"Fiche F08 : « Un étudiant passe plusieurs heures devant son ordinateur. Il ressent une sensation de brûlure et une vision fluctuante, surtout en fin de journée. » Quel mécanisme est le plus probable ?","choix":[{"t":"Il cligne moins : son film reste exposé et s’évapore","ok":true},{"t":"Ses canalicules sont bouchés, et ses larmes débordent sur la joue","pourquoi":"Il n’a pas de larmes sur la joue; ses signes sont ceux d’une surface qui s’assèche."},{"t":"Il cligne plus devant l’écran, ce qui use le film","pourquoi":"C’est l’inverse : on cligne moins « quand on regarde des détails fins et encore moins lorsqu’on est concentré »."},{"t":"L’écran irrite sa rétine, qui déclenche des larmes","pourquoi":"La rétine ne déclenche pas le larmoiement, et ses signes sont ceux d’une sécheresse."}],"expl":"On cligne moins en concentration (C6) : le film reste exposé plus longtemps. Étape évaporation, par une répartition moins fréquente (lecture déduite).","source":"F08, C6","mod":6,"voir":{"p":"larmes-quatre-etapes","r":["3"]}},{"id":"a6-059","fam":"a6-fiches","kc":"A6.19","k":"vf","q":"Un œil dont les larmes coulent sur la joue ne peut pas, en même temps, avoir une surface qui s’assèche ou s’irrite.","v":false,"expl":"Les deux vont souvent ensemble : dans F09, le vent assèche et irrite la surface, et l’irritation fait larmoyer (lecture déduite).","source":"F02, F06, F09","mod":6,"voir":{"p":"larmes-quatre-etapes"}},{"id":"a6-060","fam":"a6-fiches","kc":"A6.22","k":"qcm","q":"Fiche F09 : « Une patiente remarque que ses yeux deviennent rouges, irrités et larmoyants lorsqu’elle marche à l’extérieur par temps venteux. » Comment lire ce cas sur le trajet des larmes ?","choix":[{"t":"Un drainage bloqué : les larmes débordent sur la joue","pourquoi":"Rien n’indique une sortie bloquée : les larmes viennent d’une irritation, pas d’une épiphora."},{"t":"Évaporation par le vent, puis production réflexe à cause de l’irritation","ok":true},{"t":"Une rétine irritée par la lumière du jour","pourquoi":"« C'est la cornée qui recoit le stimulus et non la rétine ». Le vent agit sur la cornée."},{"t":"Une paralysie du VII qui empêche la fermeture","pourquoi":"Rien n’indique une atteinte du nerf. Ici, le VII fonctionne : c’est lui qui commande les larmes réflexes."}],"expl":"Le vent assèche et irrite; l’irritation lance l’arc réflexe (cornée, V, tronc cérébral, VII, glande). Deux étapes : évaporation, puis production (lecture déduite).","source":"F09, C8, RETRO","mod":6,"voir":{"p":"larmes-quatre-etapes","r":["3","1"]}},{"id":"a6-061","fam":"a6-fiches","kc":"A6.22","k":"qcm","q":"Fiche F04 : « Un patient présente un larmoiement persistant d’un œil. L’examen révèle une obstruction d’un canalicule lacrymal. » Quelle structure, quel effet, quelle étape ?","choix":[{"t":"La glande lacrymale; elle produit trop de larmes; production","pourquoi":"Le larmoiement vient ici d’une sortie bloquée, pas d’un excès de production."},{"t":"L’orbiculaire; la paupière ferme mal; répartition","pourquoi":"La fiche nomme la structure : un canalicule obstrué, dans les voies de drainage."},{"t":"Le canalicule; les larmes ne sortent plus; drainage","ok":true},{"t":"La couche lipidique; le film s’évapore trop vite; évaporation","pourquoi":"Rien ne touche les lipides ici : la larme ne peut plus sortir."}],"expl":"Le canalicule fait partie des voies (« points lacrymaux, les canalicules, le sac lacrymal, puis le conduit nasolacrymal »). Bloqué, il ne laisse plus passer les larmes : drainage.","source":"F04, C19","mod":6,"voir":{"p":"larmes-anatomie","r":["3","6"]}},{"id":"a6-062","fam":"a6-fiches","kc":"A6.21","k":"ordre","q":"Remets dans l’ordre les trois questions de chaque fiche de cas.","etapes":["Quelle structure ou quel mécanisme est principalement concerné ?","Quel effet ce problème pourrait-il avoir sur les larmes ou la surface oculaire ?","S’agit-il surtout d’un problème de production, de répartition, d’évaporation ou de drainage ?"],"expl":"Structure, puis effet, puis étape avec une justification. La consigne : « expliquer le mécanisme physiologique possible, sans poser de diagnostic ».","source":"F01–F10","mod":6},{"id":"a6-063","fam":"a6-fiches","kc":"A6.21","k":"qcm","q":"Sur une fiche de cas, laquelle de ces réponses respecte la consigne de la prof ?","choix":[{"t":"C’est une infection : il faut un traitement","pourquoi":"La consigne demande d’« expliquer le mécanisme physiologique possible, sans poser de diagnostic »."},{"t":"Drainage.","pourquoi":"La question 3 se termine par « Justifiez votre choix. » Il faut aussi la structure et l’effet."},{"t":"Le conduit nasolacrymal est bloqué.","pourquoi":"C’est la question 1 seulement : il manque l’effet sur les larmes et l’étape."},{"t":"Le conduit est bloqué, les larmes ne s’évacuent plus : problème de drainage","ok":true}],"expl":"Une bonne réponse nomme la structure, l’effet et l’étape, avec une justification, sans diagnostic : « expliquer le mécanisme physiologique possible, sans poser de diagnostic ».","source":"F01–F10","mod":6,"voir":{"p":"larmes-quatre-etapes","r":["4"]}},{"id":"a7-001","fam":"a7-milieux","kc":"A7.1","k":"ordre","q":"Remets dans l’ordre ce que la lumière traverse, de l’avant de l’œil jusqu’à la rétine.","etapes":["Cornée","Humeur aqueuse","Cristallin","Vitré","Rétine"],"expl":"Quatre milieux en enfilade : la cornée devant, l’humeur aqueuse dans les deux chambres, le cristallin entre l’« humeur aqueuse en avant et vitré en arrière », puis le vitré jusqu’à la rétine.","source":"A2, C4, D3; Anatomie 3.1, diapo 8","mod":7,"voir":{"p":"milieux"}},{"id":"a7-002","fam":"a7-milieux","kc":"A7.1","k":"qcm","q":"Un camarade dessine l’humeur aqueuse seulement entre la cornée et l’iris. Qu’a-t-il oublié ?","choix":[{"t":"La chambre postérieure, entre l’iris et le cristallin","ok":true},{"t":"Le vitré, qui est lui aussi de l’humeur aqueuse","pourquoi":"Le vitré est un autre milieu, un gel, derrière le cristallin. L’humeur aqueuse remplit les deux chambres devant le cristallin."},{"t":"Rien : chez lui, l’humeur aqueuse est bien placée devant l’iris","pourquoi":"C’est le piège : elle remplit aussi la « chambre postérieure (iris au cristallin/corps ciliaire) »."},{"t":"L’espace entre le cristallin et la rétine","pourquoi":"Cet espace est celui du vitré, « derrière le cristallin jusqu’à la rétine »."}],"expl":"L’humeur aqueuse remplit la « chambre antérieure (cornée à l’iris) » et la « chambre postérieure (iris au cristallin/corps ciliaire) ».","source":"Anatomie 3.1, diapo 8","mod":7,"voir":{"p":"milieux","r":["aqueuse"]}},{"id":"a7-003","fam":"a7-milieux","kc":"A7.1","k":"vf","q":"Le vitré fait partie des milieux qui réfractent (dévient) la lumière dans l’œil.","v":false,"expl":"Le vitré sert à « transmettre la lumière ». Deux milieux seulement la réfractent : la cornée (« 2/3 ») et le cristallin (« 1/3 »).","source":"A8, D3","mod":7,"voir":{"p":"milieux","r":["vitre"]}},{"id":"a7-004","fam":"a7-milieux","kc":"A7.24","k":"qcm","q":"Question de réflexion de l’activité : quelles structures de l’œil contribuent à la réfraction de la lumière ?","choix":[{"t":"La cornée (2/3) et le cristallin (1/3)","ok":true},{"t":"Les quatre milieux, à parts égales","pourquoi":"Les quatre sont transparents, mais deux seulement dévient la lumière : la cornée « 2/3 », le cristallin « 1/3 »."},{"t":"Le cristallin surtout, et un peu la cornée","pourquoi":"C’est l’inverse : « La cornée done (sic) 2/3 du pouvoir optique des structures oculaires (1/3 vient du cristallin) »."},{"t":"La cornée et le vitré","pourquoi":"Le vitré sert à « transmettre la lumière »; il n’est pas une des deux structures qui réfractent."}],"expl":"« La cornée done (sic) 2/3 du pouvoir optique des structures oculaires (1/3 vient du cristallin) » : environ 42 D pour la cornée, 18-20 D pour le cristallin.","source":"A7, A8, C4; ACT","mod":7,"voir":{"p":"milieux","r":["cornee","cristallin"]}},{"id":"a7-005","fam":"a7-milieux","kc":"A7.24","k":"qcm","q":"Dans le tableau de l’activité, quelle fonction principale écris-tu pour l’humeur aqueuse (vue à l’UA1) ?","choix":[{"t":"Nourrir les structures sans vaisseaux, comme la cornée et le cristallin","ok":true},{"t":"Donner les 2/3 du pouvoir optique de l’œil","pourquoi":"Ça, c’est la cornée (A8)."},{"t":"Absorber les chocs et protéger la rétine pendant les mouvements","pourquoi":"Ce sont des rôles du vitré (D3)."},{"t":"Renouveler l’épithélium de la cornée","pourquoi":"Ce sont les cellules souches du limbe qui renouvellent l’épithélium (B2)."}],"expl":"« L’humeur aqueuse nourrit les structures avasculaires de l’oeil » : la cornée et le cristallin. Le reste de sa colonne n’est sur aucune diapo du M7.","source":"Anatomie 3.1, diapo 10; ACT","mod":7,"voir":{"p":"milieux","r":["aqueuse"]}},{"id":"a7-006","fam":"a7-couches","kc":"A7.2","k":"ordre","q":"Remets les cinq couches de la cornée dans l’ordre, de l’avant (côté larmes) vers l’arrière (côté humeur aqueuse).","etapes":["Épithélium","Membrane de Bowman","Stroma","Membrane de Descemet","Endothélium"],"expl":"Dessin A4 : A « Épithélium », B « Membrane de Bowman », C « Stroma », E « Membrane de Descemet », F « Endothélium ».","source":"A3, A4, A5","mod":7,"voir":{"p":"cornee-couches"}},{"id":"a7-007","fam":"a7-couches","kc":"A7.2","k":"qcm","q":"Sur le dessin A4, la lettre D pointe à l’intérieur du stroma. Que désigne-t-elle ?","choix":[{"t":"Les kératocytes, les cellules du stroma","ok":true},{"t":"Une sixième couche, entre le stroma et Descemet","pourquoi":"La cornée a cinq couches. D n’en est pas une : le stroma est « composé de collagène et kératocytes (D) »."},{"t":"La membrane de Descemet","pourquoi":"Descemet porte la lettre E, juste avant l’endothélium (F)."},{"t":"Les fibres nerveuses de la cornée","pourquoi":"Les nerfs sont sous l’épithélium (A11). D, dans le stroma, ce sont les kératocytes."}],"expl":"Le stroma est « composé de collagène et kératocytes (D) »; les kératocytes sont des « cellules fibroblastiques aplaties ».","source":"A4, A12","mod":7,"voir":{"p":"cornee-couches","r":["D"]}},{"id":"a7-008","fam":"a7-couches","kc":"A7.2","k":"qcm","q":"Le dessin A4 ajoute deux membranes à la cornée de l’UA1 (épithélium, stroma, endothélium). Où sont-elles ?","choix":[{"t":"Bowman sous l’épithélium, Descemet sous le stroma","ok":true},{"t":"Descemet sous l’épithélium, Bowman sous le stroma","pourquoi":"Inversées : Bowman (B) suit l’épithélium (A); Descemet (E) porte l’endothélium (F)."},{"t":"Les deux entre l’épithélium et le stroma","pourquoi":"Seule Bowman est là. Descemet est la « membrane sur lequel (sic) repose les cellules de l’endothélium »."},{"t":"Les deux devant l’épithélium, sous les larmes","pourquoi":"L’épithélium est la première couche (A); les deux membranes encadrent le stroma."}],"expl":"« On ajoute 2 éléments: membrane de Bowman (pour structure) et membrane de Descement (sic) (membrane sur lequel (sic) repose les cellules de l’endothélium) ».","source":"A4","mod":7,"voir":{"p":"cornee-couches","r":["B","E"]}},{"id":"a7-009","fam":"a7-couches","kc":"A7.2","k":"vf","q":"Sur le dessin A4, la membrane de Bowman (B) est juste sous l’épithélium, et la membrane de Descemet (E) juste avant l’endothélium.","v":true,"expl":"A épithélium, B Bowman, C stroma, E Descemet, F endothélium : les deux membranes encadrent le stroma.","source":"A4","mod":7,"voir":{"p":"cornee-couches","r":["B","E"]}},{"id":"a7-010","fam":"a7-couches","kc":"A7.3","k":"qcm","q":"Quelle couche de la cornée assure la « régulation de l'hydratation du stroma » ?","choix":[{"t":"L’endothélium","ok":true},{"t":"L’épithélium","pourquoi":"L’épithélium est la « barrière protectrice », à l’avant. L’eau, c’est l’endothélium, à l’arrière."},{"t":"La membrane de Bowman","pourquoi":"Bowman est une « couche de soutien acellulaire » : sans cellules, elle ne pompe rien."},{"t":"La membrane de Descemet","pourquoi":"Descemet est la « membrane basale de l'endothelium » : elle porte l’endothélium, c’est lui qui pompe."}],"expl":"« 5. Endothélium : régulation de l'hydratation du stroma. » Sa pompe garde la cornée « à 78% eau ».","source":"A5, A15","mod":7,"voir":{"p":"cornee-couches","r":["F"]}},{"id":"a7-011","fam":"a7-couches","kc":"A7.3","k":"qcm","q":"Ton collègue pense que l’épithélium règle l’eau de la cornée. Quel est le rôle de l’épithélium selon A5 ?","choix":[{"t":"Une barrière protectrice, à l’avant de la cornée","ok":true},{"t":"Régler l’hydratation du stroma","pourquoi":"C’est le rôle de l’endothélium, la dernière couche (A5)."},{"t":"Donner la transparence par son collagène bien rangé","pourquoi":"Le collagène en ordre, c’est le stroma."},{"t":"Servir de membrane basale à l’endothélium","pourquoi":"C’est Descemet, la « membrane basale de l'endothelium »."}],"expl":"« 1. Épithélium : barrière protectrice. » Il est à l’avant, du côté des larmes; l’eau du stroma, c’est l’endothélium.","source":"A5","mod":7,"voir":{"p":"cornee-couches","r":["A"]}},{"id":"a7-012","fam":"a7-couches","kc":"A7.3","k":"qcm","q":"Quelle couche a une « organisation régulière des fibres de collagène, essentielle à la transparence », et fait environ 90 % de l’épaisseur de la cornée ?","choix":[{"t":"Le stroma","ok":true},{"t":"La membrane de Bowman","pourquoi":"Bowman est une « couche de soutien acellulaire », sous l’épithélium."},{"t":"L’endothélium","pourquoi":"L’endothélium n’est qu’« 1 seule couche de cellules » : il règle l’eau, il ne fait pas l’épaisseur."},{"t":"L’épithélium","pourquoi":"L’épithélium est la « barrière protectrice »; le collagène rangé est dans le stroma."}],"expl":"Le stroma fait « 90% de l'épaisseur de la cornée » (A14), et l’ordre de son collagène le rend transparent (A5).","source":"A5, A14","mod":7,"voir":{"p":"cornee-couches","r":["C"]}},{"id":"a7-013","fam":"a7-clarte","kc":"A7.5","k":"qcm","q":"La cornée et la sclère sont toutes deux faites de collagène. Pourquoi l’une est-elle claire et l’autre blanche et opaque ?","choix":[{"t":"Leurs fibres de collagène sont rangées autrement","ok":true},{"t":"La cornée n’a pas de collagène, seulement de l’eau","pourquoi":"C’est le piège : elle en a. Elle est transparente « Grâce à l’organisation du collagène dont elle est composée »."},{"t":"La sclère contient un pigment blanc","pourquoi":"Aucun pigment : « La disposition moins régulière des fibres de collagène dans la sclère contribue à son opacité »."},{"t":"La sclère est beaucoup plus épaisse que la cornée","pourquoi":"L’épaisseur n’est pas la cause donnée : c’est la « disposition moins régulière des fibres de collagène dans la sclère »."}],"expl":"Même matière, autre ordre : la cornée est transparente « Grâce à l’organisation du collagène dont elle est composée »; la sclère est opaque par la « disposition moins régulière des fibres de collagène ».","source":"A2, A5, B5, B6","mod":7,"voir":{"p":"cornee-clarte","r":["1","2"]}},{"id":"a7-014","fam":"a7-clarte","kc":"A7.5","k":"vf","q":"La cornée est transparente parce qu’elle ne contient pas de collagène, contrairement à la sclère.","v":false,"expl":"Elle en contient : elle est transparente « Grâce à l’organisation du collagène dont elle est composée ». C’est l’ordre qui compte, pas la matière.","source":"A2, A13, B5","mod":7,"voir":{"p":"cornee-clarte","r":["1","2"]}},{"id":"a7-015","fam":"a7-clarte","kc":"A7.5","k":"qcm","q":"La cornée est claire parce que son collagène est bien rangé. Qu’est-ce qui garde le cristallin transparent, selon C9 ?","choix":[{"t":"Ses fibres corticales, bien organisées","ok":true},{"t":"Sa capsule, qui bloque bactéries et cellules inflammatoires","pourquoi":"La capsule « forme une barrière » contre les bactéries; la transparence vient de l’ordre des fibres."},{"t":"Une pompe qui le garde à 78 % d’eau","pourquoi":"La pompe à 78 % d’eau est celle de l’endothélium de la cornée (A15); C9 parle des fibres."},{"t":"Les vaisseaux qui le nourrissent","pourquoi":"Il n’a pas de vaisseaux : l’humeur aqueuse le nourrit (UA1). Sa transparence vient de ses fibres."}],"expl":"Même règle que la cornée, l’ordre : « fibres corticales biens (sic) organisées afin de maintenir la transparence ».","source":"C9; Anatomie 3.1, diapo 10","mod":7,"voir":{"p":"cristallin-coupe","r":["C"]}},{"id":"a7-016","fam":"a7-clarte","kc":"A7.6","k":"qcm","q":"L’endothélium d’un patient est très abîmé. Que deviennent l’eau et la clarté de sa cornée ?","choix":[{"t":"Elle s’imbibe d’eau et perd de sa transparence","ok":true},{"t":"Elle se dessèche et devient plus claire","pourquoi":"C’est l’inverse : sans la pompe, l’eau s’accumule et « la cornée perd de sa transparence »."},{"t":"Elle prend plus d’eau, donc devient plus claire, comme l’eau","pourquoi":"C’est le piège : l’eau en trop la trouble. Imbibée, elle « perd de sa transparence »."},{"t":"Rien : l’épithélium prend le relais de la pompe","pourquoi":"L’épithélium est une « barrière protectrice »; régler l’eau du stroma, c’est le rôle de l’endothélium."}],"expl":"« Si l’endothélium est endommagée (sic) la cornée perd de sa transparence parce qu’elle devient imbibée d’eau ».","source":"A15, A16","mod":7,"voir":{"p":"cornee-clarte","r":["1","3"]}},{"id":"a7-017","fam":"a7-clarte","kc":"A7.6","k":"vf","q":"Plus la cornée contient d’eau, plus elle est transparente, puisque l’eau est claire.","v":false,"expl":"Trop d’eau la trouble. La pompe la garde « légèrement déshydratée »; imbibée d’eau, elle « perd de sa transparence ».","source":"A15, A16","mod":7,"voir":{"p":"cornee-clarte","r":["1","3"]}},{"id":"a7-018","fam":"a7-clarte","kc":"A7.6","k":"ordre","q":"Remets dans l’ordre ce qui arrive quand l’endothélium est endommagé.","etapes":["L’endothélium est endommagé","Sa pompe ne garde plus la cornée à 78 % d’eau","La cornée s’imbibe d’eau","La cornée perd de sa transparence"],"expl":"L’endothélium a un « Rôle de pompe pour garder la cornée à 78% eau ». Quand il lâche, la cornée « devient imbibée d’eau » et perd sa transparence.","source":"A15","mod":7,"voir":{"p":"cornee-clarte","r":["1","3"]}},{"id":"a7-019","fam":"a7-refraction","kc":"A7.7","k":"qcm","q":"Pourquoi la cornée fait-elle les 2/3 du pouvoir optique de l’œil, plus que urce":"A9","mod":7,"voir":{"p":"refraction-cornee","r":["1"]}},{"id":"a7-024","fam":"a7-refraction","kc":"A7.9","k":"qcm","q":"Le tableau de A7 donne 42 D à la cornée. Le kératomètre lit environ 43,3 D sur une cornée de 7,8 mm. Comment comprendre l’écart ?","choix":[{"t":"Il ne lit que la face avant, avec un indice fictif","ok":true},{"t":"L’une des deux valeurs est fausse","pourquoi":"Les deux sont justes, pour deux modèles : 42 D compte les deux vraies faces, 43,3 D la face avant seule avec l’indice fictif 1,3375."},{"t":"Deux cornées différentes, une jeune et une âgée","pourquoi":"C’est la même cornée, vue par deux modèles; l’âge n’y est pour rien."},{"t":"Le kératomètre ajoute la puissance du cristallin","pourquoi":"Le kératomètre lit la lumière réfléchie par la cornée (« principe du kératomètre »); le cristallin n’y entre pas."}],"expl":"42 D = les deux vraies faces (+48,21 − 6,15, Optique M6 D16); 43,3 D = la face avant seule, avec l’indice fictif 1,3375 (TO 5.1, diapo 32).","source":"A7, A10; Optique M6 D16; TO 5.1, diapo 32","mod":7},{"id":"a7-025","fam":"a7-refraction","kc":"A7.4","k":"qcm","q":"Un camarade dessine une cornée plus épaisse au centre qu’au bord. Qu’en dit le tableau de A7 ?","choix":[{"t":"L’inverse : 0,52 mm au centre, 0,67 mm au bord","ok":true},{"t":"Il a raison : 0,67 mm au centre, 0,52 mm au bord","pourquoi":"Valeurs inversées : la cornée est plus mince au centre (0,52 mm)."},{"t":"Elle a la même épaisseur partout, 0,5 mm","pourquoi":"« Epaisseur ≈ 0.5 mm » est l’arrondi de A6; le tableau de A7 distingue le centre (0,52 mm) et la périphérie (0,67 mm)."},{"t":"Il a raison : 12 mm au centre","pourquoi":"12 mm, c’est son diamètre (« Diamètre ≈ 12 mm »), pas son épaisseur."}],"expl":"Épaisseur au centre 0,52 mm, en périphérie 0,67 mm : la cornée est plus mince au centre (A7).","source":"A6, A7","mod":7},{"id":"a7-026","fam":"a7-refraction","kc":"A7.4","k":"num","q":"Selon le tableau de A7, quelle est la puissance de la cornée, en dioptries ?","rep":{"v":42,"tol":0.5,"u":"D","dec":0},"pieges":[{"v":43.3,"m":"43,3 D, c’est la lecture du kératomètre : la face avant seule, avec l’indice fictif 1,3375. Le tableau du cours donne 42 D."},{"v":48.21,"m":"+48,21 D, c’est la face avant seule, à l’air (Optique). La face arrière en retire environ 6 : 42 D."},{"v":20,"m":"18-20 D, c’est le cristallin. La cornée, elle, fait les 2/3 : 42 D."}],"expl":"« La cornée done (sic) 2/3 du pouvoir optique » : environ 42 D (A7), contre 18-20 D pour le cristallin (C4).","source":"A7, A8","mod":7,"voir":{"p":"refraction-cornee","r":["1"]}},{"id":"a7-027","fam":"a7-refraction","kc":"A7.4","k":"vf","q":"La cornée est environ 200 fois plus sensible que la peau, et elle devient moins sensible avec l’âge.","v":true,"expl":"Innervation « environ 200x plus de (sic) sensible que la peau »; « On est plus sensible en jeunesse et la cornée devient moins sensible avec l’âge ».","source":"A11","mod":7},{"id":"a7-028","fam":"a7-limbe","kc":"A7.10","k":"qcm","q":"Un patient s’égratigne l’épithélium de la cornée. D’où viennent les cellules qui le renouvellent ?","choix":[{"t":"Des cellules souches du limbe","ok":true},{"t":"De l’endothélium, de l’autre côté de la cornée","pourquoi":"L’endothélium ne se remplace même pas lui-même : ses cellules « Ne se reproduisent pas et sont perdues au long de la vie »."},{"t":"Des vaisseaux sanguins de la cornée","pourquoi":"La cornée n’a pas de vaisseaux; c’est le limbe, à son bord, qui est « Vascularisé »."},{"t":"Des kératocytes du stroma","pourquoi":"Les kératocytes sont les cellules du stroma (D sur A4). L’épithélium est renouvelé à partir du limbe."}],"expl":"Le limbe contient « les cellules souches qui participent au renouvellement de l'épithélium cornéen ».","source":"B2","mod":7,"voir":{"p":"limbe","r":["limbe"]}},{"id":"a7-029","fam":"a7-limbe","kc":"A7.10","k":"qcm","q":"Le limbe est « Vascularisé ». À quoi lui servent ses vaisseaux, selon B2 ?","choix":[{"t":"À la nutrition et à l’immunité","ok":true},{"t":"À rendre la cornée transparente","pourquoi":"La transparence vient de l’ordre du collagène et de la pompe endothéliale; la cornée elle-même n’a pas de vaisseaux."},{"t":"À l’insertion des muscles de l’œil","pourquoi":"Les muscles s’insèrent sur la sclère, qui « fournit des points d'insertion aux muscles oculaires »."},{"t":"À régler l’eau du stroma de la cornée","pourquoi":"C’est l’endothélium qui règle l’hydratation du stroma (A5)."}],"expl":"« Vascularisé, role (sic) de nutrition et immunité » : le limbe nourrit et défend la cornée, qui n’a pas de vaisseaux.","source":"B2","mod":7,"voir":{"p":"limbe","r":["limbe"]}},{"id":"a7-030","fam":"a7-limbe","kc":"A7.11","k":"qcm","q":"Épithélium et endothélium de la cornée : lequel se renouvelle ?","choix":[{"t":"L’épithélium seulement","ok":true},{"t":"Les deux, grâce aux cellules souches du limbe","pourquoi":"Le limbe renouvelle l’épithélium; les cellules endothéliales « Ne se reproduisent pas et sont perdues au long de la vie »."},{"t":"L’endothélium seulement","pourquoi":"C’est l’inverse : l’endothélium n’est jamais remplacé; l’épithélium l’est, par le limbe (B2)."},{"t":"Aucun des deux, une fois adulte","pourquoi":"L’épithélium se renouvelle à partir des cellules souches du limbe (B2)."}],"expl":"Le limbe renouvelle l’épithélium (B2); l’endothélium, « une seule couche de cellules hexagonales », ne se reproduit pas (A16).","source":"A16, B2","mod":7,"voir":{"p":"cornee-couches","r":["A","F"]}},{"id":"a7-031","fam":"a7-limbe","kc":"A7.11","k":"qcm","q":"Chez une personne âgée, les cellules endothéliales qui restent sont de grandeurs variées. Comment appelle-t-on cela ?","choix":[{"t":"Le polymégathisme","ok":true},{"t":"Le pléomorphisme des cellules","pourquoi":"Le pléomorphisme, ce sont des « cellules de formes variées ». La grandeur, c’est le polymégathisme."},{"t":"La régénération endothéliale","pourquoi":"Il n’y a pas de régénération : les cellules qui restent « changent de forme et grandeur »."},{"t":"L’imbibition de la cornée","pourquoi":"L’imbibition, c’est la cornée qui prend l’eau quand la perte est sévère, pas la forme des cellules."}],"expl":"« polymégathisme (cellules de grandeurs variées) et pléomorphisme (cellules de formes variées) parce que les cellules qui restent changent de forme et grandeur ».","source":"A16","mod":7,"voir":{"p":"cornee-couches","r":["F"]}},{"id":"a7-032","fam":"a7-limbe","kc":"A7.11","k":"vf","q":"Les cellules endothéliales perdues avec l’âge sont remplacées par les cellules souches du limbe.","v":false,"expl":"Le limbe ne renouvelle que l’épithélium. Les cellules endothéliales « Ne se reproduisent pas et sont perdues au long de la vie ».","source":"A16, B2","mod":7,"voir":{"p":"cornee-couches","r":["F"]}},{"id":"a7-033","fam":"a7-limbe","kc":"A7.12","k":"qcm","q":"Lequel de ces rôles n’est PAS celui de la sclère ?","choix":[{"t":"Régler l’hydratation de la cornée","ok":true},{"t":"Maintenir la forme du globe","pourquoi":"C’est bien un de ses rôles : elle « contribue à maintenir la forme du globe »."},{"t":"Fournir des points d’insertion aux muscles de l’œil","pourquoi":"C’est bien un de ses rôles : elle « fournit des points d'insertion aux muscles oculaires »."},{"t":"Former la tunique fibreuse, avec la cornée","pourquoi":"C’est vrai : la sclère « fait partie de la tunique fibreuse », avec la cornée."}],"expl":"La sclère est un « tissu fibreux résistant, riche en collagène, qui contribue à maintenir la forme du globe et fournit des points d'insertion aux muscles oculaires ». Régler l’eau de la cornée, c’est l’endothélium.","source":"A5, B5","mod":7,"voir":{"p":"limbe","r":["sclere"]}},{"id":"a7-034","fam":"a7-limbe","kc":"A7.12","k":"qcm","q":"Quelles sont les trois couches de la sclère, selon B6 ?","choix":[{"t":"Épisclère, stroma scléral, lamina fusca","ok":true},{"t":"Épithélium, stroma, endothélium","pourquoi":"Ce sont les trois grandes parties de la cornée (UA1), pas de la sclère."},{"t":"Conjonctive, limbe, choroïde","pourquoi":"Ce sont des structures voisines, pas des couches de la sclère."},{"t":"Épisclère, membrane de Bowman, lamina fusca","pourquoi":"Bowman est une membrane de la cornée (B sur A4), pas de la sclère."}],"expl":"Trois couches : « épisclère », « stroma scléral », « lamina fusca » (B6).","source":"B6","mod":7,"voir":{"p":"limbe","r":["sclere"]}},{"id":"a7-035","fam":"a7-limbe","kc":"A7.13","k":"qcm","q":"Un nourrisson a le blanc des yeux un peu bleuté. Quelle explication donne B7 ?","choix":[{"t":"Sa sclère est plus transparente : on voit la choroïde","ok":true},{"t":"Une collagénose qui amincit sa sclère, une maladie du collagène","pourquoi":"Les collagénoses donnent aussi une sclère bleutée, mais chez le bébé B7 donne une autre raison : sa sclère est « plus transparente »."},{"t":"Des dépôts de lipides","pourquoi":"Les lipides donnent une sclère « Jaunâtre », chez la personne âgée."},{"t":"De l’urée accumulée par les reins","pourquoi":"L’urée donne une sclère « Jaunâtre », pas bleutée."}],"expl":"« Bleutée » « chez les bébé (sic), car elle est plus transparente et on perçoit davantage la choroïde à travers la sclère ».","source":"B7","mod":7,"voir":{"p":"limbe","r":["sclere"]}},{"id":"a7-036","fam":"a7-limbe","kc":"A7.13","k":"qcm","q":"Une dame de 80 ans et un patient atteint d’une maladie des reins ont tous deux la sclère jaunâtre. Est-ce la même cause ?","choix":[{"t":"Non : des lipides chez la dame, de l’urée pour les reins","ok":true},{"t":"Oui : des lipides dans les deux cas","pourquoi":"Dans l’atteinte des reins, c’est par « accumulation d'urée »."},{"t":"Oui : la sclère s’amincit et laisse voir la choroïde","pourquoi":"L’amincissement donne une sclère « Bleutée » (collagénoses); le jaune vient de dépôts."},{"t":"Non : de l’urée chez la dame, des lipides pour les reins","pourquoi":"Inversé : chez la personne âgée, ce sont les lipides (graisses); dans l’atteinte des reins, l’urée."}],"expl":"« Jaunâtre » « chez les personnes âgées à cause de l'accumulation des lipides (graisses) », et « dans les cas d'atteinte des reins, par accumulation d'urée ».","source":"B7","mod":7,"voir":{"p":"limbe","r":["sclere"]}},{"id":"a7-037","fam":"a7-cristallin","kc":"A7.14","k":"qcm","q":"Laquelle n’est PAS une des trois fonctions du cristallin données en C3 ?","choix":[{"t":"Nourrir la cornée, qui n’a pas de vaisseaux","ok":true},{"t":"Le pouvoir réfractif","pourquoi":"C’est la fonction 1 : « 1. Pouvoir réfractif »."},{"t":"Le pouvoir accommodatif en jeunesse","pourquoi":"C’est la fonction 2 : « 2. Pouvoir accommodatif en jeunesse »."},{"t":"L’absorption des UV pour protéger la rétine","pourquoi":"C’est la fonction 3 : « 3. Absorption des rayons UV pour protéger la rétine »."}],"expl":"Nourrir la cornée, c’est le rôle de l’humeur aqueuse (« nourrit les structures avasculaires de l’oeil »). Le cristallin réfracte, accommode en jeunesse et absorbe les UV.","source":"C3; Anatomie 3.1, diapo 10","mod":7,"voir":{"p":"milieux","r":["cristallin"]}},{"id":"a7-038","fam":"a7-cristallin","kc":"A7.14","k":"qcm","q":"Les deux faces du cristallin ont-elles la même courbure ?","choix":[{"t":"Non : 10 mm devant, 6 mm derrière, plus bombé à l’arrière","ok":true},{"t":"Oui : 10 mm des deux côtés, une lentille symétrique","pourquoi":"C’est une « lentille biconvexe asymétrique » : « Rayon de courbure 10mm antérieur et postérieur est 6mm »."},{"t":"Non : 6 mm devant, 10 mm derrière, plus bombé à l’avant","pourquoi":"Rayons inversés : la face arrière est la plus courbée (6 mm)."},{"t":"Non : plat derrière, bombé devant","pourquoi":"Il est biconvexe, bombé des deux côtés : 10 mm devant, 6 mm derrière."}],"expl":"« Rayon de courbure 10mm antérieur et postérieur est 6mm » : une « lentille biconvexe asymétrique ».","source":"C8","mod":7,"voir":{"p":"cristallin-milieu","r":["1"]}},{"id":"a7-039","fam":"a7-cristallin","kc":"A7.14","k":"vf","q":"L’indice de réfraction du cristallin est plus élevé au centre qu’en périphérie.","v":true,"expl":"Son indice n’est pas unique : « 1.38 en périphérie jusqu’à  1.41 au centre ».","source":"C4","mod":7,"voir":{"p":"cristallin-milieu","r":["1"]}},{"id":"a7-040","fam":"a7-cristallin","kc":"A7.15","k":"qcm","q":"Pourquoi le cristallin est-il si bombé, selon C4 ?","choix":[{"t":"Il baigne dans du liquide : son saut d’indice est petit","ok":true},{"t":"Il est mou et se gonfle de l’humeur aqueuse qui l’entoure","pourquoi":"C4 donne une autre raison : « Elle est très bombée parce qu’elle est immersée (sic) dans le liquide »."},{"t":"Il doit être plus puissant que la cornée","pourquoi":"Il ne l’est pas : 18-20 D contre 42 D. Sa courbure compense un petit saut d’indice."},{"t":"Il absorbe les UV","pourquoi":"Il absorbe bien les UV (C12), mais ça n’explique pas sa forme : c’est le liquide autour."}],"expl":"« Elle est très bombée parce qu’elle est immersée (sic) dans le liquide (humeur aqueuse en avant et vitré en arrière) ». Entre deux liquides, seule une forme bombée donne assez de puissance.","source":"C4, C8","mod":7,"voir":{"p":"cristallin-milieu","r":["1"]}},{"id":"a7-041","fam":"a7-cristallin","kc":"A7.15","k":"qcm","q":"Le cristallin est très bombé, des deux côtés, et pourtant moins puissant que la cornée (18-20 D contre 42 D). Pourquoi ?","choix":[{"t":"Dans le liquide, son saut d’indice est petit","ok":true},{"t":"Son indice est plus bas que celui de la cornée","pourquoi":"Son indice est même un peu plus haut (1.38 à 1.41). C’est le liquide autour qui réduit le saut."},{"t":"Il est plus petit que la cornée","pourquoi":"La taille n’est pas en cause : la puissance d’une surface dépend du saut d’indice et de sa courbure."},{"t":"Il perd sa puissance en absorbant les UV","pourquoi":"Absorber les UV ne change pas la puissance; c’est le petit saut d’indice avec le liquide."}],"expl":"La cornée touche l’air (« Différence de 0.376 »); le cristallin est « immersée (sic) dans le liquide », où le saut d’indice est petit. Même bombé, il fait moins.","source":"A8, C4","mod":7,"voir":{"p":"cristallin-milieu","r":["1"]}},{"id":"a7-042","fam":"a7-cristallin","kc":"A7.15","k":"vf","q":"Sorti de l’œil et placé dans l’air, le même cristallin serait beaucoup plus puissant.","v":true,"expl":"Même principe que la cornée : dans l’air, le saut d’indice est grand, donc la puissance aussi. C’est parce qu’il est « immersée (sic) dans le liquide » qu’il doit être si bombé (lien déduit des diapos).","source":"A8, C4","mod":7,"voir":{"p":"cristallin-milieu","r":["2"]}},{"id":"a7-043","fam":"a7-cristallin","kc":"A7.16","k":"ordre","q":"Remets dans l’ordre ce qui se passe quand un jeune œil regarde un objet de près.","etapes":["Le muscle ciliaire se contracte","Les zonules se relâchent","Le cristallin s’arrondit, ses fibres glissent","Sa puissance monte, de 18-20 D vers 30 D"],"expl":"UA1 : le muscle ciliaire « contracte », les zonules « relaxent », le cristallin « va arrondir ». La puissance « peut augmenter à 30D chez un jeune œil qui accommode sur un objet rapproché ».","source":"C4, C9; Anatomie 3.2, diapo 5","mod":7,"voir":{"p":"accommodation","r":["2"]}},{"id":"a7-044","fam":"a7-cristallin","kc":"A7.16","k":"qcm","q":"Qu’est-ce qui permet au cristallin de se déformer quand il accommode, selon C9 ?","choix":[{"t":"Ses fibres corticales glissent les unes sur les autres","ok":true},{"t":"Sa capsule se durcit","pourquoi":"C’est l’inverse : la capsule qui « perd sa souplesse au fil du temps » explique la presbytie."},{"t":"Ses vaisseaux se remplissent de sang","pourquoi":"Le cristallin n’a pas de vaisseaux : l’humeur aqueuse le nourrit (UA1)."},{"t":"Le vitré, derrière lui, le pousse vers l’avant pour le bomber","pourquoi":"C9 l’explique par les fibres : elles « peuvent glisser les unes par rapport aux autres »."}],"expl":"« Elles peuvent glisser les unes par rapport aux autres, ce qui est utile au cours de l’accommodation pour permettre au cristallin de se déformer. »","source":"C9","mod":7,"voir":{"p":"accommodation","r":["2"]}},{"id":"a7-045","fam":"a7-cristallin","kc":"A7.16","k":"vf","q":"Pour voir de près, les zonules se tendent et tirent sur le cristallin pour l’arrondir.","v":false,"expl":"De près, le muscle ciliaire « contracte », les zonules « relaxent » et le cristallin « va arrondir » (UA1, Anatomie 3.2).","source":"Anatomie 3.2, diapo 5","mod":7,"voir":{"p":"accommodation","r":["2"]}},{"id":"a7-046","fam":"a7-cristallin","kc":"A7.19","k":"qcm","q":"Un rayon UVA de 350 nm entre dans l’œil. Où s’arrête-t-il ?","choix":[{"t":"Au cristallin","ok":true},{"t":"À la cornée, qui arrête tous les UV","pourquoi":"La cornée n’arrête que 280-320 nm (« UVB 280-320 »). À 350 nm, il la traverse."},{"t":"Jusqu’à la rétine","pourquoi":"Seul le visible (« VISIBLE 400 ») atteint la rétine; le cristallin arrête les « UVA 320-400 »."},{"t":"Dans le vitré, derrière","pourquoi":"C12 ne nomme que deux filtres : « Cornée 280-320nm, Cristallin 320-400 »."}],"expl":"« Cornée 280-320nm, Cristallin 320-400 » : à 350 nm, le rayon traverse la cornée et s’arrête au cristallin.","source":"C12","mod":7,"voir":{"p":"uv","r":["2"]}},{"id":"a7-047","fam":"a7-cristallin","kc":"A7.19","k":"vf","q":"La lumière visible traverse la cornée et le cristallin jusqu’à la rétine, alors que les UV sont arrêtés en chemin.","v":true,"expl":"« La lentille transmet la lumière visible et absorbe la lumière UV ». Sur C12 : « UVB 280-320 » à la cornée, « UVA 320-400 » au cristallin, « VISIBLE 400 » jusqu’à la rétine.","source":"C4, C12","mod":7,"voir":{"p":"uv","r":["3"]}},{"id":"a7-048","fam":"a7-fibres","kc":"A7.17","k":"qcm","q":"Sur le dessin CD, que désigne la lettre E ?","choix":[{"t":"La zone équatoriale, où les cellules deviennent des fibres","ok":true},{"t":"La membrane de Descemet, la même lettre que sur le dessin A4","pourquoi":"Même lettre, autre dessin : sur A4, E est Descemet; sur CD, E est la zone équatoriale."},{"t":"Le cortex, sous la capsule","pourquoi":"Le cortex porte la lettre C : « C=cortex (fibres plus récentes) ». E marque les deux pointes, l’équateur."},{"t":"Le noyau le plus vieux, au centre","pourquoi":"Les noyaux sont N1 à N3, N1 au centre. E est aux deux pointes, l’équateur."}],"expl":"« E=zone équatorial (sic) (ou (sic) les cellules transitionnent en fibres du cristallin) ».","source":"C10, CD","mod":7,"voir":{"p":"cristallin-coupe","r":["E"]}},{"id":"a7-049","fam":"a7-fibres","kc":"A7.17","k":"qcm","q":"Sur le dessin CD, P est la capsule postérieure. Quel est son rôle, selon C10 ?","choix":[{"t":"Une barrière anatomique entre le cristallin et le vitré","ok":true},{"t":"Créer les nouvelles cellules du cristallin","pourquoi":"C’est A : « A=capsule antérieure (création de nouvelles cellules) »."},{"t":"Contenir les fibres les plus récentes","pourquoi":"Les plus récentes sont dans le cortex : « C=cortex (fibres plus récentes) »."},{"t":"Recevoir l’insertion des fibres de la zonule","pourquoi":"La zonule s’insère vers l’équateur, où la capsule est « plus épaisse » (C6)."}],"expl":"« P=capsule postérieure qui crée une barrière anatomique entre l’humeur aqueuse/cristallin et le vitré ».","source":"C10, CD","mod":7,"voir":{"p":"cristallin-coupe","r":["P"]}},{"id":"a7-050","fam":"a7-fibres","kc":"A7.17","k":"ordre","q":"Sur le dessin CD, remets les parties dans l’ordre, du bord (sous la capsule) vers le centre.","etapes":["C (cortex)","N3","N2","N1"],"expl":"« C=cortex (fibres plus récentes) », puis les noyaux N3, N2 et N1 : « N1-N3=noyaux (vieux fibres (sic) au centre N1) ».","source":"C10, CD","mod":7,"voir":{"p":"cristallin-coupe","r":["C","N3","N2","N1"]}},{"id":"a7-051","fam":"a7-fibres","kc":"A7.17","k":"vf","q":"En s’ajoutant, les nouvelles fibres du cristallin rejoignent celles de l’autre direction et forment des sutures en forme de Y.","v":true,"expl":"« A mesure que les nouvelles fibres s’ajoutent, elles vont rejoindre des fibres de l’autre direction ce qui donne une souture (sic) en forme de Y. »","source":"C11","mod":7,"voir":{"p":"cristallin-coupe"}},{"id":"a7-052","fam":"a7-fibres","kc":"A7.18","k":"qcm","q":"Où se trouvent les fibres les plus vieilles du cristallin ?","choix":[{"t":"Au centre, dans le noyau (N1)","ok":true},{"t":"En périphérie, dans le cortex (C)","pourquoi":"Le cortex contient les « fibres plus récentes ». Les plus vieilles sont au centre."},{"t":"À l’équateur (E), aux deux pointes","pourquoi":"À l’équateur, les cellules deviennent tout juste des fibres. Les vieilles sont au centre, en N1."},{"t":"Contre la capsule postérieure (P)","pourquoi":"P est une barrière vers le vitré. Les vieilles fibres sont au centre, en N1."}],"expl":"Le cristallin grandit par couches : « N1-N3=noyaux (vieux fibres (sic) au centre N1) ».","source":"C10","mod":7,"voir":{"p":"cristallin-coupe","r":["N1"]}},{"id":"a7-053","fam":"a7-fibres","kc":"A7.18","k":"ordre","q":"Remets dans l’ordre la vie d’une fibre du cristallin, de sa naissance à sa place finale.","etapes":["Une cellule naît sous la capsule antérieure (A)","Elle devient une fibre à l’équateur (E)","Elle fait partie du cortex, avec les fibres récentes (C)","D’autres fibres la recouvrent : elle finit vers le centre, dans le noyau"],"expl":"C10 : A crée les cellules, E les change en fibres, C garde les « fibres plus récentes », et les plus vieilles sont « au centre N1 ».","source":"C10, C11","mod":7,"voir":{"p":"cristallin-coupe","r":["A","E","C","N1"]}},{"id":"a7-054","fam":"a7-vitre","kc":"A7.20","k":"qcm","q":"De quoi est fait le vitré ?","choix":[{"t":"D’eau à 99 %, avec collagène et acide hyaluronique : un gel","ok":true},{"t":"D’un liquide qui coule comme de l’eau","pourquoi":"Le vitré est un gel; il ne devient « plus liquide » qu’avec l’âge (D4)."},{"t":"De fibres hexagonales qui glissent, comme le cristallin","pourquoi":"Les fibres hexagonales sont celles du cristallin (C9). Le vitré est un gel d’eau, de collagène et d’acide hyaluronique."},{"t":"De collagène en lamelles croisées, comme le stroma de la cornée","pourquoi":"Le collagène croisé, c’est le stroma de la cornée (A14). Le vitré est fait à « 99% eau »."}],"expl":"« Le vitré est composé de 99% eau avec collagène et acide hyaluronique pour en faire un gel. »","source":"D3","mod":7,"voir":{"p":"vitre","r":["1"]}},{"id":"a7-055","fam":"a7-vitre","kc":"A7.20","k":"qcm","q":"Lequel n’est PAS un rôle du vitré, selon D3 et D5 ?","choix":[{"t":"Donner les 2/3 de la puissance de l’œil","ok":true},{"t":"Transmettre la lumière","pourquoi":"C’en est un : « Le rôle du vitré est de transmettre la lumière »."},{"t":"Absorber les chocs et protéger la rétine","pourquoi":"C’en est un : « absorber les choques (sic) et protéger la rétine »."},{"t":"Entreposer des métabolites pour le cristallin et la rétine","pourquoi":"C’en est un : « entreposer des métabolites pour la lentille et la rétine »."}],"expl":"Les 2/3 de la puissance, c’est la cornée (A8). Le vitré transmet la lumière, entrepose des métabolites, absorbe les chocs, protège la rétine, et aide à « maintenir la forme de l’œil ».","source":"A8, D3, D5","mod":7,"voir":{"p":"vitre","r":["1"]}},{"id":"a7-056","fam":"a7-vitre","kc":"A7.20","k":"num","q":"Le vitré occupe quelle part du volume de l’œil, en pourcentage ?","rep":{"v":80,"tol":1,"u":"%","dec":0},"pieges":[{"v":99,"m":"99 %, c’est la part d’eau dans le vitré. Sa part du volume de l’œil : 80 %."},{"v":50,"m":"50 %, c’est la part des gens de 50 ans dont le vitré est déjà séparé de la rétine (D5). Le volume : 80 %."}],"expl":"« Le vitré est la structure la plus grande dans l’oeil avec un volume d’environ 4,4ml et occupe 80% du volume de l’œil. »","source":"D3","mod":7,"voir":{"p":"vitre","r":["1"]}},{"id":"a7-057","fam":"a7-vitre","kc":"A7.21","k":"ordre","q":"Remets dans l’ordre ce qui peut arriver au vitré avec l’âge.","etapes":["Le vitré devient plus liquide","Il se retire de la rétine : décollement du vitré postérieur","Des éclairs et des corps flottants peuvent apparaître","Parfois, s’il adhère à la rétine, un décollement de rétine"],"expl":"« Quand le vitré devient plus liquide avec l’âge, il peut se retirer de la rétine. » Il peut en résulter des éclairs, des corps flottants et « parfois » un décollement de rétine, s’il y a un point d’adhérence (D10).","source":"D4, D5, D10","mod":7,"voir":{"p":"vitre","r":["2"]}},{"id":"a7-058","fam":"a7-vitre","kc":"A7.21","k":"qcm","q":"Un patient de 55 ans a un décollement du vitré postérieur. Va-t-il forcément avoir un décollement de rétine ?","choix":[{"t":"Non, rarement : seulement s’il y a un point d’adhérence","ok":true},{"t":"Oui : c’est exactement la même chose qu’un décollement de rétine","pourquoi":"Ce sont deux choses : le vitré qui se retire est « habituellement sans conséquence »."},{"t":"Oui, dans l’année qui suit","pourquoi":"D10 dit « Raement (sic) », et seulement s’il y a un point d’adhérence."},{"t":"Non, jamais : le vitré ne touche pas la rétine","pourquoi":"Le vitré est contre la rétine; s’il y adhère en un point, le décollement de rétine devient possible (D10)."}],"expl":"« Raement (sic) un décollement du vitré mène à un décollement de rétine s’il ya (sic) un point d’adhérence entre le vitré et la rétine. »","source":"D4, D10","mod":7,"voir":{"p":"vitre","r":["3"]}},{"id":"a7-059","fam":"a7-vitre","kc":"A7.21","k":"vf","q":"Les corps flottants sont dans le vitré, même si on a l’impression qu’ils sont à l’avant de l’œil.","v":true,"expl":"« Même si on a l’impression qu’ils sont sur la partie antérieure de l’œil, ils flottent en réalité dans le vitré et sont perçus comme des ombres par la rétine. »","source":"D5","mod":7,"voir":{"p":"vitre","r":["2"]}},{"id":"a7-060","fam":"a7-age","kc":"A7.22","k":"qcm","q":"Quelle association entre un milieu et son changement avec l’âge est juste ?","choix":[{"t":"Vitré : il devient plus liquide et peut se décoller","ok":true},{"t":"Cornée : elle jaunit par les lipides","pourquoi":"Les lipides jaunissent la sclère (« Jaunâtre »). La cornée, elle, perd ses cellules endothéliales."},{"t":"Cristallin : il se liquéfie","pourquoi":"Le cristallin durcit et jaunit; c’est le vitré qui devient « plus liquide »."},{"t":"Sclère : elle s’imbibe d’eau","pourquoi":"C’est la cornée qui s’imbibe d’eau quand la perte endothéliale est sévère (A16)."}],"expl":"Cornée imbibée si la perte est sévère (A16), sclère « Jaunâtre » (B7), cristallin qui « commence à durcir » (C13), vitré « plus liquide » (D4).","source":"A16, B7, C13, D4","mod":7,"voir":{"p":"milieux","r":["vitre"]}},{"id":"a7-061","fam":"a7-age","kc":"A7.22","k":"qcm","q":"Activité, ligne 4 : quel changement avec l’âge écris-tu pour la cornée ?","choix":[{"t":"Elle perd des cellules endothéliales et peut s’imbiber d’eau","ok":true},{"t":"Elle devient plus liquide et se décolle","pourquoi":"C’est le vitré (D4)."},{"t":"Elle devient plus jaune et agit comme un filtre pour la lumière","pourquoi":"C’est le cristallin : « Le cristallin devient moins claire (sic) et plus jaune avec l’âge. »"},{"t":"Elle devient plus sensible","pourquoi":"C’est l’inverse : « la cornée devient moins sensible avec l’âge »."}],"expl":"« on perd de nos cellules endothéliales graduellement et elles ne sont pas remplacées »; si c’est sévère, la cornée est imbibée d’eau (A16). Elle devient aussi moins sensible (A11).","source":"A11, A16; ACT","mod":7,"voir":{"p":"milieux","r":["cornee"]}},{"id":"a7-062","fam":"a7-age","kc":"A7.22","k":"vf","q":"Avec l’âge, le cristallin commence à durcir, et il devient moins clair et plus jaune.","v":true,"expl":"Le cristallin « commence à durcir et opacifier avec l’âge », et il « devient moins claire (sic) et plus jaune avec l’âge ».","source":"C13","mod":7,"voir":{"p":"milieux","r":["cristallin"]}},{"id":"a7-063","fam":"a7-age","kc":"A7.23","k":"qcm","q":"Une cliente de 48 ans ne voit plus bien de près, mais de loin c’est clair. Presbytie ou cataracte, et pourquoi ?","choix":[{"t":"Presbytie : son cristallin est moins souple","ok":true},{"t":"Cataracte : son cristallin s’opacifie","pourquoi":"La cataracte brouille aussi le loin (« vision embrouillée », C16). Ici, le loin est clair."},{"t":"Presbytie : son muscle ciliaire s’affaiblit","pourquoi":"C13 le nie : « ce n’est pas du (sic) à a (sic) un changement du muscle ciliaire »."},{"t":"Cataracte : son vitré se liquéfie","pourquoi":"Le vitré liquéfié donne des corps flottants (D4); la cataracte est dans le cristallin."}],"expl":"« L’œil ne devient pas faible, il devient moins flexible. » La presbytie est une perte de souplesse : le près devient difficile, le loin reste clair.","source":"C6, C13","mod":7,"voir":{"p":"accommodation","r":["2"]}},{"id":"a7-064","fam":"a7-age","kc":"A7.23","k":"qcm","q":"Un monsieur de 75 ans voit de plus en plus flou et terne, de loin comme de près. Quelle est la cause la plus probable ?","choix":[{"t":"Une cataracte : le cristallin s’opacifie","ok":true},{"t":"Une presbytie : le cristallin a durci","pourquoi":"La presbytie touche le près. Ici tout est flou et terne : c’est une perte de clarté, pas de souplesse."},{"t":"Un décollement du vitré postérieur","pourquoi":"Il donne des éclairs et des corps flottants (D4), pas une vision de plus en plus floue et terne."}],"expl":"« Les rayons lumineux se dispersent en raison du cristallin opacifié et entraînent une vision embrouillée »; la cataracte est « Souvent problématique vers les 70-80 ans ».","source":"C13, C15, C16","mod":7,"voir":{"p":"milieux","r":["cristallin"]}},{"id":"a7-065","fam":"a7-age","kc":"A7.23","k":"vf","q":"La presbytie vient d’un muscle ciliaire qui s’affaiblit avec l’âge.","v":false,"expl":"« ce n’est pas du (sic) à a (sic) un changement du muscle ciliaire ». « L’œil ne devient pas faible, il devient moins flexible. »","source":"C13","mod":7,"voir":{"p":"accommodation","r":["2"]}},{"id":"a8-001","fam":"a8-carte","kc":"A8.1","k":"qcm","q":"Selon la prof, l’information lumineuse de la rétine peut produire trois réponses. Lesquelles ?","choix":[{"t":"Voir, modifier la pupille, synchroniser l’horloge biologique.","ok":true},{"t":"Voir, faire larmoyer l’œil, synchroniser l’horloge biologique.","pourquoi":"Le larmoiement part de la cornée, pas de la rétine : « C'est la cornée qui recoit le stimulus et non la rétine »."},{"t":"Voir les couleurs, voir dans le noir, voir les formes des objets.","pourquoi":"Ce sont trois façons de voir : une seule sortie. Les deux autres ne font pas d’image : la pupille et l’horloge."},{"t":"Voir, faire accommoder le cristallin, bouger les deux yeux.","pourquoi":"Ni l’accommodation ni les mouvements des yeux ne sont dans les trois réponses de 8A1 : la pupille et l’horloge biologique y sont."}],"expl":"« L'information lumineuse peut produire différentes réponses : voir, modifier le diamètre pupillaire et synchroniser l'horloge biologique. »","source":"8A1","mod":8,"voir":{"p":"trois-sorties"}},{"id":"a8-002","fam":"a8-carte","kc":"A8.1","k":"qcm","q":"Laquelle de ces réponses passe par une voie non-visuelle ?","choix":[{"t":"Ta pupille qui rétrécit au soleil.","ok":true},{"t":"Reconnaître un visage dans la foule.","pourquoi":"C’est voir, donc faire une image. Les voies visuelles servent « à créer des images »."},{"t":"Lire une petite annonce en couleurs.","pourquoi":"Lire, c’est faire une image au cortex : voie visuelle. Les voies non-visuelles règlent la pupille et l’horloge."},{"t":"Voir une balle arriver vers toi.","pourquoi":"C’est encore une image, donc une voie visuelle."}],"expl":"Les voies non-visuelles vont « à d’autres centres au cerveau qui contrôlent la grandeur des pupilles et qui gèrent le rythme circadien ».","source":"8C1","mod":8,"voir":{"p":"trois-sorties","r":["pupille"]}},{"id":"a8-003","fam":"a8-carte","kc":"A8.28","k":"qcm","q":"Une entrée, trois sorties. Laquelle de ces suites sortie → stations est juste ?","choix":[{"t":"Horloge → noyau supra-chiasmatique → glande pinéale","ok":true},{"t":"Voir → noyau supra-chiasmatique → cortex occipital","pourquoi":"Le noyau supra-chiasmatique est l’horloge. Pour voir : tractus, CGL, puis cortex occipital."},{"t":"Pupille → CGL du thalamus → cortex occipital","pourquoi":"Le CGL mène au cortex : c’est la voie visuelle. La pupille passe par un centre réflexe, puis le nerf III."},{"t":"Horloge → nerf III → glande pinéale","pourquoi":"Le nerf III est la sortie du réflexe de la pupille, vers le sphincter de l’iris."}],"expl":"Voir → CGL → cortex occipital; pupille → centre réflexe → nerf III → sphincter; horloge → « Noyau supra-chiasmatique » → « Glande pinéale ».","source":"8A1, 8B3, 8C6, 8SEQ","mod":8,"voir":{"p":"trois-sorties","r":["horloge"]}},{"id":"a8-004","fam":"a8-photo","kc":"A8.2","k":"qcm","q":"Où se fait la phototransduction ?","choix":[{"t":"Dans les disques des photorécepteurs.","ok":true},{"t":"Dans les cellules ganglionnaires.","pourquoi":"Les ganglionnaires reçoivent l’information déjà transformée : elle leur est « acheminée »."},{"t":"Dans le nerf optique, en sortant de l’œil.","pourquoi":"Le nerf optique transporte un signal déjà électrique. La lumière devient signal « au niveau des disques dans les photorécepteurs »."},{"t":"Dans la cornée et le cristallin.","pourquoi":"La lumière les traverse seulement : « La lumière passe à travers la cornée et le cristallin »."}],"expl":"La phototransduction, c’est « la transformation de la lumière en impulsions électriques au niveau des disques dans les photorécepteurs ».","source":"8A3","mod":8,"voir":{"p":"photorecepteur","r":["A"]}},{"id":"a8-005","fam":"a8-photo","kc":"A8.2","k":"qcm","q":"La phototransduction est une réaction biochimique. Quelle molécule y participe, selon la prof ?","choix":[{"t":"Le rétinal, un dérivé de la vitamine A.","ok":true},{"t":"La mélanopsine, activée par le bleu.","pourquoi":"La mélanopsine est dans la voie de l’horloge (8C2). Pour la phototransduction, la diapo nomme le rétinal."},{"t":"La mélatonine, l’hormone du sommeil.","pourquoi":"La mélatonine vient de la glande pinéale, pas des photorécepteurs."},{"t":"Un pigment produit par la cornée, devant l’œil.","pourquoi":"La cornée laisse passer la lumière; la réaction se fait dans les disques des photorécepteurs, avec le rétinal."}],"expl":"« Réaction biochimique impliquant un dérivé de la vitamine A (rétinal) ». Elle se fait dans les disques des photorécepteurs.","source":"8A3","mod":8,"voir":{"p":"photorecepteur","r":["A"]}},{"id":"a8-006","fam":"a8-photo","kc":"A8.3","k":"qcm","q":"Tu lis une petite annonce en couleurs, en plein jour. Quels photorécepteurs travaillent surtout ?","choix":[{"t":"Les cônes.","ok":true},{"t":"Les bâtonnets.","pourquoi":"Les bâtonnets servent à « la lumière moins intense ». Couleurs et détails fins en plein jour : les cônes."},{"t":"Les cellules ganglionnaires.","pourquoi":"Elles reçoivent l’information déjà transformée. Ceux qui captent la lumière sont les photorécepteurs : « Les photorécepteurs sont les cônes » et les bâtonnets."},{"t":"Les cellules bipolaires.","pourquoi":"Elles modifient l’information qui sort des photorécepteurs; elles ne captent pas la lumière."}],"expl":"Les cônes servent à la « vision des couleurs et la vision centrale fine », et il leur faut une « lumière intense (beaucoup de photons) ».","source":"8A2, 8A5","mod":8,"voir":{"p":"photorecepteur","r":["G"]}},{"id":"a8-007","fam":"a8-photo","kc":"A8.3","k":"qcm","q":"Tu marches dans une pièce presque noire. Quel photorécepteur te permet de te diriger ?","choix":[{"t":"Le bâtonnet, activé par très peu de lumière.","ok":true},{"t":"Le cône, parce qu’il voit mieux partout.","pourquoi":"Les cônes ont besoin de « lumière intense (beaucoup de photons) »."},{"t":"Le cône S, fait pour les petites lumières.","pourquoi":"S, M et L sont trois sortes de cônes, pas des tailles; et les cônes veulent beaucoup de lumière."},{"t":"Aucun : dans le noir, la rétine ne capte plus rien du tout.","pourquoi":"Les bâtonnets « peuvent être activés par très peu de lumière »."}],"expl":"« Les bâtonnets peuvent être activés par très peu de lumière, mais les cônes ont besoin de lumière intense (beaucoup de photons) pour être activés. »","source":"8A2, 8A5","mod":8,"voir":{"p":"photorecepteur","r":["H"]}},{"id":"a8-008","fam":"a8-photo","kc":"A8.3","k":"vf","q":"Dans « S, M et L », les trois lettres désignent trois tailles de cônes.","v":false,"expl":"Ce sont trois sortes de cônes, pour la « vision des couleurs et la vision centrale fine ». La diapo ne parle pas de taille.","source":"8A2","mod":8,"voir":{"p":"photorecepteur","r":["G"]}},{"id":"a8-009","fam":"a8-photo","kc":"A8.4","k":"qcm","q":"Sur le schéma d’un cône et d’un bâtonnet (8A4), où sont les disques ?","choix":[{"t":"Dans le segment externe.","ok":true},{"t":"Dans le segment interne, avec le noyau.","pourquoi":"Le segment interne porte le noyau et les mitochondries; les disques sont dans le « Segment externe »."},{"t":"Dans les terminaisons synaptiques.","pourquoi":"Les terminaisons sont à l’autre bout du photorécepteur. Les disques sont dans le segment externe."},{"t":"Dans le noyau de la cellule.","pourquoi":"Le noyau est dans le segment interne, pas avec les disques."}],"expl":"Les disques sont dans le « Segment externe »; le noyau et les mitochondries, dans le « Segment interne ». C’est dans les disques que la lumière devient signal.","source":"8A4","mod":8,"voir":{"p":"photorecepteur","r":["A","E"]}},{"id":"a8-010","fam":"a8-couches","kc":"A8.5","k":"qcm","q":"La lumière entre dans l’œil et traverse la rétine. Quelles cellules atteint-elle en dernier, juste avant l’épithélium ?","choix":[{"t":"Les photorécepteurs.","ok":true},{"t":"Les cellules ganglionnaires.","pourquoi":"Elles sont du côté de la lumière : elle les traverse avant les autres."},{"t":"Les fibres nerveuses de la rétine.","pourquoi":"Les fibres sont la première couche du côté de la lumière (N sur F1)."},{"t":"Les cellules bipolaires.","pourquoi":"Elles sont au milieu : la lumière les traverse avant d’atteindre les photorécepteurs."}],"expl":"Sur les figures de 8A5 et 8B3, la lumière traverse les couches et atteint les photorécepteurs en dernier. Derrière eux, les cellules épithéliales absorbent le reste.","source":"8A5, 8B3, 8F1","mod":8,"voir":{"p":"retine-coupe","r":["P"]}},{"id":"a8-011","fam":"a8-couches","kc":"A8.5","k":"ordre","q":"Remets les couches de la rétine dans l’ordre, du côté de la lumière vers le fond (feuille F1).","etapes":["N · fibres nerveuses","G · cellules ganglionnaires","Cellules bipolaires (au milieu)","P · photorécepteurs (cônes, bâtonnets)","E · épithélium pigmentaire"],"expl":"Même ordre sur F1 et sur le médaillon de 8B3 : la lumière traverse N, G et les bipolaires avant d’atteindre P. L’épithélium est derrière les photorécepteurs.","source":"8F1, 8B3, 8A5","mod":8,"voir":{"p":"retine-coupe"}},{"id":"a8-012","fam":"a8-couches","kc":"A8.5","k":"vf","q":"Derrière les photorécepteurs, l’épithélium absorbe la plupart de la lumière que les cônes et les bâtonnets n’ont pas captée.","v":true,"expl":"« La plupart de la lumière qui n'est pas absorbée par les bâtonnets et les cônes est absorbée par les cellules épithéliales qui se trouvent derrière eux. »","source":"8A5","mod":8,"voir":{"p":"retine-coupe","r":["E"]}},{"id":"a8-013","fam":"a8-couches","kc":"A8.6","k":"ordre","q":"Remets dans l’ordre le parcours de la lumière, puis du signal (figure de 8A5).","etapes":["La lumière passe à travers la cornée et le cristallin","Elle active les disques des photorécepteurs","Le signal passe aux cellules bipolaires","Il arrive aux cellules ganglionnaires et longe leurs fibres","Il quitte l’œil par le nerf optique"],"expl":"À partir des disques, ce n’est plus de la lumière : un signal électrique repart en sens inverse. « Cette information est modifiée par les cellules bipolaires et acheminée aux cellules ganglionnaires ».","source":"8A3, 8A5, 8B1","mod":8,"voir":{"p":"retine-coupe"}},{"id":"a8-014","fam":"a8-couches","kc":"A8.6","k":"qcm","q":"Un ami dit que la lumière voyage dans le nerf optique jusqu’au cerveau. Que lui réponds-tu ?","choix":[{"t":"Elle s’arrête aux photorécepteurs; c’est un signal électrique qui voyage.","ok":true},{"t":"Il a raison : la lumière suit les fibres jusqu’au cortex.","pourquoi":"La lumière s’arrête aux photorécepteurs. « Le langage du cerveau est impulsions électriques et non lumière »."},{"t":"Il a raison, mais seulement jusqu’au chiasma.","pourquoi":"Dès les disques, la lumière est devenue un signal électrique : rien de lumineux ne passe dans le nerf."},{"t":"La lumière s’arrête au cristallin, avant même d’atteindre la rétine.","pourquoi":"Elle traverse le cristallin et « atteint la rétine et ses millions de bâtonnets et cônes »."}],"expl":"« Le langage du cerveau est impulsions électriques et non lumière ». Le titre « Parcours de la lumière » (8A5) est un raccourci : après les photorécepteurs, c’est un signal.","source":"8A3, 8A5","mod":8,"voir":{"p":"retine-coupe","r":["P","N"]}},{"id":"a8-015","fam":"a8-couches","kc":"A8.6","k":"qcm","q":"Dans la rétine, que font les cellules bipolaires ?","choix":[{"t":"Elles modifient l’information et la passent aux ganglionnaires.","ok":true},{"t":"Elles captent la lumière, comme les cônes.","pourquoi":"Ce sont les photorécepteurs qui captent la lumière, dans leurs disques."},{"t":"Elles absorbent la lumière que les photorécepteurs n’ont pas captée.","pourquoi":"C’est le rôle des cellules épithéliales, derrière les photorécepteurs."},{"t":"Elles forment le nerf optique, au disque optique de la rétine.","pourquoi":"Le signal sort de l’œil par les fibres des cellules ganglionnaires."}],"expl":"« Cette information est modifiée par les cellules bipolaires et acheminée aux cellules ganglionnaires ».","source":"8A3","mod":8,"voir":{"p":"retine-coupe","r":["?"]}},{"id":"a8-016","fam":"a8-disque","kc":"A8.7","k":"qcm","q":"Sur la feuille F2, le vitré est en haut. Que désignent A, B et C, de haut en bas ?","choix":[{"t":"Rétine, choroïde, sclère.","ok":true},{"t":"Sclère, choroïde, rétine.","pourquoi":"Ordre inversé : le « Vitré » est en haut de la feuille, donc l’intérieur de l’œil. La rétine touche le vitré."},{"t":"Rétine, sclère, choroïde.","pourquoi":"La choroïde est entre la rétine et la sclère : A « Rétine », B « Choroïde », C « sclère »."},{"t":"Choroïde, rétine, sclère.","pourquoi":"La rétine est la couche du dedans, juste sous le vitré."}],"expl":"F2 : « Vitré », puis A « Rétine », B « Choroïde », C « sclère ». Les fibres nerveuses (N) longent la rétine et plongent dans le nerf.","source":"8F2","mod":8,"voir":{"p":"disque-optique","r":["A","B","C"]}},{"id":"a8-017","fam":"a8-disque","kc":"A8.7","k":"vf","q":"Le nerf optique est le nerf crânien II; il transmet l’information de la rétine vers le cerveau.","v":true,"expl":"« Nerf crânien II: nerf optique » (M6). Il « transmet cette information vers le cerveau » (8A1).","source":"8A1; M6 A12","mod":8,"voir":{"p":"disque-optique","r":["N"]}},{"id":"a8-018","fam":"a8-disque","kc":"A8.30pa","k":"qcm","q":"Pourquoi a-t-on un point aveugle ?","choix":[{"t":"Au disque optique, les fibres sortent et il n’y a pas de photorécepteurs.","ok":true},{"t":"La macula y absorbe toute la lumière.","pourquoi":"La macula est le centre de la rétine, pour la vision centrale. Le point aveugle est au nerf optique."},{"t":"C’est le signe d’une maladie de la rétine.","pourquoi":"C’est normal : « Absence de photorécepteurs au niveau du nerf optique »."},{"t":"Le vitré y bloque la lumière avant qu’elle arrive à la rétine.","pourquoi":"Le vitré laisse passer la lumière. Ce qui manque au disque, ce sont les photorécepteurs."}],"expl":"Au disque optique, les fibres plongent dans le nerf et les rangées de la rétine s’arrêtent (F2). « Absence de photorécepteurs au niveau du nerf optique » : c’est le point aveugle (Anatomie 4.2).","source":"8F2; Anatomie 4.2, d6, d7","mod":8,"voir":{"p":"fond-oeil","r":["papille"]}},{"id":"a8-019","fam":"a8-disque","kc":"A8.30pa","k":"vf","q":"Le disque optique de la feuille F2 et la papille du fond d’œil sont le même endroit, vu de côté et vu de face.","v":true,"expl":"Un seul endroit, deux vues : de côté sur F2, de face au fond d’œil. « Papille: vue de face du nerf optique » (Anatomie 4.2).","source":"8F2; Anatomie 4.2, d3","mod":8,"voir":{"p":"fond-oeil","r":["papille"]}},{"id":"a8-020","fam":"a8-trajet","kc":"A8.8","k":"ordre","q":"Remets dans l’ordre les stations de la voie visuelle, de l’œil au cortex.","etapes":["Rétine","Nerf optique","Chiasma optique","Tractus optique","CGL du thalamus","Cortex visuel (lobe occipital)"],"expl":"Figures de 8B3 et 8B4 : « Nerf optique », « Chiasma optique », « Tractus optique », « CGL du thalamus », puis le cortex, « en arrière du cerveau dans le lobe occipital ».","source":"8B3, 8B4, 8B8","mod":8,"voir":{"p":"voies-visuelles"}},{"id":"a8-021","fam":"a8-trajet","kc":"A8.8","k":"qcm","q":"Où se trouve le cortex visuel ?","choix":[{"t":"Dans le lobe occipital.","ok":true},{"t":"À l’avant du cerveau, juste derrière les yeux.","pourquoi":"C’est la méprise classique : le cortex visuel est « en arrière du cerveau dans le lobe occipital »."},{"t":"Au chiasma, là où les fibres croisent.","pourquoi":"Le chiasma est une station du trajet, bien avant le cortex."},{"t":"Dans le thalamus, au CGL.","pourquoi":"Le CGL est un relais avant le cortex, pas le cortex lui-même."}],"expl":"« Situé en arrière du cerveau dans le lobe occipital ou (sic) l’information est reçue. » (8B8)","source":"8B8, 8B9","mod":8,"voir":{"p":"voies-visuelles","r":["5"]}},{"id":"a8-022","fam":"a8-trajet","kc":"A8.8","k":"vf","q":"Sur la voie visuelle, le chiasma optique vient après le CGL du thalamus.","v":false,"expl":"Le chiasma vient juste après les nerfs optiques. Puis le tractus optique, le CGL et le cortex occipital.","source":"8B3, 8B4","mod":8,"voir":{"p":"voies-visuelles","r":["2","4"]}},{"id":"a8-023","fam":"a8-trajet","kc":"A8.12","k":"qcm","q":"À quoi sert le croisement des fibres au chiasma, selon la prof ?","choix":[{"t":"À voir le même champ avec chaque œil : vision binoculaire.","ok":true},{"t":"À échanger les yeux : tout l’œil droit va au cerveau gauche.","pourquoi":"Ce n’est pas un œil entier qui change de côté : seules les fibres de la rétine nasale croisent."},{"t":"À protéger les fibres en les faisant passer au centre du cerveau.","pourquoi":"8B6 ne parle pas de protection : le but est de « voir le même champ de vision avec chaque œil »."},{"t":"À séparer la vision des couleurs et celle du noir.","pourquoi":"Cônes et bâtonnets n’ont rien à voir avec le croisement. Le chiasma réunit les deux vues d’un même champ."}],"expl":"« C’est une façon pour le cerveau de voir le même champ de vision avec chaque œil. Ceci contribue à la vision binoculaire et coordination œil-main »","source":"8B6","mod":8,"voir":{"p":"voies-croisement","r":["chiasma"]}},{"id":"a8-024","fam":"a8-trajet","kc":"A8.13","k":"qcm","q":"Que se passe-t-il dans les relais entre le chiasma et le cortex ?","choix":[{"t":"L’information est transformée ou ajoutée.","ok":true},{"t":"La lumière y devient un signal électrique.","pourquoi":"Ça se fait bien avant, dans les disques des photorécepteurs."},{"t":"Les fibres nasales y croisent vers l’autre côté.","pourquoi":"Le croisement se fait au chiasma, avant les relais."},{"t":"Rien : ils transmettent l’information sans la changer.","pourquoi":"La prof dit le contraire : « Voie et relais vers le cortex. Information transformée ou ajoutée »."}],"expl":"« Voie et relais vers le cortex. Information transformée ou ajoutée » (8B7). Au cortex, il y a ensuite « des liens avec d’autres parties due (sic) cerveau dont mémoire, mouvement, couleur et autres » (8B8).","source":"8B7, 8B8","mod":8,"voir":{"p":"voies-visuelles","r":["4"]}},{"id":"a8-025","fam":"a8-trajet","kc":"A8.14","k":"qcm","q":"Sur ta feuille F3, les fibres de la « Rétine Nasale » (en bleu) font quoi au chiasma ?","choix":[{"t":"Celles des deux yeux croisent, en X.","ok":true},{"t":"Elles restent du même côté.","pourquoi":"Ce sont les fibres « R-Temp » (vert et orange) qui restent de leur côté."},{"t":"Elles s’arrêtent au chiasma.","pourquoi":"Aucune fibre ne s’arrête au chiasma : elles continuent vers les relais et le cortex."},{"t":"Seul le bleu de OD croise; celui de OS reste à gauche.","pourquoi":"Les deux bleus croisent : celui de OD vers la gauche, celui de OS vers la droite."}],"expl":"Sur F3, le bleu (« Rétine Nasale ») croise en X; le vert (« R-Temp » de OS) reste à gauche et l’orange (« R-Temp » de OD) reste à droite.","source":"8F3, 8B3, 8B4","mod":8,"voir":{"p":"voies-croisement","r":["chiasma"]}},{"id":"a8-026","fam":"a8-croix","kc":"A8.9","k":"qcm","q":"Un point est dans le champ visuel droit. Sur quelle moitié de la rétine de l’œil droit (OD) tombe-t-il ?","choix":[{"t":"Sur la rétine nasale de OD.","ok":true},{"t":"Sur la rétine temporale de OD.","pourquoi":"Les rayons se croisent dans l’œil : un point du côté de la tempe tombe sur la moitié nasale."},{"t":"Sur les deux moitiés de la rétine de OD.","pourquoi":"Un point d’un côté du champ tombe sur une seule moitié de chaque rétine."}],"expl":"Les rayons se croisent dans l’œil : pour OD, le champ droit est du côté de la tempe et tombe sur la rétine nasale (figures de 8B3, 8B4).","source":"8B3, 8B4","mod":8,"voir":{"p":"voies-croisement"}},{"id":"a8-027","fam":"a8-croix","kc":"A8.9","k":"qcm","q":"Un point est dans le champ visuel gauche. Sur quelles moitiés de rétine tombe-t-il ?","choix":[{"t":"Rétine nasale de OS et rétine temporale de OD.","ok":true},{"t":"Rétine temporale de OS et rétine nasale de OD.","pourquoi":"Ça, c’est le champ droit. Le champ gauche tombe sur la moitié droite de chaque rétine : nasale de OS, temporale de OD."},{"t":"Rétine nasale de OS et rétine nasale de OD.","pourquoi":"Un point d’un côté du champ tombe sur une moitié nasale et une moitié temporale, jamais deux nasales."},{"t":"Toute la rétine de OS, et rien sur OD.","pourquoi":"Les deux yeux voient le champ gauche : chacun le reçoit sur une moitié de rétine."}],"expl":"Le champ gauche tombe sur la moitié droite de chaque rétine : la nasale de OS et la temporale de OD. Les deux finissent au cerveau droit.","source":"8B3, 8B4","mod":8,"voir":{"p":"voies-croi
